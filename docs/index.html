ozesses.<\/li><li>Das knappe Arbeitsgedächtnis erklärt, warum Breuer (Sitzung 2) in der FS vor allem bei Planung und Revision Einbußen findet.<\/li><li>Zimmermans Self-reflection-Phase entspricht dem, was Breuer als Revision beschreibt, geht aber über den Text hinaus (Attribution, Zufriedenheit).<\/li><\/ul>"}], "zusatz": [], "material": [{"datei": "Schnell_2020_Schreibprozesse und Schreibentwicklung in der Fremdsprache_Vorbereitungstext 3. Sitzung.pdf", "art": "Lektüre", "notiz": "Abschnitte 2.1.4 (S. 40–51) und 2.1.7 (S. 70–75), 18 Seiten. Eine zweite Fassung ohne „3. Sitzung“ im Namen liegt ebenfalls im Ordner."}, {"datei": "Modellbeschreibung_Kellog 1996.pdf", "art": "Lektüre", "notiz": "Beschreibung des Modells von 1996 in einem Beitrag im Journal of Writing Research, S. 161–165"}, {"datei": "Modellbeschreibung_Zimmerman_Kitsantas 2006.pdf", "art": "Lektüre", "notiz": "A Writer's Discipline: The Development of Self-Regulatory Skill, S. 53–59"}], "begriffe": ["kellogg-modell", "arbeitsgedaechtnis", "selbstregulation-schreiben", "knowledge-telling", "knowledge-transforming", "knowledge-crafting", "schreibstrategie", "schreibentwicklung-bereiter", "epistemisches-schreiben"]}], "glossar": [{"id": "erzaehlen-erzaehltes", "term": "das Erzählte und das Erzählen", "fa": "آنچه روایت می‌شود و روایت‌کردن", "kurz": "Die Grundunterscheidung: Was wird erzählt, und wie?", "def": "Das Erzählte ist die Geschichte mit ihrer Welt. Das Erzählen ist die Art, wie sie vermittelt wird: Sprache, Stil, Reihenfolge, Perspektive. Man trennt beides, auch wenn man bei Fiktion nur über den Text Zugang zur Welt hat.", "zitate": [{"t": "Wenn und solange wir eine solche Lesehaltung einnehmen, konzentrieren wir uns auf das, was uns erzählt wird, und blenden die Art und Weise, wie die Geschichte vermittelt wird, aus dem Bereich unserer Aufmerksamkeit aus.", "s": "S. 22"}, {"t": "Eine Geschichte, die wir als dieselbe Geschichte wiedererkennen, kann auf unzählige verschiedene Weisen präsentiert werden.", "s": "S. 23"}], "kafka": "Erzählt wird: Ein Mann wartet vor einem Tor, bis er stirbt. Das Erzählen ist ein Erzähler in der dritten Person, im Präsens, mit knappen Sätzen.", "see": ["erzaehlte-welt", "darstellung", "handlung"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "erzaehlte-welt", "term": "die erzählte Welt (Diegese)", "fa": "جهان روایت‌شده", "kurz": "Alles, was in der Geschichte existiert, nicht nur das für die Handlung Wichtige.", "def": "Die erzählte Welt umfasst Figuren, Orte und die Regeln der Geschichte. Sie ist weiter gefasst als die Handlung. Der Begriff „Diegese“ kommt aus der Filmtheorie und wurde von Genette übernommen (Fußnote S. 26).", "zitate": [{"t": "… dem engeren Begriff der Handlung, der sich nur auf die Gesamtheit der handlungsfunktionalen Elemente der dargestellten Welt bezieht.", "s": "S. 26"}], "kafka": "Zur Welt gehören auch Dinge, die nie ins Geschehen eingreifen: <span class=\"kq\">„Von Saal zu Saal stehn aber Türhüter, einer mächtiger als der andere.“<\/span> Ob es diese Türhüter gibt, wissen wir nur durch die Worte des Türhüters.", "see": ["handlung", "erzaehlen-erzaehltes"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "handlung", "term": "die Handlung", "fa": "کنش (رویدادهای مهم برای داستان)", "kurz": "Nur die handlungsfunktionalen Elemente der erzählten Welt.", "def": "Zur Handlung zählt, was für den Verlauf des Geschehens wichtig ist. Das Buch gliedert sie in vier Ebenen: Ereignis, Geschehen, Geschichte, Handlungsschema.", "zitate": [{"t": "… dem engeren Begriff der Handlung, der sich nur auf die Gesamtheit der handlungsfunktionalen Elemente der dargestellten Welt bezieht.", "s": "S. 26"}], "kafka": "Handlungsfunktional ist der Anblick des Türhüters, denn der Mann entscheidet sich seinetwegen zu warten: <span class=\"kq\">„entschließt er sich, doch lieber zu warten“<\/span>.", "see": ["erzaehlte-welt", "ereignis", "geschehen", "geschichte", "handlungsschema"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "darstellung", "term": "die Darstellung", "fa": "شیوه‌ی ارائه", "kurz": "Die Seite des „Wie“: die Art der Vermittlung der erzählten Welt.", "def": "Das Buch teilt die Darstellung in zwei Ebenen: die Erzählung (Reihenfolge und Tempo der Ereignisse) und das Erzählen (Sprache, Medium, Erzählsituation, Stil).", "zitate": [{"t": "Die andere Seite der Opposition, also die Art und Weise der Vermittlung der erzählten Welt, bezeichnen wir als Darstellung.", "s": "S. 26"}], "kafka": "Darstellung bei Kafka: Zeitraffer, Präsens, ein Erzähler, der in den Mann hineinsieht, aber den Türhüter von außen zeigt.", "see": ["erzaehlung", "erzaehlen"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "fiktionale-behauptungssaetze", "term": "fiktionale Behauptungssätze", "fa": "جمله‌های ادعایی در متن داستانی", "kurz": "Sätze im Text beziehen sich auf Tatsachen der erzählten Welt.", "def": "In einem fiktionalen Text stellen Sätze etwas als Tatsache hin. Diese Tatsachen gelten in der erzählten Welt, unabhängig davon, ob der Leser sie für wirklich hält.", "zitate": [{"t": "Fiktionale Behauptungssätze enthalten eine Referenz auf Tatsachen der durch sie erzählten Welt, unabhängig davon, ob der Leser diese zeitweise für Gegebenheiten seiner objektiven Wirklichkeit nimmt oder nicht.", "s": "S. 24"}], "kafka": "In der erzählten Welt steht das Tor offen: <span class=\"kq\">„Da das Tor zum Gesetz offensteht wie immer“<\/span>. Das ist dort eine Tatsache, obwohl wir die Geschichte als Gleichnis lesen.", "see": ["erzaehlte-welt"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "fabula-sjuzet", "term": "fabula und sjužet (Tomaševskij)", "fa": "فابولا و سیوژت", "kurz": "Russischer Formalismus: Die Ereignisse selbst (fabula) und ihre Anordnung im Werk (sjužet).", "def": "Die fabula ordnet die Motive logisch und nach Ursache und Zeit. Das sjužet betrifft nur die Reihenfolge, in der die Motive im Werk stehen.", "zitate": [{"t": "die Gesamtheit der Motive in ihrer logischen, kausal-temporalen Verknüpfung", "s": "S. 25", "q": "Tomaševskij über die fabula, zitiert bei Martínez/Scheffel"}, {"t": "die Gesamtheit derselben Motive in derjenigen Reihenfolge und Verknüpfung, in der sie im Werk vorliegen", "s": "S. 25", "q": "Tomaševskij über das sjužet, zitiert bei Martínez/Scheffel"}], "kafka": "Die Reihenfolge ist chronologisch (kommen, bitten, warten, fragen, sterben). fabula und sjužet sind daher fast gleich.", "see": ["histoire-discours", "genette"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "histoire-discours", "term": "histoire und discours (Todorov, Benveniste)", "fa": "histoire: خودِ داستان · discours: شیوه‌ی روایتِ آن", "kurz": "Todorov: das Erzählte (histoire) und die Art, wie der Erzähler es uns vermittelt (discours).", "def": "Todorov übernimmt das Paar der Formalisten. Der discours ist weiter gefasst als das sjužet: Er umfasst auch Perspektive, Stil und Modus. Benveniste hatte ursprünglich einen sprachlichen Unterschied gemeint: Erzählformen ohne und mit deutlich hervortretender Sprecherinstanz (S. 25).", "zitate": [{"t": "Dieselbe Geschichte hätte uns auch auf andere Weise vermittelt werden können, beispielsweise durch einen Film", "s": "S. 25", "q": "Todorov über die histoire, zitiert bei Martínez/Scheffel"}, {"t": "… umfasst Todorovs ‹discours› stattdessen den gesamten Bereich der literarischen Vermittlung eines Geschehens (d. h. außer der Anordnung der Ereignisse auch Perspektive, Stil, Modus usw.)", "s": "S. 25"}], "kafka": "Als histoire könnte man „Vor dem Gesetz“ auch als Film erzählen. Zum discours gehört, dass wir die Ereignisse mit dem Mann zusammen erleben und seine Gedanken kennen.", "see": ["fabula-sjuzet", "genette", "darstellung"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "genette", "term": "Genettes Dreiteilung: Geschichte, Erzählung, Narration", "fa": "سه‌گانه‌ی ژنت", "kurz": "Gérard Genette unterscheidet histoire, récit und narration.", "def": "Die Geschichte (histoire) ist der narrative Inhalt. Die Erzählung (récit) ist der Text selbst. Die Narration ist der produzierende narrative Akt, also das Erzählen, auch in seiner (realen oder fiktiven) Situation. Martínez/Scheffel nehmen diese Idee als Anregung, die Seite der Darstellung weiter zu unterteilen.", "zitate": [{"t": "das Signifikat oder den narrativen Inhalt", "s": "S. 26", "q": "Genette über die Geschichte, zitiert bei Martínez/Scheffel"}, {"t": "den Signifikanten, die Aussage [‹énoncé›], den narrativen Text oder Diskurs", "s": "S. 26", "q": "Genette über die Erzählung, zitiert bei Martínez/Scheffel"}, {"t": "produzierenden narrativen Akt", "s": "S. 26", "q": "Genette über die Narration, zitiert bei Martínez/Scheffel"}], "kafka": "Geschichte: das Geschehen um Mann und Türhüter. Erzählung: der Text „Vor dem Gesetz“. Narration: das Erzählen selbst, etwa der Erzähler, der „sagt“ und „denkt er“ berichtet.", "see": ["histoire-discours", "erzaehlung", "erzaehlen"], "sitzungen": ["erz-s1"], "hinweis": "Das Wort „Erzählung“ steht bei Genette (récit, der Text) und bei Martínez/Scheffel (Ebene 5, die Reihenfolge der Ereignisse) in ähnlichen Positionen, wird aber nicht automatisch gleich verwendet. Die Tabelle auf S. 28 zeigt, wie unterschiedlich die Autoren ihre Wörter verteilen.", "seminare": ["erz"]}, {"id": "ereignis", "term": "das Ereignis (Motiv)", "fa": "رویداد (موتیف)", "kurz": "Ebene 1: die kleinste Einheit der Handlung.", "def": "Ein Ereignis oder Motiv ist die elementare Einheit eines narrativen Textes im Bereich der Handlung.", "zitate": [{"t": "Die elementare Einheit eines narrativen Textes im Bereich der Handlung ist das Ereignis oder Motiv.", "s": "S. 27"}], "kafka": "<span class=\"kq\">„Der Türhüter gibt ihm einen Schemel“<\/span> ist ein Ereignis, ebenso das Bestechen oder das Winken kurz vor dem Tod.", "see": ["geschehen", "handlung"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "geschehen", "term": "das Geschehen", "fa": "رخدادها (ردیفِ زمانی)", "kurz": "Ebene 2: Ereignisse, die nur zeitlich aufeinander folgen.", "def": "Ein Geschehen entsteht, wenn Ereignisse chronologisch aneinandergereiht werden. Es gibt noch keinen Grund-Folge-Zusammenhang.", "zitate": [{"t": "Auf einer ersten Integrationsstufe erscheinen Ereignisse zu einem Geschehen aneinandergereiht, indem sie chronologisch aufeinander folgen.", "s": "S. 27"}], "kafka": "Der Mann kommt, bittet, wartet, fragt, stirbt: ein „und dann“.", "see": ["ereignis", "geschichte"], "sitzungen": ["erz-s1"], "hinweis": "In der Tabelle auf S. 28 heißt bei Forster das Geschehen „story“ und die Geschichte „plot“. Gleiche Wörter können in anderen Theorien etwas anderes bedeuten.", "seminare": ["erz"]}, {"id": "geschichte", "term": "die Geschichte", "fa": "داستان (با رابطه‌ی علّی)", "kurz": "Ebene 3: Ereignisse mit kausalem Zusammenhang.", "def": "Zur Geschichte wird das Geschehen, wenn die Ereignisse nicht nur aufeinander, sondern auch auseinander folgen. Es gibt also ein „weil“.", "zitate": [{"t": "… wenn die Ereignisfolge zusätzlich zum chronologischen auch einen kausalen Zusammenhang aufweist, so dass die Ereignisse nicht nur aufeinander, sondern auch auseinander folgen.", "s": "S. 27"}], "kafka": "Weil der Mann den Türhüter genauer ansieht, <span class=\"kq\">„entschließt er sich, doch lieber zu warten“<\/span>. Weil er wartet, stirbt er vor dem Tor.", "see": ["geschehen", "handlungsschema"], "sitzungen": ["erz-s1"], "hinweis": "Nicht mit „Geschichte“ im Sinne von Genette (histoire) verwechseln: Dort ist der ganze narrative Inhalt gemeint. Bei Martínez/Scheffel ist es eine bestimmte Ebene der Handlung (Tabelle S. 28).", "seminare": ["erz"]}, {"id": "handlungsschema", "term": "das Handlungsschema", "fa": "الگوی کلیِ کنش", "kurz": "Ebene 4: ein abstraktes Muster, das für Textgruppen typisch sein kann.", "def": "Das Handlungsschema ist ein aus allen erzählten Ereignissen abstrahiertes globales Schema. Es kann für ganze Textgruppen wie Gattungen charakteristisch sein und gibt der Geschichte Anfang, Mitte, Ende und eine sinnhafte Struktur.", "zitate": [{"t": "Durch die Integration in ein Handlungsschema erhält die Geschichte eine abgeschlossene (Anfang, Mitte, Ende) und sinnhafte (z. B. archetypische) Struktur.", "s": "S. 27"}], "kafka": "Mögliches Schema: Ein Suchender kommt an eine Schwelle, wartet und scheitert (eigene Deutung).", "see": ["geschichte", "handlung"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "erzaehlung", "term": "die Erzählung (Ebene 5)", "fa": "روایت (ترتیب و زمان‌بندی)", "kurz": "Die Ereignisse in der Reihenfolge, in der der Text sie darstellt.", "def": "Die Erzählung unterscheidet sich von der chronologisch rekonstruierten Handlung durch die Gestaltung und zeitliche Umgruppierung der Ereignisse im Text, etwa durch Erzähltempo, Rückwendung und Vorausdeutung.", "zitate": [{"t": "Die erzählten Ereignisse in der Reihenfolge ihrer Darstellung im Text.", "s": "S. 27"}], "kafka": "Beginn ohne Einleitung, Jahre in einem Satz (<span class=\"kq\">„Dort sitzt er Tage und Jahre.“<\/span>), eine kleine Vorausdeutung (<span class=\"kq\">„Nun lebt er nicht mehr lange.“<\/span>).", "see": ["erzaehltempo", "erzaehlen", "genette"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "erzaehlen", "term": "das Erzählen (Ebene 6)", "fa": "روایت‌کردن (زبان، سبک، موقعیت)", "kurz": "Die Präsentation der Geschichte in Sprache, Medium und Darstellungsverfahren.", "def": "Zum Erzählen gehören die Sprache, das Medium (z. B. rein sprachlich oder audio-visuell) und Darstellungsverfahren wie Erzählsituation oder Sprachstil.", "zitate": [{"t": "Die Präsentation der Geschichte und die Art und Weise dieser Präsentation in bestimmten Sprachen, Medien (z. B. rein sprachliche oder audio-visuelle) und Darstellungsverfahren (z. B. Erzählsituation oder Sprachstil).", "s": "S. 28"}], "kafka": "Ein Erzähler in der dritten Person, Präsens (eigene Beobachtung), Einblick in die Gedanken des Mannes: <span class=\"kq\">„denkt er“<\/span>.", "see": ["erzaehlung", "darstellung"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "erzaehltempo", "term": "Erzähltempo, Rückwendung, Vorausdeutung", "fa": "سرعت روایت، بازگشت به گذشته، پیش‌نمایی", "kurz": "Drei Möglichkeiten, die Zeit im Text zu gestalten (genannt bei Ebene 5).", "def": "Das Buch nennt diese Begriffe auf S. 27 als Beispiele für die zeitliche Umgruppierung der Ereignisse. Kurz gesagt: das Tempo, mit dem erzählt wird, der Sprung zurück und der Hinweis auf Späteres. Ausführlich folgen sie im Kapitel zum „Wie“.", "zitate": [{"t": "(Erzähltempo, Rückwendung, Vorausdeutung)", "s": "S. 27"}], "kafka": "Tempo: viele Jahre in einem Satz (<span class=\"kq\">„Dort sitzt er Tage und Jahre.“<\/span>). Vorausdeutung: <span class=\"kq\">„Nun lebt er nicht mehr lange.“<\/span> Eine Rückwendung gibt es kaum.", "see": ["erzaehlung"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "summative-evaluation", "term": "summative Evaluation", "fa": "ارزیابی پایانی (تراکمی)", "kurz": "Misst im Nachhinein, was erreicht wurde, und dient der Benotung.", "def": "Formelle, geplante Bewertung am Ende einer Unterrichtseinheit (Woche, Monat, Semester oder Jahr). Neuere Bezeichnung: Assessment of Learning.", "zitate": [{"t": "Die summative Evaluation misst im Nachhinein, was von Einzelpersonen oder auch Gruppen erreicht wurde", "s": "S. 83", "q": "Moser-Frötscher 2025"}], "beispiel": "Abitur, Sprachzertifikate und Klassenarbeiten sind summative Prüfungen.", "see": ["formative-evaluation", "high-low-stakes"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null}, {"id": "formative-evaluation", "term": "formative Evaluation", "fa": "ارزیابی تکوینی (در جریان آموزش)", "kurz": "Prüft den Fortschritt während des Lernens, um Unterricht und Feedback anzupassen.", "def": "Neuere Bezeichnung: Assessment for Learning. Ziel ist, den nachfolgenden Unterricht abzustimmen und den Schüler:innen Feedback zu geben.", "zitate": [{"t": "Die kontrastive Unterscheidung zwischen summativer und formativer Evaluation stellt jedoch eine starke Vereinfachung dieser beiden Konstrukte sowie ihrer Beziehung zueinander dar", "s": "S. 83", "q": "Moser-Frötscher 2025"}], "beispiel": "Nach Harlen kann dieselbe Information formativ oder summativ sein, je nach Zweck.", "see": ["summative-evaluation", "learning-oriented-assessment"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null}, {"id": "learning-oriented-assessment", "term": "Learning-Oriented Assessment", "fa": "سنجش یادگیری‌محور", "kurz": "Modell, in dem formative und summative Zugänge eng verwoben sind.", "def": "Nach Jones/Saville (2016) steht das erfolgreiche Sprachenlernen im Fokus jeglicher Prüfungsaktivitäten.", "zitate": [{"t": "Im Modell des lerner:innenorientierten Prüfens (Learning-Oriented Assessment, Jones/ Saville 2016) sind formative und summative Zugänge eng miteinander verwoben", "s": "S. 83", "q": "Moser-Frötscher 2025"}], "beispiel": "Der Text stellt es als Antwort auf die starre Gegenüberstellung summativ/formativ vor.", "see": ["formative-evaluation", "summative-evaluation"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null}, {"id": "ealta-leitfragen", "term": "EALTA-Leitfragen", "fa": "پرسش‌های راهنمای EALTA", "kurz": "Leitfragen für gute Prüfungspraxis in drei Bereichen.", "def": "Die Richtlinien der European Association for Language Testing and Assessment (EALTA 2006) betreffen (1) Prüfungszweck und Spezifikation, (2) Prüfungsverfahren und (3) Konsequenzen.", "zitate": [{"t": "Diese betreffen (1) Prüfungszweck und Spezifikation; (2) Prüfungsverfahren, und (3) Konsequenzen.", "s": "S. 85", "q": "Moser-Frötscher 2025"}], "beispiel": "Die Seminar-Textarbeit nutzt die Leitfragen als Analyseraster für Hochschulzugangsprüfungen.", "see": ["testspezifikationen", "reliabilitaet", "high-low-stakes", "washback"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null}, {"id": "testspezifikationen", "term": "Testspezifikationen", "fa": "مشخصات آزمون", "kurz": "Zentrale Informationen über eine Prüfung.", "def": "Sie enthalten laut Text die Art der überprüften Kompetenzen, die Gewichtung der Komponenten und die Aufgabenformate (Green 2013).", "zitate": [{"t": "Testspezifikationen enthalten zentrale Informationen über die Prüfung, wie die Art der überprüften Kompetenzen, die Gewichtung der einzelnen Komponenten oder die verwendeten Aufgabenformate", "s": "S. 85", "q": "Moser-Frötscher 2025"}], "beispiel": "Gehört zum EALTA-Bereich „Prüfungszweck und Spezifikation“.", "see": ["ealta-leitfragen"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null}, {"id": "reliabilitaet", "term": "Reliabilität", "fa": "پایایی", "kurz": "Ergebnisse hängen konsistent von der Sprachkompetenz ab.", "def": "Instrumente sind laut Text reliabel, wenn ihre Ergebnisse konsistent von der Sprachkompetenz abhängen und nicht von anderen Faktoren, z. B. unklaren Anweisungen oder missverständlichen Fragen (Green 2013).", "zitate": [{"t": "wenn deren Ergebnisse konsistent von der Sprachkompetenz der Schüler:innen abhängen und nicht von anderen Faktoren wie unklaren Anweisungen oder missverständlichen Fragen/Antwortoptionen beeinträchtigt werden", "s": "S. 86", "q": "Moser-Frötscher 2025"}], "beispiel": "Gehört zum EALTA-Bereich „Prüfungsverfahren“.", "see": ["ealta-leitfragen"], "seminare": ["pruefen", "ki"], "sitzungen": ["pruefen-s2", "ki-s2"], "hinweis": null}, {"id": "high-low-stakes", "term": "low stakes und high stakes", "fa": "آزمون با پیامد کم / پیامد سنگین", "kurz": "Unterscheidung nach den Folgen der Prüfungsentscheidung.", "def": "Bei low stakes sind die Auswirkungen gering. Bei high stakes hat das Nichtbestehen weitreichende Folgen, für Lernende (z. B. Verwehrung einer Ausbildung) und für Schulen (z. B. Personalabbau, behördliche Kontrolle).", "zitate": [{"t": "Je weitreichender die Auswirkungen einer Prüfung sind, desto wichtiger ist eine rigorose Qualitätssicherung und umfassende Begleitforschung zur Validierung", "s": "S. 87", "q": "Moser-Frötscher 2025"}], "beispiel": "Hochschulzugangsprüfungen sind typische high-stakes-Prüfungen (eigene Einordnung).", "see": ["washback", "ealta-leitfragen"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null}, {"id": "washback", "term": "washback", "fa": "اثر بازگشتی آزمون بر آموزش", "kurz": "Rückwirkung einer Prüfung auf Unterricht und Lernen.", "def": "Vor allem bei high stakes konzentrieren sich Lehrende und Lernende auf das, was vermutlich geprüft wird. Der Effekt kann negativ oder positiv sein.", "zitate": [{"t": "indem sich Lehrende und Lernende auf jene Kenntnisse, Fertigkeiten oder Fähigkeiten konzentrieren, von denen sie glauben, dass sie in der Prüfung behandelt werden", "s": "S. 87", "q": "Moser-Frötscher 2025"}], "beispiel": "Positives Beispiel im Text: Hören wird nach einer Prüfungsreform im Unterricht stärker gewichtet.", "see": ["high-low-stakes", "summative-evaluation"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null}, {"id": "language-assessment-literacy", "term": "Language Assessment Literacy", "fa": "سواد سنجش زبان", "kurz": "Leistungsbeurteilungskompetenz von Lehrpersonen.", "def": "Sie umfasst laut Text Fach- und Anwendungswissen in der fremdsprachlichen Leistungsbeurteilung sowie sprachlich-fachliche Kompetenzen (Fulcher 2010).", "zitate": [{"t": "die sowohl Fach- und Anwendungswissen in der fremdsprachlichen Leistungsbeurteilung als auch sprachlich-fachliche Kompetenzen umfasst", "s": "S. 85", "q": "Moser-Frötscher 2025"}], "beispiel": "Voraussetzung dafür, Aufgaben auszuwählen und Leistungen fair zu beurteilen.", "see": ["ealta-leitfragen"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null}, {"id": "funktionen-assessment", "term": "Funktionen von Assessment", "fa": "کارکردهای سنجش", "kurz": "Wozu Lehrende Leistungen erfassen: Diagnose, Förderung, Notenvergabe, Selektion u. a.", "def": "Die Folie sammelt Funktionen aus der Lehrendenperspektive (Grotjahn/Kleppin 2017, S. 12), z. B. Diagnose, Einstufung, Rückmeldung, Förderung, Motivierung, Notenvergabe, Rangordnung, Selektion und Disziplinierung.", "zitate": [{"t": "Wählen Sie drei Funktionen aus, die Sie persönlich prioritär finden", "s": "Folie 8", "q": "Folien Berthelé"}], "beispiel": "Dieselbe Klassenarbeit kann diagnostizieren, benoten und selektieren, je nachdem, wofür das Ergebnis genutzt wird (eigenes Beispiel).", "see": ["pruefen-testen", "high-low-stakes"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null}, {"id": "pruefen-testen", "term": "Prüfen und Testen", "fa": "آزمودن و تست‌کردن (assessment / testing)", "kurz": "Prüfen (assessment) ist der weite, Testen (testing) der engere Begriff.", "def": "Prüfen umfasst alle Aktivitäten, bei denen Informationen über Lernende gesammelt werden (auch Quiz, Selbst- und Peerevaluation). Testen meint Verfahren der Leistungsmessung, möglichst objektiv und zuverlässig. In der Praxis werden beide oft synonym verwendet.", "zitate": [{"t": "Häufige synonyme Verwendung in Fachliteratur", "s": "Folie 12", "q": "Folien Berthelé"}], "beispiel": "„TestDaF“ heißt Test, hat aber auch Merkmale einer Prüfung (Folie 12).", "see": ["funktionen-assessment", "konstrukt"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null}, {"id": "feedback-hattie", "term": "Feedback: feed up, feed back, feed forward", "fa": "بازخورد: feed up / feed back / feed forward", "kurz": "Drei Fragen: Wo will ich hin, wie komme ich voran, was ist der nächste Schritt?", "def": "Nach Hattie/Timperley (2007) hat Feedback drei Teile: Feed up (Ziele, Standort), Feed back (Fortschritt, Reflexion) und Feed forward (nächste Schritte). Es soll die Distanz zwischen Lernziel und aktueller Leistung überbrücken.", "zitate": [{"t": "Information im Mittelpunkt, um Distanz zwischen Lernziel und der aktuellen Leistung zu überbrücken", "s": "Folie 10", "q": "Folien Berthelé"}], "beispiel": "Feed forward: statt nur „Note 3“ ein konkreter nächster Schritt für den Text (eigenes Beispiel).", "see": ["formative-evaluation", "assessment-of-for-as"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null}, {"id": "konstrukt", "term": "Konstrukt der Leistungsmessung", "fa": "سازه‌ی سنجش (آنچه باید اندازه‌گیری شود)", "kurz": "Theoretische Vorstellung davon, was Sprachkompetenz ist und gemessen werden soll.", "def": "Die Folie zeichnet eine Entwicklung nach: behavioristisch (Lado 1961), multikomponentiell (Bachman/Palmer 2010), handlungsorientiert (GeR 2001 und 2010). Neuere Ausweitungen betreffen Mediation, Mehrsprachigkeit und den Verzicht auf den native-speaker-Standard.", "zitate": [{"t": "theoretische Vorstellungen von sprachlich-kommunikativer Handlungsfähigkeit", "s": "Folie 14", "q": "Folien Berthelé"}], "beispiel": "Ein Hörverstehenstest misst ein anderes Konstrukt als ein Test zu expliziten Grammatikkenntnissen.", "see": ["testspezifikationen", "pruefen-testen"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null}, {"id": "standardisierung", "term": "Standardisierung (high-stakes-Tests)", "fa": "استانداردسازی آزمون", "kurz": "Einheitliche Entwicklung, Durchführung und Auswertung für vergleichbare Ergebnisse.", "def": "Bei der Entwicklung legen Testspezifikationen Konstrukt und Aufgabenformate fest. Bei der Durchführung gelten vergleichbare Bedingungen. Bei der Auswertung sichern einheitliche Skalen, Doppelbeurteilung und die Multifacetten-Rasch-Analyse die Qualität.", "zitate": [{"t": "Ziel: Fairness, niemand wird benachteiligt oder bevorzugt, egal wo Prüfung abgelegt wird", "s": "Folie 18", "q": "Folien Berthelé"}], "beispiel": "TestDaF wird an vielen Orten abgelegt, die Ergebnisse müssen dennoch vergleichbar sein.", "see": ["high-low-stakes", "testspezifikationen", "reliabilitaet"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null}, {"id": "eingangstest", "term": "Eingangstest und Eignungstest", "fa": "آزمون ورودی و آزمون استعداد", "kurz": "Aufnahmetest entscheidet über die Aufnahme, Eignungstest misst die allgemeine Lernbefähigung.", "def": "Aufnahme-, Zulassungs- und Zugangstest entscheiden, ob Teilnehmende in eine Sprachausbildung aufgenommen werden. Ein Eignungstest misst dagegen die allgemeine Befähigung zum Fremdsprachenlernen. Beispiele für Aufnahmetests: TOEFL, IELTS, TestDaF.", "zitate": [{"t": "Eignungstest → misst allgemeine Befähigung zum Fremdsprachenlernen", "s": "Folie 20", "q": "Folien Berthelé"}], "beispiel": "Der TestDaF ist ein extern entwickelter proficiency test, der als Aufnahmekriterium an deutschen Hochschulen anerkannt ist.", "see": ["high-low-stakes", "standardisierung"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": "proficiency test = Sprachstandstest: misst den erreichten Sprachstand, unabhängig von einem bestimmten Kurs."}, {"id": "assessment-of-for-as", "term": "Assessment of, for und as Learning", "fa": "سنجش «از»، «برای» و «به‌عنوان» یادگیری", "kurz": "Drei Arten von Assessment mit unterschiedlichem Ziel und unterschiedlichen Beurteilenden.", "def": "Of Learning ist summativ (am Ende, Lehrperson oder Institution). For Learning ist formativ und unterstützt den Lernprozess. As Learning ist formativ und gibt den Lernenden Verantwortung, z. B. durch Self- und Peer-Assessment.", "zitate": [{"t": "In Praxis nicht immer zu trennen!", "s": "Folie 21", "q": "Folien Berthelé"}], "beispiel": "Portfolio (for Learning) und Self-Assessment (as Learning) in einem Kurs lassen sich kaum sauber trennen.", "see": ["summative-evaluation", "formative-evaluation", "feedback-hattie"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null}, {"id": "schreibkompetenz", "term": "fremdsprachliche Schreibkompetenz", "fa": "توانایی نوشتن در زبان خارجی", "kurz": "Besteht aus fünf Teilkompetenzen.", "def": "Krings unterscheidet Schreibmotorik, Orthographie, fremdsprachliches Schriftsystem, das Verfassen von Texten nach Textkonventionen und das Schreibprozessmanagement.", "zitate": [{"t": "Die fremdsprachliche Schreibkompetenz umfasst eine Reihe von Teilkompetenzen, die in der fachdidaktischen Diskussion nicht immer deutlich genug voneinander getrennt werden.", "s": "S. 107", "q": "Krings 2016"}], "beispiel": "Die Teilkompetenzen werden in der Diskussion oft vermischt, deshalb trennt Krings sie.", "see": ["schreibprozessmanagement", "textkonventionen", "ger-skalen"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s1"], "hinweis": null}, {"id": "schreibprozessmanagement", "term": "Schreibprozessmanagement", "fa": "مدیریت فرایند نوشتن", "kurz": "Planen und Steuern der mentalen Teilprozesse der Textproduktion.", "def": "Krings bezeichnet es als am häufigsten übersehene Teilkompetenz. Je umfangreicher und anspruchsvoller der Text, desto wichtiger wird sie.", "zitate": [{"t": "die am häufigsten übersehene Teilkompetenz des Schreibens", "s": "S. 107", "q": "Krings 2016"}], "beispiel": "Bei einem langen Text, etwa einer Hausarbeit, entscheidet es mit über den Erfolg (eigenes Beispiel).", "see": ["schreibkompetenz"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s1"], "hinweis": null}, {"id": "textkonventionen", "term": "Textkonventionen und Textsortenkonventionen", "fa": "قواعد و هنجارهای متنی", "kurz": "Regeln, nach denen Texte einer Sorte verfasst werden.", "def": "Textsortenkonventionen können nicht nur zwischen Textsorten, sondern auch für gleiche Textsorten von Sprache zu Sprache verschieden sein. Das Verfassen von Texten nach gültigen Konventionen ist laut Krings die Kernkompetenz des Schreibens.", "zitate": [{"t": "Dies ist zweifellos die Kernkompetenz des Schreibens.", "s": "S. 107", "q": "Krings 2016"}], "beispiel": "Ein Brief oder eine Hausarbeit folgt je nach Sprache anderen Konventionen (eigenes Beispiel).", "see": ["schreibkompetenz"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s1"], "hinweis": null}, {"id": "ger-skalen", "term": "GER-Skalen zum Schreiben", "fa": "مقیاس‌های GER برای نوشتن", "kurz": "Niveaubeschreibungen von A1 bis C2 für verschiedene Aspekte des Schreibens.", "def": "Im Anhang bei Grotjahn (2017) stehen sieben Skalen: Schriftliche Produktion allgemein, Schriftliche Interaktion allgemein, Spektrum sprachlicher Mittel, Wortschatzbeherrschung, Grammatische Korrektheit, Beherrschung der Orthographie, Kohärenz und Kohäsion (zitiert nach Europarat 2001).", "zitate": [{"t": "Kann einfache, isolierte Wendungen und Sätze schreiben.", "s": "Anhang 1, S. 113", "q": "Grotjahn 2017"}], "beispiel": "Niveau A1 der Produktionsskala: Kann einfache, isolierte Wendungen und Sätze schreiben.", "see": ["kohaerenz-kohaesion", "schreibkompetenz"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s1"], "hinweis": "GER = Gemeinsamer europäischer Referenzrahmen für Sprachen. Die Skalen stammen aus der Fassung von 2001."}, {"id": "kohaerenz-kohaesion", "term": "Kohärenz und Kohäsion (GER-Skala)", "fa": "انسجام و پیوستگی متن (مقیاس GER)", "kurz": "Skala zur Gliederung und Verknüpfung von Texten.", "def": "Die Skala beschreibt, wie gut Gliederung und Verknüpfung gelingen, von einfachen Konnektoren wie „und“ auf A1 bis zu einer Vielfalt an Mitteln auf C2 (Anhang 7).", "zitate": [{"t": "Kann Wortgruppen durch einfache Konnektoren wie und, aber und weil verknüpfen.", "s": "Anhang 7, S. 116", "q": "Grotjahn 2017"}], "beispiel": "A2: Konnektoren wie und, aber, weil. Auf C2 wird eine Vielfalt an Mitteln für Gliederung und Verknüpfung erwartet.", "see": ["ger-skalen"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s1"], "hinweis": null}, {"id": "schreibsubprozesse", "term": "Schreibsubprozesse", "fa": "زیرفرایندهای نوشتن", "kurz": "Teilprozesse des Schreibens: Ideen, Planen, Formulieren, Ausführen, Revidieren.", "def": "Breuer behandelt im Auszug fünf Subprozesse: Ideen generieren, Text planen, sprachliche Transformation, Ausführung und Revision. Sie laufen nicht strikt nacheinander ab, sondern beeinflussen sich gegenseitig.", "zitate": [{"t": "ein weiterer Indikator dafür, dass die Schreibsubprozesse sich gegenseitig beeinflussen", "s": "S. 27", "q": "Breuer 2020"}], "beispiel": "Wortfindungsprobleme (Transformation) können die Ideengenerierung bremsen und umgekehrt.", "see": ["schreiben-als-denken", "revision", "kellogg-modell"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s2"], "hinweis": null}, {"id": "schreiben-als-denken", "term": "Schreiben als Denken (thinking in action)", "fa": "نوشتن به‌مثابه‌ی اندیشیدن", "kurz": "Beim Schreiben entsteht und verändert sich Wissen.", "def": "Nach Menary (2007: 622) aktivieren die körperlichen Prozesse die mentalen. Wenn Sprachsuche zu viel Arbeitsgedächtnis bindet, hemmt das diese Funktion.", "zitate": [{"t": "Die körperlichen Prozesse aktivieren die mentalen, und das Schreiben wird zum Denken.", "s": "S. 22", "q": "Breuer 2020"}], "beispiel": "Beim Verfassen einer Hausarbeit klärt sich oft erst im Schreiben, was man eigentlich sagen will (eigenes Beispiel).", "see": ["knowledge-telling", "epistemisches-schreiben", "arbeitsgedaechtnis"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s2"], "hinweis": null}, {"id": "freewriting", "term": "freewriting", "fa": "نوشتن آزاد", "kurz": "Gedanken in vorgegebener Zeit ohne Unterbrechung und Korrektur aufschreiben.", "def": "Nach Elbow (1973) schreibt man in einem festgelegten Zeitraum, ohne zum Nachdenken oder Korrigieren zu stoppen. In Breuers Studie (2016a) entstanden damit die meisten Ideen.", "zitate": [{"t": "Die meisten Ideen wurden im L1 freewriting festgehalten, die wenigsten in den L1-Notizen.", "s": "S. 23", "q": "Breuer 2020"}], "beispiel": "Zehn Minuten freewriting auf Deutsch zur Frage der Hausarbeit, ohne zu korrigieren (eigenes Beispiel).", "see": ["pre-task-planning", "schreiben-als-denken"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s2"], "hinweis": null}, {"id": "pre-task-planning", "term": "pre-task planning", "fa": "برنامه‌ریزی پیش از نوشتن", "kurz": "Planung vor dem eigentlichen Schreiben.", "def": "Sie kann mental oder mit Stichwörtern und visuellen Mitteln relativ sprachungebunden erfolgen (z. B. Mindmap, Stichwortliste).", "zitate": [{"t": "Allgemein wird angenommen, dass FS-Schreibende nicht zu viele Prozesse parallel ausführen, sondern sich besser auf die jeweils aktuellen Aspekte konzentrieren sollten", "s": "S. 24", "q": "Breuer 2020"}], "beispiel": "Bei Abrams/Byrd (2016) verbesserten Mindmap und Stichwortliste Inhalt, Komplexität und Textfluss.", "see": ["freewriting", "knowledge-telling"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s2"], "hinweis": null}, {"id": "l1-entlastung", "term": "L1 als Entlastungsstrategie", "fa": "زبان اول به‌عنوان راهبرد کاهش بار", "kurz": "Die Erstsprache nutzen, um das Arbeitsgedächtnis beim FS-Schreiben zu entlasten.", "def": "FS-Schreibende nutzen die L1 oft für Ideen, Struktur und Wortfindung. Der Nutzen hängt von der FS-Kompetenz ab.", "zitate": [{"t": "Gute FS-Schreibende verwendeten die L1 sehr viel erfolgreicher für das Ideengenerieren als schlechte FS-Schreibende", "s": "S. 22", "q": "Breuer 2020"}], "beispiel": "Stichwörter auf Persisch sammeln und erst dann auf Deutsch ausformulieren (eigenes Beispiel).", "see": ["translanguaging", "arbeitsgedaechtnis"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s2"], "hinweis": null}, {"id": "copy-task", "term": "copy task", "fa": "تکلیف رونویسی", "kurz": "Abschreibaufgabe mit Keylogging, die reine Ausführungsprozesse misst.", "def": "Van Waes et al. (2019) entwickelten sie, um die Ausführung des Schreibens in verschiedenen Sprachen zu vergleichen.", "zitate": [{"t": "Dabei hat die reine Tippfähigkeit einen großen Einfluss auf die Erfolgsaussichten der anderen Schreibprozesse", "s": "S. 28", "q": "Breuer 2020"}], "beispiel": "Wer langsam und unsicher tippt, verliert Arbeitsgedächtnis für Inhalt und Formulierung.", "see": ["arbeitsgedaechtnis"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s2"], "hinweis": null}, {"id": "revision", "term": "Revision (Revidieren)", "fa": "بازبینی متن", "kurz": "Abgleich des Textes mit dem Schreibziel, beginnt schon bei der Ideenwahl.", "def": "Bei FS-Schreibenden ist Revision nach der Fertigstellung besonders wirksam (Chenoweth/Hayes 2001). Sie bleibt oft lokal und kosmetisch.", "zitate": [{"t": "Er findet nicht ausschließlich nach dem Erstellen eines Textes statt, sondern beginnt bereits bei der Generierung und der Auswahl von Ideen", "s": "S. 29", "q": "Breuer 2020"}], "beispiel": "Bis zu 53,5 % der Korrekturen im FS-Text waren reine Tippfehler (Breuer 2017).", "see": ["schreibsubprozesse", "arbeitsgedaechtnis"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s2"], "hinweis": "Kellogg nennt die Teilprozesse reading und editing (Sitzung 3)."}, {"id": "translanguaging", "term": "translanguaging", "fa": "ترازبان‌ورزی (آمیختن زبان‌ها)", "kurz": "Das Mischen mehrerer Sprachen beim Lernen und Schreiben.", "def": "Gevers (2018) warnt vor unkritischem Einsatz, weil der Effekt auf das Schreiben nicht gesichert sei und von der Unterschiedlichkeit der Sprachen abhänge.", "zitate": [{"t": "GEVERS (2018) warnt jedoch davor, translanguaging – also das Vermischen mehrerer Sprachen – unkritisch im Unterricht einzusetzen", "s": "S. 27", "q": "Breuer 2020"}], "beispiel": "Persische Notizen in einem deutschen Schreibkurs zulassen und beobachten, ob der Text besser wird (eigenes Beispiel).", "see": ["l1-entlastung"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s2"], "hinweis": null}, {"id": "arbeitsgedaechtnis", "term": "Arbeitsgedächtnis beim Schreiben", "fa": "حافظه‌ی کاری در نوشتن", "kurz": "Begrenzte Kapazität, die alle Schreibprozesse gleichzeitig beanspruchen.", "def": "Beansprucht Sprachsuche zu viel Kapazität, leiden Denken und Planen (Breuer, mit Baddeley 2007). Kellogg beschreibt, welche Teilprozesse welche Komponenten des Arbeitsgedächtnisses brauchen.", "zitate": [{"t": "so hemmt dies das Schreiben als Denken.", "s": "S. 23", "q": "Breuer 2020"}], "beispiel": "Wer Orthographie und Grammatik noch nicht automatisiert hat, hat weniger Kapazität für Argumentation (eigene Anwendung).", "see": ["kellogg-modell", "schreiben-als-denken"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s2", "schreiben-s3"], "hinweis": null}, {"id": "kellogg-modell", "term": "Kellogg-Modell (1996): Arbeitsgedächtnis beim Schreiben", "fa": "مدل کلوگ (حافظه‌ی کاری در نوشتن)", "kurz": "Sechs Schreibprozesse und ihre Anforderungen an das Arbeitsgedächtnis.", "def": "Planning, translating, programming, executing, reading, editing. Außer der motorischen Ausführung beanspruchen alle die zentrale Exekutive. Der Notizblock wird nur beim Planen gebraucht, die phonologische Schleife beim Formulieren und Lesen.", "zitate": [{"t": "The model differentiated six basic processes.", "s": "S. 161", "q": "Kellogg et al., Modell von 1996"}], "beispiel": "Beim Korrekturlesen eigener Texte fallen Fehler schlechter auf, weil das Lesen von oben nach unten läuft (S. 164).", "see": ["arbeitsgedaechtnis", "knowledge-transforming"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s3"], "hinweis": null}, {"id": "selbstregulation-schreiben", "term": "Selbstregulation beim Schreiben (Zyklusmodell)", "fa": "خودتنظیمی در نوشتن (مدل چرخه‌ای)", "kurz": "Drei Phasen: Forethought, Performance, Self-reflection.", "def": "Ergebnisse des Schreibens wirken auf die nächste Vorüberlegung zurück. Dazu gehören Zielsetzung, Strategien, Selbstbeobachtung, Selbstbewertung, Attribution und Zufriedenheit.", "zitate": [{"t": "Because of its cyclical nature, this model seeks to explain writing as a continuing process of growth as a writer becomes more competent.", "s": "S. 54", "q": "Zimmerman/Kitsantas 2006"}], "beispiel": "Wer einen Misserfolg auf mangelndes Talent schiebt, lernt weniger weiter als wer ihn auf die Technik zurückführt (S. 58).", "see": ["schreibstrategie", "schreibprozessmanagement"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s3"], "hinweis": null}, {"id": "knowledge-telling", "term": "knowledge telling", "fa": "دانش‌گویی", "kurz": "Gedächtnisinhalte zu Thema und Genre linear aufschreiben.", "def": "Strategie nach Bereiter/Scardamalia (1987), typisch bei Schreibnovizen. Sie ähnelt dem assoziativen Schreiben und braucht kaum Planung.", "zitate": [{"t": "Durch ein simples lineares Aneinanderreihen werden diese Informationen ohne größere erkennbare Organisationsprozesse miteinander verbunden.", "s": "S. 42", "q": "Schnell 2020"}], "beispiel": "Alles aufschreiben, was einem zum Thema „Schreibkompetenz“ einfällt, ohne Gliederung (eigenes Beispiel).", "see": ["knowledge-transforming", "schreiben-als-denken", "pre-task-planning"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s2", "schreiben-s3"], "hinweis": null}, {"id": "knowledge-transforming", "term": "knowledge transforming", "fa": "دانش‌دگرگونی", "kurz": "Wissen wird beim Schreiben problemorientiert umgeformt.", "def": "Strategie der geübten Schreibenden: Textziele und Textmuster steuern, Inhalts- und Diskurswissen werden aufeinander bezogen. Das knowledge telling ist darin als Unterprozess enthalten.", "zitate": [{"t": "Bei dieser problemorientierten Herangehensweise wird die epistemisch-heuristische (erkenntnisfördernde) Funktion des Schreibens aktiviert", "s": "S. 43", "q": "Schnell 2020"}], "beispiel": "Während der Hausarbeit merkt man, dass die Fragestellung angepasst werden muss (eigenes Beispiel).", "see": ["knowledge-telling", "knowledge-crafting", "epistemisches-schreiben"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s3"], "hinweis": null}, {"id": "knowledge-crafting", "term": "knowledge crafting", "fa": "دانش‌پرداخت", "kurz": "Dritte Stufe nach Kellogg (2008): zusätzlich die Leserperspektive im Blick.", "def": "Expert:innen halten im Kopf, wie die Leserschaft den Text interpretiert, was die Ideen des Autors sind und was der Text aktuell kommuniziert. Laut Schnell braucht das etwa zwanzig Jahre Schreibpraxis.", "zitate": [{"t": "Regardless of the particular composition strategy employed, what characterizes the knowledge-crafting of expert writers is the capacity to keep in mind how a reader would interpret the text", "s": "S. 44", "q": "Schnell 2020"}], "beispiel": "Offene Frage bei Schnell: Gibt es knowledge crafting teilweise schon ohne volles knowledge transforming?", "see": ["knowledge-transforming"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s3"], "hinweis": null}, {"id": "schreibstrategie", "term": "Schreibstrategie", "fa": "راهبرد نوشتن", "kurz": "Erworbenes Ablauf- und Organisationsschema für das Schreiben, stark aufgaben- und personengebunden.", "def": "Nach Ortner (2000) ein Verfahren, das Feld der Aufmerksamkeit zu erweitern und die Zuwendung selbst zu steuern. Er unterscheidet zehn idealtypische Strategien. Reid (1984) unterscheidet radical brain-stormer und radical outliner.", "zitate": [{"t": "Ich begreife eine Strategie als ein Verfahren, das Feld der Aufmerksamkeit zu erweitern", "s": "S. 47", "q": "Schnell 2020"}], "beispiel": "Brain-stormer: schnell schreiben, dann mehrfach überarbeiten. Outliner: lange gliedern, dann schreiben (S. 46).", "see": ["knowledge-telling", "selbstregulation-schreiben"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s3"], "hinweis": null}, {"id": "schreibentwicklung-bereiter", "term": "Schreibentwicklung nach Bereiter (1980)", "fa": "رشد نوشتن بر اساس برایتر", "kurz": "Fünf Stufen von assoziativem bis epistemischem Schreiben, ohne feste Reihenfolge.", "def": "Associative, performative, communicative, unified und epistemic writing. Automatisierung der Grundprozesse macht Kapazität frei für weitere Teilfähigkeiten.", "zitate": [{"t": "there is no natural order of writing development", "s": "S. 71", "q": "Schnell 2020"}], "beispiel": "Studierende imitieren zunächst wissenschaftliche Stilmittel und verwenden sie später kontextadäquat (Steinhoff 2007, S. 73).", "see": ["epistemisches-schreiben", "knowledge-telling"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s3"], "hinweis": null}, {"id": "epistemisches-schreiben", "term": "epistemisches Schreiben", "fa": "نوشتن معرفت‌ساز", "kurz": "Schreiben, das Erkenntnis erweitert.", "def": "Gedanken werden umstrukturiert und neue Zusammenhänge erarbeitet. Besonders interessant für universitäre Lernprozesse.", "zitate": [{"t": "Beim epistemic writing werden durch die Umstrukturierung von Gedanken neue Zusammenhänge erarbeitet, wodurch es zu einer Erkenntniserweiterung kommt.", "s": "S. 71", "q": "Schnell 2020"}], "beispiel": "Ein Lerntagebuch zu einem Seminartext kann diese Funktion erfüllen (eigenes Beispiel).", "see": ["knowledge-transforming", "schreiben-als-denken"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s3"], "hinweis": null}, {"id": "computerlinguistik", "term": "Computerlinguistik", "fa": "زبان‌شناسی رایانشی", "kurz": "Wissenschaft von Sprache aus einer rechnerischen Perspektive.", "def": "Sie modelliert sprachliche Phänomene mit Algorithmen, entweder wissensbasiert (handgemacht) oder datengetrieben (statistisch). Andere Bezeichnungen: maschinelle Sprachverarbeitung, Sprachtechnologie, NLP.", "zitate": [{"t": "Simply put, computational linguistics is the scientific study of language from a computational perspective.", "s": "Folie 43 (ACL)", "q": "Folien Sitzung 1 (vl01)"}], "beispiel": "Rechtschreibkorrektur, Suchmaschinen und Chatbots sind Anwendungen.", "see": ["algorithmus", "sprachliche-ebenen", "sprachmodell"], "seminare": ["cl"], "sitzungen": ["cl-s1"], "hinweis": null}, {"id": "algorithmus", "term": "Algorithmus", "fa": "الگوریتم", "kurz": "Eindeutige Handlungsvorschrift, die eine Eingabe in eine Ausgabe überführt.", "def": "Maschinell ausführbare Algorithmen sind finit und terminieren nach endlich vielen Schritten. Formal kann man sie als Funktion f: X → Y verstehen (Sitzung 2).", "zitate": [{"t": "Ein Algorithmus ist eine eindeutige Handlungsvorschrift zur Lösung eines Problems oder einer Klasse von Problemen.", "s": "Folie 21", "q": "Folien Sitzung 1 (vl01)"}], "beispiel": "Hausaufgabe 1: Schritte für eine Rechtschreibkorrektur formulieren.", "see": ["programmiersprache", "computerlinguistik"], "seminare": ["cl"], "sitzungen": ["cl-s1", "cl-s2"], "hinweis": null}, {"id": "programmiersprache", "term": "Programmiersprache", "fa": "زبان برنامه‌نویسی", "kurz": "Formale Sprache zur Formulierung von Algorithmen.", "def": "Sie definiert, welche Instruktionen im Quelltext erlaubt sind. Ein Compiler oder Interpreter übersetzt sie in Prozessorbefehle. Beispiel: Python.", "zitate": [{"t": "Eine Programmiersprache ist eine formale Sprache zur Formulierung von Algorithmen, die auf einem Computer ausgeführt werden können.", "s": "Folie 22", "q": "Folien Sitzung 1 (vl01)"}], "beispiel": "Im Unterschied zur natürlichen Sprache sind Syntax und Semantik hier vollständig festgelegt (eigene Anwendung der Folie 37).", "see": ["algorithmus", "natuerliche-sprache"], "seminare": ["cl"], "sitzungen": ["cl-s1"], "hinweis": null}, {"id": "natuerliche-sprache", "term": "natürliche Sprache", "fa": "زبان طبیعی", "kurz": "Die von Menschen gelernte, gesprochene, geschriebene oder gebärdete Sprache.", "def": "Natürliche Sprache ist systematisch, folgt Regeln, verändert sich aber ständig.", "zitate": [{"t": "Die Sprache, die von Menschen gelernt, gesprochen, geschrieben oder gebärdet wird", "s": "Folie 27", "q": "Folien Sitzung 1 (vl01)"}], "beispiel": "Der Satz „Kannst du mir Kaffee machen?“ ist eine Frage, wird aber als Bitte verstanden (Pragmatik).", "see": ["sprachliche-ebenen", "programmiersprache"], "seminare": ["cl"], "sitzungen": ["cl-s1"], "hinweis": null}, {"id": "sprachliche-ebenen", "term": "sprachliche Ebenen", "fa": "سطوح زبانی", "kurz": "Phonetik/Phonologie, Morphologie, Syntax, Semantik, Pragmatik.", "def": "Sprachliche Einheiten, Regeln, Strukturen und Bedeutung werden auf unterschiedlichen Ebenen betrachtet: Laute, Wörter, Satz, Bedeutung, Kommunikation.", "zitate": [{"t": "Phonetik und Phonologie: Ebene der sprachlichen Laute", "s": "Folie 35", "q": "Folien Sitzung 1 (vl01)"}], "beispiel": "„Hasu“ statt „Haus“ (Buchstabenebene), „das“ statt „dass“ (Satzebene), „Wal“ statt „Wahl“ (Bedeutung) in der Hausaufgabe zur Rechtschreibkorrektur.", "see": ["natuerliche-sprache", "computerlinguistik"], "seminare": ["cl"], "sitzungen": ["cl-s1", "cl-s2"], "hinweis": null}, {"id": "sprachmodell", "term": "Sprachmodell (Language Model)", "fa": "مدل زبانی", "kurz": "Modell, das auf großen Datenmengen lernt, Wortsequenzen vorherzusagen.", "def": "Neuere Ansätze wie ChatGPT beruhen laut Folie auf sehr einfachen, aber riesigen Sprachmodellen. Im Gegensatz dazu zerlegen klassische, regelbasierte Systeme den Prozess in Komponenten.", "zitate": [{"t": "Neuere Ansätze und Technologien basieren auf sehr einfachen aber riesigen Sprachmodellen, die auf großen Datenmengen Lernen, Wortsequenzen vorherzusagen", "s": "Folie 46", "q": "Folien Sitzung 1 (vl01)"}], "beispiel": "Verbindung zum Seminar „KI-Feedback“: Chatbots wie ChatGPT sind LLMs (Large Language Models).", "see": ["computerlinguistik"], "seminare": ["cl"], "sitzungen": ["cl-s1"], "hinweis": null}, {"id": "phonem", "term": "Phonem", "fa": "واج", "kurz": "Kleinste bedeutungsunterscheidende Einheit der gesprochenen Sprache.", "def": "Phoneme sind die Lauttypen, die in einer Sprache Wörter unterscheiden. Beispiel: /a/ vs. /u/ in „hat“ und „Hut“. Schreibweise: IPA.", "zitate": [{"t": "Phoneme sind die kleinsten bedeutungsunterscheidenden Einheiten einer Sprache", "s": "Folie 60", "q": "Folien Sitzung 2 (vl02)"}], "beispiel": "Das englische „th“ gibt es im Deutschen nicht als Phonem (Folie 19).", "see": ["phon-allophon", "graphem"], "seminare": ["cl"], "sitzungen": ["cl-s2"], "hinweis": null}, {"id": "phon-allophon", "term": "Phon und Allophon", "fa": "آوا و واج‌گونه", "kurz": "Konkrete Realisierung eines Phonems und seine Varianten.", "def": "Dasselbe Phonem kann mit verschiedenen Phonen realisiert werden. Diese Varianten (Allophone) unterscheiden keine Bedeutung.", "zitate": [{"t": "Dasselbe Phonem kann mit verschiedenen Phonen realisiert werden, diese sind dann aber nicht bedeutungsunterscheidend", "s": "Folie 26", "q": "Folien Sitzung 2 (vl02)"}], "beispiel": "Gerolltes oder nicht gerolltes „r“ (Folie 26).", "see": ["phonem"], "seminare": ["cl"], "sitzungen": ["cl-s2"], "hinweis": null}, {"id": "graphem", "term": "Graphem", "fa": "نویسه", "kurz": "Kleinste Einheit der geschriebenen Sprache.", "def": "Grapheme sind konventionell. In logographischen Schriften stehen sie für bedeutungstragende, in phonographischen für bedeutungsunterscheidende Einheiten. Die Phonem-Graphem-Zuordnung ist nie 1:1.", "zitate": [{"t": "Grapheme sind die kleinsten Einheiten der Schriftsprache", "s": "Folie 60", "q": "Folien Sitzung 2 (vl02)"}], "beispiel": "Im Deutschen kann ein Phonem mit mehreren Graphemen geschrieben werden (Tabelle bei Wiktionary, Folie 33).", "see": ["phonem", "zeichensatz"], "seminare": ["cl"], "sitzungen": ["cl-s2"], "hinweis": null}, {"id": "spracherkennung-asr", "term": "Spracherkennung (ASR)", "fa": "بازشناسی خودکار گفتار", "kurz": "Bildet Lautsignale auf Folgen von Graphemen ab.", "def": "ASR ist nicht dasselbe wie Transkription: Die Ausgabe ist keine genaue phonetische Transkription. Herausforderungen sind Segmentierung und Variation (Reduktion, Assimilation).", "zitate": [{"t": "Spracherkennungssysteme bilden komplexe lautliche Sprachsignale auf Graphemsequenzen ab", "s": "Folie 60", "q": "Folien Sitzung 2 (vl02)"}], "beispiel": "Warum funktioniert eine englische Spracherkennung nicht für Deutsch? Andere Lautsysteme (Folie 11).", "see": ["sprachsynthese-tts", "phonem"], "seminare": ["cl"], "sitzungen": ["cl-s2"], "hinweis": null}, {"id": "sprachsynthese-tts", "term": "Sprachsynthese (TTS)", "fa": "سنتز گفتار", "kurz": "Bildet geschriebene Sprache auf Lautsignale ab.", "def": "Umkehrung der Spracherkennung (Text-to-Speech).", "zitate": [{"t": "Sprachsynthese bildet geschriebene Sprache auf lautliche Sprachsignale ab", "s": "Folie 60", "q": "Folien Sitzung 2 (vl02)"}], "beispiel": "Vorlesefunktion eines Smartphones (eigenes Beispiel).", "see": ["spracherkennung-asr"], "seminare": ["cl"], "sitzungen": ["cl-s2"], "hinweis": null}, {"id": "korpus", "term": "Korpus (Korpora)", "fa": "پیکره‌ی زبانی", "kurz": "Sammlung von sprachlichen Daten.", "def": "Man unterscheidet Textkorpora (geschrieben) und Korpora gesprochener Sprache. Letztere sind schwieriger zu erstellen.", "zitate": [{"t": "Das Korpus: eine Sammlung von sprachlichen Daten", "s": "Folie 35", "q": "Folien Sitzung 2 (vl02)"}], "beispiel": "DWDS ist ein Textkorpus, die vorgelesene Wikipedia ein Korpus gesprochener Sprache.", "see": ["token-typ"], "seminare": ["cl"], "sitzungen": ["cl-s2"], "hinweis": null}, {"id": "zeichensatz", "term": "Zeichensatz und Zeichenkodierung", "fa": "مجموعه نویسه و کدگذاری", "kurz": "Wie der Computer Schriftzeichen als Zahlen darstellt.", "def": "ASCII umfasst 128 Zeichen und reicht für das Englische. Unicode (UTF-8) kann alle existierenden Zeichen kodieren und ist heute Standard.", "zitate": [{"t": "Umfasst 128 Zeichen (7 Bit + 1 Reservebit)", "s": "Folie 51", "q": "Folien Sitzung 2 (vl02)"}], "beispiel": "Deutsche Umlaute und persische Schrift brauchen Unicode (eigene Anwendung).", "see": ["graphem"], "seminare": ["cl"], "sitzungen": ["cl-s2"], "hinweis": null}, {"id": "token-typ", "term": "Token und Typ (Type)", "fa": "توکن و تایپ", "kurz": "Vorkommen versus Wortform.", "def": "Ein Token ist eine Instanz einer Wortform in einem Text, ein Typ ist die abstrakte Wortform. Im Satz über die Fliegen gibt es 11 Token und 7 Typen (eigene Zählung).", "zitate": [{"t": "Instanz einer Wortform in einem Text", "s": "Folie 57", "q": "Folien Sitzung 2 (vl02)"}], "beispiel": "Zählt man „running words“, zählt man Token. Zählt man „distinct words“, zählt man Typen (Folien 58–59).", "see": ["korpus"], "seminare": ["cl"], "sitzungen": ["cl-s2"], "hinweis": null}, {"id": "ki-feedback", "term": "KI-Feedback", "fa": "بازخورد هوش مصنوعی", "kurz": "Rückmeldung zu Lernertexten durch ein generatives KI-Tool.", "def": "Im Seminar im Zentrum: Wie gut ist KI-Feedback auf L2-Texte, wie unterscheidet es sich vom Feedback der Lehrkraft, und wie lässt sich damit eine Lerneinheit didaktisieren? Nach Moorhouse/Wong kann es als Vorkorrektur oder formatives Feedback dienen, ist aber der umstrittenste Einsatz.", "zitate": [{"t": "Welches Feedback zu schriftlichen Lernertexten ist effektiver: KI-Feedback oder Lehrerfeedback?", "s": "Folie 4", "q": "Folien Einstieg (Riemer)"}], "beispiel": "Dein 150-Wörter-Text in ChatGPT oder Claude mit drei verschiedenen Prompts (Übung der Sitzung 1).", "see": ["human-in-the-loop", "genki", "validitaet"], "seminare": ["ki"], "sitzungen": ["ki-s1", "ki-s2"], "hinweis": null}, {"id": "genki", "term": "generative KI (genKI)", "fa": "هوش مصنوعی مولد", "kurz": "KI, die neue Inhalte erzeugt, z. B. Text, Code, Bilder, Videos.", "def": "Im Gegensatz zu regelbasierten Systemen folgt genKI nicht vorprogrammierten Antworten, sondern erzeugt Inhalte aus gelernten Mustern.", "zitate": [{"t": "Generative AI refers to a subset of AI designed for generating various types of content", "s": "S. 5", "q": "Moorhouse/Wong 2025"}], "beispiel": "ChatGPT erzeugt Text, Dall-E erzeugt Bilder.", "see": ["llm", "halluzination", "sprachmodell"], "seminare": ["ki"], "sitzungen": ["ki-s2"], "hinweis": null}, {"id": "llm", "term": "Large Language Model (LLM)", "fa": "مدل زبانی بزرگ", "kurz": "Sprachmodell, das mit Deep Learning auf großen Datenmengen Inhalte als statistisch wahrscheinliche Ergebnisse erzeugt.", "def": "LLMs können z. B. das nächste Wort oder Token vorhersagen. Sie sind sehr flexibel einsetzbar und arbeiten extrem schnell.", "zitate": [{"t": "Instead of relying on predefined rules, LLMs generate content by identifying patterns and relationships within the data to produce statistically probable outcomes", "s": "S. 5", "q": "Moorhouse/Wong 2025"}], "beispiel": "Verbindung zur Computerlinguistik: Sprachmodelle lernen, Wortsequenzen vorherzusagen (Sitzung 1 dort).", "see": ["genki", "halluzination", "sprachmodell"], "seminare": ["ki", "cl"], "sitzungen": ["ki-s2"], "hinweis": null}, {"id": "p-genai-c", "term": "berufliche genKI-Kompetenz (P-GenAI-C)", "fa": "شایستگی حرفه‌ای در هوش مصنوعی مولد", "kurz": "Fünf Aspekte des Wissens und Könnens, das Sprachlehrkräfte für genKI brauchen.", "def": "Technologische Kompetenz, pädagogische Kompatibilität, professionelle Arbeit außerhalb des Unterrichts, Risiko/Wohlbefinden/Ethik und Vorbereitung der Lernenden auf eine genKI-Welt.", "zitate": [{"t": "to conceptualise the knowledge and skills needed by language teachers in the GenAI world", "s": "S. 2", "q": "Moorhouse/Wong 2025"}], "beispiel": "Lernenden zeigen, wie sie KI-Feedback prüfen und nutzen (Aspekt 5).", "see": ["affordanz", "human-in-the-loop"], "seminare": ["ki"], "sitzungen": ["ki-s2"], "hinweis": null}, {"id": "affordanz", "term": "Affordanz", "fa": "امکان‌نمایی (ویژگی‌ای که کاربرد را پیشنهاد می‌کند)", "kurz": "Handlungsmöglichkeiten, die ein Tool für Nutzende in einem Kontext wahrnehmbar und realisierbar macht.", "def": "Dazu gehört auch, was ein Tool nahelegt oder erschwert (Folie 4).", "zitate": [{"t": "Affordanzen (Angebotscharakter): Handlungsmöglichkeiten, die für bestimmte Nutzende in einem bestimmten Kontext wahrnehmbar und realisierbar sind, einschließlich dessen, was das Tool nahelegt oder erschwert.", "s": "Folie 4", "q": "Folien Moorhouse/Wong Teil I (Riemer)"}], "beispiel": "Ein Chatbot legt nahe, Fragen zu stellen, ein Bildgenerator, Bilder zu beschreiben.", "see": ["p-genai-c"], "seminare": ["ki"], "sitzungen": ["ki-s2"], "hinweis": null}, {"id": "halluzination", "term": "Halluzination (KI)", "fa": "توهم (خروجی نادرست مدل)", "kurz": "Von der KI erzeugte falsche oder erfundene, aber plausibel klingende Inhalte.", "def": "Deshalb müssen Lehrkräfte Ergebnisse prüfen. Besonders riskant bei Sprachen, zu denen es wenige Trainingsdaten gibt.", "zitate": [{"t": "Achtung: Die Antworten müssen wegen möglicher Halluzinationen und Ungenauigkeiten überprüft werden.", "s": "Folie 9", "q": "Folien Moorhouse/Wong Teil I (Riemer)"}], "beispiel": "Ein erfundenes Fest in einer Liste „interessanter Feste“ (Beispiel aus Kapitel 2, eigene Erinnerung der Folie).", "see": ["llm", "human-in-the-loop"], "seminare": ["ki"], "sitzungen": ["ki-s2"], "hinweis": null}, {"id": "human-in-the-loop", "term": "human in the loop", "fa": "انسان در چرخه (نظارت انسانی)", "kurz": "Ein Mensch prüft und verantwortet die KI-Ausgabe.", "def": "Beim Feedback und Bewerten soll die Lehrkraft die KI-Ausgabe prüfen, damit sie zu Aufgabe, Kontext und Lernenden passt.", "zitate": [{"t": "there is still a need for the ‘human in the loop’ to ensure that the feedback is appropriate to the task, the context, and the learner", "s": "S. 39", "q": "Moorhouse/Wong 2025"}], "beispiel": "Vorkorrektur durch KI, Endbewertung durch die Lehrkraft.", "see": ["ki-feedback", "validitaet"], "seminare": ["ki"], "sitzungen": ["ki-s2"], "hinweis": null}, {"id": "prompt", "term": "Prompt (Prompten)", "fa": "پرامپت (دستور ورودی)", "kurz": "Eingabeanweisung an ein genKI-Tool.", "def": "Je genauer der Kontext beschrieben wird (Alter, Sprachstand, Fokus, Methode, Dauer), desto brauchbarer das Ergebnis. Arbeiten mit KI ist ein iterativer Prozess mit Folgeprompts.", "zitate": [{"t": "Experimentieren Sie mit unterschiedlichen Prompts und lassen sich Feedback auf Ihren Text geben.", "s": "Folie 4", "q": "Folien Einstieg (Riemer)"}], "beispiel": "Prompt-Idee für Feedback: „Gib mir Feedback auf Niveau B1, nenne drei Stärken und zwei Verbesserungen, ohne den Text umzuschreiben“ (eigenes Beispiel).", "see": ["ki-feedback"], "seminare": ["ki"], "sitzungen": ["ki-s1", "ki-s2"], "hinweis": null}, {"id": "validitaet", "term": "Validität", "fa": "روایی", "kurz": "Geprüft wird das, was geprüft werden soll, und nichts anderes.", "def": "Neben Transparenz und Reliabilität ein Qualitätskriterium für Bewertung. Es gilt auch beim Einsatz von genKI.", "zitate": [{"t": "Validität (geprüft wird das, was geprüft werden soll, und nichts anderes)", "s": "Folie 14", "q": "Folien Moorhouse/Wong Teil I (Riemer)"}], "beispiel": "Ein Leseverstehenstest, bei dem die KI vor allem Rechtschreibung bewertet, ist nicht valide.", "see": ["reliabilitaet", "human-in-the-loop"], "seminare": ["ki", "pruefen"], "sitzungen": ["ki-s2"], "hinweis": null}], "vokabeln": [{"de": "das Gesetz", "fa": "قانون", "gruppe": "text", "sitzung": "erz-s1", "forms": ["Gesetz"], "seminar": "erz"}, {"de": "der Türhüter", "fa": "دربان", "gruppe": "text", "sitzung": "erz-s1", "forms": ["Türhüter"], "seminar": "erz"}, {"de": "der Mann vom Lande", "fa": "مرد روستایی", "gruppe": "text", "sitzung": "erz-s1", "forms": ["Mann vom Lande"], "seminar": "erz"}, {"de": "der Eintritt (um Eintritt bitten)", "fa": "ورود (اجازه‌ی ورود خواستن)", "gruppe": "text", "sitzung": "erz-s1", "forms": ["Eintritt"], "seminar": "erz"}, {"de": "gewähren", "fa": "اجازه دادن، روا داشتن", "gruppe": "text", "sitzung": "erz-s1", "forms": ["gewähren"], "seminar": "erz"}, {"de": "das Tor", "fa": "دروازه", "gruppe": "text", "sitzung": "erz-s1", "forms": ["Tor"], "seminar": "erz"}, {"de": "beiseite treten", "fa": "کنار رفتن", "gruppe": "text", "sitzung": "erz-s1", "forms": ["beiseite tritt"], "seminar": "erz"}, {"de": "sich bücken", "fa": "خم شدن", "gruppe": "text", "sitzung": "erz-s1", "forms": ["bückt"], "seminar": "erz"}, {"de": "das Innere", "fa": "درون، داخل", "gruppe": "text", "sitzung": "erz-s1", "forms": ["Innere"], "seminar": "erz"}, {"de": "locken", "fa": "وسوسه کردن، به سوی خود کشیدن", "gruppe": "text", "sitzung": "erz-s1", "forms": ["lockt"], "seminar": "erz"}, {"de": "das Verbot", "fa": "منع، ممنوعیت", "gruppe": "text", "sitzung": function markParts(parts,vocab){
  var used={};
  return parts.map(function(p){
    var hits=[];
    vocab.forEach(function(v,i){
      if(used[i])return;
      var best=null;
      v.forms.forEach(function(f){
        var re=new RegExp("(^|[^\\p{L}])("+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![\\p{L}])","u");
        var m=re.exec(p);
        if(m){var st=m.index+m[1].length;if(!best||st<best.s)best={s:st,e:st+f.length,i:i}}
      });
      if(best)hits.push(best);
    });
    hits.sort(function(a,b){return a.s-b.s});
    var out="",pos=0;
    hits.forEach(function(h){
      if(h.s<pos)return;
      used[h.i]=true;
      out+=esc(p.slice(pos,h.s))+'<span class="v" role="button" tabindex="0" data-i="'+h.i+'">'+esc(p.slice(h.s,h.e))+'</span>';
      pos=h.e;
    });
    return out+esc(p.slice(pos));
  });
}

/* ---------- Suche ---------- */
var INDEX=[];
function buildIndex(){
  var add=function(url,title,kind,text){INDEX.push({url:url,title:title,kind:kind,text:strip(text)})};
  D.sitzungen.forEach(function(s){
    var o=s.ueberblick||{}, n=sem(s.seminar).name+" · Sitzung "+s.nr+": "+s.titel, b="#"+s.id;
    add(b,n,"Überblick",[o.kurzinhalt,o.leitfrage,o.merksatz].filter(Boolean).join(" "));
    (s.inhalt||[]).forEach(function(x){add(b+"-inhalt",n+" · "+x.titel,"Inhalt",x.html)});
    if(s.text)s.text.teile.forEach(function(x){add(b+"-text",n,"Text",x.t)});
    if(s.buch)s.buch.karten.forEach(function(k){add(b+"-buch",n+" · "+k.titel,"Lektüre "+k.seite,[k.text,k.kafka||""].concat((k.zitate||[]).map(function(z){return z.t})).join(" "))});
    if(s.analyse){
      (s.analyse.ebenen||[]).forEach(function(e){add(b+"-analyse",n+" · "+e.titel,"Analyse",[e.kafka].concat((e.zitate||[]).map(function(z){return z.t})).join(" "))});
      (s.analyse.beobachtungen||[]).forEach(function(x){add(b+"-analyse",n+" · "+x.titel,"Analyse",x.text)});
    }
    (s.zusatz||[]).forEach(function(z){add(b+"-zusatz",n+" · "+z.titel,"Zusatz",[z.quelle||"",z.notiz||"",z.url].join(" "))});
  });
  D.glossar.forEach(function(g){add("#b-"+g.id,g.term,"Glossar",[g.fa,g.kurz,g.def,g.beispiel||g.kafka||"",g.hinweis||""].concat((g.zitate||[]).map(function(z){return z.t})).join(" "))});
  D.vokabeln.forEach(function(v){add("#vokabeln",v.de,"Vokabel",v.de+" "+v.fa)});
  D.kommentare.forEach(function(k){add("#kommentare",k.quelle,"Kommentar",k.text+" "+(k.anmerkung||""))});
  D.quellen.forEach(function(q){add("#quellen",q.kurz,"Quelle",q.voll)});
}
function pSuche(){
  var q=query.trim(), h='<h1>Suche</h1>';
  if(q.length<2)return h+'<p class="lead">Mindestens zwei Zeichen eingeben.</p>';
  var ql=q.toLowerCase(), res=[];
  INDEX.forEach(function(it){
    var i=it.text.toLowerCase().indexOf(ql), t=it.title.toLowerCase().indexOf(ql);
    if(i<0&&t<0)return;
    var from=Math.max(0,i-60), snip=i<0?it.text.slice(0,140):(from>0?"…":"")+it.text.slice(from,i+q.length+90)+"…";
    res.push({it:it,score:(t>=0?2:0)+(i>=0?1:0),snip:snip});
  });
  res.sort(function(a,b){return b.score-a.score});
  var re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  var hl=function(s){return esc(s).replace(re,function(m){return '<mark class="hl">'+m+'</mark>'})};
  h+='<p class="lead">'+res.length+' Treffer für „'+esc(q)+'“</p><ul class="list">';
  res.slice(0,60).forEach(function(r){
    h+='<li><a class="row" href="'+r.it.url+'"><span class="t">'+hl(r.it.title)+'</span><span class="s">'+hl(r.snip)+'</span><span class="r meta">'+esc(r.it.kind)+'</span></a></li>';
  });
  return h+'</ul>';
}

/* ---------- Routing ---------- */
function render(){
  var cur=(location.hash||"#start").slice(1)||"start", html, m;
  if(cur==="suche"){html=pSuche()}
  else if(cur==="start"){html=pStart()}
  else if(cur==="glossar"){html=pGlossar()}
  else if(cur.indexOf("b-")===0){html=pEntry(cur.slice(2))}
  else if(cur==="vokabeln"){html=pVokabeln()}
  else if(cur==="kommentare"){html=pKomm()}
  else if(cur==="quellen"){html=pQuellen()}
  else if(sem(cur)){html=pSeminar(cur)}
  else if((m=/^([a-z0-9]+-s\d+)(?:-([a-z]+))?$/.exec(cur))&&sess(m[1])&&(!m[2]||tabsFor(sess(m[1])).some(function(t){return t[0]===m[2]}))){
    var s=sess(m[1]), t=m[2]||"";
    html={"":pOverview,inhalt:pInhalt,text:pText,buch:pBuch,analyse:pAnalyse,vokabeln:pSVokab,zusatz:pZusatz,material:pMaterial,kommentare:pSKomm}[t](s);
  } else {cur="start";html=pStart()}
  $("#view").innerHTML=html;
  renderNav(cur);
  document.body.classList.remove("nav-open");$("#menu").setAttribute("aria-expanded","false");
  bind();
  if(cur!=="suche")window.scrollTo(0,0);
}
function bind(){
  var tx=$("#storytext");
  if(tx){
    var vocab=D.vokabeln.filter(function(v){return v.sitzung===tx.getAttribute("data-s")&&v.gruppe==="text"&&v.forms});
    var show=function(el){
      var v=vocab[+el.getAttribute("data-i")];
      if(!v||tx.classList.contains("nohelp"))return;
      $("#gloss").innerHTML='<strong>'+esc(v.de)+'</strong> '+fa(v.fa)+(v.hinweis?' <span class="meta">'+esc(v.hinweis)+'</span>':'');
    };
    tx.addEventListener("click",function(e){var el=e.target.closest(".v");if(el)show(el)});
    tx.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("v")){e.preventDefault();show(e.target)}});
    $("#helpToggle").addEventListener("change",function(e){tx.classList.toggle("nohelp",!e.target.checked);store.set("vokhilfe",e.target.checked?"an":"aus")});
  }
  var vf=$("#vf");
  if(vf){
    var vg=$("#vg"), vs=$("#vs"), rows=$$("tbody tr");
    var apply=function(){
      var q=vf.value.toLowerCase(), g=vg?vg.value:"", sm=vs?vs.value:"";
      rows.forEach(function(r){
        var ok=r.textContent.toLowerCase().indexOf(q)>=0;
        if(ok&&g)ok=r.getAttribute("data-art")===g;
        if(ok&&sm)ok=r.getAttribute("data-sem")===sm;
        r.hidden=!ok;
      });
    };
    vf.addEventListener("input",apply); if(vg)vg.addEventListener("change",apply); if(vs)vs.addEventListener("change",apply);
  }
  var gf=$("#gf");
  if(gf){
    var gs=$("#gs"), items=$$("#glist li");
    var ap2=function(){var q=gf.value.toLowerCase(), sm=gs.value;items.forEach(function(li){var ok=li.textContent.toLowerCase().indexOf(q)>=0;if(ok&&sm)ok=(" "+li.getAttribute("data-sem")+" ").indexOf(" "+sm+" ")>=0;li.hidden=!ok})};
    gf.addEventListener("input",ap2); gs.addEventListener("change",ap2);
  }
}

$("#menu").addEventListener("click",function(){var o=document.body.classList.toggle("nav-open");this.setAttribute("aria-expanded",o?"true":"false")});
$("#q").addEventListener("input",function(e){
  query=e.target.value;
  if(query.trim().length>=2){ if(location.hash!=="#suche")location.hash="suche"; else render(); }
  else if(location.hash==="#suche"){render()}
});
window.addEventListener("hashchange",render);
buildIndex();
render();
})();
</script>
