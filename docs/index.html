l-s2"], "hinweis": null, "herkunft": [{"q": "Folien Sitzung 2 (vl02)", "s": ["Folie 57"]}]}, {"id": "ki-feedback", "term": "KI-Feedback", "kurz": "Rückmeldung zu Lernertexten durch ein generatives KI-Tool.", "def": "Im Seminar im Zentrum: Wie gut ist KI-Feedback auf L2-Texte, wie unterscheidet es sich vom Feedback der Lehrkraft, und wie lässt sich damit eine Lerneinheit didaktisieren? Nach Moorhouse/Wong kann es als Vorkorrektur oder formatives Feedback dienen, ist aber der umstrittenste Einsatz.", "zitate": [{"t": "Welches Feedback zu schriftlichen Lernertexten ist effektiver: KI-Feedback oder Lehrerfeedback?", "s": "Folie 4", "q": "Folien Einstieg (Riemer)"}], "beispiel": "Dein 150-Wörter-Text in ChatGPT oder Claude mit drei verschiedenen Prompts (Übung der Sitzung 1).", "see": ["human-in-the-loop", "genki", "validitaet"], "seminare": ["ki"], "sitzungen": ["ki-s1", "ki-s2"], "hinweis": null, "herkunft": [{"q": "Folien Einstieg (Riemer)", "s": ["Folie 4"]}]}, {"id": "genki", "term": "generative KI (genKI)", "kurz": "KI, die neue Inhalte erzeugt, z. B. Text, Code, Bilder, Videos.", "def": "Im Gegensatz zu regelbasierten Systemen folgt genKI nicht vorprogrammierten Antworten, sondern erzeugt Inhalte aus gelernten Mustern.", "zitate": [{"t": "Generative AI refers to a subset of AI designed for generating various types of content", "s": "S. 5", "q": "Moorhouse/Wong 2025"}], "beispiel": "ChatGPT erzeugt Text, Dall-E erzeugt Bilder.", "see": ["llm", "halluzination", "sprachmodell"], "seminare": ["ki"], "sitzungen": ["ki-s2"], "hinweis": null, "herkunft": [{"q": "Moorhouse/Wong 2025", "s": ["S. 5"]}]}, {"id": "llm", "term": "Large Language Model (LLM)", "kurz": "Sprachmodell, das mit Deep Learning auf großen Datenmengen Inhalte als statistisch wahrscheinliche Ergebnisse erzeugt.", "def": "LLMs können z. B. das nächste Wort oder Token vorhersagen. Sie sind sehr flexibel einsetzbar und arbeiten extrem schnell.", "zitate": [{"t": "Instead of relying on predefined rules, LLMs d": "halluzination", "term": "Halluzination (KI)", "kurz": "Von der KI erzeugte falsche oder erfundene, aber plausibel klingende Inhalte.", "def": "Deshalb müssen Lehrkräfte Ergebnisse prüfen. Besonders riskant bei Sprachen, zu denen es wenige Trainingsdaten gibt.", "zitate": [{"t": "Achtung: Die Antworten müssen wegen möglicher Halluzinationen und Ungenauigkeiten überprüft werden.", "s": "Folie 9", "q": "Folien Moorhouse/Wong Teil I (Riemer)"}], "beispiel": "Ein erfundenes Fest in einer Liste „interessanter Feste“ (Beispiel aus Kapitel 2, eigene Erinnerung der Folie).", "see": ["llm", "human-in-the-loop"], "seminare": ["ki"], "sitzungen": ["ki-s2"], "hinweis": null, "herkunft": [{"q": "Folien Moorhouse/Wong Teil I (Riemer)", "s": ["Folie 9"]}]}, {"id": "human-in-the-loop", "term": "human in the loop", "kurz": "Ein Mensch prüft und verantwortet die KI-Ausgabe.", "def": "Beim Feedback und Bewerten soll die Lehrkraft die KI-Ausgabe prüfen, damit sie zu Aufgabe, Kontext und Lernenden passt.", "zitate": [{"t": "there is still a need for the ‘human in the loop’ to ensure that the feedback is appropriate to the task, the context, and the learner", "s": "S. 39", "q": "Moorhouse/Wong 2025"}], "beispiel": "Vorkorrektur durch KI, Endbewertung durch die Lehrkraft.", "see": ["ki-feedback", "validitaet"], "seminare": ["ki"], "sitzungen": ["ki-s2"], "hinweis": null, "herkunft": [{"q": "Moorhouse/Wong 2025", "s": ["S. 39"]}]}, {"id": "prompt", "term": "Prompt (Prompten)", "kurz": "Eingabeanweisung an ein genKI-Tool.", "def": "Je genauer der Kontext beschrieben wird (Alter, Sprachstand, Fokus, Methode, Dauer), desto brauchbarer das Ergebnis. Arbeiten mit KI ist ein iterativer Prozess mit Folgeprompts.", "zitate": [{"t": "Experimentieren Sie mit unterschiedlichen Prompts und lassen sich Feedback auf Ihren Text geben.", "s": "Folie 4", "q": "Folien Einstieg (Riemer)"}], "beispiel": "Prompt-Idee für Feedback: „Gib mir Feedback auf Niveau B1, nenne drei Stärken und zwei Verbesserungen, ohne den Text umzuschreiben“ (eigenes Beispiel).", "see": ["ki-feedback"], "seminare": ["ki"], "sitzungen": ["ki-s1", "ki-s2"], "hinweis": null, "herkunft": [{"q": "Folien Einstieg (Riemer)", "s": ["Folie 4"]}]}, {"id": "validitaet", "term": "Validität", "kurz": "Geprüft wird das, was geprüft werden soll, und nichts anderes.", "def": "Neben Transparenz und Reliabilität ein Qualitätskriterium für Bewertung. Es gilt auch beim Einsatz von genKI.", "zitate": [{"t": "Validität (geprüft wird das, was geprüft werden soll, und nichts anderes)", "s": "Folie 14", "q": "Folien Moorhouse/Wong Teil I (Riemer)"}], "beispiel": "Ein Leseverstehenstest, bei dem die KI vor allem Rechtschreibung bewertet, ist nicht valide.", "see": ["reliabilitaet", "human-in-the-loop"], "seminare": ["ki", "pruefen"], "sitzungen": ["ki-s2"], "hinweis": null, "herkunft": [{"q": "Folien Moorhouse/Wong Teil I (Riemer)", "s": ["Folie 14"]}]}, {"id": "hayes-flower", "term": "Schreibprozessmodell von Hayes/Flower", "kurz": "Kognitives Modell mit Aufgabenumfeld, Langzeitgedächtnis und den Prozessen Planen, Formulieren, Überprüfen.", "def": "Schreiben wird als rekursiver Problemlösungsprozess modelliert, nicht als Abfolge fester Phasen. Ein Monitor steuert, wann Schreibende von einem Prozess zum nächsten wechseln.", "zitate": [{"t": "the task environment, the writer’s long-term memory, and the writing processes", "s": "S. 24", "q": "Schnell 2020"}], "beispiel": "Beim Schreiben einer Hausarbeit springt man vom Formulieren zurück zum Ideensammeln und dann zum Überarbeiten (eigenes Beispiel).", "see": ["schreibsubprozesse", "arbeitsgedaechtnis", "kellogg-modell"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s2"], "hinweis": null, "herkunft": [{"q": "Schnell 2020", "s": ["S. 24"]}]}, {"id": "schreibblockade", "term": "Schreibblockade", "kurz": "Anhaltende Schwierigkeit, mit dem Schreiben zu beginnen oder weiterzukommen.", "def": "Nach Rose und Keseling entsteht sie meist durch starre Regeln oder ineffektive Strategien, etwa zu frühes Überarbeiten der Sprache, fehlendes Konzept oder einen zu kritischen inneren Adressaten.", "zitate": [{"t": "rigid rules focus the writer’s mind too narrowly", "s": "S. 65", "q": "Schnell 2020"}], "beispiel": "Man feilt am ersten Satz, statt zuerst das Konzept zu klären (angelehnt an Rose, S. 66).", "see": ["schreibstrategie", "selbstregulation-schreiben"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s2"], "hinweis": null, "herkunft": [{"q": "Schnell 2020", "s": ["S. 65"]}]}, {"id": "faktuales-erzaehlen", "term": "faktuale Erzählung", "kurz": "Erzählung, die den Anspruch erhebt, von realen Vorgängen zu berichten.", "def": "Beispiele sind der Reisebericht, der Zeitungsbericht und die Biographie. Die Lüge gilt hier als Sonderfall: Sie erzählt Erfundenes mit dem Anspruch, wahr zu sein.", "zitate": [{"t": "Diese Form der authentischen Erzählung von historischen Ereignissen und Personen sei hier als faktuale Erzählung bezeichnet", "s": "S. 12", "q": "Martínez/Scheffel"}], "beispiel": "Ein Zeitungsbericht über einen Verkehrsunfall (Beispiel des Buchs, S. 12).", "see": ["fiktional-fiktiv-fingiert", "erzaehlen"], "seminare": ["erz"], "sitzungen": ["erz-s2"], "hinweis": null, "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 12"]}]}, {"id": "fiktional-fiktiv-fingiert", "term": "fiktional, fiktiv, fingiert", "kurz": "Drei Begriffe, die das Buch bewusst unterscheidet.", "def": "Fingieren heißt (vor)täuschen. Fiktional ist der pragmatische Status einer Rede (Gegenbegriff: faktual, authentisch). Fiktiv ist der ontologische Status des Ausgesagten (Gegenbegriff: real).", "zitate": [{"t": "Fiktional steht im Gegensatz zu ‹faktual› bzw. ‹authentisch› und bezeichnet den pragmatischen Status einer Rede.", "s": "S. 16", "q": "Martínez/Scheffel"}, {"t": "Fiktiv steht im Gegensatz zu ‹real› und bezeichnet den ontologischen Status des in dieser Rede Ausgesagten.", "s": "S. 16", "q": "Martínez/Scheffel"}], "beispiel": "Ein Märchen ist fiktional (als Erzählung markiert) und fiktiv (die Figuren gibt es nicht), aber nicht fingiert, weil es niemanden täuschen will.", "see": ["faktuales-erzaehlen", "fiktionssignale", "fiktionale-behauptungssaetze"], "seminare": ["erz"], "sitzungen": ["erz-s2"], "hinweis": null, "lexikon": [{"t": "Ein erfundener (‚fingierter‘) einzelner Sachverhalt oder eine Zusammenfügung solcher Sachverhalte zu einer erfundenen Geschichte.", "q": "Reallexikon der deutschen Literaturwissenschaft, s. v. Fiktion", "s": "PDF-S. 616"}], "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 16"]}]}, {"id": "dichtung-luege", "term": "Dichtung und Lüge (Sidney)", "kurz": "Sidneys These, dass der Dichter nichts behauptet und deshalb nicht lügt.", "def": "Sidney antwortet auf den Täuschungsvorwurf (Platon), indem er sich nicht auf den Inhalt, sondern auf den Status der Rede des Dichters beruft. Lukian hatte schon in der Vorrede gestanden, dass seine Geschichten erfunden sind.", "zitate": [{"t": "the Poet, he nothing affirms, and therefore never lieth", "s": "S. 15", "q": "Martínez/Scheffel"}], "beispiel": "Die Eingangsformel ‹Es war einmal› heißt nicht nur ‹Glauben Sie nichts davon›, sondern auch ‹Stellen Sie sich vor› (S. 17).", "see": ["fiktional-fiktiv-fingiert"], "seminare": ["erz"], "sitzungen": ["erz-s2"], "hinweis": null, "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 15"]}]}, {"id": "fiktionssignale", "term": "Fiktionssignale", "kurz": "Erkennbare Hinweise, dass eine Rede als fiktional gelesen werden soll.", "def": "Kontextmarkierungen wie Gattungsbezeichnung im Untertitel, Eingangsformeln und Schlüsse, textinterne Merkmale (Verben innerer Vorgänge, erweitertes Tempussystem) und Metafiktion.", "zitate": [{"t": "Damit eine Rede als fiktional aufgefasst wird, bedarf sie der Kontextmarkierung.", "s": "S. 18", "q": "Martínez/Scheffel"}], "beispiel": "‹morgen war Weihnachten, und sie hatte immer noch kein Geschenk›: Zukunftsadverb mit Präteritum (S. 19).", "see": ["fiktional-fiktiv-fingiert", "doppelte-kommunikation"], "seminare": ["erz"], "sitzungen": ["erz-s2"], "hinweis": null, "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 18"]}]}, {"id": "doppelte-kommunikation", "term": "doppelte Kommunikationssituation", "kurz": "Fiktionale Texte gehören einer realen und einer imaginären Kommunikation an.", "def": "In der realen Kommunikation schreibt ein Autor für einen Leser (Sätze real, aber inauthentisch). In der imaginären erzählt ein Erzähler einem Hörer oder Leser (Sätze imaginär, aber authentisch).", "zitate": [{"t": "Die fiktionale Erzählung richtet sich sowohl im imaginären als auch im realen Kontext an einen Leser und stellt daher eine «kommunizierte Kommunikation» dar", "s": "S. 19", "q": "Martínez/Scheffel"}], "beispiel": "In Kleists Anekdote erzählt der Offizier (imaginär) der Gesellschaft; Kleist (real) schreibt für uns.", "see": ["fiktionssignale", "erzaehlen-erzaehltes"], "seminare": ["erz"], "sitzungen": ["erz-s2"], "hinweis": null, "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 19"]}]}, {"id": "mehrsprachigkeitsphilologie", "term": "Mehrsprachigkeitsphilologie", "kurz": "Dembecks Vorschlag, die Literaturwissenschaft methodisch auf Sprachvielfalt auszurichten.", "def": "Sie untersucht literarische Sprachvielfalt nicht als ein Korpus mehrsprachiger Texte, sondern liest jeden Text auf die Vielfalt seiner sprachlichen Mittel hin und bezieht manifeste wie latente Formen ein.", "zitate": [{"t": "die Analyse und Interpretation literarischer Sprachvielfalt muss umgekehrt als Frage der Methode aufgefasst werden", "s": "S. 163", "q": "Dembeck 2020"}, {"t": "Jeder Text kann im Hinblick auf die Vielfalt der verwendeten sprachlichen Ausdrucksmittel gelesen werden.", "s": "S. 167", "q": "Dembeck 2020"}], "beispiel": "Eine Lektüre der Buddenbrooks-Szene fragt nach Platt, Hochdeutsch, Schreibung und Goschs Fremdsprachen zugleich.", "see": ["heterolinguismus", "binnenmehrsprachigkeit"], "seminare": ["litmehr"], "sitzungen": ["litmehr-s3", "litmehr-s2"], "hinweis": null, "herkunft": [{"q": "Dembeck 2020", "s": ["S. 163", "S. 167"]}]}, {"id": "heterolinguismus", "term": "Heterolinguismus (hétérolinguisme)", "kurz": "Grutmans weite Bestimmung literarischer Mehrsprachigkeit.", "def": "Gemeint ist das Vorhandensein fremder Idiome in einem Text in irgendeiner Form sowie von sozial, regional oder historisch definierten Varietäten der Hauptsprache.", "zitate": [{"t": "Vorhandensein fremder Idiome, in welcher Form auch immer, sowie von (sozial, regional oder chronologisch definierten) Varietäten der Hauptsprache in einem Text", "s": "S. 164 (Fn. 2)", "q": "Dembeck 2020"}], "beispiel": "Plattdeutsch in einem hochdeutschen Roman fällt unter diesen Begriff.", "see": ["mehrsprachigkeitsphilologie", "binnenmehrsprachigkeit"], "seminare": ["litmehr"], "sitzungen": ["litmehr-s3", "litmehr-s2"], "hinweis": null, "herkunft": [{"q": "Dembeck 2020", "s": ["S. 164 (Fn. 2)"]}]}, {"id": "binnenmehrsprachigkeit", "term": "binnensprachliche Mehrsprachigkeit", "kurz": "Mehrsprachigkeit innerhalb einer Sprache, etwa zwischen Standard und Dialekt.", "def": "Dembeck übernimmt den Begriff von Wandruszka. Er ergibt sich aus Fällen wie Karl May, wo Dialekt für eine andere Sprache steht.", "zitate": [{"t": "binnensprachliche Mehrsprachigkeit", "s": "S. 168", "q": "Dembeck 2020"}], "beispiel": "Karl May: Sächsisch steht für Deutsch, Standarddeutsch steht für Englisch.", "see": ["heterolinguismus", "dialekt"], "seminare": ["litmehr"], "sitzungen": ["litmehr-s3", "litmehr-s2"], "hinweis": null, "herkunft": [{"q": "Dembeck 2020", "s": ["S. 168"]}]}, {"id": "sprachwechsel-sprachmischung", "term": "Sprachwechsel und Sprachmischung", "kurz": "Zwei Formen der Kontrastierung von Idiomen im Text.", "def": "Beim Sprachwechsel bleiben die beteiligten Idiome voneinander unterscheidbar, bei der Sprachmischung sind sie so stark integriert, dass sich das nicht mehr trennen lässt.", "zitate": [{"t": "Sprachwechsel einerseits und Sprachmischung andererseits unterscheiden, wobei Ersterer die segmentäre Differenzierung der beteiligten Idiome erlaubt, während Letztere die verschiedenen Sprachen in einem solchen Maße integriert, dass diese Differenzierung nicht möglich ist", "s": "S. 170", "q": "Dembeck 2020"}], "beispiel": "Joyce, Finnegans Wake: eine Sprachmischung, bei der kaum noch eine Hauptsprache bestimmbar ist.", "see": ["code-switching", "heterolinguismus"], "seminare": ["litmehr"], "sitzungen": ["litmehr-s3", "litmehr-s2"], "hinweis": "Dembeck meint mit ‹Sprachwechsel› das Wechseln zwischen Idiomen im Text. Im Metzler Lexikon Sprache bedeutet derselbe Begriff etwas anderes, nämlich den Übergang einer Sprachgemeinschaft von einer Sprache zur anderen (engl. language shift). Beides nicht verwechseln.", "lexikon": [{"t": "Übergang einer Sprachgemeinschaft bzw. eines Individuums von einer Spr. A zu einer Spr. B", "q": "Metzler Lexikon Sprache, s. v. Sprachwechsel", "s": "PDF-S. 685"}], "herkunft": [{"q": "Dembeck 2020", "s": ["S. 170"]}]}, {"id": "code-switching", "term": "Code-Switching (Codeswitching)", "kurz": "Wechsel zwischen Sprachen oder Varietäten im Gespräch oder im Text.", "def": "Ein Begriff der Mehrsprachigkeitslinguistik, den die Literaturwissenschaft mit Dembeck für literarische Texte nutzt. In der Literatur wird es oft nur durch ‹poetische Tricks› nachgeahmt.", "zitate": [{"t": "durch poetische Tricks nachgeahmt", "s": "S. 164", "q": "Dembeck 2020"}], "beispiel": "Zauberberg: Französisch von Hans Castorp und Clawdia Chauchat (S. 169).", "see": ["sprachwechsel-sprachmischung"], "seminare": ["litmehr", "schreiben"], "sitzungen": ["litmehr-s3", "litmehr-s2"], "hinweis": "Auch im Seminar ‹Schreiben in der L2› relevant (Translanguaging).", "lexikon": [{"t": "Im Unterschied zu code-switching basiert t. auf der Annahme, dass Lernende nur ein linguistisches Repertoire nutzen, um zu kommunizieren, und nicht (willkürlich) zwischen mehreren sprachlichen Systemen wechseln.", "q": "Metzler Lexikon Fremdsprachendidaktik, s. v. Translanguag  (drei) Binnenerzählungen als Novelle zu erkennen, während die einzelnen Geschichten eher als Anekdoten zu bewerten wären.", "bezug": [], "anmerkung": "Für die Analyse, die du bis zum 27.11. schreibst: Das Handbuch ordnet die Form so ein, bevor es inhaltlich wird."}, {"sitzung": "erz-s2", "quelle": "Kleist-Handbuch, Kap. II.2.12 „Unwahrscheinliche Wahrhaftigkeiten“", "seite": "S. 158", "art": "wörtlicher Auszug, vom Scan abgelesen", "text": "Sein Thema ist allgemeiner die Unterscheidung von (wahrhaftiger) Historiographie und (wahrscheinlicher) Dichtung auf der Basis von Aristoteles’ Poetik, nach der sich Geschichtsschreiber und Dichter dadurch unterscheiden, dass »der eine das wirklich Geschehene mitteilt, der andere was geschehen könnte« (Aristoteles 1989, 31).", "bezug": ["dichtung-luege", "faktuales-erzaehlen"], "anmerkung": "Das ist dieselbe Unterscheidung wie in deiner Mitschrift vom 19.10. (Punkt 1, Aristoteles) und bei Martínez/Scheffel S. 13."}, {"sitzung": "erz-s2", "quelle": "Kleist-Handbuch, Kap. II.2.12 „Unwahrscheinliche Wahrhaftigkeiten“", "seite": "S. 158", "art": "wörtlicher Auszug, vom Scan abgelesen", "text": "Diese Unwahrscheinlichkeit wird durch Kleist – entgegen den Quellen – zusätzlich forciert, indem die grundsätzlich möglichen und z. T. dort bereits genannten Erklärungen unterschlagen werden", "bezug": []}, {"sitzung": "erz-s2", "quelle": "Kleist-Handbuch, Kap. II.2.12 „Unwahrscheinliche Wahrhaftigkeiten“", "seite": "S. 159", "art": "wörtlicher Auszug, vom Scan abgelesen", "text": "Kleists Geschichte ist gut erzählt, und ihr Autor führt dieses gelungene Erzählen vor, das aber gerade dadurch entsteht, dass sich der Erzähler/Autor dem Zuhörer/Leser entzieht – letztlich verschwindet selbst Kleist und hinterlässt als Signum von Autorschaft nur noch das Kürzel »vx.«.", "bezug": ["doppelte-kommunikation"], "anmerkung": "Passt zur doppelten Kommunikationssituation: Der Offizier erzählt der Gesellschaft, der (verschwindende) Autor dem Leser."}, {"sitzung": "erz-s3", "quelle": "Kafka-Handbuch, Kap. „Kleine Formen: Denkbilder, Parabeln, Aphorismen“", "seite": "S. 458", "art": "wörtlicher Auszug, vom Scan abgelesen", "text": "Im Vergleich zu den erzähltechnisch avancierten Belegfällen der Gattung ›Parabel‹ bei Kafka ist seine älteste und berühmteste Parabel, Vor dem Gesetz, allerdings noch recht konventionell, da man in diesem Text eine dominierende (erzähltechnisch distanzierende) personale Erzählsituation feststellen kann.", "bezug": [], "anmerkung": "‹Personale Erzählsituation› kommt im Seminarplan erst später dran (Modus, Fokalisierung ab 30.11.). Hier nur als Vorschau lesen."}, {"sitzung": "erz-s3", "quelle": "Kafka-Handbuch, Kap. „Kleine Formen: Denkbilder, Parabeln, Aphorismen“", "seite": "S. 458", "art": "wörtlicher Auszug, vom Scan abgelesen", "text": "Dabei wird der zur rezeptiven Anteilnahme einladende Inhalt konterkariert durch Formen der erzähltechnischen Distanzierung, durch die Kombination von Erzähltempus (historisches Präsens), intensiver Raffung und der dominanten personalen Erzählsituation.", "bezug": ["erzaehltempo"], "anmerkung": "‹Raffung› gehört zur Dauer (Sitzung 5, 9.11.); in Sitzung 3 reicht es, den Begriff als Vorschau zu kennen."}, {"sitzung": "erz-s3", "quelle": "Kafka-Handbuch, Kap. „Kleine Formen: Denkbilder, Parabeln, Aphorismen“", "seite": "S. 458", "art": "wörtlicher Auszug, vom Scan abgelesen", "text": "Bei der Einzelerzählung endet der Text mit der Pointe der Geschichte (»Hier konnte niemand sonst Einlaß erhalten, denn dieser Eingang war nur für dich bestimmt. Ich gehe jetzt und schließe ihn«; DzL 269).", "bezug": []}, {"sitzung": "erz-s3", "quelle": "Kafka-Handbuch, Kap. „Kleine Formen: Denkbilder, Parabeln, Aphorismen“", "seite": "S. 459", "art": "wörtlicher Auszug, vom Scan abgelesen", "text": "Im Kontext des Romans ist die Geschichte mithin darauf zu beziehen, dass und wie sich K. in dem Gericht täuscht, mit dem er es in seinem Prozess zu tun hat.", "bezug": [], "anmerkung": "Das Handbuch unterscheidet die einzeln gedruckte Parabel von der Fassung im Dom-Kapitel des Process-Romans (dort erzählt sie der Geistliche)."}], "quellen": [{"kurz": "Martínez/Scheffel: Einführung in die Erzähltheorie", "voll": "Matías Martínez, Michael Scheffel: Einführung in die Erzähltheorie. München: C. H. Beck (Seminarplan: 2020; Dateiname der Seminar-PDF: 2019).", "hinweis": "Seitenzahlen im Wiki sind die gedruckten Seitenzahlen. In der Seminar-PDF liegt jede Seite eine PDF-Seite später (gedruckte S. 22 = PDF-Seite 23)."}, {"kurz": "Kafka: Vor dem Gesetz", "voll": "Franz Kafka: Vor dem Gesetz. In: Drucke zu Lebzeiten, hg. von Wolf Kittler, Hans-Gerd Koch und Gerhard Neumann (Kritische Ausgabe). Frankfurt a. M.: S. Fischer 1994, S. 267–269.", "hinweis": "Der Text folgt der Schreibung dieser Ausgabe."}, {"kurz": "Handbücher", "voll": "Noch keine Handbuch-Kommentare eingetragen. Bibliografische Angaben kommen hierher, sobald die ersten Auszüge vorliegen.", "hinweis": null}, {"kurz": "Breuer 2020: Schreibprozesse in der Erst- und in der Fremdsprache", "voll": "Esther Odilia Breuer: Schreibprozesse in der Erst- und in der Fremdsprache. In: Fremdsprachen Lehren und Lernen (FLuL) 49 (2020), Heft 1, S. 22–31. DOI 10.2357/FLuL-2020-0002.", "hinweis": "Seitenzahlen im Wiki sind die gedruckten Seitenzahlen der Zeitschrift."}, {"kurz": "Kellogg et al.: Working Memory in Written Composition", "voll": "Kellogg et al.: Working Memory in Written Composition. In: Journal of Writing Research, S. 161–165 (Auszug zum Modell von 1996).", "hinweis": "Jahrgang und Heft nicht aus der Datei abgelesen, bitte bei Bedarf ergänzen."}, {"kurz": "Zimmerman/Kitsantas 2006: A Writer's Discipline", "voll": "Barry J. Zimmerman, Anastasia Kitsantas: A Writer's Discipline: The Development of Self-Regulatory Skill (2006), S. 53–59.", "hinweis": "Sammelband nicht aus der Datei abgelesen, bitte bei Bedarf ergänzen."}, {"kurz": "Schnell 2020: Schreibprozesse und Schreibentwicklung in der Fremdsprache", "voll": "Schnell (2020): Schreibprozesse und Schreibentwicklung in der Fremdsprache, hier S. 40–51 und 70–75 (Vorbereitungstext zur 3. Sitzung). Kapitel „Forschungsstand der L1- und L2-Schreibprozessforschung“.", "hinweis": "Verlag nicht aus der Datei abgelesen, bitte bei Bedarf ergänzen."}, {"kurz": "Moorhouse/Wong 2025: Generative Artificial Intelligence and Language Teaching", "voll": "Benjamin Luke Moorhouse, Kevin M. Wong (2025): Generative Artificial Intelligence and Language Teaching. Cambridge Elements (Reihe zu generativer KI in der Bildung, hg. von Mark Warschauer und Tamara Tate).", "hinweis": "Seitenzahlen im Wiki sind die Buchseiten der Element-Ausgabe, nicht die PDF-Seiten."}, {"kurz": "Seminarfolien (Berthelé, Riemer, Zarrieß/Bunzeck)", "voll": "Folien der Dozierenden zu Prüfen und Testen, Feedback und generativer KI sowie Computerlinguistik. Zitate daraus sind mit Folien-Nummer angegeben.", "hinweis": "Folien-Nummern sind die PDF-Seiten der jeweiligen Datei."}, {"kurz": "Kleist: Unwahrscheinliche Wahrhaftigkeiten", "voll": "Heinrich von Kleist: Unwahrscheinliche Wahrhaftigkeiten. In: Ders.: Sämtliche Erzählungen. Hg. v. Klaus Müller-Salget. Frankfurt a. M. 2005, S. 376–379.", "hinweis": "Scan mit schlechter Texterkennung; zitiert sind nur gut lesbare Stellen, bitte gegen die Vorlage prüfen."}, {"kurz": "Mann: Buddenbrooks", "voll": "Thomas Mann: Buddenbrooks (1901), S. 192–210 laut Seminarplan. Der Plan nennt die Große kommentierte Frankfurter Ausgabe (Hg. Heinrich Detering u. a., Frankfurt a. M. 2002ff.); welche Ausgabe der Scan zeigt, ist nicht vermerkt.", "hinweis": "Scan schlecht lesbar. Zitate habe ich von Hand an den Seiten abgelesen; Seitenzahlen sind die der Vorlage."}, {"kurz": "Dembeck 2020", "voll": "Till Dembeck: Es gibt keine einsprachigen Texte! Ein Vorschlag für die Literaturwissenschaft. In: Zeitschrift für interkulturelle Germanistik 11 (2020), H. 1, S. 163–176.", "hinweis": "Gekürzte, überarbeitete Übersetzung von Dembeck (2017)."}, {"kurz": "Dembeck/Parr 2017", "voll": "Till Dembeck, Rolf Parr (Hgg.): Literatur und Mehrsprachigkeit. Ein Handbuch. Tübingen 2017."}, {"kurz": "Seminarpläne", "voll": "Die Seminarpläne (Erzählkunst: Schönbeck; Prüfen und Testen: Berthelé; Schreiben in der L2: Introna; Literarische Mehrsprachigkeit) liegen als PDF im jeweiligen Ordner ‹Folien und Aufgaben›.", "hinweis": "Der Plan zu Erzählkunst nennt im Kopf ‹Wintersemester 2024›; der Plan zu Prüfen und Testen schreibt ‹Moser-Förtscher›, in der Lektüre steht ‹Moser-Frötscher›."}, {"kurz": "Kleist-Handbuch, Kap. II.2.12 „Unwahrscheinliche Wahrhaftigkeiten“", "voll": "Kleist-Handbuch, Teil II „Werke – Erzählungen“, Kap. 2.12 „Unwahrscheinliche Wahrhaftigkeiten“, S. 156–159 (Scan, Datei „unwahrscheinliche Wahrhaftigkeiten Kleist.pdf“).", "hinweis": "Titelei, Herausgeber und der Verfasser von Kap. 2.12 stehen nicht auf diesen vier Seiten (der Name „Ulrich Johannes Beil“ auf S. 156 gehört zum vorigen Kapitel 2.11). Trag sie nach, sobald du die Titelei hast."}, {"kurz": "Kafka-Handbuch, Kap. „Kleine Formen: Denkbilder, Parabeln, Aphorismen“", "voll": "Kafka-Handbuch, Teil „4. Strukturen, Schreibweisen, Themen“, Kapitel „Kleine Formen: Denkbilder, Parabeln, Aphorismen“, S. 458–459 (Scan, Datei „Kommentar Kafka vor dem Gesetz HB S458.pdf“).", "hinweis": "Titel des Handbuchs, Herausgeber und Verfasser des Kapitels stehen nicht auf diesen beiden Seiten. Trag sie nach, sobald du die Titelei hast. Verweise im Text wie „Zymner 1991“ sind Literaturangaben, nicht der Verfasser."}]}</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById("data").textContent);
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")};
var rich=function(s){return String(s).replace(/\[\[([a-z0-9-]+)\|([^\]]+)\]\]/g,function(m,id,t){return '<a class="term" href="#b-'+id+'">'+t+'</a>'})};
var strip=function(s){return String(s).replace(/\[\[[a-z0-9-]+\|([^\]]+)\]\]/g,"$1").replace(/<[^>]+>/g," ").replace(/&amp;/g,"&").replace(/\s+/g," ").trim()};
var fa=function(t){return '<span class="fa" lang="fa" dir="rtl">'+t+'</span>'};
var sess=function(id){return D.sitzungen.filter(function(s){return s.id===id})[0]};
var sem=function(id){return D.seminare.filter(function(s){return s.id===id})[0]};
var semester=function(id){return D.semester.filter(function(s){return s.id===id})[0]};
var entry=function(id){return D.glossar.filter(function(g){return g.id===id})[0]};
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var query="";
var pad=function(n){return String(n).padStart(2,"0")};
var sessVocab=function(s){return D.vokabeln.filter(function(v){return v.sitzung===s.id})};
var sessOf=function(cur){var m=/^([a-z0-9]+-s\d+)(?:-|$)/.exec(cur);return m?m[1]:null};

function tabsFor(s){
  var t=[["","Überblick"]];
  if(s.inhalt&&s.inhalt.length)t.push(["inhalt","Inhalt"]);
  if(s.text)t.push(["text","Text"]);
  if(s.buch)t.push(["buch","Lektüre"]);
  if(s.analyse)t.push(["analyse","Analyse"]);
  if(sessVocab(s).length)t.push(["vokabeln","Vokabeln"]);
  t.push(["zusatz","Zusatz"]);
  if(s.material&&s.material.length)t.push(["material","Material"]);
  t.push(["kommentare","Kommentare"]);
  return t;
}
var tok=function(id,tab){return tab?id+"-"+tab:id};

/* ---------- Navigation ---------- */
function renderNav(cur){
  var cs=sessOf(cur), h='<h4>Wiki</h4><a href="#start" class="'+(cur==="start"?"on":"")+'">Start</a>';
  D.semester.forEach(function(se){
    h+='<h4>'+esc(se.kurz)+'</h4>';
    D.seminare.filter(function(x){return x.semester===se.id}).forEach(function(sm){
      var inSem=(cs&&sess(cs)&&sess(cs).seminar===sm.id)||cur===sm.id;
      h+='<a class="sem'+(cur===sm.id?" on":"")+'" href="#'+sm.id+'">'+esc(sm.name)+'</a>';
      if(inSem){
        D.sitzungen.filter(function(s){return s.seminar===sm.id}).forEach(function(s){
          h+='<a class="sub'+(cs===s.id?" on":"")+'" href="#'+s.id+'"><span class="nr">S'+pad(s.nr)+'</span>'+esc(s.titel)+'</a>';
        });
      }
    });
  });
  h+='<h4>Nachschlagen</h4>';
  h+='<a href="#glossar" class="'+(cur==="glossar"||cur.indexOf("b-")===0?"on":"")+'">Glossar</a>';
  h+='<a href="#vokabeln" class="'+(cur==="vokabeln"?"on":"")+'">Vokabeln</a>';
  h+='<h4>Material</h4>';
  h+='<a href="#kommentare" class="'+(cur==="kommentare"?"on":"")+'">Handbuch-Kommentare</a>';
  h+='<a href="#quellen" class="'+(cur==="quellen"?"on":"")+'">Quellen</a>';
  $("#nav").innerHTML=h;
}

/* ---------- Bausteine ---------- */
function zitate(list){
  return (list||[]).map(function(z){return '<blockquote><p>'+rich(z.t)+'</p><cite>'+esc(z.q||"Martínez/Scheffel")+', '+esc(z.s)+'</cite></blockquote>'}).join("");
}
function statusBadge(s){
  return s.status==="geprueft"?'<span class="badge geprueft">geprüft</span>':'<span class="badge entwurf">Entwurf</span>';
}
function sessionHead(s,tab){
  var h='<span class="stamp">Sitzung '+s.nr+'</span>'+statusBadge(s)+'<h1>'+esc(s.titel)+'</h1>';
  var meta=[sem(s.seminar).name,s.autor,s.lektuere,s.thema].filter(Boolean).map(esc).join(" · ");
  h+='<p class="meta">'+meta+'</p>';
  h+='<div class="tabs" role="tablist">'+tabsFor(s).map(function(t){return '<a href="#'+tok(s.id,t[0])+'" class="'+(t[0]===tab?"on":"")+'">'+t[1]+'</a>'}).join("")+'</div>';
  return h;
}
function kommCard(k){
  var b=(k.bezug||[]).map(function(id){var g=entry(id);return g?'<a class="term" href="#b-'+id+'">'+esc(g.term)+'</a>':""}).join(", ");
  return '<article class="card"><div class="pg">'+esc(k.quelle)+(k.seite?', '+esc(k.seite):'')+' · '+esc(k.art)+'</div><blockquote><p>'+rich(k.text)+'</p></blockquote>'+(b?'<p class="meta">Bezug: '+b+'</p>':'')+(k.anmerkung?'<p>'+rich(k.anmerkung)+'</p>':'')+'</article>';
}
function emptyKomm(){
  return '<div class="empty"><strong>Noch keine Handbuch-Kommentare.</strong><p>Schick Auszüge aus akademischen Handbüchern mit Quelle und Seitenzahl. Sie werden hier abgelegt und mit Begriffen und Sitzungen verknüpft. Kurze Zitate oder Zusammenfassungen reichen.</p><pre>Handbuch / Autor:\nSeite:\nSitzung (Text):\nBezug (Begriff):\nAuszug oder Zusammenfassung:</pre></div>';
}
function vocabRows(list){
  return list.map(function(v){return '<tr data-sem="'+esc(v.seminar||"")+'" data-art="'+esc(v.gruppe)+'"><td><strong>'+esc(v.de)+'</strong>'+(v.hinweis?'<div class="small">'+esc(v.hinweis)+'</div>':'')+'</td>'+(v.fa?'<td class="fa" lang="fa" dir="rtl">'+v.fa+'</td>':'<td class="small">'+(v.glossar?'<a href="#b-'+esc(v.glossar)+'">→ Glossar</a>':'ohne Übersetzung')+'</td>')+'<td class="small">'+esc(v.gruppe==="text"?"Text":"Fachbegriff")+'</td></tr>'}).join("");
}
function vocabTable(list){
  return '<div class="tablewrap"><table><thead><tr><th>Deutsch</th><th>Persisch / Glossar</th><th>Art</th></tr></thead><tbody>'+vocabRows(list)+'</tbody></table></div>';
}
function semOptions(){
  return '<option value="">Alle Seminare</option>'+D.seminare.map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>'}).join("");
}

/* ---------- Seiten ---------- */
function pStart(){
  var h='<span class="stamp">Uni-Wiki</span><h1>Seminar-Wiki</h1>';
  h+='<p class="lead">Persönliche Wissenssammlung zu meinen Seminaren. Pro Sitzung: Überblick, Inhalt, Analyse, Vokabeln, Zusatzmaterial und Kommentare. Begriffe und Vokabeln sind über alle Seminare hinweg verknüpft.</p>';
  D.semester.forEach(function(se){
    h+='<div class="semhead">'+esc(se.name)+'</div>';
    D.seminare.filter(function(x){return x.semester===se.id}).forEach(function(sm){
      var list=D.sitzungen.filter(function(s){return s.seminar===sm.id});
      h+='<a class="sess" href="#'+sm.id+'"><span class="meta">'+list.length+' Sitzung'+(list.length===1?"":"en")+'</span><h3>'+esc(sm.name)+'</h3><p>'+esc(sm.beschreibung||"")+'</p></a>';
    });
  });
  h+='<h2>Nachschlagen</h2><ul class="list">';
  h+='<li><a class="row" href="#glossar"><span class="t">Glossar</span><span class="s">'+D.glossar.length+' Begriffe mit Belegstellen und Beispielen</span><span class="r">→</span></a></li>';
  h+='<li><a class="row" href="#vokabeln"><span class="t">Vokabeln</span><span class="s">'+D.vokabeln.length+' Wörter Deutsch–Persisch</span><span class="r">→</span></a></li>';
  h+='<li><a class="row" href="#kommentare"><span class="t">Handbuch-Kommentare</span><span class="s">'+(D.kommentare.length?D.kommentare.length+' Einträge':'Noch leer')+'</span><span class="r">→</span></a></li></ul>';
  h+='<footer class="f">Stand: '+esc(D.meta.stand)+'. Seiten mit dem Vermerk „Entwurf“ sind noch nicht geprüft. Zitate aus der Literatur sind kurz gehalten und mit Seitenzahl belegt.</footer>';
  return h;
}
function planHtml(sm){
  var p=sm.plan; if(!p)return "";
  var today=new Date().toISOString().slice(0,10), nxt=-1;
  (p.termine||[]).forEach(function(t,i){if(nxt<0&&t.iso&&t.iso>=today&&!t.entfaellt)nxt=i});
  var h='<h2>Seminarplan</h2>';
  if(p.info&&p.info.length)h+='<dl class="pinfo">'+p.info.map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>'}).join("")+'</dl>';
  h+='<ul class="plan">'+(p.termine||[]).map(function(t,i){
    var s=t.sitzung&&D.sitzungen.filter(function(x){return x.id===t.sitzung})[0];
    return '<li class="'+(i===nxt?'next':'')+(t.entfaellt?' off':'')+'"><div class="d">'+(t.nr?'Sitzung '+t.nr+'<br>':'')+esc(t.datum)+(i===nxt?'<br><strong>nächste</strong>':'')+'</div><div><div class="th">'+esc(t.thema)+'</div>'
      +(t.texte&&t.texte.length?t.texte.map(function(x){return '<p class="tx">'+esc(x)+'</p>'}).join(""):'')
      +(t.frist?'<p class="fr">'+esc(t.frist)+'</p>':'')
      +(s?'<p class="go"><a href="#'+s.id+'">Zur Sitzungsseite: '+esc(s.titel)+'</a></p>':'')+'</div></li>'}).join("")+'</ul>';
  if(p.leistungen&&p.leistungen.length)h+='<h3 style="margin-top:1.4rem">Leistungen</h3>'+p.leistungen.map(function(l){return '<div class="lei"><h3>'+esc(l.titel)+'</h3>'+l.text.map(function(x){return '<p>'+esc(x)+'</p>'}).join("")+'</div>'}).join("");
  if(p.quelle)h+='<p class="meta">Quelle: '+esc(p.quelle)+'</p>';
  return h;
}
function pSeminar(id){
  var sm=sem(id), se=semester(sm.semester), list=D.sitzungen.filter(function(s){return s.seminar===id});
  var h='<span class="stamp">'+esc(se.kurz)+'</span><h1>'+esc(sm.name)+'</h1><p class="lead">'+esc(sm.beschreibung||"")+'</p><h2>Sitzungen</h2>';
  h+=list.length?list.map(function(s){return '<a class="sess" href="#'+s.id+'"><span class="meta">Sitzung '+s.nr+(s.autor?' · '+esc(s.autor):'')+(s.lektuere?' · '+esc(s.lektuere):'')+'</span>'+statusBadge(s)+'<h3>'+esc(s.titel)+'</h3><p>'+esc(s.thema||"")+'</p></a>'}).join(""):'<div class="empty">Noch keine Sitzungen.</div>';
  h+=planHtml(sm);
  if(sm.lektuere&&sm.lektuere.length)h+='<h2>Lektüre und Material</h2><ul class="list">'+sm.lektuere.map(function(l){return '<li><div class="row"><span class="t">'+esc(l.titel)+'</span><span class="s">'+esc(l.autor)+(l.umfang?' · '+esc(l.umfang):'')+'</span><span class="r meta">'+esc(l.art)+'</span></div></li>'}).join("")+'</ul>';
  var gl=D.glossar.filter(function(g){return (g.seminare||[]).indexOf(id)>=0});
  h+='<h2>Begriffe dieses Seminars</h2><p>'+(gl.length?gl.map(function(g){return '<a class="term" href="#b-'+g.id+'">'+esc(g.term)+'</a>'}).join(" · "):'Noch keine Begriffe.')+'</p>';
  return h;
}
function pOverview(s){
  var o=s.ueberblick||{}, h=sessionHead(s,"");
  if(o.kurzinhalt)h+='<h2 style="margin-top:0">Kurzinhalt</h2><p>'+rich(o.kurzinhalt)+'</p>';
  if(o.leitfrage)h+='<h2>Leitfrage der Sitzung</h2><p>'+rich(o.leitfrage)+'</p>';
  if(o.merksatz)h+='<div class="hint"><strong>Merksatz.</strong> '+rich(o.merksatz)+'</div>';
  if(o.fa&&o.fa.length)h+='<h2>Zusammenfassung auf Persisch</h2><div class="card fa-box">'+o.fa.map(function(p){return '<p>'+p+'</p>'}).join("")+'</div>';
  if(s.begriffe&&s.begriffe.length)h+='<h2>Begriffe dieser Sitzung</h2><p>'+s.begriffe.map(function(id){var g=entry(id);return g?'<a class="term" href="#b-'+id+'">'+esc(g.term)+'</a>':""}).join(" · ")+'</p>';
  return h;
}
function pInhalt(s){
  var h=sessionHead(s,"inhalt");
  s.inhalt.forEach(function(x){
    h+='<h2 style="margin-top:1.6rem">'+esc(x.titel)+'</h2>'+(x.quelle?'<p class="meta">Quelle: '+esc(x.quelle)+'</p>':'')+'<div>'+rich(x.html)+'</div>';
  });
  return h;
}
function markParts(parts,vocab){
  var used={};
  return parts.map(function(p){
    var hits=[];
    vocab.forEach(function(v,i){
      if(used[i])return;
      var best=null;
      v.forms.forEach(function(f){
        var re=new RegExp("(^|[^\\p{L}])("+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![\\p{L}])","u");
        var m=re.exec(p);
        if(m){var st=m.index+m[1].length;if(!best||st<best.s)best={s:st,e:st+f.length,i:i}}
      });
      if(best)hits.push(best);
    });
    hits.sort(function(a,b){return a.s-b.s});
    var out="",pos=0;
    hits.forEach(function(h){
      if(h.s<pos)return;
      used[h.i]=true;
      out+=esc(p.slice(pos,h.s))+'<span class="v" role="button" tabindex="0" data-i="'+h.i+'">'+esc(p.slice(h.s,h.e))+'</span>';
      pos=h.e;
    });
    return out+esc(p.slice(pos));
  });
}
function pText(s){
  var t=s.text, vocab=D.vokabeln.filter(function(v){return v.sitzung===s.id&&v.gruppe==="text"&&v.forms});
  var marked=markParts(t.teile.map(function(x){return x.t}),vocab);
  var on=store.get("vokhilfe")!=="aus";
  var h=sessionHead(s,"text");
  h+='<p class="meta">'+esc(t.quelle)+'</p>';
  h+='<label class="toggle"><input type="checkbox" id="helpToggle"'+(on?" checked":"")+'> Vokabelhilfe anzeigen (erste Fundstelle jedes Wortes)</label>';
  h+='<div class="textcard'+(on?"":" nohelp")+'" id="storytext" data-s="'+s.id+'">';
  t.teile.forEach(function(x,i){h+='<div class="sec">'+esc(x.titel)+'</div><p class="k">'+marked[i]+'</p>'});
  h+='</div>';
  h+='<div class="gloss" id="gloss" aria-live="polite"><span class="meta">Tippe auf ein markiertes Wort, um die Übersetzung zu sehen.</span></div>';
  if(t.hinweis)h+='<p class="hint">'+esc(t.hinweis)+'</p>';
  return h;
}
function pBuch(s){
  var h=sessionHead(s,"buch");
  if(s.buch.einleitung)h+='<p class="lead">'+esc(s.buch.einleitung)+'</p>';
  s.buch.karten.forEach(function(k){
    h+='<article class="card"><div class="pg">'+esc(k.seite)+'</div><h3>'+esc(k.titel)+'</h3><p>'+rich(k.text)+'</p>'+zitate(k.zitate)+(k.kafka?'<div class="bei"><b>Beispiel</b>'+rich(k.kafka)+'</div>':'')+'</article>';
  });
  return h;
}
function pAnalyse(s){
  var a=s.analyse, h=sessionHead(s,"analyse");
  if(a.einleitung)h+='<p class="lead">'+rich(a.einleitung)+'</p>';
  var g="";
  (a.ebenen||[]).forEach(function(e){
    if(e.gruppe!==g){g=e.gruppe;h+='<div class="group">'+esc(g)+'</div>'}
    h+='<div class="lvl"><div class="n">'+e.n+'</div><div><h3>'+rich(e.titel)+'</h3>'+zitate(e.zitate)+'<p>'+rich(e.kafka)+'</p></div></div>';
  });
  if(a.beobachtungen&&a.beobachtungen.length){h+='<h2>Weitere Beobachtungen</h2>';a.beobachtungen.forEach(function(b){h+='<div class="card"><h3>'+esc(b.titel)+'</h3><p>'+rich(b.text)+'</p></div>'})}
  if(a.fragen&&a.fragen.length)h+='<h2>Fragen für die Seminardiskussion</h2><ul class="plain">'+a.fragen.map(function(f){return '<li>'+rich(f)+'</li>'}).join("")+'</ul>';
  return h;
}
function pSVokab(s){
  var h=sessionHead(s,"vokabeln");
  h+='<input class="filter" id="vf" type="search" placeholder="Vokabeln filtern" aria-label="Vokabeln filtern">';
  return h+vocabTable(sessVocab(s));
}
function pZusatz(s){
  var h=sessionHead(s,"zusatz"), z=s.zusatz||[];
  h+='<div class="hint">Zusatzmaterial gehört nicht zum Seminarmaterial. Es wird mit Quelle angegeben. Aktualität und Verlässlichkeit bitte selbst prüfen.</div>';
  if(!z.length)return h+'<div class="empty"><strong>Noch kein Zusatzmaterial.</strong><p>Sag „such Zusatzmaterial zu Sitzung '+s.nr+'“, dann werden hier Artikel, Handbuchkapitel und Links mit Quellenangabe eingetragen.</p></div>';
  h+=z.map(function(x){return '<div class="linkitem"><div><a href="'+esc(x.url)+'" target="_blank" rel="noopener"><strong>'+esc(x.titel)+'</strong></a><span class="chip">'+esc(x.typ||"Link")+'</span>'+(x.geprueft?'':'<span class="chip">Link noch nicht geprüft</span>')+'</div><div class="u">'+esc(x.url)+'</div>'+(x.quelle?'<div class="meta">'+esc(x.quelle)+'</div>':'')+(x.notiz?'<p>'+rich(x.notiz)+'</p>':'')+'</div>'}).join("");
  return h;
}
function pMaterial(s){
  var h=sessionHead(s,"material");
  h+='<div class="hint">Die Originaldateien liegen lokal im Ordner <code>seminare/</code> und werden nicht auf GitHub hochgeladen.</div><ul class="list">';
  s.material.forEach(function(m){h+='<li><div class="row"><span class="t">'+esc(m.datei)+'</span><span class="s">'+esc(m.notiz||"")+'</span><span class="r meta">'+esc(m.art)+'</span></div></li>'});
  return h+'</ul>';
}
function pSKomm(s){
  var list=D.kommentare.filter(function(k){return k.sitzung===s.id});
  return sessionHead(s,"kommentare")+(list.length?list.map(kommCard).join(""):emptyKomm());
}
function pGlossar(){
  var h='<h1>Glossar</h1><p class="lead">Begriffe aller Seminare, mit Definition, Angabe der Herkunft, Belegstelle und Beispiel. Fachbegriffe stehen ohne persische Entsprechung.</p>';
  h+='<div class="row-tools"><input class="filter" id="gf" type="search" placeholder="Begriffe filtern" aria-label="Begriffe filtern"><select id="gs" aria-label="Seminar">'+semOptions()+'</select></div><ul class="list" id="glist">';
  D.glossar.slice().sort(function(a,b){return a.term.localeCompare(b.term,"de")}).forEach(function(g){
    h+='<li data-sem="'+esc((g.seminare||[]).join(" "))+'"><a class="row" href="#b-'+g.id+'"><span class="t">'+esc(g.term)+'</span><span class="s">'+esc(g.kurz)+'</span>'+(g.lexikon&&g.lexikon.length?'<span class="r small">Fachlexikon</span>':'')+'</a></li>';
  });
  return h+'</ul>';
}
function herkunft(g){
  var hk=g.herkunft||[], lx=g.lexikon||[];
  var h='<div class="src"><strong>Woher die Definition stammt</strong><p>Kurzfassung im Wiki, nicht wörtlich zitiert'+(hk.length?'. Grundlage:':'.')+'</p>';
  if(hk.length)h+='<ul>'+hk.map(function(x){return '<li>'+esc(x.q)+(x.s&&x.s.length?', '+esc(x.s.join('; ')):'')+'</li>'}).join('')+'</ul>';
  h+='<p>'+(lx.length?'Fachlexikon: '+lx.map(function(z){return esc(z.q)+', '+esc(z.s)}).join('; ')+' (wörtlich unten).':'Aus den Fachlexika ist hier noch nichts belegt.')+'</p></div>';
  return h;
}
function pEntry(id){
  var g=entry(id); if(!g)return pStart();
  var h='<a class="back" href="#glossar">← Glossar</a><h1>'+esc(g.term)+'</h1>';
  h+='<h2>Definition</h2><p>'+rich(g.def)+'</p>'+herkunft(g)+zitate(g.zitate);
  if(g.lexikon&&g.lexikon.length)h+='<h2>Im Fachlexikon</h2><p class="meta">Wörtlich aus den Lexika in deinem Ordner fachlexika (PDF-Seitenzahlen).</p>'+g.lexikon.map(function(z){return '<blockquote class="lex"><p>'+rich(z.t)+'</p><cite>'+esc(z.q)+', '+esc(z.s)+'</cite></blockquote>'}).join("");
  if(g.hinweis)h+='<div class="hint"><strong>Achtung.</strong> '+rich(g.hinweis)+'</div>';
  var bsp=g.beispiel||g.kafka;
  if(bsp)h+='<h2>Beispiel</h2><p>'+rich(bsp)+'</p>';
  if(g.see&&g.see.length)h+='<h2>Siehe auch</h2><p>'+g.see.map(function(i){var x=entry(i);return x?'<a class="term" href="#b-'+i+'">'+esc(x.term)+'</a>':""}).join(" · ")+'</p>';
  if(g.sitzungen&&g.sitzungen.length)h+='<h2>Vorkommen</h2><p>'+g.sitzungen.map(function(i){var s=sess(i);return s?'<a href="#'+i+'">'+esc(sem(s.seminar).name)+', Sitzung '+s.nr+': '+esc(s.titel)+'</a>':""}).join(" · ")+'</p>';
  var km=D.kommentare.filter(function(k){return (k.bezug||[]).indexOf(id)>=0});
  h+='<h2>Handbuch-Kommentare</h2>'+(km.length?km.map(kommCard).join(""):'<p class="meta">Zu diesem Begriff gibt es noch keine Kommentare.</p>');
  return h;
}
function pVokabeln(){
  var h='<h1>Vokabeln</h1><p class="lead">Alle Wörter aus den Sitzungen. Wörter aus den Texten haben eine persische Übersetzung. Fachbegriffe haben keine, dafür einen Link zum Glossar, wo es einen Eintrag gibt.</p><div class="row-tools"><input class="filter" id="vf" type="search" placeholder="Vokabeln filtern" aria-label="Vokabeln filtern"><select id="vs" aria-label="Seminar">'+semOptions()+'</select><select id="vg" aria-label="Art"><option value="">Alle Arten</option><option value="text">Wörter aus den Texten</option><option value="fach">Fachbegriffe</option></select></div>';
  return h+vocabTable(D.vokabeln);
}
function pKomm(){
  var h='<h1>Handbuch-Kommentare</h1><p class="lead">Auszüge und Zusammenfassungen aus akademischen Handbüchern, geordnet nach Sitzung und Begriff.</p>';
  return h+(D.kommentare.length?D.kommentare.map(kommCard).join(""):emptyKomm());
}
function pQuellen(){
  var h='<h1>Quellen</h1><p class="lead">Ausgaben, nach denen im Wiki zitiert wird.</p>';
  D.quellen.forEach(function(q){h+='<article class="card"><h3>'+esc(q.kurz)+'</h3><p>'+esc(q.voll)+'</p>'+(q.hinweis?'<p class="meta">'+esc(q.hinweis)+'</p>':'')+'</article>'});
  return h;
}

/* ---------- Suche ---------- */
var INDEX=[];
function buildIndex(){
  var add=function(url,title,kind,text){INDEX.push({url:url,title:title,kind:kind,text:strip(text)})};
  D.sitzungen.forEach(function(s){
    var o=s.ueberblick||{}, n=sem(s.seminar).name+" · Sitzung "+s.nr+": "+s.titel, b="#"+s.id;
    add(b,n,"Überblick",[o.kurzinhalt,o.leitfrage,o.merksatz].filter(Boolean).join(" "));
    (s.inhalt||[]).forEach(function(x){add(b+"-inhalt",n+" · "+x.titel,"Inhalt",x.html)});
    if(s.text)s.text.teile.forEach(function(x){add(b+"-text",n,"Text",x.t)});
    if(s.buch)s.buch.karten.forEach(function(k){add(b+"-buch",n+" · "+k.titel,"Lektüre "+k.seite,[k.text,k.kafka||""].concat((k.zitate||[]).map(function(z){return z.t})).join(" "))});
    if(s.analyse){
      (s.analyse.ebenen||[]).forEach(function(e){add(b+"-analyse",n+" · "+e.titel,"Analyse",[e.kafka].concat((e.zitate||[]).map(function(z){return z.t})).join(" "))});
      (s.analyse.beobachtungen||[]).forEach(function(x){add(b+"-analyse",n+" · "+x.titel,"Analyse",x.text)});
    }
    (s.zusatz||[]).forEach(function(z){add(b+"-zusatz",n+" · "+z.titel,"Zusatz",[z.quelle||"",z.notiz||"",z.url].join(" "))});
  });
  D.glossar.forEach(function(g){add("#b-"+g.id,g.term,"Glossar",[g.kurz,g.def,g.beispiel||g.kafka||"",g.hinweis||""].concat((g.zitate||[]).map(function(z){return z.t})).concat((g.lexikon||[]).map(function(z){return z.t})).join(" "))});
  D.vokabeln.forEach(function(v){add("#vokabeln",v.de,"Vokabel",v.de+(v.fa?" "+v.fa:""))});
  D.kommentare.forEach(function(k){add("#kommentare",k.quelle,"Kommentar",k.text+" "+(k.anmerkung||""))});
  D.quellen.forEach(function(q){add("#quellen",q.kurz,"Quelle",q.voll)});
}
function pSuche(){
  var q=query.trim(), h='<h1>Suche</h1>';
  if(q.length<2)return h+'<p class="lead">Mindestens zwei Zeichen eingeben.</p>';
  var ql=q.toLowerCase(), res=[];
  INDEX.forEach(function(it){
    var i=it.text.toLowerCase().indexOf(ql), t=it.title.toLowerCase().indexOf(ql);
    if(i<0&&t<0)return;
    var from=Math.max(0,i-60), snip=i<0?it.text.slice(0,140):(from>0?"…":"")+it.text.slice(from,i+q.length+90)+"…";
    res.push({it:it,score:(t>=0?2:0)+(i>=0?1:0),snip:snip});
  });
  res.sort(function(a,b){return b.score-a.score});
  var re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  var hl=function(s){return esc(s).replace(re,function(m){return '<mark class="hl">'+m+'</mark>'})};
  h+='<p class="lead">'+res.length+' Treffer für „'+esc(q)+'“</p><ul class="list">';
  res.slice(0,60).forEach(function(r){
    h+='<li><a class="row" href="'+r.it.url+'"><span class="t">'+hl(r.it.title)+'</span><span class="s">'+hl(r.snip)+'</span><span class="r meta">'+esc(r.it.kind)+'</span></a></li>';
  });
  return h+'</ul>';
}

/* ---------- Routing ---------- */
function render(){
  var cur=(location.hash||"#start").slice(1)||"start", html, m;
  if(cur==="suche"){html=pSuche()}
  else if(cur==="start"){html=pStart()}
  else if(cur==="glossar"){html=pGlossar()}
  else if(cur.indexOf("b-")===0){html=pEntry(cur.slice(2))}
  else if(cur==="vokabeln"){html=pVokabeln()}
  else if(cur==="kommentare"){html=pKomm()}
  else if(cur==="quellen"){html=pQuellen()}
  else if(sem(cur)){html=pSeminar(cur)}
  else if((m=/^([a-z0-9]+-s\d+)(?:-([a-z]+))?$/.exec(cur))&&sess(m[1])&&(!m[2]||tabsFor(sess(m[1])).some(function(t){return t[0]===m[2]}))){
    var s=sess(m[1]), t=m[2]||"";
    html={"":pOverview,inhalt:pInhalt,text:pText,buch:pBuch,analyse:pAnalyse,vokabeln:pSVokab,zusatz:pZusatz,material:pMaterial,kommentare:pSKomm}[t](s);
  } else {cur="start";html=pStart()}
  $("#view").innerHTML=html;
  renderNav(cur);
  document.body.classList.remove("nav-open");$("#menu").setAttribute("aria-expanded","false");
  bind();
  if(cur!=="suche")window.scrollTo(0,0);
}
function bind(){
  var tx=$("#storytext");
  if(tx){
    var vocab=D.vokabeln.filter(function(v){return v.sitzung===tx.getAttribute("data-s")&&v.gruppe==="text"&&v.forms});
    var show=function(el){
      var v=vocab[+el.getAttribute("data-i")];
      if(!v||tx.classList.contains("nohelp"))return;
      $("#gloss").innerHTML='<strong>'+esc(v.de)+'</strong> '+fa(v.fa)+(v.hinweis?' <span class="meta">'+esc(v.hinweis)+'</span>':'');
    };
    tx.addEventListener("click",function(e){var el=e.target.closest(".v");if(el)show(el)});
    tx.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("v")){e.preventDefault();show(e.target)}});
    $("#helpToggle").addEventListener("change",function(e){tx.classList.toggle("nohelp",!e.target.checked);store.set("vokhilfe",e.target.checked?"an":"aus")});
  }
  var vf=$("#vf");
  if(vf){
    var vg=$("#vg"), vs=$("#vs"), rows=$$("tbody tr");
    var apply=function(){
      var q=vf.value.toLowerCase(), g=vg?vg.value:"", sm=vs?vs.value:"";
      rows.forEach(function(r){
        var ok=r.textContent.toLowerCase().indexOf(q)>=0;
        if(ok&&g)ok=r.getAttribute("data-art")===g;
        if(ok&&sm)ok=r.getAttribute("data-sem")===sm;
        r.hidden=!ok;
      });
    };
    vf.addEventListener("input",apply); if(vg)vg.addEventListener("change",apply); if(vs)vs.addEventListener("change",apply);
  }
  var gf=$("#gf");
  if(gf){
    var gs=$("#gs"), items=$$("#glist li");
    var ap2=function(){var q=gf.value.toLowerCase(), sm=gs.value;items.forEach(function(li){var ok=li.textContent.toLowerCase().indexOf(q)>=0;if(ok&&sm)ok=(" "+li.getAttribute("data-sem")+" ").indexOf(" "+sm+" ")>=0;li.hidden=!ok})};
    gf.addEventListener("input",ap2); gs.addEventListener("change",ap2);
  }
}

$("#menu").addEventListener("click",function(){var o=document.body.classList.toggle("nav-open");this.setAttribute("aria-expanded",o?"true":"false")});
$("#q").addEventListener("input",function(e){
  query=e.target.value;
  if(query.trim().length>=2){ if(location.hash!=="#suche")location.hash="suche"; else render(); }
  else if(location.hash==="#suche"){render()}
});
window.addEventListener("hashchange",render);
buildIndex();
render();
})();
</script>
