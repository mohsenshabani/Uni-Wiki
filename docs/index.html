<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Aktenordner-Wiki. Kopfzeile mit Suche, linke Navigation, Lesespalte.
   Blau = Behördenblau (Navigation, Links); Rot = Stempel (Sitzungsmarken, Belege). */
:root{
  --bg:#E9EDF1; --surface:#F7F9FB; --ink:#172233; --muted:#566376; --line:#CBD3DC;
  --accent:#1F4E79; --accent-soft:#DCE6F0; --stamp:#A12B2B; --quote:#EEF2F6; --hl:#F6E3A1;
  --f-serif:"Literata",Georgia,"Times New Roman",serif;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-fa:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1620; --surface:#17212D; --ink:#E6EBF1; --muted:#9AA7B8; --line:#2B3949;
    --accent:#86B8E4; --accent-soft:#22364A; --stamp:#E8827A; --quote:#1C2836; --hl:#5A4B12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1620; --surface:#17212D; --ink:#E6EBF1; --muted:#9AA7B8; --line:#2B3949;
  --accent:#86B8E4; --accent-soft:#22364A; --stamp:#E8827A; --quote:#1C2836; --hl:#5A4B12; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
a{color:var(--accent);text-underline-offset:.18em}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--f-serif);line-height:1.25;text-wrap:balance;margin:0}
.fa{font-family:var(--f-fa);direction:rtl;unicode-bidi:isolate}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:.9rem;padding-block:.6rem}
.brand{display:flex;align-items:baseline;gap:.6rem;text-decoration:none;color:var(--ink);font:600 1.05rem var(--f-serif);white-space:nowrap}
.az{font:500 .68rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);border:1.5px solid var(--stamp);padding:.05rem .35rem;border-radius:2px}
.top input[type=search]{flex:1;min-width:0;max-width:26rem;margin-left:auto;font:inherit;padding:.45rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#menu{display:none;font:500 .9rem var(--f-sans);padding:.4rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}

/* Rahmen */
.shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:2.5rem;padding-block:1.75rem 4rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav#nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.2rem);align-self:start;max-height:calc(100vh - 6rem);overflow:auto;font-size:.93rem}
nav h4{font:500 .7rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:1.3rem 0 .4rem}
nav h4:first-child{margin-top:0}
nav a{display:block;padding:.32rem .6rem;margin-left:-.6rem;border-radius:4px;color:var(--ink);text-decoration:none}
nav a:hover{background:var(--accent-soft)}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav a .nr{font:500 .75rem var(--f-mono);color:var(--stamp);margin-right:.45rem}
main{min-width:0;font:17px/1.7 var(--f-serif)}
main:focus{outline:none}
main > *{max-width:46rem}
main h1{font-size:2rem;font-weight:600}
main h2{font-size:1.3rem;font-weight:600;margin:2.2rem 0 .6rem}
main h3{font-size:1.05rem;font-weight:600;margin:0 0 .35rem}
main p{margin:.6rem 0}
.lead{font-size:1.1rem;color:var(--muted)}
.meta{font:500 .8rem var(--f-sans);color:var(--muted);letter-spacing:.02em}
.stamp{display:inline-block;font:500 .72rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--stamp);border:1.5px solid var(--stamp);padding:.12rem .5rem;border-radius:2px;transform:rotate(-1.5deg);margin-bottom:.7rem}

/* Status und Navigation */
.badge{display:inline-block;font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:.1rem .45rem;border-radius:2px;margin:0 0 .7rem .5rem;vertical-align:top}
.badge.entwurf{color:var(--muted);border:1.5px dashed var(--muted)}
.badge.geprueft{color:var(--surface);background:var(--accent);border:1.5px solid var(--accent)}
nav a.sem{font-weight:600;margin-top:.3rem}
nav a.sub{padding-left:1.1rem;font-size:.9rem}
.semhead{font:500 .8rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2rem 0 .2rem}
.linkitem{display:block;padding:.8rem 0;border-top:1px solid var(--line)}
.linkitem:last-child{border-bottom:1px solid var(--line)}
.linkitem .u{font:.8rem var(--f-mono);color:var(--muted);word-break:break-all}
.chip{display:inline-block;font:500 .72rem var(--f-mono);letter-spacing:.06em;border:1px solid var(--line);border-radius:3px;padding:0 .4rem;color:var(--muted);margin-left:.4rem}

/* Reiter */
.tabs{display:flex;gap:.1rem;overflow-x:auto;border-bottom:1px solid var(--line);margin:1.2rem 0 1.5rem}
.tabs a{white-space:nowrap;padding:.55rem .85rem;font:500 .9rem var(--f-sans);color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a:hover{color:var(--ink)}

/* Bausteine */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem 1.2rem;margin:1rem 0}
.card.fa-box{border-left:3px solid var(--accent)}
.card.fa-box p{font:400 1rem/1.9 var(--f-fa);direction:rtl;text-align:right;margin:.2rem 0}
.pg{font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--stamp);margin-bottom:.3rem}
blockquote{margin:.8rem 0;padding:.6rem 1rem;background:var(--quote);border-left:3px solid var(--line);font-size:.97rem}
blockquote p{margin:.2rem 0}
blockquote cite{display:block;font:500 .75rem var(--f-mono);letter-spacing:.06em;color:var(--muted);font-style:normal;margin-top:.35rem}
.kq{font-style:italic}
.bei{border-top:1px dashed var(--line);margin-top:.7rem;padding-top:.5rem;font-size:.96rem}
.bei b{font:600 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-right:.4rem}
.hint{font:.88rem/1.5 var(--f-sans);color:var(--muted);background:var(--accent-soft);padding:.55rem .8rem;border-radius:5px;margin:.8rem 0}
a.term{text-decoration:none;border-bottom:1px solid var(--accent)}
a.term:hover{background:var(--accent-soft)}
.list{list-style:none;padding:0;margin:.5rem 0}
.list li{border-top:1px solid var(--line)}
.list li:last-child{border-bottom:1px solid var(--line)}
.list .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem 1rem;padding:.75rem .2rem;text-decoration:none;color:var(--ink)}
.list a.row:hover{background:var(--accent-soft)}
.list .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.list .s{min-width:0;overflow-wrap:anywhere}
.list .s{grid-column:1;font:.9rem/1.45 var(--f-sans);color:var(--muted)}
.list .r{grid-row:1/3;grid-column:2;align-self:center;font-size:.95rem}
.sess{display:block;text-decoration:none;color:var(--ink);padding:1rem 1.2rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin:.8rem 0}
.sess:hover{border-color:var(--accent)}
.sess h3{font-size:1.2rem;margin:.1rem 0 .3rem}
.sess p{margin:.2rem 0;font:.95rem/1.5 var(--f-sans);color:var(--muted)}
.filter{width:100%;max-width:26rem;font:inherit;font-family:var(--f-sans);padding:.5rem .75rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);margin:.4rem 0 .8rem}
.row-tools{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;max-width:none!important}
.row-tools select{font:inherit;font-family:var(--f-sans);padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.tablewrap{overflow-x:auto;max-width:none!important}
table{border-collapse:collapse;width:100%;font:.95rem/1.45 var(--f-sans)}
th{font:500 .7rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:.5rem .7rem;border-bottom:1.5px solid var(--ink)}
td{padding:.55rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
td.fa{font-size:1.02rem;text-align:right;min-width:9rem}
td .small{color:var(--muted);font-size:.82rem}
tr[hidden]{display:none}

/* Ebenen */
.group{font:500 .72rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:1.8rem 0 .2rem;display:flex;gap:.6rem;align-items:center}
.group::after{content:"";flex:1;border-top:1px solid var(--line)}
.lvl{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:0 .9rem;padding:1rem 0;border-top:1px solid var(--line)}
.lvl .n{font:500 1.5rem var(--f-mono);color:var(--stamp);line-height:1.2}
.lvl .fa{font-size:.95rem;color:var(--muted);margin-left:.4rem}
ul.plain{padding-left:1.1rem;margin:.5rem 0}
ul.plain li{margin:.35rem 0}

/* Text mit Vokabelhilfe */
.textcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.2rem 1.4rem;margin:1rem 0}
.textcard .sec{font:500 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);margin:1.2rem 0 .1rem}
.textcard .sec:first-child{margin-top:0}
.textcard p.k{font-size:1.1rem;line-height:1.85;margin:.2rem 0 .6rem}
.v{background:var(--accent-soft);border-bottom:1.5px dotted var(--accent);cursor:pointer;border-radius:2px;padding:0 .08em}
.nohelp .v{background:none;border-bottom:none;cursor:text}
.gloss{position:sticky;bottom:env(safe-area-inset-bottom,0px);margin-top:1rem;padding:.6rem .9rem;background:var(--surface);border:1px solid var(--accent);border-radius:6px;font:.95rem/1.5 var(--f-sans);display:flex;gap:.8rem;align-items:baseline;flex-wrap:wrap;max-width:none!important}
.gloss .fa{font-size:1.05rem}
.toggle{display:inline-flex;gap:.5rem;align-items:center;font:.9rem var(--f-sans);color:var(--muted);cursor:pointer}

mark.hl{background:var(--hl);color:inherit;border-radius:2px}
.snip{font:.92rem/1.5 var(--f-sans);color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:6px;padding:1.2rem 1.4rem;margin:1rem 0;font-family:var(--f-sans)}
.empty pre{font:.85rem/1.6 var(--f-mono);background:var(--quote);padding:.7rem .9rem;border-radius:5px;overflow-x:auto;margin:.7rem 0 0;white-space:pre-wrap}
.back{font:.88rem var(--f-sans);display:inline-block;margin-bottom:.8rem}
footer.f{font:.8rem/1.5 var(--f-sans);color:var(--muted);margin-top:3rem;border-top:1px solid var(--line);padding-top:1rem;max-width:46rem}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:1rem;padding-block:1rem 3rem}
  #menu{display:inline-block}
  nav#nav{display:none;position:static;max-height:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.9rem 1rem}
  body.nav-open nav#nav{display:block}
  .az{display:none}
  main h1{font-size:1.65rem}
  .lvl{grid-template-columns:1.8rem minmax(0,1fr);gap:0 .6rem}
}
@media (prefers-reduced-motion:no-preference){ .sess,nav a,.list a.row{transition:background .15s,border-color .15s} }
</style>

tung", "autor": "Zarrieß, Bunzeck", "umfang": "vl02.pdf", "art": "Folien"}, {"titel": "Linguistic Fundamentals for Natural Language Processing: 100 Essentials from Morphology and Syntax", "autor": "Emily M. Bender", "umfang": "174 Seiten", "art": "Buch"}, {"titel": "Linguistic Fundamentals for Natural Language Processing II: 100 Essentials from Semantics and Pragmatics", "autor": "Emily M. Bender, Alex Lascarides", "umfang": "270 Seiten", "art": "Buch"}, {"titel": "Speech and Language Processing, 2nd Edition", "autor": "Daniel Jurafsky, James H. Martin", "umfang": "1038 Seiten", "art": "Buch"}, {"titel": "Hausaufgabe 1: Rechtschreibkorrektur (Algorithmen)", "autor": "eigene Hausaufgabe", "umfang": "2 Seiten", "art": "Eigene Arbeit"}], "semester": "2026-ws", "ordner": "Computerlinguistik"}, {"id": "litmehr", "name": "Literatur und Mehrsprachigkeit", "beschreibung": "Seminar zu literarischer Mehrsprachigkeit. Noch keine Sitzungen angelegt.", "lektuere": [{"titel": "Literatur und Mehrsprachigkeit. Ein Handbuch", "autor": "Till Dembeck, Rolf Parr (Hrsg.)", "umfang": "383 Seiten", "art": "Handbuch"}], "semester": "2026-ws", "ordner": "Lit. Mehrsprachigkeit"}], "sitzungen": [{"id": "cl-s1", "nr": 1, "seminar": "cl", "titel": "Einführung in die Computerlinguistik", "autor": "Sina Zarrieß, Bastian Bunzeck (AG Computerlinguistik)", "lektuere": "Folien Sitzung 1 (51 Folien)", "thema": "Organisation, Grundbegriffe (Algorithmus, Programmiersprache), sprachliche Ebenen und was Computerlinguistik ist", "status": "entwurf", "ueberblick": {"kurzinhalt": "Die erste Sitzung klärt die Organisation und stellt die Frage, was [[computerlinguistik|Computerlinguistik]] ist. Dazu werden zuerst die Grundbegriffe [[algorithmus|Algorithmus]] und [[programmiersprache|Programmiersprache]] geklärt, dann [[natuerliche-sprache|natürliche Sprache]] und die [[sprachliche-ebenen|sprachlichen Ebenen]] (Phonetik/Phonologie, Morphologie, Syntax, Semantik, Pragmatik). Die Computerlinguistik modelliert Sprachverstehen und Sprachproduktion mit Algorithmen, klassisch regelbasiert, heute vor allem mit [[sprachmodell|Sprachmodellen]].", "leitfrage": "Was ist Computerlinguistik, und worin unterscheiden sich natürliche Sprache und Programmiersprachen auf den sprachlichen Ebenen?", "merksatz": "Computerlinguistik = Sprache formal beschreiben und mit Algorithmen verarbeiten, zwischen Linguistik und Informatik, aber mit eigenen Theorien und Methoden.", "fa": ["زبان‌شناسی رایانشی (Computerlinguistik) یعنی توصیف دقیق و صوری زبان طبیعی و مدل‌سازی درک و تولید زبان با الگوریتم‌ها. این رشته بین زبان‌شناسی و علوم کامپیوتر است، ولی نظریه‌ها و روش‌های خودش را دارد.", "الگوریتم یک دستورالعمل بی‌ابهام برای حل یک مسئله است که یک ورودی مشخص را به یک خروجی مشخص تبدیل می‌کند. زبان برنامه‌نویسی یک زبان صوری برای نوشتن الگوریتم‌هاست (مثلاً Python).", "سطح‌های زبانی: آواشناسی/واج‌شناسی (صداها)، ساختواژه (واژه‌ها)، نحو (جمله)، معنی‌شناسی (معنی) و کاربردشناسی (ارتباط)."]}, "inhalt": [{"titel": "1. Organisation der Veranstaltung", "quelle": "Folien Sitzung 1 (vl01), Folien 3–12", "html": "<div class=\"tablewrap\"><table><thead><tr><th><\/th><th>Seminar (vorlesungsartig)<\/th><th>Übung/Tutorium<\/th><\/tr><\/thead><tbody><tr><td>Wer<\/td><td>Sina Zarrieß<\/td><td>Hannah Bultmann<\/td><\/tr><tr><td>Wann<\/td><td>Do, 10–12, S1-209<\/td><td>Di, 8–10, Hörsaal 11<\/td><\/tr><tr><td>Inhalt<\/td><td>Folien auf Moodle, Mitarbeit erwünscht, 2 Anwesenheitsübungen (je 15 Minuten)<\/td><td>wöchentliche Hausaufgaben mit Frist, Besprechung in der Übung, oft Laptop/Tablet nötig<\/td><\/tr><tr><td>Bewertung<\/td><td>Anwesenheitsübungen: bestanden/nicht bestanden<\/td><td>Hausaufgaben: bestanden/nicht bestanden<\/td><\/tr><\/tbody><\/table><\/div><p>Materialien, Hausaufgaben und Fragen laufen über Moodle.<\/p><blockquote><p>„Folien sind kein vollständiges/ausformuliertes Skript!“<\/p><cite>Folien Sitzung 1 (vl01), Folie 7<\/cite><\/blockquote><blockquote><p>„Mini-Probeklausur mit Fragen, wie sie in der Klausur vorkommen werden“<\/p><cite>Folien Sitzung 1 (vl01), Folie 8<\/cite><\/blockquote><blockquote><p>„mehr als 50% der Punkte wurden erreicht“<\/p><cite>Folien Sitzung 1 (vl01), Folie 8 (Kriterium für „bestanden“ bei den Anwesenheitsübungen)<\/cite><\/blockquote><blockquote><p>„sinnvolle Auseinandersetzung mit der Aufgabe ist erkennbar“<\/p><cite>Folien Sitzung 1 (vl01), Folie 9 (Kriterium für „bestanden“ bei den Hausaufgaben)<\/cite><\/blockquote><h4>Studienleistung und Prüfung<\/h4><ul class=\"plain\"><li>23-CL-BaCL1: 3 LP Seminar + 3 LP Übung. 23-MeWi-Einf-II: 3 LP Seminar.<\/li><li>Alle Hausaufgaben müssen bis zum Ende der Vorlesungszeit (05.02.2027) eingereicht und bestanden sein, beide Anwesenheitsübungen bestanden.<\/li><li>Klausur, 1. Termin: 11.02.2027, 10–12 Uhr, X-E0-001.<\/li><li>Klausur, 2. Termin: laut Folie 22.03.2026, 10–12 Uhr, X-E0-001. <strong>Die Jahreszahl 2026 liegt vor dem Semester und ist vermutlich ein Tippfehler (2027?). Bitte in Moodle prüfen.<\/strong><\/li><\/ul>"}, {"titel": "2. Was machen Computerlinguist:innen?", "quelle": "Folien Sitzung 1 (vl01), Folien 13–19", "html": "<p><strong>Anwendungen im Alltag<\/strong> (Folie 15): Chatbots und andere Dialogsysteme, Sprachmodelle (Large Language Models), Suchmaschinen, Recommendersysteme, automatische Übersetzung, Spamfilter, Rechtschreibkorrekturprogramme, Sprachlernprogramme, Robot Journalists, Informationsextraktionssysteme.<\/p><p><strong>Andere Bezeichnungen<\/strong> (Folie 16): Maschinelle Sprachverarbeitung, Sprachtechnologie, sprachliche Informationsverarbeitung, Digital Humanities, Natural Language Processing, Computational Linguistics.<\/p><p><strong>Verhältnis zu anderen Wissenschaften<\/strong> (Folien 17–18): Die Folien fragen zuerst, ob Computerlinguistik = Linguistik + Informatik + Psychologie ist, und antworten dann:<\/p><blockquote><p>„Computerlinguisten entwickeln eigene Theorien, Modelle und Methoden, die nicht Teil der Kern-Informatik oder Kern-Linguistik sind.“<\/p><cite>Folien Sitzung 1 (vl01), Folie 18<\/cite><\/blockquote>"}, {"titel": "3. Grundbegriffe: Computer, Algorithmus, Programmiersprache", "quelle": "Folien Sitzung 1 (vl01), Folien 20–24", "html": "<p><strong>Computer<\/strong> (Folie 20): Die Folie benennt Bauteile und ihre Aufgaben, z. B. Prozessor (CPU) verarbeitet Bits, Arbeitsspeicher (RAM) und Festplatte speichern Bits, der Monitor zeigt Pixel an.<\/p><blockquote><p>„Ein Algorithmus ist eine eindeutige Handlungsvorschrift zur Lösung eines Problems oder einer Klasse von Problemen. Bei der Problemlösung wird eine bestimmte Eingabe in eine bestimmte Ausgabe überführt.“<\/p><cite>Folien Sitzung 1 (vl01), Folie 21<\/cite><\/blockquote><p>Algorithmen lassen sich in natürlicher Sprache, Pseudocode oder Programmiersprachen formulieren. Maschinell ausführbare Algorithmen sind außerdem <em>finit<\/em> (endlicher Programmcode und Speicherbedarf) und <em>terminieren<\/em> nach endlich vielen Schritten.<\/p><blockquote><p>„Eine Programmiersprache ist eine formale Sprache zur Formulierung von Algorithmen, die auf einem Computer ausgeführt werden können.“<\/p><cite>Folien Sitzung 1 (vl01), Folie 22<\/cite><\/blockquote><p>Ein Compiler oder Interpreter übersetzt den Programmcode in Befehle, die der Prozessor ausführt. <strong>Python<\/strong> ist das Beispiel der Folien:<\/p><blockquote><p>„Wird in der Computerlinguistik und im maschinellen Lernen viel verwendet“<\/p><cite>Folien Sitzung 1 (vl01), Folie 23<\/cite><\/blockquote>"}, {"titel": "4. Natürliche Sprache und sprachliches Wissen", "quelle": "Folien Sitzung 1 (vl01), Folien 26–38", "html": "<p>Ausgangspunkt ist ein Alltagsgespräch (Hassan, Espresso). Die Folien fragen: Was wissen und können Sprecher einer natürlichen Sprache?<\/p><blockquote><p>„Die Sprache, die von Menschen gelernt, gesprochen, geschrieben oder gebärdet wird“<\/p><cite>Folien Sitzung 1 (vl01), Folie 27 (Definition natürliche Sprache)<\/cite><\/blockquote><p>Beispiele für Wissen auf verschiedenen Stufen:<\/p><ul class=\"plain\"><li><strong>Einheiten<\/strong>: Buchstaben/Laute, Silben, Wortteile, Wort, Phrase, Satz, Text.<\/li><li><strong>Strukturen und Regeln<\/strong>: „Kannst du mir Kaffee machen?“ ist möglich, „Machst du Kaffee können?“ oder „Kannst du Offee machen?“ nicht.<\/li><li><strong>Bedeutung und Intention<\/strong>: Warum stellt der Sprecher diese Frage, was versteht der Hörer, wie reagiert er?<\/li><\/ul><blockquote><p>„Bisherige Erkenntnis: Sprache ist systematisch!“<\/p><cite>Folien Sitzung 1 (vl01), Folie 34<\/cite><\/blockquote><p>Die Erforschung dieser Regelmäßigkeiten ist Gegenstand der Sprachwissenschaft.<\/p><h4>Sprachliche Ebenen (Folie 35)<\/h4><div class=\"tablewrap\"><table><thead><tr><th>Ebene<\/th><th>Gegenstand<\/th><\/tr><\/thead><tbody><tr><td>Phonetik und Phonologie<\/td><td>Ebene der sprachlichen Laute<\/td><\/tr><tr><td>Morphologie<\/td><td>Ebene der Wörter<\/td><\/tr><tr><td>Syntax<\/td><td>Ebene des Satzes<\/td><\/tr><tr><td>Semantik<\/td><td>Ebene der Bedeutung<\/td><\/tr><tr><td>Pragmatik<\/td><td>Ebene der Kommunikation<\/td><\/tr><\/tbody><\/table><\/div><p>Die Folien fordern auf, zu jeder Ebene ein Phänomen zu finden und zu vergleichen, auf welchen Ebenen sich natürliche Sprache und Programmiersprachen unterscheiden (Folien 36–37).<\/p><blockquote><p>„Sprache ist die Fähigkeit lautliche Äußerungen (oder Gebärden) zu produzieren, wahrzunehmen und diese mit Bedeutung zu assoziieren.“<\/p><cite>Folien Sitzung 1 (vl01), Folie 38 (Zusammenfassung)<\/cite><\/blockquote>"}, {"titel": "5. Was ist Computerlinguistik?", "quelle": "Folien Sitzung 1 (vl01), Folien 39–47", "html": "<p>Die Folien verbinden die beiden Begriffe: Ein Modell oder Algorithmus bildet Sprache auf Bedeutung/Intention ab (Sprachverstehen) oder Bedeutung/Intention auf Sprache (Sprachgenerierung). Leitfragen der Computerlinguistik (Folie 42):<\/p><blockquote><p>„Wie kann man natürliche Sprache und sprachliches Wissen formal präzise beschreiben?“<\/p><cite>Folien Sitzung 1 (vl01), Folie 42<\/cite><\/blockquote><blockquote><p>„Wie kann man Sprachverstehen und -produktion mit Algorithmen modellieren?“<\/p><cite>Folien Sitzung 1 (vl01), Folie 42<\/cite><\/blockquote><p><strong>Offizielle Definition (Association for Computational Linguistics, Folie 43):<\/strong><\/p><blockquote><p lang=\"en\">“Simply put, computational linguistics is the scientific study of language from a computational perspective.”<\/p><cite>ACL, zitiert auf Folien Sitzung 1 (vl01), Folie 43<\/cite><\/blockquote><p>Die Definition nennt zwei Arten von Modellen (wissensbasiert/handgemacht und datengetrieben/statistisch) und zwei Motivationen (wissenschaftliche Erklärung eines Phänomens oder technische Komponente eines Sprachsystems).<\/p><h4>Zwei Beispiele für Systeme<\/h4><blockquote><p>„Regelbasierte oder sog. „symbolische“ Systeme zerlegen den Sprachverarbeitungsprozess in verschiedene Komponenten mit entsprechenden Repräsentationen für sprachliche Struktur und Bedeutung“<\/p><cite>Folien Sitzung 1 (vl01), Folie 45 („klassisches“ Dialogsystem, nach J&M, S. 503)<\/cite><\/blockquote><blockquote><p>„Neuere Ansätze und Technologien basieren auf sehr einfachen aber riesigen Sprachmodellen, die auf großen Datenmengen Lernen, Wortsequenzen vorherzusagen“<\/p><cite>Folien Sitzung 1 (vl01), Folie 46 (Beispiel ChatGPT)<\/cite><\/blockquote>"}, {"titel": "6. Lernziele und Lektüre", "quelle": "Folien Sitzung 1 (vl01), Folien 47–50", "html": "<p>Die Veranstaltung vermittelt: linguistisches Grundwissen („Linguistic Essentials“), wie Sprache mit formalen oder statistischen Methoden beschrieben wird, welche Grenzen diese Methoden haben, welche Typen von Methoden und Algorithmen es gibt, und eine Hinführung zum Programmieren (sehr basic).<\/p><blockquote><p>„Welche Herausforderungen ergeben sich bei der formalen Beschreibung von Sprache, wo stoßen unsere Methoden an ihre Grenzen?“<\/p><cite>Folien Sitzung 1 (vl01), Folie 47<\/cite><\/blockquote><p><strong>Lektüreempfehlungen:<\/strong> Jurafsky/Martin, Speech and Language Processing, 2. Auflage 2009 (Abkürzung J&M, die Folie nennt sie eine sehr gute Einführung), sowie die 3. Edition (Fokus auf maschinelles Lernen und Deep Learning), die in späteren Semestern eine große Rolle spielen wird.<\/p><blockquote><p>„Diese Edition wird in späteren Semestern eine große Rolle spielen“<\/p><cite>Folien Sitzung 1 (vl01), Folie 50<\/cite><\/blockquote>"}], "zusatz": [{"titel": "Speech and Language Processing, 3. Edition (Jurafsky/Martin)", "url": "https://web.stanford.edu/~jurafsky/slp3/", "typ": "Lehrbuch (online)", "quelle": "Stanford, Folie 50", "geprueft": false, "notiz": "Link steht auf der Folie. Nicht von mir geöffnet."}, {"titel": "ACL: What is Computational Linguistics?", "url": "http://www.aclweb.org/archive/misc/what.html", "typ": "Definition", "quelle": "Association for Computational Linguistics, Folie 43", "geprueft": false, "notiz": "Quelle der zitierten Definition. Link steht auf der Folie. Nicht von mir geöffnet."}, {"titel": "AG Computerlinguistik Bielefeld", "url": "https://clause-bielefeld.github.io", "typ": "Webseite der Gruppe", "quelle": "Folie 2", "geprueft": false, "notiz": "Link steht auf der Folie. Nicht von mir geöffnet."}], "material": [{"datei": "vl01.pdf", "art": "Folien", "notiz": "Sitzung 1: Einführung, 51 Folien"}, {"datei": "Hausaufgabe_Algorithmen.pdf", "art": "Eigene Arbeit", "notiz": "Hausaufgabe 1: Rechtschreibkorrektur und Simultandolmetschen. Noch nicht in das Wiki übernommen. Die zugehörige Aufgabe stammt vermutlich aus der Übung."}], "begriffe": ["computerlinguistik", "algorithmus", "programmiersprache", "natuerliche-sprache", "sprachliche-ebenen", "sprachmodell"]}, {"id": "cl-s2", "nr": 2, "seminar": "cl", "titel": "Input und Output der Sprachverarbeitung", "autor": "Sina Zarrieß (AG Computerlinguistik)", "lektuere": "Folien Sitzung 2 (61 Folien); Jurafsky/Martin SLP3, Kap. 16 und 2 (Hinweis auf Folien)", "thema": "Gesprochene und geschriebene Sprache, Phoneme und Grapheme, Spracherkennung, Zeichensätze, Token und Typen", "status": "entwurf", "ueberblick": {"kurzinhalt": "Die Sitzung fragt, welche Eingaben und Ausgaben Sprachverarbeitung hat. Bei gesprochener Sprache geht es um Schall, [[phonem|Phoneme]] und [[phon-allophon|Phone]], bei geschriebener um [[graphem|Grapheme]] und Schriftsysteme. [[spracherkennung-asr|Spracherkennung]] bildet Laute auf Graphemfolgen ab, die [[sprachsynthese-tts|Sprachsynthese]] umgekehrt. Im Computer wird Text über [[zeichensatz|Zeichensätze]] kodiert. Schließlich unterscheidet man in einem [[korpus|Korpus]] [[token-typ|Token und Typen]].", "leitfrage": "Woraus bestehen sprachliche Inputs und Outputs, und wie machen Computer Sprache und Wörter greifbar?", "merksatz": "Spracherkennung ist nicht Transkription: Sie bildet Laute auf Graphemfolgen ab, nicht auf Lautschrift.", "fa": ["ورودی زبان گفتاری موج صوتی است و ورودی زبان نوشتاری دنباله‌ای از نمادهای گسسته (حروف). واج کوچک‌ترین واحد معنی‌متمایزکننده‌ی گفتار است و نویسه (Graphem) کوچک‌ترین واحد نوشتار.", "بازشناسی گفتار (ASR) صدا را به دنباله‌ی حروف تبدیل می‌کند، نه به نشانه‌گذاری آوایی (IPA). سنتز گفتار (TTS) برعکس عمل می‌کند.", "Token هر نمونه‌ی یک واژه در متن است و Type شکل انتزاعی واژه. در جمله‌ی «Wenn eine Fliege hinter Fliegen fliegt, fliegt eine Fliege Fliegen nach.» ۱۱ توکن و ۷ تایپ وجود دارد."]}, "inhalt": [{"titel": "1. Organisatorisches und Rückblick", "quelle": "Folien Sitzung 2 (vl02), Folien 2–6", "html": "<ul class=\"plain\"><li>Keine Vorlesung am 29.10.2026.<\/li><li>Die Übung am 27.10.2026 findet statt, die Übung am 03.11.2026 nicht.<\/li><li>Nächste Anwesenheitsübung: 26.11.2026.<\/li><\/ul><p>Hinweis der Folie: keine E-Mails schicken, wenn Hausaufgaben nicht hochgeladen wurden (die Abgabe in Moodle bleibt geöffnet) oder wenn man wegen Krankheit nicht teilnehmen kann.<\/p><p>Rückblick: die fünf sprachlichen Ebenen und der Algorithmus als Funktion:<\/p><blockquote><p>„Algorithmen kann man formal auch als Funktionen verstehen, die Inputs aus einer Menge X auf Outputs aus einer Menge Y abbilden“<\/p><cite>Folien Sitzung 2 (vl02), Folie 6<\/cite><\/blockquote>"}, {"titel": "2. Gesprochene Sprache: Schall, Vokale, Konsonanten", "quelle": "Folien Sitzung 2 (vl02), Folien 9–19", "html": "<p>Beim Sprechen erzeugen wir mit Artikulationsorganen (Stimmbänder, Zunge, Lippen) und Atmung Schallwellen. Physikalisch sind das Änderungen im Luftdruck, die ein Mikrofon aufnehmen kann. Eine Wellenform zeigt die Amplitude über die Zeit.<\/p><blockquote><p>„Vokale sind stimmhafte Laute, bei deren Artikulation die Stimmbänder relativ eng zusammen stehen und dadurch vibrieren“<\/p><cite>Folien Sitzung 2 (vl02), Folie 15<\/cite><\/blockquote><blockquote><p>„Konsonanten sind stimmhaft oder stimmlos“<\/p><cite>Folien Sitzung 2 (vl02), Folie 16<\/cite><\/blockquote><p>Vokale sind relativ lang und laut, stimmlose Konsonanten sind in der Wellenform schwer zu erkennen.<\/p><blockquote><p>„Die Phonetik beschäftigt sich mit sprachlichen Lauten“<\/p><cite>Folien Sitzung 2 (vl02), Folie 17<\/cite><\/blockquote><p>Demo auf der Folie (Spracherkennung im Browser) und die Frage: Warum kann man eine englische Spracherkennung nicht für deutsche Äußerungen verwenden? Antwort der nächsten Folien: Sprachen haben unterschiedliche Lautsysteme.<\/p><blockquote><p>„Einzelsprachen unterscheiden sich sehr bezüglich der Laute, die Sprecher (systematisch) produzieren und verstehen können“<\/p><cite>Folien Sitzung 2 (vl02), Folie 19<\/cite><\/blockquote>"}, {"titel": "3. Phoneme, Phone, Transkription", "quelle": "Folien Sitzung 2 (vl02), Folien 20–27", "html": "<p>Ein <strong>Phonem<\/strong> ist die Art von Laut, die in einer Sprache Wörter unterscheiden kann (Minimalpaar: /a/ vs. /u/ in <em>hat<\/em> und <em>Hut<\/em>). Ein <strong>Phon<\/strong> ist eine konkrete Realisierung.<\/p><blockquote><p>„Dasselbe Phonem kann mit verschiedenen Phonen realisiert werden, diese sind dann aber nicht bedeutungsunterscheidend“<\/p><cite>Folien Sitzung 2 (vl02), Folie 26<\/cite><\/blockquote><blockquote><p>„Die Realisierung eines Phonems wird auch durch vorangehende Phoneme bedingt“<\/p><cite>Folien Sitzung 2 (vl02), Folie 25<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th>Begriff<\/th><th>Bedeutung (Folien 20, 26)<\/th><\/tr><\/thead><tbody><tr><td>Phonem<\/td><td>kleinste bedeutungsunterscheidende Einheit der gesprochenen Sprache<\/td><\/tr><tr><td>Phon<\/td><td>minimale Analyseeinheit, Laut, Realisierung eines Phonems<\/td><\/tr><tr><td>Allophon<\/td><td>Variante desselben Phonems, nicht bedeutungsunterscheidend (Beispiel: gerolltes oder nicht gerolltes „r“)<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Das IPA ist eine standardisierte Schreibweise für Phoneme in verschiedenen Sprachen“<\/p><cite>Folien Sitzung 2 (vl02), Folie 21<\/cite><\/blockquote><p>ARPAbet ist ein vereinfachtes Transkriptionsalphabet, das J&M für das Englische nutzen. Zusätzlich tragen Betonung, Intonation und Prosodie Information:<\/p><blockquote><p>„Wörter und Sätze können mit verschiedenen Intonationsmustern gesprochen werden“<\/p><cite>Folien Sitzung 2 (vl02), Folie 27<\/cite><\/blockquote>"}, {"titel": "4. Geschriebene Sprache: Grapheme und Schriftsysteme", "quelle": "Folien Sitzung 2 (vl02), Folien 28–33", "html": "<blockquote><p>„Schriftsprache ist generell eine sekundäre Form der Sprachverwendung und ist an bestimmte Medien geknüpft“<\/p><cite>Folien Sitzung 2 (vl02), Folie 29<\/cite><\/blockquote><blockquote><p>„kann als erste Form der sprachwissenschaftlichen Analyse gesehen werden“<\/p><cite>Folien Sitzung 2 (vl02), Folie 29 (zur Erfindung der Schriftsysteme)<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th><\/th><th>Phonem<\/th><th>Graphem<\/th><\/tr><\/thead><tbody><tr><td>Definition<\/td><td>kleinste bedeutungsunterscheidende Einheit der gesprochenen Sprache<\/td><td>kleinste bedeutungsunterscheidende Einheit der geschriebenen Sprache<\/td><\/tr><tr><td>Status<\/td><td>Teil des Sprachsystems<\/td><td>sekundär, beruht auf Konvention<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Logographische Schrift:<\/strong> Grapheme stehen für bedeutungstragende Einheiten. <strong>Phonographische Schrift:<\/strong> Grapheme stehen für bedeutungsunterscheidende Einheiten (Laute).<\/p><blockquote><p>„Je nach Schrift und orthographischen Konventionen gibt es unterschiedliche Graphem-Phonem-Korrespondenzen in Sprachen, aber diese sind nie 1:1“<\/p><cite>Folien Sitzung 2 (vl02), Folie 60 (Zusammenfassung)<\/cite><\/blockquote>"}, {"titel": "5. Sprachliche Daten: Korpora", "quelle": "Folien Sitzung 2 (vl02), Folien 34–37", "html": "<blockquote><p>„Das Korpus: eine Sammlung von sprachlichen Daten“<\/p><cite>Folien Sitzung 2 (vl02), Folie 35<\/cite><\/blockquote><ul class=\"plain\"><li><strong>Textkorpora<\/strong>: geschriebene Texte (Zeitung, Artikel, Blogs, Tweets, Webseiten). Beispiel auf der Folie: DWDS.<\/li><li><strong>Korpora gesprochener Sprache<\/strong>: Dialoge, Interviews, vorgelesene Texte. Beispiel auf der Folie: vorgelesene Wikipedia (Spoken Wikipedia Corpus).<\/li><\/ul><blockquote><p>„Korpora gesprochener Sprache sind generell schwieriger zu erstellen und zu bekommen“<\/p><cite>Folien Sitzung 2 (vl02), Folie 35<\/cite><\/blockquote>"}, {"titel": "6. Spracherkennung (ASR) und Sprachsynthese (TTS)", "quelle": "Folien Sitzung 2 (vl02), Folien 38–47", "html": "<p>Systeme für gesprochene Sprache müssen Audio auf Symbolfolgen abbilden.<\/p><blockquote><p>„Spracherkennung bildet komplexe Lautsignale auf Sequenzen von Graphemen ab“<\/p><cite>Folien Sitzung 2 (vl02), Folie 42<\/cite><\/blockquote><blockquote><p>„Achtung: Spracherkennung ist nicht dasselbe wie Transkription! Die Ausgabe von existierenden ASR-Systemen ist keine genaue phonetische Transkription (z.B. mit IPA)!“<\/p><cite>Folien Sitzung 2 (vl02), Folie 42<\/cite><\/blockquote><p>Die Folie fragt: Warum nimmt man Grapheme und nicht Phoneme, um gesprochene Sprache zu erkennen? Aktuelle Systeme verwenden maschinelles Lernen (z. B. tiefe neuronale Netze).<\/p><p><strong>Herausforderungen:<\/strong><\/p><blockquote><p>„Keine oder sehr kurze Pausen zwischen Wörtern. Stimmlose Laute sind schwer zu erkennen!“<\/p><cite>Folien Sitzung 2 (vl02), Folie 44 (Segmentierung)<\/cite><\/blockquote><blockquote><p>„Reduktionen: Weglassen von Phonemen“<\/p><cite>Folien Sitzung 2 (vl02), Folie 45 (Variation in der Artikulation)<\/cite><\/blockquote><p>Assimilation: Anpassung von Phonen an den Kontext, z. B. [semf] statt [senf].<\/p><blockquote><p>„Sprachsynthese bildet Grapheme auf komplexe Lautsignale ab“<\/p><cite>Folien Sitzung 2 (vl02), Folie 47 (TTS, Text-to-Speech)<\/cite><\/blockquote>"}, {"titel": "7. Zeichensätze: ASCII und Unicode", "quelle": "Folien Sitzung 2 (vl02), Folien 48–53", "html": "<p>Bei geschriebener Sprache liegt der Input als Folge diskreter Symbole vor. Der Computer braucht einen Zeichensatz und eine Zeichenkodierung.<\/p><div class=\"tablewrap\"><table><thead><tr><th><\/th><th>ASCII<\/th><th>Unicode (UTF-8)<\/th><\/tr><\/thead><tbody><tr><td>Umfang<\/td><td>128 Zeichen (7 Bit + 1 Reservebit)<\/td><td>kann alle existierenden Zeichen kodieren<\/td><\/tr><tr><td>Bedeutung<\/td><td>erster Standard auf Computern, reicht für das Englische<\/td><td>heutiger Standard für Betriebssysteme und Programme<\/td><\/tr><tr><td>Beispiele<\/td><td>Leerzeichen: 32 (sp), Zeilenumbruch „\\n“: 10 (nl)<\/td><td>ältere Daten nutzen manchmal noch andere Zeichensätze<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Umfasst 128 Zeichen (7 Bit + 1 Reservebit)“<\/p><cite>Folien Sitzung 2 (vl02), Folie 51<\/cite><\/blockquote><blockquote><p>„Kann alle existierenden Zeichen kodieren“<\/p><cite>Folien Sitzung 2 (vl02), Folie 52<\/cite><\/blockquote><p>Einfache Textdateien („raw text“) enthalten nur Zeichen, keine Schriftart, und werden meist in Unicode kodiert.<\/p>"}, {"titel": "8. Wie erkennen Computer Wörter? Token und Typ", "quelle": "Folien Sitzung 2 (vl02), Folien 54–59", "html": "<p>Der Beispielsatz: <em>Wenn eine Fliege hinter Fliegen fliegt, fliegt eine Fliege Fliegen nach.<\/em> Zählt man „Fliege“ einmal oder zweimal?<\/p><div class=\"tablewrap\"><table><thead><tr><th><\/th><th>Type<\/th><th>Token<\/th><\/tr><\/thead><tbody><tr><td>Definition<\/td><td>Wortform, Element des Vokabulars einer Sprache<\/td><td>Instanz einer Wortform in einem Text<\/td><\/tr><tr><td>Beispiel im Satz<\/td><td>der Type „Fliege“<\/td><td>zwei Token des Types „Fliege“<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Wortform, Element des Vokabulars“<\/p><cite>Folien Sitzung 2 (vl02), Folie 57 (Type)<\/cite><\/blockquote><blockquote><p>„Instanz einer Wortform in einem Text“<\/p><cite>Folien Sitzung 2 (vl02), Folie 57 (Token)<\/cite><\/blockquote><p><strong>Eigene Zählung<\/strong> (ohne Satzzeichen, Groß- und Kleinschreibung unterschieden): Der Satz hat <strong>11 Token<\/strong> (running words) und <strong>7 Types<\/strong> (distinct words): Wenn, eine, Fliege, hinter, Fliegen, fliegt, nach.<\/p><blockquote><p>„Token sind Vorkommen von Wörtern einer Sprache in einem Text“<\/p><cite>Folien Sitzung 2 (vl02), Folie 60 (Zusammenfassung)<\/cite><\/blockquote><blockquote><p>„Typen sind abstrakte Wortformen einer Sprache“<\/p><cite>Folien Sitzung 2 (vl02), Folie 60<\/cite><\/blockquote>"}], "zusatz": [{"titel": "SLP3, Kapitel 16: Automatic Speech Recognition and Text-to-Speech", "url": "https://web.stanford.edu/~jurafsky/slp3/16.pdf", "typ": "Lehrbuchkapitel", "quelle": "Folie 10", "geprueft": false, "notiz": "Als Literatur zu gesprochener Sprache auf der Folie genannt. Nicht von mir geöffnet; Kapiteltitel nicht geprüft."}, {"titel": "SLP3, Kapitel 2: Wörter und Tokenisierung", "url": "https://web.stanford.edu/~jurafsky/slp3/2.pdf", "typ": "Lehrbuchkapitel", "quelle": "Folie 55", "geprueft": false, "notiz": "Als Literatur zu Wörtern auf der Folie genannt. Nicht von mir geöffnet; Kapiteltitel nicht geprüft."}, {"titel": "vosk-browser (Spracherkennungs-Demo)", "url": "https://ccoreilly.github.io/vosk-browser/", "typ": "Demo", "quelle": "Folie 11", "geprueft": false, "notiz": "Demo aus der Sitzung, nicht von mir geöffnet."}, {"titel": "Phoneme und Grapheme des Deutschen (Wiktionary)", "url": "https://de.wiktionary.org/wiki/Verzeichnis:Deutsch/Phoneme_und_Grapheme", "typ": "Nachschlagewerk", "quelle": "Folien 23 und 33", "geprueft": false, "notiz": "Auf den Folien genannt, nicht von mir geöffnet."}], "material": [{"datei": "vl02.pdf", "art": "Folien", "notiz": "Sitzung 2: Input und Output der Sprachverarbeitung, 61 Folien"}], "begriffe": ["algorithmus", "sprachliche-ebenen", "phonem", "phon-allophon", "graphem", "spracherkennung-asr", "sprachsynthese-tts", "korpus", "zeichensatz", "token-typ"]}, {"id": "erz-s1", "nr": 1, "titel": "Vor dem Gesetz", "autor": "Franz Kafka", "thema": "Das Erzählen und das Erzählte", "begriffe": ["erzaehlen-erzaehltes", "erzaehlte-welt", "handlung", "darstellung", "fiktionale-behauptungssaetze", "fabula-sjuzet", "histoire-discours", "genette", "ereignis", "geschehen", "geschichte", "handlungsschema", "erzaehlung", "erzaehlen", "erzaehltempo"], "ueberblick": {"kurzinhalt": "Ein Mann vom Lande will in das Gesetz. Der Türhüter sagt, jetzt könne er ihn nicht einlassen. Der Mann wartet Tage und Jahre vor dem offenen Tor, besticht den Türhüter und stellt ihm kurz vor seinem Tod eine letzte Frage: Warum hat in all den Jahren niemand außer ihm Einlass verlangt? Der Türhüter antwortet, dieser Eingang sei nur für ihn bestimmt gewesen, und schließt ihn.", "leitfrage": "Wie unterscheiden wir das Erzählte (das „Was“) vom Erzählen (dem „Wie“)? Und warum ist diese Unterscheidung auch bei fiktionalen Texten sinnvoll?", "merksatz": "[[erzaehlen-erzaehltes|Das Erzählte]] umfasst die Ebenen 1–4 ([[ereignis|Ereignis]], [[geschehen|Geschehen]], [[geschichte|Geschichte]], [[handlungsschema|Handlungsschema]]). [[erzaehlen-erzaehltes|Das Erzählen]] umfasst die Ebenen 5–6 ([[erzaehlung|Erzählung]], [[erzaehlen|Erzählen]]).", "fa": ["مردی روستایی می‌خواهد وارد «قانون» شود، اما دربان اجازه نمی‌دهد. مرد سال‌ها منتظر می‌ماند و در پایان می‌فهمد که این در فقط برای او بوده است.", "در کتاب مارتینز/شفل (ص ۲۲–۲۸) یاد می‌گیریم که هر روایت دو لایه دارد: «آنچه روایت می‌شود» (das Erzählte) و «شیوه‌ی روایت‌کردن» (das Erzählen).", "همین داستان را می‌شود به شیوه‌های بی‌شمار بازگفت، بی‌آنکه داستان عوض شود."]}, "text": {"quelle": "Franz Kafka: Vor dem Gesetz. In: Drucke zu Lebzeiten. Kritische Ausgabe, hg. von Wolf Kittler, Hans-Gerd Koch und Gerhard Neumann. S. Fischer 1994, S. 267–269.", "hinweis": "Rechtschreibung und Wortlaut folgen der Ausgabe („daß“, „Einlaß“, „sehn“). Die Einteilung in drei Abschnitte stammt aus dem Wiki, im Original ist es ein durchgehender Text.", "teile": [{"titel": "Abschnitt 1 · Am Tor", "t": "Vor dem Gesetz steht ein Türhüter. Zu diesem Türhüter kommt ein Mann vom Lande und bittet um Eintritt in das Gesetz. Aber der Türhüter sagt, daß er ihm jetzt den Eintritt nicht gewähren könne. Der Mann überlegt und fragt dann, ob er also später werde eintreten dürfen. „Es ist möglich“, sagt der Türhüter, „jetzt aber nicht.“ Da das Tor zum Gesetz offensteht wie immer und der Türhüter beiseite tritt, bückt sich der Mann, um durch das Tor in das Innere zu sehn. Als der Türhüter das merkt, lacht er und sagt: „Wenn es dich so lockt, versuche es doch, trotz meines Verbotes hineinzugehn. Merke aber: Ich bin mächtig. Und ich bin nur der unterste Türhüter. Von Saal zu Saal stehn aber Türhüter, einer mächtiger als der andere. Schon den Anblick des dritten kann nicht einmal ich mehr ertragen.“ Solche Schwierigkeiten hat der Mann vom Lande nicht erwartet; das Gesetz soll doch jedem und immer zugänglich sein, denkt er, aber als er jetzt den Türhüter in seinem Pelzmantel genauer ansieht, seine große Spitznase, den langen, dünnen, schwarzen tatarischen Bart, entschließt er sich, doch lieber zu warten, bis er die Erlaubnis zum Eintritt bekommt."}, {"titel": "Abschnitt 2 · Die Jahre des Wartens", "t": "Der Türhüter gibt ihm einen Schemel und läßt ihn seitwärts von der Tür sich niedersetzen. Dort sitzt er Tage und Jahre. Er macht viele Versuche, eingelassen zu werden, und ermüdet den Türhüter durch seine Bitten. Der Türhüter stellt öfters kleine Verhöre mit ihm an, fragt ihn über seine Heimat aus und nach vielem andern, es sind aber teilnahmslose Fragen, wie sie große Herren stellen, und zum Schlüsse sagt er ihm immer wieder, daß er ihn noch nicht einlassen könne. Der Mann, der sich für seine Reise mit vielem ausgerüstet hat, verwendet alles, und sei es noch so wertvoll, um den Türhüter zu bestechen. Dieser nimmt zwar alles an, aber sagt dabei: „Ich nehme es nur an, damit du nicht glaubst, etwas versäumt zu haben.“ Während der vielen Jahre beobachtet der Mann den Türhüter fast ununterbrochen. Er vergißt die andern Türhüter und dieser erste scheint ihm das einzige Hindernis für den Eintritt in das Gesetz. Er verflucht den unglücklichen Zufall, in den ersten Jahren rücksichtslos und laut, später, als er alt wird, brummt er nur noch vor sich hin. Er wird kindisch, und, da er in dem jahrelangen Studium des Türhüters auch die Flöhe in seinem Pelzkragen erkannt hat, bittet er auch die Flöhe, ihm zu helfen und den Türhüter umzustimmen."}, {"titel": "Abschnitt 3 · Das Ende", "t": "Schließlich wird sein Augenlicht schwach, und er weiß nicht, ob es um ihn wirklich dunkler wird, oder ob ihn nur seine Augen täuschen. Wohl aber erkennt er jetzt im Dunkel einen Glanz, der unverlöschlich aus der Türe des Gesetzes bricht. Nun lebt er nicht mehr lange. Vor seinem Tode sammeln sich in seinem Kopfe alle Erfahrungen der ganzen Zeit zu einer Frage, die er bisher an den Türhüter noch nicht gestellt hat. Er winkt ihm zu, da er seinen erstarrenden Körper nicht mehr aufrichten kann. Der Türhüter muß sich tief zu ihm hinunterneigen, denn der Größenunterschied hat sich sehr zu ungunsten des Mannes verändert. „Was willst du denn jetzt noch wissen?“ fragt der Türhüter, „du bist unersättlich.“ „Alle streben doch nach dem Gesetz“, sagt der Mann, „wieso kommt es, daß in den vielen Jahren niemand außer mir Einlaß verlangt hat?“ Der Türhüter erkennt, daß der Mann schon an seinem Ende ist, und, um sein vergehendes Gehör noch zu erreichen, brüllt er ihn an: „Hier konnte niemand sonst Einlaß erhalten, denn dieser Eingang war nur für dich bestimmt. Ich gehe jetzt und schließe ihn.“"}]}, "buch": {"einleitung": "Die Seiten 22–28 stehen im Kapitel „I. Merkmale fiktionalen Erzählens“, Abschnitt 2: Das Erzählen und das Erzählte. Jede Karte gibt einen Gedanken des Buches wieder, belegt ihn mit einem Zitat und wendet ihn auf Kafka an.", "karten": [{"seite": "S. 22", "titel": "Zwei Lesehaltungen: auf das „Was“ achten", "text": "Beim Lesen achten wir meistens auf den Inhalt. Wie der Text etwas erzählt, rückt in den Hintergrund.", "zitate": [{"t": "Wenn und solange wir eine solche Lesehaltung einnehmen, konzentrieren wir uns auf das, was uns erzählt wird, und blenden die Art und Weise, wie die Geschichte vermittelt wird, aus dem Bereich unserer Aufmerksamkeit aus.", "s": "S. 22"}], "kafka": "Wir fragen zuerst: Warum lässt der Türhüter den Mann nicht ein? Dass der Text im Präsens steht und aus knappen Sätzen besteht, bemerken wir erst, wenn wir auf das „Wie“ achten."}, {"seite": "S. 22–23", "titel": "Ist die Trennung bei Fiktion sinnvoll?", "text": "Bei einem Bericht können wir Ereignisse mit anderen Quellen vergleichen. Bei fiktionalen Texten kennen wir die Welt nur durch den Text. Das Buch zeigt das an Goethes „Werther“: Über den wirklichen Carl Wilhelm Jerusalem gibt es Berichte und Urkunden, über Werther nur den Roman.", "zitate": [{"t": "Aber ist denn im Falle fiktionaler Texte eine solche Unterscheidung zwischen dem Inhalt und seiner Darstellung sinnvoll?", "s": "S. 22"}], "kafka": "Was hinter dem Tor liegt, steht nirgends außerhalb des Textes. Wir wissen nur, was der Text uns mitteilt."}, {"seite": "S. 23", "titel": "Dieselbe Geschichte, viele Darstellungen", "text": "Das Buch antwortet: Man muss beides trennen, weil man dieselbe Geschichte auf viele Weisen erzählen kann. Beispiel ist Kafkas Roman „Das Schloß“. In der ersten Fassung erzählt ein „ich“, in der zweiten ein Erzähler über „K.“. Die Information über die erzählte Welt bleibt gleich.", "zitate": [{"t": "… dass die erzählte Geschichte und ihre Welt von der Art und Weise ihrer Darstellung zu unterscheiden sind.", "s": "S. 23"}, {"t": "Es wird uns mitgeteilt, dass es spät abends war, als der Protagonist ankam.", "s": "S. 23"}, {"t": "Eine Geschichte, die wir als dieselbe Geschichte wiedererkennen, kann auf unzählige verschiedene Weisen präsentiert werden.", "s": "S. 23"}], "kafka": "„Vor dem Gesetz“ könnte der Mann in der Ich-Form erzählen oder der Türhüter aus seiner Sicht. Die Geschichte bliebe erkennbar dieselbe (Beispiel in der Analyse)."}, {"seite": "S. 23–24", "titel": "Illusion und Distanz beim Lesen", "text": "Das Buch stellt Theorien vor: Boileau (der Leser muss das Erzählte vorübergehend für real halten), Aristoteles (wir haben Freude an der Nachahmung), Ingarden und Iser (wir schweben zwischen Illusion und dem Wissen, dass es Fiktion ist). Eine abschließende Antwort gibt es nicht.", "zitate": [{"t": "Eine befriedigende Antwort auf die Frage nach der psychischen Distanz des Lesers zu fiktiven Welten hat die Literaturwissenschaft bislang nicht gegeben.", "s": "S. 24"}], "kafka": "Wir wissen, dass „Vor dem Gesetz“ ein Gleichnis ist, und leiden trotzdem mit dem Mann. Das ist ein Beispiel für dieses Schweben (eigenes Beispiel, nicht aus dem Buch)."}, {"seite": "S. 24", "titel": "Fiktionale Behauptungssätze", "text": "Auch in fiktionalen Texten gibt es Tatsachen, aber sie gelten in der erzählten Welt. Ob der Leser sie für wirklich hält, spielt dafür keine Rolle.", "zitate": [{"t": "Fiktionale Behauptungssätze enthalten eine Referenz auf Tatsachen der durch sie erzählten Welt, unabhängig davon, ob der Leser diese zeitweise für Gegebenheiten seiner objektiven Wirklichkeit nimmt oder nicht.", "s": "S. 24"}], "kafka": "In der erzählten Welt gilt als Tatsache: <span class=\"kq\">„Da das Tor zum Gesetz offensteht wie immer“<\/span>. Deshalb kann der Türhüter sagen: <span class=\"kq\">„versuche es doch, trotz meines Verbotes hineinzugehn“<\/span>."}, {"seite": "S. 25", "titel": "fabula/sjužet und histoire/discours", "text": "Der russische Formalismus nennt die Reihe der Ereignisse fabula und ihre Anordnung im Werk sjužet. Todorov übernimmt das als [[histoire-discours|histoire und discours]]. Sein discours ist weiter gefasst als das sjužet.", "zitate": [{"t": "die Gesamtheit der Motive in ihrer logischen, kausal-temporalen Verknüpfung", "s": "S. 25", "q": "Tomaševskij über die fabula, zitiert bei Martínez/Scheffel"}, {"t": "die Gesamtheit derselben Motive in derjenigen Reihenfolge und Verknüpfung, in der sie im Werk vorliegen", "s": "S. 25", "q": "Tomaševskij über das sjužet, zitiert bei Martínez/Scheffel"}, {"t": "Dieselbe Geschichte hätte uns auch auf andere Weise vermittelt werden können, beispielsweise durch einen Film", "s": "S. 25", "q": "Todorov über die histoire, zitiert bei Martínez/Scheffel"}], "kafka": "Die Reihenfolge ist chronologisch, fabula und sjužet liegen also nah beieinander. Der Unterschied zeigt sich bei Perspektive und Tempo, und die gehören zu Todorovs weiterem discours-Begriff."}, {"seite": "S. 26", "titel": "Erzählte Welt, Handlung, Darstellung und Genettes Dreiteilung", "text": "Das Buch trennt die [[erzaehlte-welt|erzählte Welt]] (alles, was in der Geschichte existiert) von der engeren [[handlung|Handlung]]. Genette teilt in [[genette|Geschichte, Erzählung und Narration]]. Martínez/Scheffel übernehmen die Idee, teilen aber die Seite des „Wie“ in zwei Ebenen.", "zitate": [{"t": "Die andere Seite der Opposition, also die Art und Weise der Vermittlung der erzählten Welt, bezeichnen wir als Darstellung.", "s": "S. 26"}, {"t": "das Signifikat oder den narrativen Inhalt", "s": "S. 26", "q": "Genette über die Geschichte, zitiert bei Martínez/Scheffel"}], "kafka": "Zur erzählten Welt gehören auch die weiteren Türhüter: <span class=\"kq\">„Von Saal zu Saal stehn aber Türhüter, einer mächtiger als der andere.“<\/span> Sie greifen nie in die Handlung ein."}, {"seite": "S. 27–28", "titel": "Sechs Ebenen und die Tabelle der Begriffe", "text": "Weil die Fachbegriffe nicht einheitlich sind, schlagen die Autoren sechs Ebenen vor (siehe Analyse). Die Tabelle auf S. 28 vergleicht, wie 19 Autorinnen und Autoren ihre Begriffe auf diese Ebenen verteilen, zum Beispiel Forster, Genette, Todorov und Tomaševskij.", "zitate": [{"t": "Wie unsere theoriegeschichtlichen Hinweise bereits zeigen, ist die literaturwissenschaftliche Terminologie in diesem Zusammenhang nicht einheitlich.", "s": "S. 27"}], "kafka": "Die Ebenen 1–6 an „Vor dem Gesetz“ durchgespielt: siehe Reiter „Analyse“."}]}, "analyse": {"einleitung": "Die sechs Ebenen aus [[erzaehlen-erzaehltes|Martínez/Scheffel]] (S. 27–28), auf „Vor dem Gesetz“ angewendet. Ebene 1–4 gehören zur Handlung (das Erzählte), Ebene 5–6 zur Darstellung (das Erzählen).", "ebenen": [{"n": 1, "gruppe": "Das Erzählte: Handlung", "titel": "[[ereignis|Ereignis (Motiv)]]", "fa": "رویداد", "zitate": [{"t": "Die elementare Einheit eines narrativen Textes im Bereich der Handlung ist das Ereignis oder Motiv.", "s": "S. 27"}], "kafka": "Ein Ereignis ist zum Beispiel <span class=\"kq\">„Der Türhüter gibt ihm einen Schemel“<\/span> oder <span class=\"kq\">„bückt sich der Mann, um durch das Tor in das Innere zu sehn“<\/span>."}, {"n": 2, "gruppe": "Das Erzählte: Handlung", "titel": "[[geschehen|Geschehen]]", "fa": "رخدادها به ترتیب زمانی", "zitate": [{"t": "Auf einer ersten Integrationsstufe erscheinen Ereignisse zu einem Geschehen aneinandergereiht, indem sie chronologisch aufeinander folgen.", "s": "S. 27"}], "kafka": "Der Mann kommt, bittet um Eintritt, setzt sich, wartet Jahre, stellt seine Frage, stirbt. Hier gibt es nur „und dann“, noch kein „weil“."}, {"n": 3, "gruppe": "Das Erzählte: Handlung", "titel": "[[geschichte|Geschichte]]", "fa": "داستان با رابطه‌ی علّی", "zitate": [{"t": "… wenn die Ereignisfolge zusätzlich zum chronologischen auch einen kausalen Zusammenhang aufweist, so dass die Ereignisse nicht nur aufeinander, sondern auch auseinander folgen.", "s": "S. 27"}], "kafka": "Der Text nennt einen Grund: Der Mann sieht den Türhüter genauer an, <span class=\"kq\">„entschließt er sich, doch lieber zu warten“<\/span>. Weil er wartet, wird er alt und stirbt, ohne eingetreten zu sein. So werden die Ereignisse zu einer Geschichte."}, {"n": 4, "gruppe": "Das Erzählte: Handlung", "titel": "[[handlungsschema|Handlungsschema]]", "fa": "الگوی کلیِ کنش", "zitate": [{"t": "Durch die Integration in ein Handlungsschema erhält die Geschichte eine abgeschlossene (Anfang, Mitte, Ende) und sinnhafte (z. B. archetypische) Struktur.", "s": "S. 27"}], "kafka": "Mögliches Schema: Ein Suchender kommt an eine Schwelle, wartet und scheitert. Anfang ist die Ankunft vor dem Tor, Mitte die Jahre des Wartens, Ende der Tod und das Schließen des Eingangs. Das ist eine Deutung, die Einordnung als Gleichnis steht nicht im Buch."}, {"n": 5, "gruppe": "Das Erzählen: Darstellung", "titel": "[[erzaehlung|Erzählung]]", "fa": "ترتیب و زمان‌بندی ارائه", "zitate": [{"t": "Die erzählten Ereignisse in der Reihenfolge ihrer Darstellung im Text.", "s": "S. 27"}, {"t": "(Erzähltempo, Rückwendung, Vorausdeutung)", "s": "S. 27"}], "kafka": "Der Text beginnt ohne Einleitung: <span class=\"kq\">„Vor dem Gesetz steht ein Türhüter.“<\/span> Jahre werden in einem Satz zusammengefasst: <span class=\"kq\">„Dort sitzt er Tage und Jahre.“<\/span> Anfang und Ende dagegen sind als Gespräch ausgestaltet. Es gibt eine kleine Vorausdeutung: <span class=\"kq\">„Nun lebt er nicht mehr lange.“<\/span> Die Reihenfolge der Ereignisse ist chronologisch."}, {"n": 6, "gruppe": "Das Erzählen: Darstellung", "titel": "[[erzaehlen|Erzählen]]", "fa": "زبان، سبک و موقعیت روایی", "zitate": [{"t": "Die Präsentation der Geschichte und die Art und Weise dieser Präsentation in bestimmten Sprachen, Medien (z. B. rein sprachliche oder audio-visuelle) und Darstellungsverfahren (z. B. Erzählsituation oder Sprachstil).", "s": "S. 28"}], "kafka": "Ein Erzähler in der dritten Person, der nicht als Figur auftritt. Der Text steht im Präsens (eigene Beobachtung). Wir sehen in den Mann hinein: <span class=\"kq\">„denkt er“<\/span>, <span class=\"kq\">„er weiß nicht, ob es um ihn wirklich dunkler wird“<\/span>. Den Türhüter sehen wir von außen: <span class=\"kq\">„lacht er“<\/span>, <span class=\"kq\">„brüllt er ihn an“<\/span>. Genauere Begriffe dafür folgen im Kapitel „II. Das ‹Wie›: Darstellung“."}], "beobachtungen": [{"titel": "Erzählte Welt und Handlung", "text": "Handlungsrelevant ist das Aussehen des Türhüters, denn es bestimmt die Entscheidung des Mannes: <span class=\"kq\">„in seinem Pelzmantel genauer ansieht, seine große Spitznase, den langen, dünnen, schwarzen tatarischen Bart“<\/span>. Nur zur erzählten Welt gehören die weiteren Türhüter und Säle. Ob es sie gibt, erfahren wir ausschließlich aus der Rede des Türhüters."}, {"titel": "Dieselbe Geschichte, andere Darstellung (Übung)", "text": "Original: <span class=\"kq\">„Zu diesem Türhüter kommt ein Mann vom Lande und bittet um Eintritt in das Gesetz.“<\/span> In der Ich-Form könnte es heißen: „Ich ging zu dem Türhüter und bat um Eintritt in das Gesetz.“ (eigenes Beispiel). Die [[geschichte|Geschichte]] bleibt dieselbe, die [[darstellung|Darstellung]] ändert sich: Perspektive, Nähe zum Mann und Ton sind anders."}, {"titel": "fabula und sjužet", "text": "Weil die Reihenfolge chronologisch ist, fallen [[fabula-sjuzet|fabula und sjužet]] fast zusammen. Interessanter ist Todorovs [[histoire-discours|discours]]: Er umfasst auch Perspektive und Stil."}], "fragen": ["Wo ist die Grenze zwischen [[geschehen|Geschehen]] und [[geschichte|Geschichte]]? Ist der Grund für das Warten im Text eindeutig angegeben?", "Was ändert sich, wenn der Türhüter erzählt oder wenn die Geschichte in der Ich-Form steht?", "Welche Teile der [[erzaehlte-welt|erzählten Welt]] sind nur behauptet und werden nie bestätigt?"]}, "seminar": "erz", "status": "entwurf", "lektuere": "Martínez/Scheffel, S. 22–28", "material": [{"datei": "Kafka_Franz-Vor_dem_Gesetz_Kritische_Ausgabe.pdf", "art": "Primärtext", "notiz": "Kritische Ausgabe, S. 267–269"}, {"datei": "Martinez_Scheffel_2019-Einführung_in_die_Erzähltheorie.pdf", "art": "Lektüre", "notiz": "gedruckte S. 22–28 (PDF-Seiten 23–29)"}], "zusatz": []}, {"id": "ki-s1", "nr": 1, "seminar": "ki", "titel": "Einstieg, Seminarplanung und Übung zu KI-Feedback", "autor": "Prof. Dr. Claudia Riemer", "lektuere": "Folien Einstieg (4 Folien)", "thema": "Seminarplan, Studien- und Prüfungsleistung, eigene Lernertext-Übung mit KI-Feedback", "status": "entwurf", "ueberblick": {"kurzinhalt": "Die erste Sitzung stellt den Seminarplan (drei Blöcke) und die Anforderungen für Studien- und Prüfungsleistung vor. In einer Übung schreibt man selbst einen kurzen Text in einer L2, reflektiert die eigenen Korrekturstrategien und lässt den Text von einem KI-Tool kommentieren, um zu erleben, welche Prompts und welches [[ki-feedback|KI-Feedback]] nützlich sind.", "leitfrage": "Welche Strategien nutze ich beim Korrigieren eigener Texte, und welches KI-Feedback finde ich nützlich?", "merksatz": "Erst selbst schreiben, dann KI-Feedback einholen und kritisch vergleichen: Die eigene Erfahrung ist der Ausgangspunkt für die Forschungsfrage des Seminars.", "fa": ["سمینار سه بلوک دارد: (۱) مقدمه‌ی موضوعی و مبانی، (۲) پژوهش تجربی درباره‌ی بازخورد هوش مصنوعی در L2 (جست‌وجو، انتخاب و تحلیل مطالعات)، (۳) تدوین یک واحد آموزشی.", "Studienleistung: کار گروهی (۳ تا ۵ نفر) با ارائه‌ی دستاوردها؛ تحلیل یک مطالعه‌ی تجربی و طراحی یک واحد درسی با استفاده از بازخورد هوش مصنوعی. Prüfungsleistung: مقاله‌ی ۱۵ تا ۲۰ صفحه‌ای یا امتحان شفاهی حدود ۴۵ دقیقه (طبق اسلاید). گروه‌ها تا ۱۷.۱۱.۲۰۲۶ تعیین شوند.", "تمرین: یک متن حدود ۱۵۰ کلمه‌ای در یک زبان دوم بنویس (بدون ابزار ترجمه)، سپس از یک ابزار هوش مصنوعی با پرامپت‌های مختلف بازخورد بگیر و مقایسه کن."]}, "inhalt": [{"titel": "1. Seminarplan", "quelle": "Folien Einstieg (Riemer), Folie 2 (Bildschirmfoto aus Moodle, von mir abgelesen)", "html": "<p>Das Seminar „Feedback und generative KI, empirische Studien und Konsequenzen für den DaF- und DaZ-Unterricht“ (Prof. Dr. Claudia Riemer, WiSe 2026/27) ist in Blöcke gegliedert. Auf der Folie sind drei Blöcke sichtbar:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Block<\/th><th>Titel laut Folie<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Thematische Einführung – Grundlagen – Überblick<\/td><\/tr><tr><td>2<\/td><td>Empirische Forschung in der L2-KI-Feedbackforschung: Recherche, Auswahl und Analyse von Studien<\/td><\/tr><tr><td>3<\/td><td>Entwicklung einer didaktisierten Lerneinheit<\/td><\/tr><\/tbody><\/table><\/div><p class=\"meta\">Möglicherweise gibt es weitere Blöcke; die Folie schneidet die Liste ab.<\/p>"}, {"titel": "2. Zeitplan", "quelle": "Folien Einstieg (Riemer), Folie 3", "html": "<p>Die Folie nennt Termine und Themen des Semesters. Rot markiert sind dort Fristen, hier mit „Frist“ gekennzeichnet.<\/p><div class=\"tablewrap\"><table><thead><tr><th>Datum<\/th><th>Thema / Frist<\/th><\/tr><\/thead><tbody><tr><td>13.10.<\/td><td>Seminarplanung, Einstiegsübung<\/td><\/tr><tr><td>20.10.<\/td><td>Theoretische Grundlagen 1: KI und Fremdsprachenlernen. Gemeinsame Lektüre und Besprechung von Moorhouse/Wong 2025, Teil I (Kap. 1–4)<\/td><\/tr><tr><td>27.10.<\/td><td>Theoretische Grundlagen 2: KI und Fremdsprachenlernen. Teil II (Kap. 5–8)<\/td><\/tr><tr><td>3.11.<\/td><td>Gruppenarbeit, Training<\/td><\/tr><tr><td>10.11.<\/td><td>Theoretische Grundlagen 3: Feedback und Schreiben in der L2. <em>Frist:<\/em> Gruppenzuordnung bis 17.11. abgeschlossen<\/td><\/tr><tr><td>17.11.<\/td><td>Überblick über das Forschungsthema: Lektüre von Meta-Studien<\/td><\/tr><tr><td>24.11.<\/td><td>Recherche von empirischen Studien zur Rolle von genKI beim Schreiben in der L2 (Gruppenarbeit)<\/td><\/tr><tr><td>1.12.<\/td><td>Kurzpräsentation von gefundenen empirischen Studien. <em>Frist:<\/em> Auswahl der empirischen Studie bis 8.12.<\/td><\/tr><tr><td>8.12.<\/td><td>Analyse empirischer Studien mit dem Analyseraster (Einführung Analyseraster, Gruppenarbeit)<\/td><\/tr><tr><td>15.12.<\/td><td>Analyse empirischer Studien mit dem Analyseraster (Gruppenarbeit). <em>Frist:<\/em> ausgefüllte Analyseraster bis 21.12.<\/td><\/tr><tr><td>22.12.<\/td><td>Kurzpräsentation der Analyseergebnisse: Diskussion im Seminar, mündliche Kommentierung der Gruppen, keine PowerPoint-Präsentation<\/td><\/tr><tr><td>Weihnachtspause<\/td><td><\/td><\/tr><tr><td>12.1.<\/td><td>Entwicklung einer didaktisierten Lerneinheit (Einführung in die Aufgabe, Gruppenarbeit)<\/td><\/tr><tr><td>19.1.<\/td><td>Entwicklung einer didaktisierten Lerneinheit (Gruppenarbeit). <em>Frist:<\/em> Entwurf der Lerneinheit bis 25.1.<\/td><\/tr><tr><td>26.1.<\/td><td>Präsentation der entwickelten Lerneinheiten plus Peer-Feedback<\/td><\/tr><tr><td>2.2.<\/td><td>Präsentation der entwickelten Lerneinheiten plus Peer-Feedback<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Gemeinsame Lektüre und Besprechung von Moorhouse/Wong 2025, Teil I (Kap. 1–4)“<\/p><cite>Folien Einstieg (Riemer), Folie 3 (Bild, von mir abgelesen)<\/cite><\/blockquote>"}, {"titel": "3. Studienleistung, Prüfungsleistung, Arbeitsgruppen", "quelle": "Folien Einstieg (Riemer), Folie 2 (Bildschirmfoto aus Moodle, von mir abgelesen)", "html": "<p>Die Folie zeigt eine Moodle-Beschreibung. Sinngemäß:<\/p><ul class=\"plain\"><li><strong>Studienleistung:<\/strong> Erarbeitung in betreuter Gruppenarbeit mit Präsentationen im Seminar. Recherche und Analyse einer empirischen Studie aus dem Themenbereich sowie Didaktisierung einer Lerneinheit mit Einsatz von KI-Feedback (als Gruppenarbeit).<\/li><li><strong>Prüfungsleistung:<\/strong> Voraussetzung ist die Beteiligung an der Gruppenarbeit inklusive Präsentationen im Seminar. Dann entweder eine schriftliche Hausarbeit (ca. 15–20 Seiten, kritische Analyse von mindestens zwei empirischen Studien) oder eine ca. 45-minütige mündliche Prüfung mit 5–10-seitigem Thesenpapier als Modulprüfung. In beiden Fällen wird vorab eine Kurzpräsentation der gewählten Thematik im Seminar verlangt.<\/li><li><strong>Zusatzbestimmung:<\/strong> Wird im Modul „Sprachlehr- und -lernforschung“ die schriftliche Hausarbeit gewählt, muss das Modul „Entwicklungen in der Sprach- und Kulturvermittlung“ mündlich abgeschlossen werden und umgekehrt.<\/li><li><strong>Arbeitsgruppen:<\/strong> 3 bis 5 Personen, in begründeten Ausnahmefällen und nur nach Rücksprache Partner- oder Einzelarbeit. <strong>Die Gruppen sind bis spätestens 17.11.2026 festzulegen<\/strong> (Eintrag in Moodle).<\/li><\/ul><p class=\"meta\">Wortlaut bitte in Moodle gegenprüfen, ich habe nur das Bildschirmfoto gelesen.<\/p>"}, {"titel": "4. Übung zu KI-Feedback", "quelle": "Folien Einstieg (Riemer), Folie 4", "html": "<p>Die Übung hat vier Schritte:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Schritt<\/th><th>Aufgabe<\/th><\/tr><\/thead><tbody><tr><td>1. Schreiben<\/td><td>Digitaler Text in einer L2 deiner Wahl, ca. 150 Wörter, 15 Minuten, ohne Übersetzungstool. Impuls A oder B.<\/td><\/tr><tr><td>2. Reflektieren<\/td><td>Welche Strategien zur Textkorrektur habe ich beim Schreiben genutzt?<\/td><\/tr><tr><td>3. KI-Feedback<\/td><td>Text in ein KI-Tool laden (ChatGPT, Claude, BiKi o. ä.) und mit verschiedenen Prompts Feedback einholen.<\/td><\/tr><tr><td>4. Auswerten<\/td><td>Welches Feedback ist nützlich? Welcher Prompt war am besten? Womit bin ich unzufrieden?<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Benutzen Sie bitte kein Übersetzungstool.“<\/p><cite>Folien Einstieg (Riemer), Folie 4<\/cite><\/blockquote><p><strong>Impuls A:<\/strong><\/p><blockquote><p>„Was ich über die Chancen und Risiken von KI-Feedback für die Verbesserung der L2-Schreibkompetenz weiß“<\/p><cite>Folien Einstieg (Riemer), Folie 4<\/cite><\/blockquote><p><strong>Impuls B:<\/strong><\/p><blockquote><p>„Welches Feedback zu schriftlichen Lernertexten ist effektiver: KI-Feedback oder Lehrerfeedback?“<\/p><cite>Folien Einstieg (Riemer), Folie 4<\/cite><\/blockquote><blockquote><p>„Experimentieren Sie mit unterschiedlichen Prompts und lassen sich Feedback auf Ihren Text geben.“<\/p><cite>Folien Einstieg (Riemer), Folie 4<\/cite><\/blockquote><blockquote><p>„Welches Feedback finden Sie nützlich? Welcher Prompt hat am besten funktioniert? Womit sind Sie unzufrieden?“<\/p><cite>Folien Einstieg (Riemer), Folie 4<\/cite><\/blockquote>"}, {"titel": "5. Platz für deine eigenen Beobachtungen", "quelle": "Eigene Notizen, noch leer", "html": "<p>Hier könnten deine Notizen zur Übung stehen: dein Text, die Prompts, die du ausprobiert hast, und welches KI-Feedback nützlich war. Lege sie als Datei in den Ordner „Notizen“ dieses Seminars, dann nehme ich sie beim nächsten Update auf.<\/p>"}], "zusatz": [], "material": [{"datei": "Sitzung_Einstieg.pdf", "art": "Folien", "notiz": "Seminarplanung und Übung, 4 Folien"}], "begriffe": ["ki-feedback"]}, {"id": "ki-s2", "nr": 2, "seminar": "ki", "titel": "KI und Fremdsprachenlernen: Moorhouse/Wong 2025, Teil I", "autor": "Benjamin Luke Moorhouse, Kevin M. Wong (Buch); Claudia Riemer (Folien)", "lektuere": "Moorhouse/Wong 2025, Kap. 1–4 (S. 1–40)", "thema": "genKI, berufliche genKI-Kompetenz, Wissensressource, Unterrichtsplanung, Testen/Prüfen und Feedback", "status": "entwurf", "ueberblick": {"kurzinhalt": "Moorhouse/Wong sehen in generativer KI Potenzial und Risiko zugleich und fordern von Lehrkräften eine berufsbezogene genKI-Kompetenz ([[p-genai-c|P-GenAI-C]]) mit fünf Aspekten. Kapitel 1 erklärt, was [[genki|genKI]] und [[llm|LLMs]] sind, Kapitel 2 zeigt genKI als Wissensressource, Kapitel 3 für Unterrichtsplanung und Materialien und Kapitel 4 für Testen/Prüfen und Feedback. Beim Feedback ist der Einsatz umstritten. Bedingungen sind Urheberrecht, Datenschutz, Transparenz und [[human-in-the-loop|human-in-the-loop]].", "leitfrage": "Unter welchen Bedingungen kann genKI Lehrkräfte unterstützen, evidenzbasierte Prinzipien des Fremdsprachenunterrichts umzusetzen, und wo liegen die Grenzen, besonders bei Bewertung und Feedback?", "merksatz": "genKI ist Werkzeug und nicht Ersatz: Lernziele und Prinzipien zuerst, KI-Ergebnisse immer fachlich prüfen, bei Lernertexten Einwilligung und Transparenz.", "fa": ["نویسندگان می‌گویند هوش مصنوعی مولد هم فرصت است و هم خطر. معلم باید «شایستگی حرفه‌ای در هوش مصنوعی مولد» (P-GenAI-C) با پنج جنبه داشته باشد: دانش فنی، سازگاری آموزشی، کار حرفه‌ای بیرون از کلاس، آگاهی از خطر و اخلاق، آماده‌سازی زبان‌آموزان.", "LLMها محتوا را با شناسایی الگوها تولید می‌کنند و خروجی «از نظر آماری محتمل» است، نه لزوماً درست؛ پس باید پاسخ‌ها بررسی شوند (توهم، سوگیری).", "در بازخورد و نمره‌دهی، استفاده از هوش مصنوعی بحث‌برانگیزترین کاربرد است. شرایط: رضایت زبان‌آموز و حق مالکیت متن، حفظ داده‌ها، شفافیت و دخالت ارزیاب انسانی (human in the loop)."]}, "inhalt": [{"titel": "1. Einleitung: Potenzial, Risiko, P-GenAI-C", "quelle": "Moorhouse/Wong 2025, S. 1–3; Folien Moorhouse/Wong Teil I (Riemer)", "html": "<p>Die zentrale These der Einleitung:<\/p><blockquote><p>„Zentrale These: Moorhouse und Wong sagen, genKI berge Potenzial und Risiko zugleich.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 3<\/cite><\/blockquote><p>Die Autoren übertragen den Gedanken der Berufsbezogenheit auf KI: Ein Arzt und eine Lehrkraft brauchen beide digitale Kompetenz, aber unterschiedliche.<\/p><blockquote><p lang=\"en\">“A doctor may need to understand and apply the use of AI in medical diagnostic processes. In contrast, a language teacher may need to guide students in how to use GenAI tools to engage in language practice activities.”<\/p><cite>Moorhouse/Wong 2025, S. 2<\/cite><\/blockquote><blockquote><p lang=\"en\">“to conceptualise the knowledge and skills needed by language teachers in the GenAI world”<\/p><cite>Moorhouse/Wong 2025, S. 2<\/cite><\/blockquote><h4>Fünf Aspekte der beruflichen genKI-Kompetenz (P-GenAI-C)<\/h4><div class=\"tablewrap\"><table><thead><tr><th>#<\/th><th>Aspekt<\/th><th>Bedeutung (Folie)<\/th><th>Beispiel (Folie)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Technologische Kompetenz<\/td><td>Tools, Funktionen, Verwendungen, Affordanzen kennen<\/td><td>Lehrkraft entscheidet, ob ein Chatbot, ein Bildgenerator oder ein Spezialtool passt<\/td><\/tr><tr><td>2<\/td><td>Pädagogische Kompatibilität<\/td><td>genKI zur Unterstützung des Sprachenlernens einsetzen, ausgerichtet an Lernzielen<\/td><td>Chatbot-Rollenspiel für mündliches Üben<\/td><\/tr><tr><td>3<\/td><td>Professionelle Arbeit außerhalb des Unterrichts<\/td><td>Bewertung, Feedback, Kommunikation, Verwaltung<\/td><td>Vorkorrektur von Lernertexten, Elternbrief<\/td><\/tr><tr><td>4<\/td><td>Risiko, Wohlbefinden, Ethik<\/td><td>Risiken, Wohlbefinden und ethische Fragen im Blick<\/td><td>Einwilligung, bevor Lernertexte hochgeladen werden<\/td><\/tr><tr><td>5<\/td><td>Vorbereitung der Lernenden<\/td><td>Lernende auf eine genKI-Welt vorbereiten<\/td><td>Lernenden zeigen, wie sie KI-Feedback prüfen und nutzen<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Die Lehrkraft kennt unterschiedliche genKI-Tools sowie deren Funktionen, Verwendungsweisen und Affordanzen.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 4<\/cite><\/blockquote><blockquote><p>„Affordanzen (Angebotscharakter): Handlungsmöglichkeiten, die für bestimmte Nutzende in einem bestimmten Kontext wahrnehmbar und realisierbar sind, einschließlich dessen, was das Tool nahelegt oder erschwert.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 4<\/cite><\/blockquote>"}, {"titel": "2. Kapitel 1: Generative KI (S. 3–15)", "quelle": "Moorhouse/Wong 2025, S. 3–15; Folien Moorhouse/Wong Teil I (Riemer), Folien 6–7", "html": "<p><strong>Abgrenzung zu regelbasierten Systemen:<\/strong> Frühere Chatbots und Schreibassistenten folgten vorprogrammierten Regeln und konnten nicht von ihrer Rolle abweichen.<\/p><blockquote><p lang=\"en\">“While researchers saw the potential of these kinds of rule-based AIs in language teaching, due to their narrow functionality, they have experienced very limited uptake in language classrooms.”<\/p><cite>Moorhouse/Wong 2025, S. 5<\/cite><\/blockquote><p><strong>LLMs und „statistisch wahrscheinlich“:<\/strong><\/p><blockquote><p lang=\"en\">“Instead of relying on predefined rules, LLMs generate content by identifying patterns and relationships within the data to produce statistically probable outcomes”<\/p><cite>Moorhouse/Wong 2025, S. 5<\/cite><\/blockquote><blockquote><p>„LLMs generieren Inhalte, indem sie Muster und Zusammenhänge innerhalb der Daten identifizieren, um statistisch wahrscheinliche Ergebnisse zu erzeugen (S. 5).“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 7<\/cite><\/blockquote><p>Konsequenz für die Verlässlichkeit: Wahrscheinlich heißt nicht wahr. Lehrkräfte sollten das wissen, weil sie Inhalte prüfen müssen (siehe Kapitel 2).<\/p><p><strong>Drei Hauptarten von genKI-Tools:<\/strong><\/p><blockquote><p lang=\"en\">“One way to classify GenAI tools for language teaching is according to the following three categories: 1. conversational AI chatbots; 2. visual, audio, and video generators; and 3. tools with embedded GenAI functions and specialist AI tools.”<\/p><cite>Moorhouse/Wong 2025, S. 6<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th>Kategorie<\/th><th>Beispiele im Buch (S. 6–14)<\/th><\/tr><\/thead><tbody><tr><td>Conversational AI chatbots<\/td><td>ChatGPT (OpenAI), Gemini (Google), Claude (Anthropic), Llama (Meta)<\/td><\/tr><tr><td>Visuelle, Audio- und Videogeneratoren<\/td><td>Dall-E, Stable Diffusion, MidJourney; Jukebox, Speechflow AI, Heygen; Sora AI<\/td><\/tr><tr><td>Tools mit eingebauten genKI-Funktionen und Spezialtools<\/td><td>Kahoot! (Quizfragen generieren), Mentimeter, MagicSchool.ai<\/td><\/tr><\/tbody><\/table><\/div><p>Die Frage der Folien, ob die Einteilung trennscharf ist, beantwortet das Buch selbst: Viele Tools kombinieren mehrere Funktionen.<\/p><blockquote><p lang=\"en\">“Many tools have multiple functionalities and combine different AI technologies to make them easy to use while performing highly advanced tasks.”<\/p><cite>Moorhouse/Wong 2025, S. 6<\/cite><\/blockquote><p><strong>Fähigkeiten von Chatbots<\/strong> (Folie 7): in natürlicher Sprache interagieren, multimodale Eingaben analysieren, Texte nach Vorgaben erzeugen, Gesprächspartner mit Rollen sein, Texte bewerten, zusammenfassen und analysieren, dolmetschen und übersetzen.<\/p><blockquote><p>„Besonderheit: Die Tools arbeiten extrem schnell.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 7<\/cite><\/blockquote>"}, {"titel": "3. Kapitel 2: genKI als Wissensressource (S. 15–23)", "quelle": "Moorhouse/Wong 2025, S. 15–23; Folien Moorhouse/Wong Teil I (Riemer), Folien 8–9", "html": "<p>Sprachunterricht findet in sehr verschiedenen Kontexten statt, deshalb gibt es kein Patentrezept:<\/p><blockquote><p lang=\"en\">“Similarly, there is no ‘one-size-fits-all’ method or approach that language teachers can adopt to guarantee success in any or all contexts”<\/p><cite>Moorhouse/Wong 2025, S. 17<\/cite><\/blockquote><p>Es gibt aber evidenzbasierte Prinzipien (Richards 2010), z. B. klare Lernziele, verständlicher Input, bedeutungsvolle Kommunikation, authentische Materialien, regelmäßige Übung, zeitnahes Feedback. Die These: genKI kann helfen, diese Prinzipien in verschiedenen Kontexten umzusetzen.<\/p><p><strong>Drei Ausdifferenzierungen<\/strong> (Folie 9):<\/p><ul class=\"plain\"><li><strong>Themen- und Inhaltswissen<\/strong> der Lehrkraft entwickeln (z. B. Feste für Jugendliche). Antworten müssen wegen möglicher Halluzinationen geprüft werden (S. 18).<\/li><li><strong>Verständnis von Methoden und Ansätzen<\/strong> fördern: Informationen zu Methoden, Beispielaktivitäten, kontextbezogene Unterrichtspläne (S. 19).<\/li><li><strong>Bewusstsein für Sprachen, Kulturen und Gesellschaften<\/strong>: Recherchen zu den Sprachen der Lernenden, kontrastive Darstellungen (S. 19–20).<\/li><\/ul><blockquote><p>„Achtung: Die Antworten müssen wegen möglicher Halluzinationen und Ungenauigkeiten überprüft werden.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 9<\/cite><\/blockquote><blockquote><p lang=\"en\">“the majority of the training data for LLMs is in English (93%) compared to 7% for other languages”<\/p><cite>Moorhouse/Wong 2025, S. 20 (nach Brown et al. 2020)<\/cite><\/blockquote><p>Folge für mehrsprachige Klassen (Frage 3 der Folie, meine Antwort): Für weniger verbreitete Sprachen ist die Qualität der Antworten schlechter, Stereotype sind wahrscheinlicher. Das Buch sagt: Die Qualität hängt von der Datenmenge zur Sprache und vom Prompt ab.<\/p>"}, {"titel": "4. Kapitel 3: Unterrichtsplanung und Materialien (S. 24–33)", "quelle": "Moorhouse/Wong 2025, S. 24–33; Folien Moorhouse/Wong Teil I (Riemer), Folien 10–12", "html": "<p>genKI als <em>Kolleg:in auf Abruf<\/em> (Folie 10): als Planungspartner oder kritische:r Freund:in beim Brainstorming und Verfeinern von Stundenideen.<\/p><blockquote><p lang=\"en\">“Lesson planning is a great place to start using GenAI as it does not require students to engage with the tools directly”<\/p><cite>Moorhouse/Wong 2025, S. 33<\/cite><\/blockquote><p><strong>Einsatzmöglichkeiten<\/strong> (Folie 11):<\/p><ul class=\"plain\"><li>multimodale Materialien (Texte, Bilder, Audios, Videos, Skripte), zugeschnitten auf Lernende<\/li><li>Material auf bestimmtem Niveau oder mit bestimmten Wörtern und Strukturen<\/li><li>Training einzelner Fertigkeiten (Hörtexte aus Texten, Verständnisfragen)<\/li><li>affektiv und kognitiv ansprechende Materialien (Witze, Lieder, Spiele, Bilder)<\/li><li>formfokussierte Materialien (Arbeitsblätter, Übungen)<\/li><li>mehrsprachige Materialien und Anpassung vorhandener Materialien an evidenzbasierte Prinzipien<\/li><\/ul><p><strong>Bedingungen<\/strong> (Folie 9):<\/p><blockquote><p>„Lernziele und pädagogische Prinzipien müssen den Ausgangspunkt bilden.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 12<\/cite><\/blockquote><blockquote><p>„Die Planung darf nicht von der bloßen Verfügbarkeit eines Tools bestimmt werden“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 12<\/cite><\/blockquote><blockquote><p>„Es soll keine ausschließliche Abhängigkeit von KI-generierten Materialien entstehen.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 12<\/cite><\/blockquote><blockquote><p>„muss der Einsatz von GenKI offengelegt werden“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 12 (bei Übersetzungen in Sprachen, die die Lehrkraft nicht beherrscht)<\/cite><\/blockquote><p>Eine mögliche Rangfolge (meine Begründung zu Frage 4 der Folien): 1. Lernziele zuerst, 2. fachliche und didaktische Prüfung aller Vorschläge, 3. genaues, iteratives Prompten, 4. Transparenz bei Übersetzungen, 5. keine Abhängigkeit.<\/p>"}, {"titel": "5. Kapitel 4: Testen/Prüfen und Feedback (S. 33–40)", "quelle": "Moorhouse/Wong 2025, S. 33–40; Folien Moorhouse/Wong Teil I (Riemer), Folien 13–15", "html": "<p>Die Qualität einer Prüfung beurteilt man nach drei Merkmalen:<\/p><blockquote><p lang=\"en\">“The quality of an assessment is often judged by three characteristics: transparency, validity, and reliability”<\/p><cite>Moorhouse/Wong 2025, S. 35<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th>Kriterium<\/th><th>Bedeutung (Folie 11)<\/th><th>Wo es mit genKI gefährdet sein kann (eigenes Beispiel)<\/th><\/tr><\/thead><tbody><tr><td>Transparenz<\/td><td>Zweck der Leistungsüberprüfung ist bekannt<\/td><td>Lernende wissen nicht, dass KI mitbewertet<\/td><\/tr><tr><td>Validität<\/td><td>geprüft wird das, was geprüft werden soll, und nichts anderes<\/td><td>KI-Aufgabe prüft eher Rechtschreibung als Leseverstehen<\/td><\/tr><tr><td>Reliabilität<\/td><td>konsistente Ergebnisse, Rater-Reliabilität<\/td><td>derselbe Text bekommt bei zweitem Durchlauf eine andere Note<\/td><\/tr><\/tbody><\/table><\/div><p>Querverbindung: Das sind dieselben Gütekriterien wie im Seminar „Prüfen und Testen“ (siehe [[reliabilitaet|Reliabilität]], [[washback|washback]], Sitzung 2).<\/p><blockquote><p>„Validität (geprüft wird das, was geprüft werden soll, und nichts anderes)“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 14<\/cite><\/blockquote><blockquote><p lang=\"en\">“This is commonly referred to as the washback effect.”<\/p><cite>Moorhouse/Wong 2025, S. 35<\/cite><\/blockquote><p><strong>Einsatzmöglichkeiten<\/strong> (Folie 14): Online-Bewertungstools (z. B. Aussprache, Flüssigkeit), genKI-gestützte Gestaltung von Prüfungsaufgaben, formative und summative Bewertung (Vorkorrektur, eigene Tools mit Bewertungsschema), Anleitung der Lernenden zur Nutzung formativen KI-Feedbacks.<\/p><p><strong>Bedingungen<\/strong> (Folie 12 und Buch):<\/p><blockquote><p lang=\"en\">“students have copyright over the work they produce”<\/p><cite>Moorhouse/Wong 2025, S. 39<\/cite><\/blockquote><blockquote><p lang=\"en\">“there is still a need for the ‘human in the loop’ to ensure that the feedback is appropriate to the task, the context, and the learner”<\/p><cite>Moorhouse/Wong 2025, S. 39<\/cite><\/blockquote><blockquote><p>„KI-Feedback muss mit Fachwissen überprüft werden“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 15<\/cite><\/blockquote><p><strong>Befund zu Feedback-Qualität<\/strong> (Steiss et al. 2024, nach dem Buch):<\/p><blockquote><p lang=\"en\">“Importantly, there was no difference in the quality of ChatGPT feedback between L2 and L1 writing.”<\/p><cite>Moorhouse/Wong 2025, S. 39<\/cite><\/blockquote><blockquote><p lang=\"en\">“It excelled in criteria-based feedback.”<\/p><cite>Moorhouse/Wong 2025, S. 39<\/cite><\/blockquote><p>Menschen schnitten in vier Kategorien besser ab (Klarheit,
