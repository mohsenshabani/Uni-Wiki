 Genauigkeit, Priorisierung wesentlicher Merkmale, Ton), ChatGPT-Feedback wurde aber ebenfalls hoch bewertet.<\/p><p><strong>Fazit des Kapitels:<\/strong><\/p><blockquote><p lang=\"en\">“the use of GenAI within assessment practices is the most controversial use of GenAI in language teaching and learning”<\/p><cite>Moorhouse/Wong 2025, S. 39<\/cite><\/blockquote><blockquote><p>„Einsatz von genKI zu Bewertungszwecken ist sehr umstritten!“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 15<\/cite><\/blockquote><blockquote><p>„Gleichgewicht zwischen technischer Effizienz und ethischen Überlegungen herstellen“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 15<\/cite><\/blockquote>"}, {"titel": "6. Zentrale These und Diskussionsfragen", "quelle": "Folien Moorhouse/Wong Teil I (Riemer), Folie 16", "html": "<blockquote><p>„GenKI kann Lehrkräfte dabei unterstützen, evidenzbasierte Prinzipien des Fremdsprachenunterrichts in unterschiedlichen Kontexten umzusetzen.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 16<\/cite><\/blockquote><p>Die Folie fragt: Welche Argumente aus Kapitel 1–4 stützen die These, welche Einschränkungen sind zu machen, unter welchen Bedingungen stimmst du zu, und wie lautet eine präzisere Version?<\/p><p><strong>Mein Entwurf einer differenzierten Version (eigene Formulierung, zur Diskussion):<\/strong> genKI kann Lehrkräfte bei der Umsetzung evidenzbasierter Prinzipien unterstützen, wenn Lernziele die Planung leiten, die Lehrkraft alle Ausgaben fachlich prüft und bei Bewertung und Feedback Einwilligung, Transparenz und menschliche Letztverantwortung gesichert sind.<\/p><p>Dazu passende Einschränkungen aus dem Material: Halluzinationen und Verzerrungen, englischlastige Trainingsdaten, Datenschutz und Urheberrecht, Abhängigkeit, und die Frage, wie sich Lernende fühlen, wenn Dozierende KI zur Beurteilung nutzen.<\/p>"}], "zusatz": [{"titel": "Moorhouse/Wong (2025): Generative Artificial Intelligence and Language Teaching", "url": "https://doi.org/10.1017/9781009618823", "typ": "Buch (Cambridge Elements)", "quelle": "DOI aus der Fußzeile der PDF-Seiten", "geprueft": false, "notiz": "DOI steht in der Fußzeile der Lektüre-PDF. Nicht von mir geöffnet."}], "material": [{"datei": "Sitzung_Lektüre und Diskussion Moorhouse  Wong 2025_Teil 1.pdf", "art": "Folien", "notiz": "Fragen und Zusammenfassungen zu Kap. 1–4, 16 Folien"}, {"datei": "generative-artificial-intelligence-and-language-teaching.pdf", "art": "Lektüre", "notiz": "Buch, 94 PDF-Seiten, 8 Sektionen. Dieses Wiki nutzt bisher nur Kap. 1–4 (S. 1–40)."}], "begriffe": ["genki", "llm", "p-genai-c", "affordanz", "halluzination", "human-in-the-loop", "prompt", "validitaet", "ki-feedback"]}, {"id": "pruefen-s1", "nr": 1, "seminar": "pruefen", "titel": "Summative Evaluation", "autor": "Doris Moser-Frötscher", "lektuere": "Moser-Frötscher 2025, S. 83–88", "thema": "Summativ und formativ, EALTA-Leitfragen, high stakes und washback", "status": "entwurf", "ueberblick": {"kurzinhalt": "Der Text unterscheidet [[summative-evaluation|summative Evaluation]] (misst im Nachhinein, was erreicht wurde, und dient der Benotung) von [[formative-evaluation|formativer Evaluation]] (begleitet das Lernen und stimmt den Unterricht darauf ab). Er betont, dass diese Gegenüberstellung eine Vereinfachung ist. Dann stellt er externe summative Prüfungen im deutschsprachigen Raum vor und ordnet gute Prüfungspraxis anhand der [[ealta-leitfragen|EALTA-Leitfragen]]: Prüfungszweck und Spezifikation, Prüfungsverfahren und Konsequenzen. Bei den Konsequenzen geht es um [[high-low-stakes|low und high stakes]] und den [[washback|washback-Effekt]].", "leitfrage": "Worin unterscheiden sich summative und formative Evaluation, und warum ist die Gegenüberstellung laut Text eine Vereinfachung? Wie lassen sich high stakes und washback auf Prüfungen zum Hochschulzugang übertragen?", "merksatz": "Summativ misst im Nachhinein und bewertet, formativ begleitet und steuert das Lernen. Entscheidend ist der Zweck, für den Informationen genutzt werden, nicht das Instrument.", "fa": ["ارزیابی پایانی (summativ) چیزی را که یادگرفته شده در پایان یک دوره می‌سنجد و برای نمره‌دادن به کار می‌رود. ارزیابی تکوینی (formativ) در جریان یادگیری انجام می‌شود تا آموزش و بازخورد را تنظیم کند.", "متن می‌گوید این تقابل یک ساده‌سازی است: یک اطلاعات یکسان می‌تواند هم پایانی و هم تکوینی باشد، بسته به اینکه برای چه هدفی استفاده شود.", "هر چه پیامد یک آزمون سنگین‌تر باشد (high stakes)، کنترل کیفیت باید دقیق‌تر باشد. همچنین آزمون‌های مهم می‌توانند بر آموزش اثر بگذارند (washback)."]}, "inhalt": [{"titel": "1. Summativ und formativ", "quelle": "Moser-Frötscher 2025, S. 83", "html": "<ul class=\"plain\"><li><strong>Summativ:<\/strong> misst im Nachhinein, was erreicht wurde. Sie findet punktuell statt, bewertet Fortschritte und dient der Benotung. Sie ist formell und geplant und steht am Ende einer Einheit (von einer Woche bis zu einem Jahr).<\/li><li><strong>Formativ:<\/strong> prüft während der Lernphase den Fortschritt, um den folgenden Unterricht abzustimmen und Feedback zu geben.<\/li><li><strong>Neuere Bezeichnungen:<\/strong> Assessment of Learning (summativ) und Assessment for Learning (formativ).<\/li><\/ul><blockquote><p>„Die summative Evaluation misst im Nachhinein, was von Einzelpersonen oder auch Gruppen erreicht wurde“<\/p><cite>Moser-Frötscher 2025, S. 83<\/cite><\/blockquote>"}, {"titel": "2. Warum die Gegenüberstellung eine Vereinfachung ist", "quelle": "Moser-Frötscher 2025, S. 83", "html": "<blockquote><p>„Die kontrastive Unterscheidung zwischen summativer und formativer Evaluation stellt jedoch eine starke Vereinfachung dieser beiden Konstrukte sowie ihrer Beziehung zueinander dar“<\/p><cite>Moser-Frötscher 2025, S. 83<\/cite><\/blockquote><p>Der Text nennt mehrere Positionen:<\/p><ul class=\"plain\"><li><strong>Harlen (2005):<\/strong> Nur der Zweck macht den Unterschied. Dieselbe Information kann summativ oder formativ sein.<\/li><li><strong>Harsch (2012):<\/strong> Dieselben Instrumente können prinzipiell für beide Paradigmen verwendet werden.<\/li><li><strong>Bachman/Damböck (2017):<\/strong> Unterschied nach den Entscheidungen. Formative betreffen Unterrichten und Lernen, summative teilen Lernende in Gruppen (z. B. Versetzung).<\/li><li><strong>Learning-Oriented Assessment (Jones/Saville 2016):<\/strong> Beide Zugänge sind eng verwoben, das erfolgreiche Lernen steht im Fokus.<\/li><\/ul><blockquote><p>„Für Harlen (2005) macht einzig der Zweck den Unterschied aus: Dieselbe Information, die gesammelt wird, kann sowohl summativ als auch formativ sein“<\/p><cite>Moser-Frötscher 2025, S. 83<\/cite><\/blockquote>"}, {"titel": "3. Zwecke und Adressaten", "quelle": "Moser-Frötscher 2025, S. 83–84", "html": "<p>Summative Informationen dienen verschiedenen Zwecken (Harlen 2005):<\/p><ul class=\"plain\"><li>schulintern: Fortschritte festhalten, die nächste Lehrperson informieren<\/li><li>Adressaten: Eltern und Schüler:innen, häufig als Schulnoten<\/li><li>extern: Zertifizierung, Auswahl von Bewerber:innen für eine Anstellung oder ein Studium<\/li><li>Standardisierung und Bildungsmonitoring durch extern vorgegebene Prüfungen<\/li><\/ul>"}, {"titel": "4. Extern vorgegebene summative Prüfungen im deutschsprachigen Raum", "quelle": "Moser-Frötscher 2025, S. 84–85", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Art<\/th><th>Beispiele im Text<\/th><\/tr><\/thead><tbody><tr><td>Leistungsvergleich<\/td><td>PISA (OECD): Kompetenzen der 15-Jährigen. 2025 erstmals optionale Zusatzerhebung zur Fremdsprachenkompetenz.<\/td><\/tr><tr><td>Zentrale Kompetenzerhebungen<\/td><td>Deutschland: Bildungstrends und VERA (IQB). Österreich: iKMPLUS (IQS). Schweiz: ÜGK.<\/td><\/tr><tr><td>Abschlussprüfungen<\/td><td>Zentralabitur in mehreren Bundesländern mit gemeinsamem Aufgabenpool. Österreich: Standardisierte, kompetenzorientierte Reife- und Diplomprüfung, zentral entwickelt, dezentral beurteilt.<\/td><\/tr><tr><td>Sprachzertifikate<\/td><td>z. B. Cambridge, Trinity, Aptis for Teens, Oxford Test of English (Englisch), DELF/DALF (Französisch), DELE (Spanisch), PLIDA/CILS (Italienisch). Für Deutsch: DSD und ÖSD.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"titel": "5. EALTA-Leitfragen als Analyseraster", "quelle": "Moser-Frötscher 2025, S. 85–87", "html": "<p>Die Richtlinien der European Association for Language Testing and Assessment (EALTA 2006) bieten Leitfragen für gute Praxis. Der Text ordnet sie drei Bereichen zu. Voraussetzung ist Language Assessment Literacy bei den Lehrpersonen.<\/p><div class=\"tablewrap\"><table><thead><tr><th>Bereich<\/th><th>Worauf geachtet wird<\/th><\/tr><\/thead><tbody><tr><td><strong>1. Prüfungszweck und Spezifikation<\/strong> (S. 85–86)<\/td><td>Zweck der Prüfung und Bezug zum Lehrplan. Testspezifikationen (Art der Kompetenzen, Gewichtung, Aufgabenformate). Abdeckung des Lehrplans. Authentizität der Aufgaben. Transparenz gegenüber den Schüler:innen.<\/td><\/tr><tr><td><strong>2. Prüfungsverfahren<\/strong> (S. 86)<\/td><td>Reliabilität. Wer entwirft die Prüfung, wie angemessen ist sie für die Zielgruppe. Vertraute Aufgabentypen, passende Schwierigkeit, sensible Themen vermeiden. Genauigkeit und Fairness der Bewertung, Bewertungsraster, Schulungen. Jahresnote aus vielen Quellen. Bestehensgrenzen kriterienorientiert. Rechtliche Vorgaben beachten.<\/td><\/tr><tr><td><strong>3. Konsequenzen<\/strong> (S. 86–87)<\/td><td>Verwendung der Ergebnisse, Folgen für Schüler:innen und Schulen. low/high stakes. Qualitätssicherung und Begleitforschung. washback. Feedback als formative Funktion.<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Etwaige Bestehensgrenzen sollten nicht normativ, sondern kriterienorientiert (d. h. in Bezug zum Lehrplan) festgelegt werden“<\/p><cite>Moser-Frötscher 2025, S. 86<\/cite><\/blockquote>"}, {"titel": "6. high stakes und washback", "quelle": "Moser-Frötscher 2025, S. 86–87", "html": "<p>Prüfungen unterscheiden sich nach den Folgen der Entscheidung: <strong>low stakes<\/strong> (geringe Auswirkungen) und <strong>high stakes<\/strong> (weitreichende Auswirkungen bei Nichtbestehen, für Lernende wie für Schulen). Bei high stakes steigen die Anforderungen an Qualitätssicherung und Validierung.<\/p><blockquote><p>„Je weitreichender die Auswirkungen einer Prüfung sind, desto wichtiger ist eine rigorose Qualitätssicherung und umfassende Begleitforschung zur Validierung“<\/p><cite>Moser-Frötscher 2025, S. 87<\/cite><\/blockquote><p><strong>washback<\/strong>: Prüfungen wirken auf Unterricht und Lernen zurück.<\/p><blockquote><p>„indem sich Lehrende und Lernende auf jene Kenntnisse, Fertigkeiten oder Fähigkeiten konzentrieren, von denen sie glauben, dass sie in der Prüfung behandelt werden“<\/p><cite>Moser-Frötscher 2025, S. 87<\/cite><\/blockquote><p>Der washback kann negativ sein (wenn die Prüfung vom Lehrplan abweicht) oder positiv. Als positives Beispiel nennt der Text eine bisher wenig beachtete Fertigkeit wie Hören, die nach einer Prüfungsreform im Unterricht stärker gewichtet wird. Auch lokale summative Prüfungen wie Klassenarbeiten können vom washback einer externen Prüfung betroffen sein.<\/p><blockquote><p>„Genauso kann washback aber auch positiv ausfallen“<\/p><cite>Moser-Frötscher 2025, S. 87<\/cite><\/blockquote>"}, {"titel": "7. Übertragung auf Hochschulzugangsprüfungen (eigene Ableitung)", "quelle": "Eigene Übertragung auf Grundlage des Textes, nicht im Text enthalten", "html": "<p>Die Aufgabenstellung der Seminar-Textarbeit verlangt, die Leitfragen auf sprachliche Prüfungen zum Hochschulzugang zu übertragen. Ein Vorschlag für das Raster:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Bereich<\/th><th>Mögliche Leitfrage für Hochschulzugangsprüfungen<\/th><\/tr><\/thead><tbody><tr><td>Zweck und Spezifikation<\/td><td>Welche Zulassungsentscheidung stützt die Prüfung, und welche sprachlichen Kompetenzen für das Studium sind in den Testspezifikationen beschrieben und gewichtet?<\/td><\/tr><tr><td>Prüfungsverfahren<\/td><td>Wie werden Aufgaben entwickelt und Leistungen bewertet (Bewertungsraster, Schulung der Bewertenden), und wie wird die Fairness gegenüber verschiedenen Gruppen von Prüflingen sichergestellt?<\/td><\/tr><tr><td>Konsequenzen<\/td><td>Welche Folgen hat das Nichtbestehen (high stakes: Zugang zum Studium), welche Begleitforschung gibt es, und wie beeinflusst die Prüfung die Vorbereitungskurse (washback)?<\/td><\/tr><\/tbody><\/table><\/div>"}], "zusatz": [{"titel": "EALTA Guidelines for Good Practice in Language Testing and Assessment", "url": "https://ealta.eu/ealta-guidelines-for-good-practice-in-language-testing-and-assessment/", "typ": "Richtlinien", "quelle": "EALTA (European Association for Language Testing and Assessment)", "geprueft": true, "notiz": "Die Richtlinien, auf die sich der Text beruft (EALTA 2006). Die Seite war beim Abruf erreichbar und bietet sie als PDF in vielen Sprachen an. Sie richten sich an Lehrerausbildung, Unterrichtsbeurteilung und Testentwicklung."}], "material": [{"datei": "Moser-Frötscher 2025.pdf", "art": "Lektüre", "notiz": "3.2 Summative Evaluation, S. 83–88"}, {"datei": "2 Textarbeit summative Evaluation.docx", "art": "Aufgabenblatt", "notiz": "Textarbeit mit vier Aufgaben (Begriffe, Argumentation, Einordnung, Analyseraster), 30 Minuten"}, {"datei": "2_Textarbeit_summative_Evaluation_ausgefuellt.docx", "art": "Eigene Bearbeitung", "notiz": "Noch nicht in das Wiki übernommen"}], "begriffe": ["summative-evaluation", "formative-evaluation", "learning-oriented-assessment", "ealta-leitfragen", "testspezifikationen", "reliabilitaet", "high-low-stakes", "washback", "language-assessment-literacy"]}, {"id": "pruefen-s2", "nr": 2, "seminar": "pruefen", "titel": "Funktionen von Assessment, Testtypen und High-Stakes-Tests", "autor": "Annika Berthelé (Folien), Doris Moser-Frötscher (Text)", "lektuere": "Folien 22.10.2026; Moser-Frötscher 2025, S. 83–88", "thema": "Funktionen, Prüfen und Testen, Feedback, low/high stakes, Standardisierung, summative Evaluation", "status": "entwurf", "ueberblick": {"kurzinhalt": "Die Sitzung klärt die Grundbegriffe: Welche [[funktionen-assessment|Funktionen]] hat Assessment, wie unterscheiden sich [[pruefen-testen|Prüfen und Testen]], was leistet [[feedback-hattie|Feedback]] und welche [[konstrukt|Konstrukte]] werden gemessen. Dann geht es um [[high-low-stakes|low und high stakes]], die [[standardisierung|Standardisierung]] von high-stakes-Tests, [[eingangstest|Eingangstests]] für den Hochschulzugang und die drei Arten [[assessment-of-for-as|Assessment of, for und as Learning]]. In der Textarbeit zu Moser-Frötscher werden [[summative-evaluation|summative]] und [[formative-evaluation|formative Evaluation]], die [[ealta-leitfragen|EALTA-Leitfragen]] und der [[washback|washback]] besprochen.", "leitfrage": "Worin unterscheiden sich Prüfen und Testen, low und high stakes, und wie lassen sich die EALTA-Leitfragen auf Prüfungen zum Hochschulzugang übertragen?", "merksatz": "Je weitreichender die Folgen einer Prüfung, desto strenger muss sie standardisiert und qualitätsgesichert sein.", "fa": ["ارزیابی پایانی (summativ) چیزی را که یادگرفته شده در پایان یک دوره می‌سنجد و برای نمره‌دادن به کار می‌رود. ارزیابی تکوینی (formativ) در جریان یادگیری انجام می‌شود تا آموزش و بازخورد را تنظیم کند.", "متن می‌گوید این تقابل یک ساده‌سازی است: یک اطلاعات یکسان می‌تواند هم پایانی و هم تکوینی باشد، بسته به اینکه برای چه هدفی استفاده شود.", "هر چه پیامد یک آزمون سنگین‌تر باشد (high stakes)، کنترل کیفیت باید دقیق‌تر باشد. همچنین آزمون‌های مهم می‌توانند بر آموزش اثر بگذارند (washback).", "«Prüfen» (assessment) مفهومی گسترده است و هر فعالیتی را که اطلاعاتی درباره‌ی زبان‌آموز جمع می‌کند در بر می‌گیرد؛ «Testen» مفهومی محدودتر است و روش اندازه‌گیری عملکرد است.", "بازخورد خوب سه گام دارد: feed up (هدف و جایگاه من)، feed back (پیشرفت من)، feed forward (گام بعدی).", "سه نوع سنجش: Assessment of Learning (پایانی)، for Learning (در جریان یادگیری، با بازخورد) و as Learning (خود/همتاسنجی)."]}, "inhalt": [{"titel": "1. Organisatorisches und Plan der Sitzung", "quelle": "Folien Berthelé, 22.10.2026, Folie 4 und 6", "html": "<p>Je nach Leistungsart gilt im Seminar:<\/p><ul class=\"plain\"><li><strong>Studienleistung:<\/strong> Referat ist Pflicht.<\/li><li><strong>Prüfungsleistung:<\/strong> Hausarbeit oder mündliche Prüfung (abhängig von der Studienleistungsform, laut Folie „SLF“).<\/li><\/ul><blockquote><p>„Wenn Studienleistung: Referat Pflicht“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 4<\/cite><\/blockquote><p>Geplante Inhalte der Sitzung: Funktionen, Definitionen (Prüfen, Testen), low-stakes und high-stakes, Standardisierung und Arten von Assessment.<\/p>"}, {"titel": "2. Funktionen von Assessment (Einstieg)", "quelle": "Folien Berthelé, 22.10.2026, Folie 7 und 8; Quelle der Grafik: Grotjahn/Kleppin 2017, S. 12", "html": "<p>Die Folie sammelt Funktionen aus der Perspektive der Lehrenden:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Gruppe (eigene Ordnung)<\/th><th>Stichwörter auf der Folie<\/th><\/tr><\/thead><tbody><tr><td>Diagnose und Entwicklung<\/td><td>Diagnose, Entwicklung diagnostischer Kompetenzen (Lernende), Fortschritte erkennen, Einstufung<\/td><\/tr><tr><td>Lernunterstützung<\/td><td>Rückmeldung, Förderung, Motivierung<\/td><\/tr><tr><td>Steuerung und Auslese<\/td><td>Notenvergabe, Rangordnung erstellen, Selektionsfunktion, Vergleich, Disziplinierung<\/td><\/tr><tr><td>Bezug zum Lehrplan<\/td><td>Lernziele und curriculare Vorgaben<\/td><\/tr><\/tbody><\/table><\/div><p class=\"meta\">Die Gruppierung in der linken Spalte ist meine Ordnung, nicht die der Folie.<\/p><p><strong>Energizer („Gesprächsmühle“):<\/strong> Wähle drei Funktionen, die du persönlich am wichtigsten findest, und überlege, was deine Prüfungseinstellung für die Lehrpraxis bedeutet. Tausche dich in wechselnden Gruppen jeweils zwei Minuten darüber aus.<\/p><blockquote><p>„Wählen Sie drei Funktionen aus, die Sie persönlich prioritär finden“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 8<\/cite><\/blockquote>"}, {"titel": "3. Begriffe: Prüfen, Testen, Evaluation", "quelle": "Folien 9, 12, 13, 15; Vogt 2025a, S. 10–11; Grotjahn/Kleppin 2017, S. 15; Zimmermann 2025, S. 110", "html": "<p>Die Begriffe sind hierarchisch geordnet, werden aber oft synonym verwendet und überschneiden sich. Die Abbildung (Vogt 2025a, S. 11) ordnet <strong>Evaluation<\/strong> über <strong>Leistungsbeurteilung / Prüfen / Assessment<\/strong> und diese über <strong>Leistungsmessung / Prüfen / Testen<\/strong>.<\/p><blockquote><p>„Häufige synonyme Verwendung in Fachliteratur“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 12<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th><\/th><th>Prüfen (assessment)<\/th><th>Testen (testing)<\/th><\/tr><\/thead><tbody><tr><td>Umfang<\/td><td>weiter Begriff<\/td><td>enger Begriff<\/td><\/tr><tr><td>Was gehört dazu<\/td><td>alle Aktivitäten, bei denen Informationen über Lernende gesammelt werden<\/td><td>Verfahren der Leistungsmessung<\/td><\/tr><tr><td>Ziel<\/td><td>Sprachkompetenz oder Lernfortschritt evaluieren<\/td><td>Auskunft über den aktuellen Stand der Kompetenzentwicklung<\/td><\/tr><tr><td>Form<\/td><td>formell, informell und alternativ (Quiz, Selbst- und Peerevaluation)<\/td><td>möglichst objektiv und zuverlässig<\/td><\/tr><tr><td>Rückschluss<\/td><td colspan=\"2\">Rückschluss auf Kompetenz über elizitierte Leistungen: Beantwortung von Items, schriftliche oder mündliche Textproduktion<\/td><\/tr><\/tbody><\/table><\/div><p>Im Sprachgebrauch ist „TestDaF“ oder „DTZ“ ein „Test“ als Marke, hat aber auch Merkmale einer Prüfung. „Prüfen“ wird eher mit wichtigem Assessment verbunden (z. B. Zertifikate), „Tests“ eher mit engen Formaten (Vokabeltest) oder geschlossenen Formaten (Multiple Choice).<\/p><blockquote><p>„Bei Sprachtests im Sinne der pädagogisch-psychologischen Diagnostik handelt es sich um theoretisch und empirisch fundierte Verfahren zur kontrollierten Auslösung von diagnostisch relevantem Verhalten durch standardisierte Reize“<\/p><cite>Grotjahn 2010, S. 211, zitiert auf Folien Berthelé, 22.10.2026, Folie 15<\/cite><\/blockquote><blockquote><p>„Das Testen ist eine Methode der Leistungsmessung, die die latente Fähigkeit (Kompetenz) eines Individuums in einer ausgewählten Domäne mittels einer Lerner:innenleistung (Performanz) anhand von Indikatoren (Bearbeitung von Testaufgaben und Items) misst“<\/p><cite>Vogt 2025a, S. 10, zitiert auf Folien Berthelé, 22.10.2026, Folie 15<\/cite><\/blockquote>"}, {"titel": "4. Feedback: feed up, feed back, feed forward", "quelle": "Folien 10 und 11; Hattie/Timperley 2007; Vogt 2025a, S. 10; Vogt 2025c, S. 96 und 99", "html": "<p>Feedback hat an Bedeutung gewonnen, weil es Lehren, Lernen und Assessment verbindet. Es soll die Distanz zwischen Lernziel und aktueller Leistung überbrücken. Es ist ein entscheidender Faktor für erfolgreiches Lernen, kann aber negativ wirken, wenn es nicht zu erhöhter Leistung motiviert.<\/p><div class=\"tablewrap\"><table><thead><tr><th>Schritt<\/th><th>Leitfrage<\/th><\/tr><\/thead><tbody><tr><td><strong>Feed up<\/strong><\/td><td>Welche Ziele habe ich? Wo stehe ich?<\/td><\/tr><tr><td><strong>Feed back<\/strong><\/td><td>Wie komme ich voran? (Reflexion, Rückblick)<\/td><\/tr><tr><td><strong>Feed forward<\/strong><\/td><td>Wohin als nächstes? Was sind die nächsten Schritte?<\/td><\/tr><\/tbody><\/table><\/div><p>Gutes Feedback muss laut Vogt (2025c, S. 99) unter anderem:<\/p><blockquote><p>„klar und verständlich für den:die Adressat:in sein“<\/p><cite>Vogt 2025c, S. 99, zitiert auf Folien Berthelé, 22.10.2026, Folie 11<\/cite><\/blockquote><blockquote><p>„kategorienbezogen und aufgabenbezogen sein, nicht auf die Person abzielend“<\/p><cite>Vogt 2025c, S. 99, zitiert auf Folien Berthelé, 22.10.2026, Folie 11<\/cite><\/blockquote><blockquote><p>„spezifisch und konkret am Beispiel arbeitend sein, ggf. auf wenige Aspekte fokussieren“<\/p><cite>Vogt 2025c, S. 99, zitiert auf Folien Berthelé, 22.10.2026, Folie 11<\/cite><\/blockquote>"}, {"titel": "5. Konstrukte der Leistungsmessung", "quelle": "Folien Berthelé, 22.10.2026, Folie 14; Vogt 2025a, S. 12", "html": "<p>Die Leitfrage lautet: Was soll gemessen werden? Ein <strong>Konstrukt<\/strong> ist eine theoretische Vorstellung von sprachlich-kommunikativer Handlungsfähigkeit. Die Folie zeichnet zwei Linien nach:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Entwicklung<\/th><th>Ausweitung<\/th><\/tr><\/thead><tbody><tr><td>behavioristisch (Lado 1961) → multikomponentiell (Bachman/Palmer 2010) → handlungsorientiert (GeR 2001 und 2010)<\/td><td>allgemeine Kompetenzen (GeR); Mediation; Lernendenautonomie; plurikulturelle Kompetenz; Mehrsprachigkeit; kein native-speaker-Standard; Prüfungsgerechtigkeit<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„theoretische Vorstellungen von sprachlich-kommunikativer Handlungsfähigkeit“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 14<\/cite><\/blockquote>"}, {"titel": "6. low stakes und high stakes", "quelle": "Folien Berthelé, 22.10.2026, Folie 16; Zimmermann 2025, S. 110", "html": "<p>Unterschieden wird nach der Tragweite der Konsequenzen für die Teilnehmenden, abhängig von Art und Verwendungszweck des Tests.<\/p><div class=\"tablewrap\"><table><thead><tr><th><\/th><th>low stakes<\/th><th>high stakes<\/th><\/tr><\/thead><tbody><tr><td>Folgen<\/td><td>keine langfristigen Folgen für Lernende<\/td><td>weitreichende Folgen für Lernende<\/td><\/tr><tr><td>Zweck<\/td><td>Diagnose, Förderung, Einordnung<\/td><td>anerkannte Zertifizierung<\/td><\/tr><tr><td>Beispiele<\/td><td>schulischer Diagnosetest (Stärken und Schwächen, Förderbedarf), Einstufungstest im Sprachkurs<\/td><td>Hochschulzugang, Einbürgerung, Nachweis berufsbezogener Sprachkenntnisse; oft als Sprachstandstest (proficiency test) angelegt<\/td><\/tr><\/tbody><\/table><\/div><p>Bei high-stakes-Tests sind Qualitätssicherung und die Einhaltung der Gütekriterien bei Erstellung, Durchführung und Auswertung besonders wichtig. Dazu dient die <strong>Standardisierung<\/strong>.<\/p><blockquote><p>„Unterschieden wird nach der Tragweite der Konsequenzen für die Teilnehmenden, abhängig von Art und Verwendungszweck des Tests.“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 16<\/cite><\/blockquote>"}, {"titel": "7. Standardisierung bei high-stakes-Tests", "quelle": "Folien 17–19; Zimmermann 2025, S. 112–113", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Bereich<\/th><th>Kern<\/th><\/tr><\/thead><tbody><tr><td><strong>Entwicklung<\/strong><\/td><td>Testspezifikationen legen Konstrukt und Aufgabenformate fest und dienen als Blaupause für weitere Testversionen. Ziel: Vergleichbarkeit, gleichbleibende Schwierigkeit. Schritte: Aufgabenentwicklung, Pilotierung, psychometrische Analysen und qualitative Begleitforschung, Festlegung des Formats, Produktion weiterer Versionen.<\/td><\/tr><tr><td><strong>Durchführung<\/strong><\/td><td>Leistungen entstehen unter vergleichbaren Bedingungen. Durchführungsbestimmungen bei dezentralen Tests (z. B. Goethe, TestDaF, DELF/DALF, DELE, Cambridge). Ziel: Fairness.<\/td><\/tr><tr><td><strong>Auswertung<\/strong><\/td><td>Geschlossene Formate: objektive Auswertung unproblematisch. Produktive Leistungen: einheitliche Beurteilungsskalen, unabhängige Doppelbeurteilung, Multifacetten-Rasch-Analyse.<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Ziel: Fairness, niemand wird benachteiligt oder bevorzugt, egal wo Prüfung abgelegt wird“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 18<\/cite><\/blockquote><blockquote><p>„Multifacetten-Rasch-Analyse: statistischer Ausgleich von Strenge/Milde der Beurteilenden“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 19<\/cite><\/blockquote>"}, {"titel": "8. Eingangstests für den sprachlichen Hochschulzugang", "quelle": "Folien Berthelé, 22.10.2026, Folie 20; Holzknecht 2025, S. 117", "html": "<p><strong>Aufnahmetest, Zulassungstest, Zugangstest:<\/strong> Sie klären, ob Teilnehmende in eine Sprachausbildung aufgenommen werden. Sie sind high stakes.<\/p><div class=\"tablewrap\"><table><thead><tr><th>Eignungstest<\/th><th>Aufnahmetest<\/th><\/tr><\/thead><tbody><tr><td>misst die allgemeine Befähigung zum Fremdsprachenlernen<\/td><td>meist sprachspezifisch, idealerweise auf Inhalte der jeweiligen Ausbildung abgestimmt<\/td><\/tr><\/tbody><\/table><\/div><p>Im Seminarkontext sind extern entwickelte <em>proficiency tests<\/em> das Aufnahmekriterium: in englischsprachigen Ländern TOEFL und IELTS, in Deutschland der TestDaF (und weitere) als anerkannter Aufnahmetest.<\/p><blockquote><p>„Eignungstest → misst allgemeine Befähigung zum Fremdsprachenlernen“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 20<\/cite><\/blockquote>"}, {"titel": "9. Arten von Assessment: of, for und as Learning", "quelle": "Folien Berthelé, 22.10.2026, Folie 21 (nach Vogt 2025a, S. 12–14)", "html": "<div class=\"tablewrap\"><table><thead><tr><th><\/th><th>Assessment of Learning<\/th><th>Assessment for Learning<\/th><th>Assessment as Learning<\/th><\/tr><\/thead><tbody><tr><td>Art<\/td><td>summativ (am Ende)<\/td><td>formativ (prozessbezogen)<\/td><td>formativ (prozessbezogen)<\/td><\/tr><tr><td>Ziel<\/td><td>Lernziele erreicht?<\/td><td>Lernprozess unterstützen<\/td><td>Verantwortung für eigenes Lernen<\/td><\/tr><tr><td>Zeitpunkt<\/td><td>Ende (Kurs, Lektion, Abschnitt)<\/td><td>prozessbegleitend<\/td><td>integraler Teil des Lernens<\/td><\/tr><tr><td>Charakter<\/td><td>geplant, eher formell<\/td><td>eher informell, eingebettet<\/td><td>in Lernen eingebettet<\/td><\/tr><tr><td>Wer beurteilt?<\/td><td>Lehrperson / Institution<\/td><td>Lehrperson, mit Feedback<\/td><td>Lernende (selbst / gegenseitig)<\/td><\/tr><tr><td>Beispiele<\/td><td>Klassenarbeit, Abitur, Vergleichsarbeiten<\/td><td>Rückfragen, geplante Evaluationsaktivitäten, Portfolio<\/td><td>Self-Assessment, Peer-Assessment, dynamic assessment<\/td><\/tr><tr><td>Nutzen<\/td><td>Ergebnis, Bildungsmonitoring<\/td><td>Feedback für Lernen und Lehren<\/td><td>Selbststeuerung der Lernenden<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„In Praxis nicht immer zu trennen!“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 21<\/cite><\/blockquote>"}, {"titel": "10. Vorbereitung der nächsten Sitzung", "quelle": "Folien Berthelé, 22.10.2026, Folie 23", "html": "<blockquote><p>„Mindestens 2 Texte aus Kapitel 2 in Vogt/Rossa (2025) – freie Wahl!“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 23<\/cite><\/blockquote><p>Der Sammelband ist auf Moodle verlinkt.<\/p>"}, {"titel": "Textarbeit: Ziele", "quelle": "Folien Berthelé, 22.10.2026, Folie 22", "html": "<p>Zu bearbeiten ist Moser-Frötscher (2025), Summative Evaluation, S. 83–88. Die Folie nennt als Lernziele:<\/p><blockquote><p>„Ich kann die Begriffe summative und formative Evaluation, high stakes und washback erklären und voneinander abgrenzen und sie kritisch einordnen.“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 22<\/cite><\/blockquote><blockquote><p>„Ich kann Leitfragen guter Prüfungspraxis (EALTA) auf Prüfungen zum Hochschulzugang übertragen und als Analyseraster nutzen.“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 22<\/cite><\/blockquote>"}, {"titel": "Textarbeit: 1. Summativ und formativ", "quelle": "Moser-Frötscher 2025, S. 83", "html": "<ul class=\"plain\"><li><strong>Summativ:<\/strong> misst im Nachhinein, was erreicht wurde. Sie findet punktuell statt, bewertet Fortschritte und dient der Benotung. Sie ist formell und geplant und steht am Ende einer Einheit (von einer Woche bis zu einem Jahr).<\/li><li><strong>Formativ:<\/strong> prüft während der Lernphase den Fortschritt, um den folgenden Unterricht abzustimmen und Feedback zu geben.<\/li><li><strong>Neuere Bezeichnungen:<\/strong> Assessment of Learning (summativ) und Assessment for Learning (formativ).<\/li><\/ul><blockquote><p>„Die summative Evaluation misst im Nachhinein, was von Einzelpersonen oder auch Gruppen erreicht wurde“<\/p><cite>Moser-Frötscher 2025, S. 83<\/cite><\/blockquote>"}, {"titel": "Textarbeit: 2. Warum die Gegenüberstellung eine Vereinfachung ist", "quelle": "Moser-Frötscher 2025, S. 83", "html": "<blockquote><p>„Die kontrastive Unterscheidung zwischen summativer und formativer Evaluation stellt jedoch eine starke Vereinfachung dieser beiden Konstrukte sowie ihrer Beziehung zueinander dar“<\/p><cite>Moser-Frötscher 2025, S. 83<\/cite><\/blockquote><p>Der Text nennt mehrere Positionen:<\/p><ul class=\"plain\"><li><strong>Harlen (2005):<\/strong> Nur der Zweck macht den Unterschied. Dieselbe Information kann summativ oder formativ sein.<\/li><li><strong>Harsch (2012):<\/strong> Dieselben Instrumente können prinzipiell für beide Paradigmen verwendet werden.<\/li><li><strong>Bachman/Damböck (2017):<\/strong> Unterschied nach den Entscheidungen. Formative betreffen Unterrichten und Lernen, summative teilen Lernende in Gruppen (z. B. Versetzung).<\/li><li><strong>Learning-Oriented Assessment (Jones/Saville 2016):<\/strong> Beide Zugänge sind eng verwoben, das erfolgreiche Lernen steht im Fokus.<\/li><\/ul><blockquote><p>„Für Harlen (2005) macht einzig der Zweck den Unterschied aus: Dieselbe Information, die gesammelt wird, kann sowohl summativ als auch formativ sein“<\/p><cite>Moser-Frötscher 2025, S. 83<\/cite><\/blockquote>"}, {"titel": "Textarbeit: 3. Zwecke und Adressaten", "quelle": "Moser-Frötscher 2025, S. 83–84", "html": "<p>Summative Informationen dienen verschiedenen Zwecken (Harlen 2005):<\/p><ul class=\"plain\"><li>schulintern: Fortschritte festhalten, die nächste Lehrperson informieren<\/li><li>Adressaten: Eltern und Schüler:innen, häufig als Schulnoten<\/li><li>extern: Zertifizierung, Auswahl von Bewerber:innen für eine Anstellung oder ein Studium<\/li><li>Standardisierung und Bildungsmonitoring durch extern vorgegebene Prüfungen<\/li><\/ul>"}, {"titel": "Textarbeit: 4. Extern vorgegebene summative Prüfungen im deutschsprachigen Raum", "quelle": "Moser-Frötscher 2025, S. 84–85", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Art<\/th><th>Beispiele im Text<\/th><\/tr><\/thead><tbody><tr><td>Leistungsvergleich<\/td><td>PISA (OECD): Kompetenzen der 15-Jährigen. 2025 erstmals optionale Zusatzerhebung zur Fremdsprachenkompetenz.<\/td><\/tr><tr><td>Zentrale Kompetenzerhebungen<\/td><td>Deutschland: Bildungstrends und VERA (IQB). Österreich: iKMPLUS (IQS). Schweiz: ÜGK.<\/td><\/tr><tr><td>Abschlussprüfungen<\/td><td>Zentralabitur in mehreren Bundesländern mit gemeinsamem Aufgabenpool. Österreich: Standardisierte, kompetenzorientierte Reife- und Diplomprüfung, zentral entwickelt, dezentral beurteilt.<\/td><\/tr><tr><td>Sprachzertifikate<\/td><td>z. B. Cambridge, Trinity, Aptis for Teens, Oxford Test of English (Englisch), DELF/DALF (Französisch), DELE (Spanisch), PLIDA/CILS (Italienisch). Für Deutsch: DSD und ÖSD.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"titel": "Textarbeit: 5. EALTA-Leitfragen als Analyseraster", "quelle": "Moser-Frötscher 2025, S. 85–87", "html": "<p>Die Richtlinien der European Association for Language Testing and Assessment (EALTA 2006) bieten Leitfragen für gute Praxis. Der Text ordnet sie drei Bereichen zu. Voraussetzung ist Language Assessment Literacy bei den Lehrpersonen.<\/p><div class=\"tablewrap\"><table><thead><tr><th>Bereich<\/th><th>Worauf geachtet wird<\/th><\/tr><\/thead><tbody><tr><td><strong>1. Prüfungszweck und Spezifikation<\/strong> (S. 85–86)<\/td><td>Zweck der Prüfung und Bezug zum Lehrplan. Testspezifikationen (Art der Kompetenzen, Gewichtung, Aufgabenformate). Abdeckung des Lehrplans. Authentizität der Aufgaben. Transparenz gegenüber den Schüler:innen.<\/td><\/tr><tr><td><strong>2. Prüfungsverfahren<\/strong> (S. 86)<\/td><td>Reliabilität. Wer entwirft die Prüfung, wie angemessen ist sie für die Zielgruppe. Vertraute Aufgabentypen, passende Schwierigkeit, sensible Themen vermeiden. Genauigkeit und Fairness der Bewertung, Bewertungsraster, Schulungen. Jahresnote aus vielen Quellen. Bestehensgrenzen kriterienorientiert. Rechtliche Vorgaben beachten.<\/td><\/tr><tr><td><strong>3. Konsequenzen<\/strong> (S. 86–87)<\/td><td>Verwendung der Ergebnisse, Folgen für Schüler:innen und Schulen. low/high stakes. Qualitätssicherung und Begleitforschung. washback. Feedback als formative Funktion.<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Etwaige Bestehensgrenzen sollten nicht normativ, sondern kriterienorientiert (d. h. in Bezug zum Lehrplan) festgelegt werden“<\/p><cite>Moser-Frötscher 2025, S. 86<\/cite><\/blockquote>"}, {"titel": "Textarbeit: 6. high stakes und washback", "quelle": "Moser-Frötscher 2025, S. 86–87", "html": "<p>Prüfungen unterscheiden sich nach den Folgen der Entscheidung: <strong>low stakes<\/strong> (geringe Auswirkungen) und <strong>high stakes<\/strong> (weitreichende Auswirkungen bei Nichtbestehen, für Lernende wie für Schulen). Bei high stakes steigen die Anforderungen an Qualitätssicherung und Validierung.<\/p><blockquote><p>„Je weitreichender die Auswirkungen einer Prüfung sind, desto wichtiger ist eine rigorose Qualitätssicherung und umfassende Begleitforschung zur Validierung“<\/p><cite>Moser-Frötscher 2025, S. 87<\/cite><\/blockquote><p><strong>washback<\/strong>: Prüfungen wirken auf Unterricht und Lernen zurück.<\/p><blockquote><p>„indem sich Lehrende und Lernende auf jene Kenntnisse, Fertigkeiten oder Fähigkeiten konzentrieren, von denen sie glauben, dass sie in der Prüfung behandelt werden“<\/p><cite>Moser-Frötscher 2025, S. 87<\/cite><\/blockquote><p>Der washback kann negativ sein (wenn die Prüfung vom Lehrplan abweicht) oder positiv. Als positives Beispiel nennt der Text eine bisher wenig beachtete Fertigkeit wie Hören, die nach einer Prüfungsreform im Unterricht stärker gewichtet wird. Auch lokale summative Prüfungen wie Klassenarbeiten können vom washback einer externen Prüfung betroffen sein.<\/p><blockquote><p>„Genauso kann washback aber auch positiv ausfallen“<\/p><cite>Moser-Frötscher 2025, S. 87<\/cite><\/blockquote>"}, {"titel": "Textarbeit: 7. Übertragung auf Hochschulzugangsprüfungen (eigene Ableitung)", "quelle": "Eigene Übertragung auf Grundlage des Textes, nicht im Text enthalten", "html": "<p>Die Aufgabenstellung der Seminar-Textarbeit verlangt, die Leitfragen auf sprachliche Prüfungen zum Hochschulzugang zu übertragen. Ein Vorschlag für das Raster:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Bereich<\/th><th>Mögliche Leitfrage für Hochschulzugangsprüfungen<\/th><\/tr><\/thead><tbody><tr><td>Zweck und Spezifikation<\/td><td>Welche Zulassungsentscheidung stützt die Prüfung, und welche sprachlichen Kompetenzen für das Studium sind in den Testspezifikationen beschrieben und gewichtet?<\/td><\/tr><tr><td>Prüfungsverfahren<\/td><td>Wie werden Aufgaben entwickelt und Leistungen bewertet (Bewertungsraster, Schulung der Bewertenden), und wie wird die Fairness gegenüber verschiedenen Gruppen von Prüflingen sichergestellt?<\/td><\/tr><tr><td>Konsequenzen<\/td><td>Welche Folgen hat das Nichtbestehen (high stakes: Zugang zum Studium), welche Begleitforschung gibt es, und wie beeinflusst die Prüfung die Vorbereitungskurse (washback)?<\/td><\/tr><\/tbody><\/table><\/div>"}], "zusatz": [{"titel": "EALTA Guidelines for Good Practice in Language Testing and Assessment", "url": "https://ealta.eu/ealta-guidelines-for-good-practice-in-language-testing-and-assessment/", "typ": "Richtlinien", "quelle": "EALTA (European Association for Language Testing and Assessment)", "geprueft": true, "notiz": "Die Richtlinien, auf die sich der Text beruft (EALTA 2006). Die Seite war beim Abruf erreichbar und bietet sie als PDF in vielen Sprachen an. Sie richten sich an Lehrerausbildung, Unterrichtsbeurteilung und Testentwicklung."}], "material": [{"datei": "2 Prüfen Testen_Funktionen und High Stakes Tests 22.10.pdf", "art": "Folien", "notiz": "Annika Berthelé, 24 Folien"}, {"datei": "Moser-Frötscher 2025.pdf", "art": "Lektüre", "notiz": "3.2 Summative Evaluation, S. 83–88"}, {"datei": "2 Textarbeit summative Evaluation.docx", "art": "Aufgabenblatt", "notiz": "Textarbeit mit vier Aufgaben, 30 Minuten"}, {"datei": "2_Textarbeit_summative_Evaluation_ausgefuellt.docx", "art": "Eigene Bearbeitung", "notiz": "Noch nicht in das Wiki übernommen"}], "begriffe": ["summative-evaluation", "formative-evaluation", "learning-oriented-assessment", "ealta-leitfragen", "testspezifikationen", "reliabilitaet", "high-low-stakes", "washback", "language-assessment-literacy", "funktionen-assessment", "pruefen-testen", "feedback-hattie", "konstrukt", "standardisierung", "eingangstest", "assessment-of-for-as"]}, {"id": "schreiben-s1", "nr": 1, "seminar": "schreiben", "titel": "Schreibkompetenz und GER-Skalen", "autor": "Krings 2016, Grotjahn 2017", "lektuere": "Krings 2016, S. 107; Grotjahn 2017, Anhang 1–7, S. 113–116", "thema": "Teilkompetenzen des fremdsprachlichen Schreibens und ihre Beschreibung im GER", "status": "entwurf", "ueberblick": {"kurzinhalt": "Krings gliedert die fremdsprachliche [[schreibkompetenz|Schreibkompetenz]] in fünf Teilkompetenzen: Schreibmotorik, Orthographie, fremdsprachliches Schriftsystem, das Verfassen von Texten nach gültigen [[textkonventionen|Textkonventionen]] (die Kernkompetenz) und das [[schreibprozessmanagement|Schreibprozessmanagement]]. Grotjahn dokumentiert im Anhang sieben [[ger-skalen|GER-Skalen]] mit Niveaubeschreibungen von A1 bis C2.", "leitfrage": "Welche Teilkompetenzen umfasst fremdsprachliches Schreiben, und welche davon beschreiben die sieben GER-Skalen im Anhang?", "merksatz": "Schreiben ist mehr als Texte formulieren: Die Kernkompetenz ist das Verfassen von Texten nach Textkonventionen, die am häufigsten übersehene Teilkompetenz ist das Schreibprozessmanagement.", "fa": ["طبق کرینگس، توانایی نوشتن در زبان خارجی از پنج مهارت جزئی تشکیل می‌شود: حرکت دست یا تایپ، املا، آشنایی با نظام خط زبان خارجی، نوشتن متن طبق قواعد متنی (مهارت اصلی) و مدیریت فرایند نوشتن.", "مدیریت فرایند نوشتن بیشتر از همه نادیده گرفته می‌شود. هر چه متن طولانی‌تر و دشوارتر باشد، این مهارت مهم‌تر است.", "گروتیان در پیوست خود هفت مقیاس چارچوب مرجع اروپایی (GER) درباره‌ی نوشتن آورده است، از سطح A1 تا C2."]}, "inhalt": [{"titel": "1. Fünf Teilkompetenzen des fremdsprachlichen Schreibens (Krings)", "quelle": "Krings 2016, S. 107", "html": "<div class=\"tablewrap\"><table><thead><tr><th>#<\/th><th>Teilkompetenz<\/th><th>Inhalt laut Text<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Schreibmotorik<\/td><td>Handschriftliches oder elektronisches Schreibprodukt. Die elementare Handschrift wird in der Grundschule erworben. Die Beherrschung des Tastaturschreibens beeinflusst jede Textproduktion an PC, Tablet oder Smartphone.<\/td><\/tr><tr><td>2<\/td><td>Orthographie<\/td><td>Besonders wichtig in Sprachen ohne einheitliche Phonem-Graphem-Zuordnung, z. B. Englisch und Französisch.<\/td><\/tr><tr><td>3<\/td><td>Fremdsprachliches Schriftsystem<\/td><td>Der Lernaufwand hängt davon ab, ob es eine Alphabetschrift (zwei bis drei Dutzend Zeichen) oder eine logographische Schrift wie Chinesisch (mehrere tausend Zeichen) ist.<\/td><\/tr><tr><td>4<\/td><td>Texte nach Textkonventionen verfassen<\/td><td>Die Kernkompetenz. Dazu gehören Textsortenkonventionen, die von Sprache zu Sprache differieren können, und die Beherrschung der Schriftsprache im Unterschied zur Umgangssprache.<\/td><\/tr><tr><td>5<\/td><td>Schreibprozessmanagement<\/td><td>Planen und Steuern der komplexen mentalen Teilprozesse der Textproduktion.<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Dies ist zweifellos die Kernkompetenz des Schreibens.“<\/p><cite>Krings 2016, S. 107<\/cite><\/blockquote><blockquote><p>„die am häufigsten übersehene Teilkompetenz des Schreibens“<\/p><cite>Krings 2016, S. 107<\/cite><\/blockquote><blockquote><p>„Je umfangreicher und anspruchsvoller der hervorzubringende Text gemessen an den Schreiberfahrungen des Textproduzenten ist, desto größer ist die Bedeutung dieser Teilkompetenz.“<\/p><cite>Krings 2016, S. 107<\/cite><\/blockquote>"}, {"titel": "2. Die sieben GER-Skalen im Anhang (Grotjahn)", "quelle": "Grotjahn 2017, Anhang 1–7, S. 113–116", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Anhang<\/th><th>Skala<\/th><th>Seite<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Schriftliche Produktion allgemein<\/td><td>113<\/td><\/tr><tr><td>2<\/td><td>Schriftliche Interaktion allgemein<\/td><td>113<\/td><\/tr><tr><td>3<\/td><td>Spektrum sprachlicher Mittel (allgemein)<\/td><td>114<\/td><\/tr><tr><td>4<\/td><td>Wortschatzbeherrschung<\/td><td>115<\/td><\/tr><tr><td>5<\/td><td>Grammatische Korrektheit<\/td><td>115<\/td><\/tr><tr><td>6<\/td><td>Beherrschung der Orthographie<\/td><td>116<\/td><\/tr><tr><td>7<\/td><td>Kohärenz und Kohäsion<\/td><td>116<\/td><\/tr><\/tbody><\/table><\/div><p>Alle Skalen stammen aus dem Gemeinsamen europäischen Referenzrahmen (Europarat 2001) und sind in sechs Niveaus von A1 bis C2 gegliedert. Bei Wortschatz heißt es für A1: „keine Deskriptoren verfügbar“.<\/p>"}, {"titel": "3. Beispiel: Skala „Schriftliche Produktion allgemein“", "quelle": "Grotjahn 2017, Anhang 1, S. 113 (zitiert nach Europarat 2001, S. 67)", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Niveau<\/th><th>Kann …<\/th><\/tr><\/thead><tbody><tr><td><strong>C2<\/strong><\/td><td>Kann klare, flüssige, komplexe Texte in angemessenen und effektiven Stil schreiben, deren logische Struktur den Lesern das Auffinden der wesentlichen Punkte erleichtert.<\/td><\/tr><tr><td><strong>C1<\/strong><\/td><td>Kann klare, gut strukturierte Texte zu komplexen Themen verfassen und dabei die entscheidenden Punkte hervorheben…<\/td><\/tr><tr><td><strong>B2<\/strong><\/td><td>Kann klare, detaillierte Texte zu verschiedenen Themen aus seinem / ihrem Interessengebiet verfassen und dabei Informationen und Argumente aus verschiedenen Quellen zusammenführen und gegeneinander abwägen.<\/td><\/tr><tr><td><strong>B1<\/strong><\/td><td>Kann unkomplizierte, zusammenhängende Texte zu mehreren vertrauten Themen aus seinem / ihrem Interessengebiet verfassen, wobei einzelne kürzere Teile in linearer Abfolge verbunden werden.<\/td><\/tr><tr><td><strong>A2<\/strong><\/td><td>Kann eine Reihe einfacher Wendungen und Sätze schreiben und mit Konnektoren wie und, aber oder weil verbinden.<\/td><\/tr><tr><td><strong>A1<\/strong><\/td><td>Kann einfache, isolierte Wendungen und Sätze schreiben.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"meta\">Die Beschreibung für C1 ist hier gekürzt.<\/p>"}, {"titel": "4. Teilkompetenzen und Skalen im Vergleich (eigene Zuordnung)", "quelle": "Eigene Zuordnung, nicht in den Texten enthalten", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Teilkompetenz (Krings)<\/th><th>Passende GER-Skala im Anhang<\/th><\/tr><\/thead><tbody><tr><td>2. Orthographie<\/td><td>Anhang 6: Beherrschung der Orthographie<\/td><\/tr><tr><td>4. Texte nach Textkonventionen verfassen<\/td><td>Anhang 1: Schriftliche Produktion allgemein. Anhang 7: Kohärenz und Kohäsion. Außerdem Anhang 3–5 (sprachliche Mittel, Wortschatz, Grammatik) für die sprachliche Seite.<\/td><\/tr><tr><td>1. Schreibmotorik, 3. Schriftsystem, 5. Schreibprozessmanagement<\/td><td>In den sieben Skalen des Auszugs nicht vertreten<\/td><\/tr><\/tbody><\/table><\/div><p>Das wäre ein Ansatzpunkt für die Diskussion, welche Teilkompetenzen Skalen überhaupt erfassen können.<\/p>"}], "zusatz": [{"titel": "Council of Europe: CEFR Companion Volume with new descriptors", "url": "https://www.coe.int/en/web/education/-/council-of-europe-launches-the-cefr-companion-volume-with-new-descriptors", "typ": "Offizielle Seite", "quelle": "Europarat (Council of Europe)", "geprueft": false, "notiz": "Die Skalen bei Grotjahn stammen aus dem GER von 2001. Der Begleitband ergänzt neue Deskriptoren, auch zum Schreiben. Die Seite wurde nur in Suchergebnissen gesehen, nicht geöffnet."}], "material": [{"datei": "Krings 2016_ Schreibkompetenz Definition aus Handbuch Fremdsprachenunterricht_.pdf", "art": "Lektüre", "notiz": "Kap. 23 Schreiben, S. 107 (1 Seite)"}, {"datei": "Grotjahn 2017_GER Skalen Schreiben.pdf", "art": "Lektüre", "notiz": "Anhang 1–7, S. 113–116 (4 Seiten)"}], "begriffe": ["schreibkompetenz", "schreibprozessmanagement", "textkonventionen", "ger-skalen", "kohaerenz-kohaesion"]}, {"id": "schreiben-s2", "nr": 2, "seminar": "schreiben", "titel": "Schreibprozesse in der Erst- und in der Fremdsprache", "autor": "Esther Odilia Breuer", "lektuere": "Breuer 2020, S. 22–31 (Abschnitte 2–6, Auszug)", "thema": "Ideen generieren, Planen, sprachliche Transformation, Ausführung und Revision in L1 und Fremdsprache", "status": "entwurf", "ueberblick": {"kurzinhalt": "Breuer vergleicht, wie fünf [[schreibsubprozesse|Schreibsubprozesse]] in der Erstsprache (L1) und in der Fremdsprache (FS) ablaufen: Ideen generieren, Text planen, sprachliche Transformation, Ausführung und Revision. Durchgehend zeigt sich: Die FS belastet das [[arbeitsgedaechtnis|Arbeitsgedächtnis]] stärker, die Sprachkompetenz entscheidet mit, und die L1 dient als [[l1-entlastung|Entlastung]]. Der Beitrag stellt viele Einzelstudien vor, etwa zu [[freewriting|freewriting]], [[pre-task-planning|Planung vor dem Schreiben]], zur [[copy-task|copy task]] und zur [[revision|Revision]].", "leitfrage": "Was unterscheidet die einzelnen Schreibsubprozesse in der FS von denen in der L1, und welche Rolle spielt die Sprachkompetenz dabei?", "merksatz": "Auch Prozesse, die als sprachunabhängig gelten (Ideen, Planen), laufen in der Fremdsprache anders ab, weil die Sprache Arbeitsgedächtnis bindet.", "fa": ["برِویِر پنج زیرفرایند نوشتن را در زبان اول و زبان خارجی مقایسه می‌کند: تولید ایده، برنامه‌ریزی متن، تبدیل زبانی، اجرا (تایپ/نوشتن) و بازبینی.", "نتیجه‌ی تکرارشونده: نوشتن در زبان خارجی حافظه‌ی کاری را بیشتر درگیر می‌کند و توانایی زبانی نقش تعیین‌کننده دارد. زبان اول می‌تواند باری را سبک کند (مثلاً برای ایده‌پردازی).", "در بازبینی، نویسندگان زبان خارجی بیشتر خطاهای سطحی (مثلاً غلط تایپی) را اصلاح می‌کنند؛ تغییرات ساختاری کمتر دیده می‌شود."]}, "inhalt": [{"titel": "1. Überblick: fünf Subprozesse im Auszug", "quelle": "Breuer 2020, S. 22–31", "html": "<p>Der Auszug umfasst die Abschnitte 2 bis 6 des Beitrags (Abschnitt 1 liegt nicht vor):<\/p><div class=\"tablewrap\"><table><thead><tr><th>Abschnitt<\/th><th>Subprozess<\/th><th>Seiten<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>Ideen generieren<\/td><td>22–24<\/td><\/tr><tr><td>3<\/td><td>Text planen<\/td><td>24–26<\/td><\/tr><tr><td>4<\/td><td>Sprachliche Transformation<\/td><td>26–27<\/td><\/tr><tr><td>5<\/td><td>Ausführung<\/td><td>27–28<\/td><\/tr><tr><td>6<\/td><td>Revision<\/td><td>29–31<\/td><\/tr><\/tbody><\/table><\/div><p class=\"meta\">Abkürzungen im Text: L1 = Erstsprache, FS = Fremdsprache.<\/p>"}, {"titel": "2. Ideen generieren", "quelle": "Breuer 2020, S. 22–24", "html": "<p>Ideengenerierung ist laut Flower/Hayes (1981) der Startpunkt des Schreibprozesses.<\/p><blockquote><p>„Dieser Subprozess kann in weiten Teilen sprachunabhängig ablaufen, da viele Informationen in unserem Gehirn in anderen als sprachlichen Modalitäten gespeichert werden“<\/p><cite>Breuer 2020, S. 22<\/cite><\/blockquote><p>Zugleich ist abstraktes Denken stark an Sprache gebunden. Daraus folgt ein Paradoxon:<\/p><blockquote><p>„dass wir einerseits Probleme beim Formulieren von Ideen in der FS haben, wir andererseits aber bei dem Versuch, dies in unserer L1 zu tun, feststellen, dass das nötige Fachvokabular fehlt“<\/p><cite>Breuer 2020, S. 22<\/cite><\/blockquote><p><strong>L1 als Entlastung:<\/strong> Jugendliche (Gunnarson 2019) nutzten die L1 zum Ideengenerieren, Strukturieren und bei Wortfindungsproblemen, die FS beim Lesen der Aufgabe, Formulieren und Revidieren. Bei Li (2008) hing der Erfolg von der FS-Kompetenz ab:<\/p><blockquote><p>„Gute FS-Schreibende verwendeten die L1 sehr viel erfolgreicher für das Ideengenerieren als schlechte FS-Schreibende“<\/p><cite>Breuer 2020, S. 22<\/cite><\/blockquote><p><strong>Schreiben als Denken:<\/strong> Schreiben dient auch dazu, Wissen zu transformieren oder neues zu erzeugen (Bereiter/Scardamalia 1987, Galbraith 1999).<\/p><blockquote><p>„Die körperlichen Prozesse aktivieren die mentalen, und das Schreiben wird zum Denken.“<\/p><cite>Breuer 2020, S. 22 (zu Menary 2007: 622)<\/cite><\/blockquote><blockquote><p>„so hemmt dies das Schreiben als Denken.“<\/p><cite>Breuer 2020, S. 23 (wenn Sprachsuche zu viel Arbeitsgedächtnis beansprucht)<\/cite><\/blockquote><p><strong>Studie Breuer (2016a):<\/strong> Studierende mit L1 Deutsch schrieben vier akademische Texte (zwei Deutsch, zwei Englisch), geplant mit Notizen oder mit freewriting.<\/p><blockquote><p>„Die meisten Ideen wurden im L1 freewriting festgehalten, die wenigsten in den L1-Notizen.“<\/p><cite>Breuer 2020, S. 23<\/cite><\/blockquote><blockquote><p>„Die kognitive Entlastung durch das Nicht-Verwenden der FS hatte hier langfristig keinen positiven Effekt.“<\/p><cite>Breuer 2020, S. 23<\/cite><\/blockquote><p><strong>Abrams/Byrd (2016)<\/strong> und <strong>Bloch (2007)<\/strong>: Wenn Ideen losgelöst vom Schreiben entwickelt werden (bei Bloch durch einen Genrewechsel zum Bloggen), steigen Zahl und Komplexität der Ideen.<\/p><blockquote><p>„Die Teilnehmenden, die komplexe sowie besonders viele Ideen in den inhaltszentrierten Planungsepisoden generierten, schrieben am Ende längere und bessere Texte als diejenigen, die dies nicht taten.“<\/p><cite>Breuer 2020, S. 23<\/cite><\/blockquote><blockquote><p>„Die Sprachkompetenz spielt dabei eine entscheidende Rolle.“<\/p><cite>Breuer 2020, S. 24 (Fazit des Abschnitts)<\/cite><\/blockquote>"}, {"titel": "3. Text planen", "quelle": "Breuer 2020, S. 24–26", "html": "<p>Planen heißt: Ideen auf Aufgabenadäquatheit prüfen und eine Struktur wählen. Das kann sprachungebunden mit Stichwörtern oder visuellen Mitteln geschehen (pre-task planning).<\/p><blockquote><p>„Werden aufgrund von Sprachproblemen nur wenige Ideen generiert, hat dies für die Textplanung die Konsequenz, dass die Pläne simpel sind“<\/p><cite>Breuer 2020, S. 24 (= knowledge telling)<\/cite><\/blockquote><blockquote><p>„Allgemein wird angenommen, dass FS-Schreibende nicht zu viele Prozesse parallel ausführen, sondern sich besser auf die jeweils aktuellen Aspekte konzentrieren sollten“<\/p><cite>Breuer 2020, S. 24<\/cite><\/blockquote><p>Die L1 kann auch beim Planen entlasten: Bei Lally (2000) beeinflusste die Planungssprache Organisation und globalen Texteindruck, nicht das Vokabular. Bei Li (2008) nutzten Schreibende mit hohem FS-Niveau die L1 verstärkt für strategische höherrangige Prozesse.<\/p><p><strong>Abrams/Byrd (2016):<\/strong> Deutschlernende schrieben Zusammenfassungen ohne Planung, mit Mindmapping und mit chronologischer Stichwortliste.<\/p><blockquote><p>„Die Ergebnisse demonstrieren, dass der Text ohne vorherige Planung derjenige war, der in den Bereichen Grammatik, Wortkorrektheit und Wortwahl am besten funktionierte.“<\/p><cite>Breuer 2020, S. 25<\/cite><\/blockquote><blockquote><p>„Dagegen waren Inhalt, lexikalische Komplexität und Textfluss wesentlich besser, wenn die Teilnehmenden den Text planten.“<\/p><cite>Breuer 2020, S. 25<\/cite><\/blockquote><p><strong>Ong (2014):<\/strong> Gruppen planten 0, 10 oder 20 Minuten bei 30 Minuten Gesamtzeit, mit einfacher, mittlerer oder komplexer Aufgabenstellung.<\/p><blockquote><p>„Die Resultate belegen, dass die Aufgabenumgebung einen großen Effekt auf die metakognitiven Prozesse hatte, dass die Zeit für das Planen aber nur einen Einfluss darauf hatte, wie oft die Teilnehmenden über sprachliche Aspekte nachdachten.“<\/p><cite>Breuer 2020, S. 25<\/cite><\/blockquote><p>Ziegler (2018): Auch bei nur drei Minuten Planung dachten die Teilnehmenden vor allem über Formulierungen und Grammatik nach.<\/p><blockquote><p>„Wie man diesen Anforderungen begegnen kann, ist bisher aber noch nicht zufriedenstellend beantwortet worden.“<\/p><cite>Breuer 2020, S. 26 (Fazit des Abschnitts)<\/cite><\/blockquote>"}, {"titel": "4. Sprachliche Transformation", "quelle": "Breuer 2020, S. 26–27", "html": "<p>Hier werden Gedanken in Text umgesetzt: Wörter generieren, syntaktische Strukturen aktivieren, das passende Register wählen.<\/p><blockquote><p>„Bei der Transformation der Gedanken in Text müssen Wörter generiert und syntaktische Strukturen aktiviert werden, was stark mit der Sprachkompetenz in der Zielsprache zusammenhängt“<\/p><cite>Breuer 2020, S. 26<\/cite><\/blockquote><p><strong>Lee (2018)<\/strong> verglich englische Abstracts koreanischer Akademiker:innen mit professionellen Übersetzungen:<\/p><blockquote><p>„LEE geht darum davon aus, dass die Übersetzung von der Idee zum Text noch über eine weitere Übersetzung abläuft – die von der L1 in die FS.“<\/p><cite>Breuer 2020, S. 26<\/cite><\/blockquote><p><strong>Breuer (2015):<\/strong> Deutsche Schreibende mit Englisch auf C1-Niveau machten die meisten Fehler bei L1-Interferenzen.<\/p><blockquote><p>„Die Analyse der Texte zeigt, dass die Fehlerquote am höchsten im Bereich der L1-Interferenzen war – vor allem im Bereich der Syntax, aber auch in phonemisch-orthographischen Aspekten.“<\/p><cite>Breuer 2020, S. 26<\/cite><\/blockquote><p><strong>Van Gelderen et al. (2011):<\/strong> Flüssigkeits- und Worttraining erhöhte die Nutzung der Zielwörter, auch auf Textebene. Eine zweite Gruppe mit Fachwissen-Unterricht profitierte ebenfalls, weil sie Ideen besser generierte.<\/p><blockquote><p>„ein weiterer Indikator dafür, dass die Schreibsubprozesse sich gegenseitig beeinflussen“<\/p><cite>Breuer 2020, S. 27<\/cite><\/blockquote><p>Der New-Literacies-Ansatz (Kress 2009) und Hunma (2016) sehen Mehrsprachigkeit positiv. Vor unkritischem Einsatz warnt Gevers:<\/p><blockquote><p>„GEVERS (2018) warnt jedoch davor, translanguaging – also das Vermischen mehrerer Sprachen – unkritisch im Unterricht einzusetzen“<\/p><cite>Breuer 2020, S. 27<\/cite><\/blockquote>"}, {"titel": "5. Ausführung (motorische Umsetzung)", "quelle": "Breuer 2020, S. 27–28", "html": "<p>Ausführung heißt: Tippen oder Handschreiben. Dieser Prozess wurde bisher wenig als eigener Gegenstand erforscht.<\/p><blockquote><p>„Dabei hat die reine Tippfähigkeit einen großen Einfluss auf die Erfolgsaussichten der anderen Schreibprozesse“<\/p><cite>Breuer 2020, S. 28<\/cite><\/blockquote><p>Die <em>copy task<\/em> (Van Waes et al. 2019) misst per Keylogging reine Ausführungsprozesse beim Abschreiben. In einer laufenden, unveröffentlichten Studie von Breuer schrieben bisher 323 Studierende je einen deutschen und einen englischen Text ab, aufgeteilt in vier Gruppen:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Gruppe<\/th><th>Beschreibung<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>monolinguale deutsche Studierende<\/td><\/tr><tr><td>2<\/td><td>bilinguale Studierende mit Deutsch als einer der beiden L1<\/td><\/tr><tr><td>3<\/td><td>Studierende mit Migrationshintergrund (mündliche L1 nicht Deutsch, erste Schriftsprache Deutsch)<\/td><\/tr><tr><td>4<\/td><td>FS-Studierende (Deutsch weder mündlich noch schriftlich L1)<\/td><\/tr><\/tbody><\/table><\/div><p>Gruppen 1 und 2 waren in beiden Sprachen wesentlich schneller als 3 und 4. Tiryakioglu/Hilton (2018) fanden bei türkisch-französisch bilingualen Schüler:innen die höchste Geschwindigkeit in der dominanten Bildungssprache Französisch.<\/p><blockquote><p>„Die ersten Ergebnisse im Bereich der reinen Ausführungsanalyse belegen somit, dass selbst die motorische Umsetzung des geplanten Textes in der FS nicht so automatisiert abläuft, wie sie es in der L1 tut.“<\/p><cite>Breuer 2020, S. 28<\/cite><\/blockquote>"}, {"titel": "6. Revision", "quelle": "Breuer 2020, S. 29–31", "html": "<p>Revision ist der Abgleich des Textes mit den sprachlichen, semantischen und pragmatischen Besonderheiten des Schreibziels (Alamargot/Chanquoy 2001). Sie beginnt schon bei der Ideenwahl.<\/p><blockquote><p>„Er findet nicht ausschließlich nach dem Erstellen eines Textes statt, sondern beginnt bereits bei der Generierung und der Auswahl von Ideen“<\/p><cite>Breuer 2020, S. 29<\/cite><\/blockquote><p><strong>Zeitpunkt (Chenoweth/Hayes 2001):<\/strong><\/p><blockquote><p>„Für diese war es am effektivsten, den Text erst nach der Fertigstellung zu überarbeiten.“<\/p><cite>Breuer 2020, S. 29 (für FS-Schreibende; L1-Schreibende profitierten von aktiver Revision während der Produktion)<\/cite><\/blockquote><p><strong>Ebene der Revision:<\/strong> Bereiter/Scardamalia (1987: 22) beobachten bei Anfänger:innen, unsicheren Schreibenden und FS-Schreibenden eine Überarbeitung auf einem „cosmetic level of little more than proofreading“. Xu (2018) fand bei niedriger FS-Kompetenz mehr kleine, oberflächliche Revisionen.<\/p><blockquote><p>„Der Großteil der durchgeführten Korrekturen betraf orthographische Fehler, die meisten davon waren reine Tippfehler: bis zu 53,5% im FS-Text und 60,43% im L1-Text.“<\/p><cite>Breuer 2020, S. 29–30 (Studie Breuer 2017)<\/cite><\/blockquote><p><strong>Feedback unter Studierenden (Breuer 2016b, Fallstudie):<\/strong> Eine FS-Gruppe, eine L1-Peerberaterin und eine FS-Peerberaterin gaben je einer FS-Studierenden Feedback.<\/p><blockquote><p>„Einzig der FS-Peerberaterin gelang es, den Fokus auf die eigentlichen Schwachpunkte zu setzen und dies konstruktiv-kooperativ zu tun, sodass nach dem Gespräch über den Text eine echte (selbstständige) Überarbeitung stattfand.“<\/p><cite>Breuer 2020, S. 30<\/cite><\/blockquote><p><strong>Förderung (Van Steendam et al. 2014):<\/strong> Modelling (Strategie vorführen, dann anwenden) half beiden Gruppen, das Learning-to-write-Prinzip vor allem den weniger kompetenten Schreibenden.<\/p><blockquote><p>„Die kollaborative Überarbeitung in der Fremdsprache funktionierte durch das Auseinanderziehen der Prozesse (Methode separat lernen, beobachten, anwenden) generell besser als ein paralleles Arbeiten mit Selbstmonitoring“<\/p><cite>Breuer 2020, S. 31<\/cite><\/blockquote><blockquote><p>„Alle vorgestellten Studien demonstrieren, dass es Unterschiede in L1- und FS-Revision gibt, dass hier aber schon Ansätze für Methoden zur besseren Unterstützung existieren.“<\/p><cite>Breuer 2020, S. 31<\/cite><\/blockquote>"}, {"titel": "7. Vergleich auf einen Blick (eigene Zusammenfassung)", "quelle": "Eigene Zusammenfassung der Abschnitte 2–6, nicht im Text enthalten", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Subprozess<\/th><th>Befund in der FS (laut Breuer)<\/th><th>Was hilft<\/th><\/tr><\/thead><tbody><tr><td>Ideen generieren<\/td><td>weniger und einfachere Ideen, abhängig von der FS-Kompetenz<\/td><td>L1 als Entlastung, freewriting, Ideenentwicklung getrennt vom Schreiben<\/td><\/tr><tr><td>Planen<\/td><td>einfache Pläne bei Sprachproblemen, Planen und Formulieren konkurrieren<\/td><td>Pre-task planning, Fokus auf einen Aspekt zur Zeit<\/td><\/tr><tr><td>Sprachliche Transformation<\/td><td>zusätzlicher Übersetzungsweg L1 → FS, L1-Interferenzen auch bei C1<\/td><td>Wort- und Flüssigkeitstraining, Fachwissen, metakognitives Wissen über die Übersetzung<\/td><\/tr><tr><td>Ausführung<\/td><td>langsamer und weniger automatisiert als in der L1<\/td><td>Tippfertigkeit, Schreibübung<\/td><\/tr><tr><td>Revision<\/td><td>überwiegend lokal und oberflächlich, Textstruktur bleibt meist unberührt<\/td><td>Revision nach der Fertigstellung, Modelling, Peerberatung mit Fokus auf Schwachpunkte<\/td><\/tr><\/tbody><\/table><\/div><p>Verknüpfung mit anderen Texten: Das knappe Arbeitsgedächtnis steht auch im [[kellogg-modell|Kellogg-Modell]] im Zentrum, und die Unterscheidung zwischen einfachem und transformierendem Schreiben ([[knowledge-telling|knowledge telling]]) wird bei Schnell ausführlich erklärt (Sitzung 3).<\/p>"}], "zusatz": [], "material": [{"datei": "Breuer 2020_L2-Schreiben Ideen generieren.pdf", "art": "Lektüre", "notiz": "Abschnitt 2, S. 22–24"}, {"datei": "Breuer 2020_ L2-Schreiben Text planen.pdf", "art": "Lektüre", "notiz": "Abschnitt 3, S. 24–26"}, {"datei": "Breuer 2020_L2-Schreiben Sprachliche Transformation u. Ausführung.pdf", "art": "Lektüre", "notiz": "Abschnitte 4 und 5, S. 26–28"}, {"datei": "Breuer 2020_L2-Schreiben Revision.pdf", "art": "Lektüre", "notiz": "Abschnitt 6, S. 29–31"}], "begriffe": ["schreibsubprozesse", "arbeitsgedaechtnis", "l1-entlastung", "freewriting", "pre-task-planning", "copy-task", "revision", "translanguaging", "schreiben-als-denken", "knowledge-telling"]}, {"id": "schreiben-s3", "nr": 3, "seminar": "schreiben", "titel": "Schreibprozessmodelle und Schreibentwicklung", "autor": "Kellogg et al., Zimmerman/Kitsantas, Schnell", "lektuere": "Schnell 2020, S. 40–51 und 70–75 (Vorbereitungstext); Kellogg et al. (Modell 1996), S. 161–165; Zimmerman/Kitsantas 2006, S. 53–59", "thema": "Arbeitsgedächtnis-Modell, selbstregulierter Schreibzyklus, Schreibstrategien und Schreibentwicklung", "status": "entwurf", "ueberblick": {"kurzinhalt": "Drei Texte beschreiben das Schreiben aus unterschiedlichen Perspektiven. Das [[kellogg-modell|Modell von Kellogg (1996)]] zeigt, welche sechs Teilprozesse welche Teile des [[arbeitsgedaechtnis|Arbeitsgedächtnisses]] beanspruchen. Zimmerman/Kitsantas beschreiben einen Zyklus der [[selbstregulation-schreiben|Selbstregulation]] mit drei Phasen. Schnell (Vorbereitungstext für die 3. Sitzung) fasst [[schreibstrategie|Schreibstrategien]] ([[knowledge-telling|knowledge telling]], [[knowledge-transforming|knowledge transforming]], [[knowledge-crafting|knowledge crafting]]) und die [[schreibentwicklung-bereiter|Schreibentwicklung]] zusammen.", "leitfrage": "Wie unterscheiden sich Novizen und Expert:innen beim Schreiben, und welche Modelle erklären das (Arbeitsgedächtnis, Selbstregulation, Strategien, Entwicklungsstufen)?", "merksatz": "Wer Schreiben lernt, automatisiert Teilprozesse, damit Arbeitsgedächtnis für höhere Aufgaben frei wird, und lernt, den eigenen Prozess zu steuern.", "fa": ["مدل کلوگ: نوشتن شش فرایند دارد (برنامه‌ریزی، ترجمه‌ی ایده به جمله، برنامه‌ریزی حرکتی، اجرا، خواندن، ویرایش) و هر کدام بخش مشخصی از حافظه‌ی کاری را به کار می‌گیرد.", "زیمرمن و کیتساس: نوشتن یک چرخه‌ی خودتنظیمی است با سه مرحله: پیش‌اندیشی، اجرا و خودبازتابی؛ نتیجه‌ی هر متن، نوشتن بعدی را شکل می‌دهد.", "اشنل: نوآموزان بیشتر «دانش‌گویی» (knowledge telling) می‌کنند و خبرگان «دانش‌دگرگونی» (knowledge transforming)؛ ولی هر دو راهبرد می‌توانند خوب یا بد اجرا شوند."]}, "inhalt": [{"titel": "1. Kellogg: Arbeitsgedächtnis und sechs Schreibprozesse", "quelle": "Kellogg et al., Modell von 1996, S. 161–165", "html": "<blockquote><p lang=\"en\">“The model differentiated six basic processes.”<\/p><cite>Kellogg et al., Modell von 1996, S. 161<\/cite><\/blockquote><p>Kellogg baut auf Hayes/Flower (1980) auf und unterscheidet vier kognitive Prozesse (planning, translating, reading, editing; die letzten beiden sind Teile des Überprüfens, reviewing) sowie zwei motorische Prozesse (programming, executing). Die Textproduktion ist rekursiv:<\/p><blockquote><p lang=\"en\">“planning, sentence generation, and even reviewing of ideas and text are recursive operations that occur in complex patterns through text production”<\/p><cite>Kellogg et al., Modell von 1996, S. 161<\/cite><\/blockquote><p>Das Modell bezieht sich auf Baddeleys Arbeitsgedächtnis mit drei Komponenten: <strong>zentrale Exekutive<\/strong> (central executive), <strong>visuell-räumlicher Notizblock<\/strong> (visuo-spatial sketchpad) und <strong>phonologische Schleife<\/strong> (phonological loop). Tabelle 1 im Text ordnet zu:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Prozess<\/th><th>Visuell-räumlicher Notizblock<\/th><th>Zentrale Exekutive<\/th><th>Phonologische Schleife<\/th><\/tr><\/thead><tbody><tr><td>Planning (Planen)<\/td><td>X<\/td><td>X<\/td><td><\/td><\/tr><tr><td>Translating (Formulieren)<\/td><td><\/td><td>X<\/td><td>X<\/td><\/tr><tr><td>Programming (motorisch planen)<\/td><td><\/td><td>X<\/td><td><\/td><\/tr><tr><td>Executing (motorisch ausführen)<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Reading (Lesen)<\/td><td><\/td><td>X<\/td><td>X<\/td><\/tr><tr><td>Editing (Überarbeiten)<\/td><td><\/td><td>X<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><p>Wichtige Aussagen:<\/p><ul class=\"plain\"><li>Planen ist der einzige Prozess, der den Notizblock braucht, etwa für Visualisierungen, Skizzen und Textlayout.<\/li><li>Formulieren braucht die phonologische Schleife (innere Sprache).<\/li><li>Die motorische Ausführung stellt kaum Anforderungen, bei Kindern ist aber schon das Programmieren von Handschrift anstrengend.<\/li><\/ul><blockquote><p lang=\"en\">“planning was the only aspect of written composition that placed a demand on the visuo-spatial sketchpad”<\/p><cite>Kellogg et al., Modell von 1996, S. 163<\/cite><\/blockquote><blockquote><p lang=\"en\">“Translating ideas into sentences in theory demanded the phonological loop.”<\/p><cite>Kellogg et al., Modell von 1996, S. 163<\/cite><\/blockquote><blockquote><p lang=\"en\">“Until they learn to automate to some degree these lower level processes, insufficient resources of the central executive are available to the higher order demands of planning ideas, generating text, and reviewing the work produced thus far.”<\/p><cite>Kellogg et al., Modell von 1996, S. 163<\/cite><\/blockquote><p><strong>Artikulatorische Suppression:<\/strong> Die Vorhersage lautet, dass irrelevante Sprache oder ständiges lautloses Wiederholen eines Wortes (z. B. „tap, tap, tap“) das Formulieren stört.<\/p><blockquote><p lang=\"en\">“This form of dual task methodology is known as articulatory suppression, because it prevents participants from engaging in silent articulation.”<\/p><cite>Kellogg et al., Modell von 1996, S. 164<\/cite><\/blockquote><p><strong>Editing:<\/strong> Erkennen von Abweichungen zwischen Absicht und Ergebnis, im Modell nur von der zentralen Exekutive getragen.<\/p><blockquote><p lang=\"en\">“Editing refers to the detection of mistakes, that is, some mismatch between the writer’s intentions and output of another writing process.”<\/p><cite>Kellogg et al., Modell von 1996, S. 164<\/cite><\/blockquote><blockquote><p lang=\"en\">“A key and controversial assumption of Kellogg’s (1996) model is that editing makes demands solely on the central executive.”<\/p><cite>Kellogg et al., Modell von 1996, S. 165<\/cite><\/blockquote><blockquote><p lang=\"en\">“This may be one reason why it is difficult to catch mistakes in one’s own text”<\/p><cite>Kellogg et al., Modell von 1996, S. 164<\/cite><\/blockquote>"}, {"titel": "2. Zimmerman/Kitsantas: Zyklus der Selbstregulation", "quelle": "Zimmerman/Kitsantas 2006, S. 53–59", "html": "<p>Das sozial-kognitive Modell hat drei Phasen, ähnlich den Schreibphasen bei Rohman (1965) und den Prozessen bei Flower/Hayes (1980):<\/p><blockquote><p lang=\"en\">“It includes sources of motivation as well as cognitive processes in a cyclical feedback loop wherein writing outcomes are used to modify and guide subsequent efforts to write.”<\/p><cite>Zimmerman/Kitsantas 2006, S. 54<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th>Phase<\/th><th>Teilprozesse laut Abbildung 1 und Text<\/th><th>Beispiele im Text<\/th><\/tr><\/thead><tbody><tr><td><strong>Forethought<\/strong> (Vorüberlegung)<\/td><td>Task analysis: goal setting, strategic planning. Sources of self-motivation: self-efficacy, outcome expectancy, task interest/valuing, goal orientation.<\/td><td>Wochenziele bei Trollope; ausführliche Planung bei John Irving<\/td><\/tr><tr><td><strong>Performance<\/strong> (Ausführung)<\/td><td>Self-control: self-instruction, mental imagery, task strategies, attention focusing, time management, environmental structuring, self-consequences, help-seeking. Self-observation: metacognitive monitoring, self-recording.<\/td><td>Hemingway hört mitten im Satz auf; Proust lässt einen korkgedämmten Raum bauen; Hugo gibt seine Kleider ab<\/td><\/tr><tr><td><strong>Self-reflection<\/strong> (Selbstreflexion)<\/td><td>Self-judgment: self-evaluation, causal attribution. Self-reaction: self-satisfaction/affect, adaptive/defensive inferences.<\/td><td>Faulkner: nie zufrieden sein; Stafford senkt Standards gegen Schreibblockaden<\/td><\/tr><\/tbody><\/table><\/div><p>Wichtige Aussagen:<\/p><blockquote><p lang=\"en\">“Prior to performing, expert writers analyze their literary tasks and set specific writing goals”<\/p><cite>Zimmerman/Kitsantas 2006, S. 54<\/cite><\/blockquote><blockquote><p lang=\"en\">“Hemingway would purposely halt his writing for the day in mid-sentence”<\/p><cite>Zimmerman/Kitsantas 2006, S. 56<\/cite><\/blockquote><blockquote><p lang=\"en\">“Adaptive help-seeking strategies are distinguished from social dependence by several key characteristics: self-initiation, selective focus, and limited duration”<\/p><cite>Zimmerman/Kitsantas 2006, S. 57<\/cite><\/blockquote><blockquote><p lang=\"en\">“Because novice writers fail to set selective goals, they are often overwhelmed by the amount of information that must be metacognitively monitored”<\/p><cite>Zimmerman/Kitsantas 2006, S. 57<\/cite><\/blockquote><blockquote><p lang=\"en\">“Self-evaluation involves comparing self-monitored outcomes with a standard or goal.”<\/p><cite>Zimmerman/Kitsantas 2006, S. 58<\/cite><\/blockquote><blockquote><p lang=\"en\">“Poorly self-regulated writers often attribute their errors to uncontrollable factors, such as a lack of talent, which discourage these individuals from further learning efforts”<\/p><cite>Zimmerman/Kitsantas 2006, S. 58<\/cite><\/blockquote><blockquote><p lang=\"en\">“Because of its cyclical nature, this model seeks to explain writing as a continuing process of growth as a writer becomes more competent.”<\/p><cite>Zimmerman/Kitsantas 2006, S. 54<\/cite><\/blockquote>"}, {"titel": "3. Schnell: Schreibstrategien (Abschnitt 2.1.4)", "quelle": "Schnell 2020, S. 40–51", "html": "<p>Die Strategieforschung sah sich zunächst als Weg, Lernenden wenige Strategien beizubringen, die dann in vielen Gebieten helfen. Die Kognitionspsychologie zeigte aber, dass kognitive Operationen stärker an aufgabenbezogenes und inhaltliches Wissen gebunden sind.<\/p><h4>Bereiter/Scardamalia (1987): knowledge telling und knowledge transforming<\/h4><blockquote><p>„Die Grundfiguren des Modells sind die Knowledge-telling-Strategie und die Knowledge-transforming-Strategie.“<\/p><cite>Schnell 2020, S. 41<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th><\/th><th>[[knowledge-telling|knowledge telling]]<\/th><th>[[knowledge-transforming|knowledge transforming]]<\/th><\/tr><\/thead><tbody><tr><td>Wer<\/td><td>vor allem Schreibnovizen<\/td><td>vor allem Schreibexpert:innen<\/td><\/tr><tr><td>Vorgehen<\/td><td>Schlüsselbegriffe zu Thema und Genre aus dem Gedächtnis abrufen und linear aneinanderreihen, ohne größere Planung<\/td><td>Textziele und Textmuster steuern das Schreiben; Inhalts- und Diskurswissen werden aufeinander bezogen<\/td><\/tr><tr><td>Funktion<\/td><td>ähnelt dem assoziativen oder expressiven Schreiben<\/td><td>aktiviert die epistemisch-heuristische (erkenntnisfördernde) Funktion<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Durch ein simples lineares Aneinanderreihen werden diese Informationen ohne größere erkennbare Organisationsprozesse miteinander verbunden.“<\/p><cite>Schnell 2020, S. 42<\/cite><\/blockquote><blockquote><p>„Bei dieser problemorientierten Herangehensweise wird die epistemisch-heuristische (erkenntnisfördernde) Funktion des Schreibens aktiviert“<\/p><cite>Schnell 2020, S. 43<\/cite><\/blockquote><p>Beide Strategien sind integriert gedacht: Das gesamte knowledge telling ist als Unterprozess in das knowledge transforming eingebunden. Wichtig ist die Einschränkung:<\/p><blockquote><p lang=\"en\">“it is possible to write well or poorly following either model”<\/p><cite>Schnell 2020, S. 43 (Bereiter/Scardamalia 1987: 5)<\/cite><\/blockquote><blockquote><p>„Dieses bietet eine Erklärung dafür, dass die kognitiv-emotionale Belastung auch bei versierten Schreibenden nicht zwingend abnimmt, sondern u. U. sogar zunehmen kann“<\/p><cite>Schnell 2020, S. 43<\/cite><\/blockquote><h4>Kellogg (2008): knowledge crafting<\/h4><p>Als dritte Stufe ergänzt Kellogg das [[knowledge-crafting|knowledge crafting]]. Schreibende können dabei zusätzlich über Wissen, Argumentation und Adressaten reflektieren. Das gelingt laut Kellogg meist erst nach etwa zwanzig Jahren Schreibpraxis.<\/p><blockquote><p lang=\"en\">“Regardless of the particular composition strategy employed, what characterizes the knowledge-crafting of expert writers is the capacity to keep in mind how a reader would interpret the text as well as representing the author’s ideas and what the text says, in its present form, communicates to the author and to the reader”<\/p><cite>Schnell 2020, S. 44 (zitiert Kellogg 2008, S. 10)<\/cite><\/blockquote><h4>Weitere Befunde und Typologien<\/h4><ul class=\"plain\"><li><strong>Hayes/Flower (1981):<\/strong> Erfolgreiche Schreibende halten die Repräsentation der Aufgabe und die Leserschaft im Blick. Manche vereinfachen das Problem radikal (z. B. „write another theme for English class“), was ein Risiko ist.<\/li><li><strong>Reid (1984):<\/strong> zwei Typen, radical brain-stormer (wenig Vorplanung, mehrfach überarbeiten) und radical outliner (sehr detaillierte Planung, spätes Schreiben).<\/li><li><strong>Ortner (2000):<\/strong> zehn idealtypische Schreibstrategien aus Selbstbeschreibungen von Schriftstellern, z. B. „Einen Text zu einer Idee schreiben“, „Planendes Schreiben“, „Schrittweises, produktionslogisches Vorgehen“ (Sammeln, Disponieren, Konzipieren, Gliedern, Formulieren, Korrigieren).<\/li><li><strong>Deutschsprachige Studien:<\/strong> Molitor-Lübbert (1985), Becker-Mrotzek (1992, 2004), Perrin (2001), Reimann (1989). Strategien sind vor allem aufgabenabhängig, aber auch personenabhängig.<\/li><\/ul><blockquote><p>„people only solve the problems they define for themselves“<\/p><cite>Schnell 2020, S. 45 (zitiert Hayes/Flower 1981: 372)<\/cite><\/blockquote><blockquote><p>„Ich begreife eine Strategie als ein Verfahren, das Feld der Aufmerksamkeit zu erweitern“<\/p><cite>Schnell 2020, S. 47 (Ortner 2000: 352)<\/cite><\/blockquote><blockquote><p>„Insgesamt weisen die meisten Ergebnisse der Untersuchungen zu Schreibstrategien darauf hin, dass sich situationsbedingte, aufgaben- und personenspezifische Parameter erheblich voneinander unterscheiden können, ohne dass dadurch Rückschlüsse auf bessere oder schlechtere Produkte gezogen werden können“<\/p><cite>Schnell 2020, S. 50<\/cite><\/blockquote>"}, {"titel": "4. Schnell: Schreibentwicklung (Abschnitt 2.1.7)", "quelle": "Schnell 2020, S. 70–75", "html": "<p>Bereiters Modell (1980) mit fünf Stufen ist theoretisch begründet, nicht empirisch (Übersetzungen nach Zuchewicz 2001):<\/p><div class=\"tablewrap\"><table><thead><tr><th>Stufe (englisch)<\/th><th>Deutsch<\/th><th>Kern<\/th><\/tr><\/thead><tbody><tr><td>Associative writing<\/td><td>Assoziatives Schreiben<\/td><td>Ideen aufschreiben, wie sie einfallen; reines knowledge telling<\/td><\/tr><tr><td>Performative writing<\/td><td>Regelgemäßes Schreiben<\/td><td>zusätzlich auf Orthografie, Syntax, Stil, Textsortenwissen achten<\/td><\/tr><tr><td>Communicative writing<\/td><td>Kommunikatives Schreiben<\/td><td>Wirkung auf Adressaten wird mitgedacht<\/td><\/tr><tr><td>Unified writing<\/td><td>Authentisch-gestaltendes (reflektiertes) Schreiben<\/td><td>eigener Stil und kritischer Standpunkt; Perspektivwechsel Schreibende/Lesende (writing-reading feedback loop)<\/td><\/tr><tr><td>Epistemic writing<\/td><td>Epistemisches Schreiben<\/td><td>Gedanken umstrukturieren, neue Zusammenhänge erarbeiten, Erkenntnis erweitern<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Es handelt sich um reines knowledge telling“<\/p><cite>Schnell 2020, S. 70 (zu associative writing)<\/cite><\/blockquote><blockquote><p lang=\"en\">“there is no natural order of writing development”<\/p><cite>Schnell 2020, S. 71 (Bereiter 1980: 89)<\/cite><\/blockquote><p>Die Stufen sind also keine feste Abfolge. Wichtig ist die Automatisierung der Grundprozesse, damit Aufmerksamkeit für weitere Teilfähigkeiten frei wird. Kritik: Das Modell erklärt nicht, wie der Übergang zum knowledge transforming gelingt (Hyland 2011, Becker-Mrotzek 2004).<\/p><blockquote><p lang=\"en\">“do not explain, however, how novices make the cognitive transition to a knowledge-transforming model”<\/p><cite>Schnell 2020, S. 72 (Hyland 2011: 19)<\/cite><\/blockquote><p><strong>Studierende:<\/strong> Pohl (2007) fand komplexere Problemrepräsentationen bei wachsender Schreibfähigkeit. Steinhoff (2007) beschreibt drei Stufen der Schreibkompetenz im Studium:<\/p><blockquote><p>„Zu Anfang des Studiums kommt es zu einer Imitation wissenschaftlicher Stilmittel.“<\/p><cite>Schnell 2020, S. 73<\/cite><\/blockquote><blockquote><p>„Am Ende der Schreibkompetenzentwicklung steht dann ein kontextadäquater Sprachgebrauch, der keine Anzeichen mehr von Imitation aufweist.“<\/p><cite>Schnell 2020, S. 73<\/cite><\/blockquote><blockquote><p>„Hinzu kommt, dass die Anforderungen, die Schreibende mit zunehmender Schreibexpertise an sich selbst stellen, steigen und dass es dadurch im Hinblick auf die Schreibentwicklung keinen Endpunkt gibt.“<\/p><cite>Schnell 2020, S. 75<\/cite><\/blockquote>"}, {"titel": "5. Die drei Texte im Zusammenhang (eigene Verknüpfung)", "quelle": "Eigene Verknüpfung, nicht in den Texten enthalten", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Perspektive<\/th><th>Frage<\/th><th>Text<\/th><\/tr><\/thead><tbody><tr><td>Kognitive Architektur<\/td><td>Welche Teilprozesse beanspruchen welche Speicher?<\/td><td>Kellogg<\/td><\/tr><tr><td>Selbststeuerung und Motivation<\/td><td>Wie steuert der Schreibende sich über mehrere Schreibzyklen?<\/td><td>Zimmerman/Kitsantas<\/td><\/tr><tr><td>Strategien und Entwicklung<\/td><td>Wie unterscheiden sich Novizen und Expert:innen und wie entwickelt sich das?<\/td><td>Schnell<\/td><\/tr><\/tbody><\/table><\/div><ul class=\"plain\"><li>Die zentrale Exekutive bei Kellogg und das Schreibprozessmanagement bei Krings (Sitzung 1) betreffen beide die Steuerung des Pr
