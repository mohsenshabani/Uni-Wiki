<style>
/* Layout: Aktenordner-Wiki. Kopfzeile mit Suche, linke Navigation, Lesespalte.
   Blau = Behördenblau (Navigation, Links); Rot = Stempel (Sitzungsmarken, Belege). */
:root{
  --bg:#E9EDF1; --surface:#F7F9FB; --ink:#172233; --muted:#566376; --line:#CBD3DC;
  --accent:#1F4E79; --accent-soft:#DCE6F0; --stamp:#A12B2B; --quote:#EEF2F6; --hl:#F6E3A1;
  --f-serif:"Literata",Georgia,"Times New Roman",serif;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-fa:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1620; --surface:#17212D; --ink:#E6EBF1; --muted:#9AA7B8; --line:#2B3949;
    --accent:#86B8E4; --accent-soft:#22364A; --stamp:#E8827A; --quote:#1C2836; --hl:#5A4B12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1620; --surface:#17212D; --ink:#E6EBF1; --muted:#9AA7B8; --line:#2B3949;
  --accent:#86B8E4; --accent-soft:#22364A; --stamp:#E8827A; --quote:#1C2836; --hl:#5A4B12; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
a{color:var(--accent);text-underline-offset:.18em}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--f-serif);line-height:1.25;text-wrap:balance;margin:0}
.fa{font-family:var(--f-fa);direction:rtl;unicode-bidi:isolate}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:.9rem;padding-block:.6rem}
.brand{display:flex;align-items:baseline;gap:.6rem;text-decoration:none;color:var(--ink);font:600 1.05rem var(--f-serif);white-space:nowrap}
.az{font:500 .68rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);border:1.5px solid var(--stamp);padding:.05rem .35rem;border-radius:2px}
.top input[type=search]{flex:1;min-width:0;max-width:26rem;margin-left:auto;font:inherit;padding:.45rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#menu{display:none;font:500 .9rem var(--f-sans);padding:.4rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}

/* Rahmen */
.shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:2.5rem;padding-block:1.75rem 4rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav#nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.2rem);align-self:start;max-height:calc(100vh - 6rem);overflow:auto;font-size:.93rem}
nav h4{font:500 .7rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:1.3rem 0 .4rem}
nav h4:first-child{margin-top:0}
nav a{display:block;padding:.32rem .6rem;margin-left:-.6rem;border-radius:4px;color:var(--ink);text-decoration:none}
nav a:hover{background:var(--accent-soft)}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav a .nr{font:500 .75rem var(--f-mono);color:var(--stamp);margin-right:.45rem}
main{min-width:0;font:17px/1.7 var(--f-serif)}
main:focus{outline:none}
main > *{max-width:46rem}
main h1{font-size:2rem;font-weight:600}
main h2{font-size:1.3rem;font-weight:600;margin:2.2rem 0 .6rem}
main h3{font-size:1.05rem;font-weight:600;margin:0 0 .35rem}
main p{margin:.6rem 0}
.lead{font-size:1.1rem;color:var(--muted)}
.meta{font:500 .8rem var(--f-sans);color:var(--muted);letter-spacing:.02em}
.stamp{display:inline-block;font:500 .72rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--stamp);border:1.5px solid var(--stamp);padding:.12rem .5rem;border-radius:2px;transform:rotate(-1.5deg);margin-bottom:.7rem}

/* Status und Navigation */
.badge{display:inline-block;font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:.1rem .45rem;border-radius:2px;margin:0 0 .7rem .5rem;vertical-align:top}
.badge.entwurf{color:var(--muted);border:1.5px dashed var(--muted)}
.badge.geprueft{color:var(--surface);background:var(--accent);border:1.5px solid var(--accent)}
nav a.sem{font-weight:600;margin-top:.3rem}
nav a.sub{padding-left:1.1rem;font-size:.9rem}
.semhead{font:500 .8rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2rem 0 .2rem}
.linkitem{display:block;padding:.8rem 0;border-top:1px solid var(--line)}
.linkitem:last-child{border-bottom:1px solid var(--line)}
.linkitem .u{font:.8rem var(--f-mono);color:var(--muted);word-break:break-all}
.chip{display:inline-block;font:500 .72rem var(--f-mono);letter-spacing:.06em;border:1px solid var(--line);border-radius:3px;padding:0 .4rem;color:var(--muted);margin-left:.4rem}

/* Reiter */
.tabs{display:flex;gap:.1rem;overflow-x:auto;border-bottom:1px solid var(--line);margin:1.2rem 0 1.5rem}
.tabs a{white-space:nowrap;padding:.55rem .85rem;font:500 .9rem var(--f-sans);color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a:hover{color:var(--ink)}

/* Bausteine */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem 1.2rem;margin:1rem 0}
.card.fa-box{border-left:3px solid var(--accent)}
.card.fa-box p{font:400 1rem/1.9 var(--f-fa);direction:rtl;text-align:right;margin:.2rem 0}
.pg{font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--stamp);margin-bottom:.3rem}
blockquote{margin:.8rem 0;padding:.6rem 1rem;background:var(--quote);border-left:3px solid var(--line);font-size:.97rem}
blockquote p{margin:.2rem 0}
blockquote cite{display:block;font:500 .75rem var(--f-mono);letter-spacing:.06em;color:var(--muted);font-style:normal;margin-top:.35rem}
.kq{font-style:italic}
.bei{border-top:1px dashed var(--line);margin-top:.7rem;padding-top:.5rem;font-size:.96rem}
.bei b{font:600 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-right:.4rem}
.hint{font:.88rem/1.5 var(--f-sans);color:var(--muted);background:var(--accent-soft);padding:.55rem .8rem;border-radius:5px;margin:.8rem 0}
a.term{text-decoration:none;border-bottom:1px solid var(--accent)}
a.term:hover{background:var(--accent-soft)}
.list{list-style:none;padding:0;margin:.5rem 0}
.list li{border-top:1px solid var(--line)}
.list li:last-child{border-bottom:1px solid var(--line)}
.list .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem 1rem;padding:.75rem .2rem;text-decoration:none;color:var(--ink)}
.list a.row:hover{background:var(--accent-soft)}
.list .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.list .s{min-width:0;overflow-wrap:anywhere}
.list .s{grid-column:1;font:.9rem/1.45 var(--f-sans);color:var(--muted)}
.list .r{grid-row:1/3;grid-column:2;align-self:center;font-size:.95rem}
.sess{display:block;text-decoration:none;color:var(--ink);padding:1rem 1.2rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin:.8rem 0}
.sess:hover{border-color:var(--accent)}
.sess h3{font-size:1.2rem;margin:.1rem 0 .3rem}
.sess p{margin:.2rem 0;font:.95rem/1.5 var(--f-sans);color:var(--muted)}
.filter{width:100%;max-width:26rem;font:inherit;font-family:var(--f-sans);padding:.5rem .75rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);margin:.4rem 0 .8rem}
.row-tools{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;max-width:none!important}
.row-tools select{font:inherit;font-family:var(--f-sans);padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.tablewrap{overflow-x:auto;max-width:none!important}
table{border-collapse:collapse;width:100%;font:.95rem/1.45 var(--f-sans)}
th{font:500 .7rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:.5rem .7rem;border-bottom:1.5px solid var(--ink)}
td{padding:.55rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
td.fa{font-size:1.02rem;text-align:right;min-width:9rem}
td .small{color:var(--muted);font-size:.82rem}
tr[hidden]{display:none}

/* Ebenen */
.group{font:500 .72rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:1.8rem 0 .2rem;display:flex;gap:.6rem;align-items:center}
.group::after{content:"";flex:1;border-top:1px solid var(--line)}
.lvl{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:0 .9rem;padding:1rem 0;border-top:1px solid var(--line)}
.lvl .n{font:500 1.5rem var(--f-mono);color:var(--stamp);line-height:1.2}
.lvl .fa{font-size:.95rem;color:var(--muted);margin-left:.4rem}
ul.plain{padding-left:1.1rem;margin:.5rem 0}
ul.plain li{margin:.35rem 0}

/* Text mit Vokabelhilfe */
.textcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.2rem 1.4rem;margin:1rem 0}
.textcard .sec{font:500 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);margin:1.2rem 0 .1rem}
.textcard .sec:first-child{margin-top:0}
.textcard p.k{font-size:1.1rem;line-height:1.85;margin:.2rem 0 .6rem}
.v{background:var(--accent-soft);border-bottom:1.5px dotted var(--accent);cursor:pointer;border-radius:2px;padding:0 .08em}
.nohelp .v{background:none;border-bottom:none;cursor:text}
.gloss{position:sticky;bottom:env(safe-area-inset-bottom,0px);margin-top:1rem;padding:.6rem .9rem;background:var(--surface);border:1px solid var(--accent);border-radius:6px;font:.95rem/1.5 var(--f-sans);display:flex;gap:.8rem;align-items:baseline;flex-wrap:wrap;max-width:none!important}
.gloss .fa{font-size:1.05rem}
.toggle{display:inline-flex;gap:.5rem;align-items:center;font:.9rem var(--f-sans);color:var(--muted);cursor:pointer}

mark.hl{background:var(--hl);color:inherit;border-radius:2px}
.snip{font:.92rem/1.5 var(--f-sans);color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:6px;padding:1.2rem 1.4rem;margin:1rem 0;font-family:var(--f-sans)}
.empty pre{font:.85rem/1.6 var(--f-mono);background:var(--quote);padding:.7rem .9rem;border-radius:5px;overflow-x:auto;margin:.7rem 0 0;white-space:pre-wrap}
.back{font:.88rem var(--f-sans);display:inline-block;margin-bottom:.8rem}
footer.f{font:.8rem/1.5 var(--f-sans);color:var(--muted);margin-top:3rem;border-top:1px solid var(--line);padding-top:1rem;max-width:46rem}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:1rem;padding-block:1rem 3rem}
  #menu{display:inline-block}
  nav#nav{display:none;position:static;max-height:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.9rem 1rem}
  body.nav-open nav#nav{display:block}
  .az{display:none}
  main h1{font-size:1.65rem}
  .lvl{grid-template-columns:1.8rem minmax(0,1fr);gap:0 .6rem}
}
@media (prefers-reduced-motion:no-preference){ .sess,nav a,.list a.row{transition:background .15s,border-color .15s} }
</style>

m Semantics and Pragmatics", "autor": "Emily M. Bender, Alex Lascarides", "umfang": "270 Seiten", "art": "Buch"}, {"titel": "Speech and Language Processing, 2nd Edition", "autor": "Daniel Jurafsky, James H. Martin", "umfang": "1038 Seiten", "art": "Buch"}, {"titel": "Hausaufgabe 1: Rechtschreibkorrektur (Algorithmen)", "autor": "eigene Hausaufgabe", "umfang": "2 Seiten", "art": "Eigene Arbeit"}], "semester": "2026-ws"}, {"id": "litmehr", "name": "Literatur und Mehrsprachigkeit", "beschreibung": "Seminar zu literarischer Mehrsprachigkeit. Noch keine Sitzungen angelegt.", "lektuere": [{"titel": "Literatur und Mehrsprachigkeit. Ein Handbuch", "autor": "Till Dembeck, Rolf Parr (Hrsg.)", "umfang": "383 Seiten", "art": "Handbuch"}], "semester": "2026-ws"}], "sitzungen": [{"id": "erz-s1", "nr": 1, "titel": "Vor dem Gesetz", "autor": "Franz Kafka", "thema": "Das Erzählen und das Erzählte", "begriffe": ["erzaehlen-erzaehltes", "erzaehlte-welt", "handlung", "darstellung", "fiktionale-behauptungssaetze", "fabula-sjuzet", "histoire-discours", "genette", "ereignis", "geschehen", "geschichte", "handlungsschema", "erzaehlung", "erzaehlen", "erzaehltempo"], "ueberblick": {"kurzinhalt": "Ein Mann vom Lande will in das Gesetz. Der Türhüter sagt, jetzt könne er ihn nicht einlassen. Der Mann wartet Tage und Jahre vor dem offenen Tor, besticht den Türhüter und stellt ihm kurz vor seinem Tod eine letzte Frage: Warum hat in all den Jahren niemand außer ihm Einlass verlangt? Der Türhüter antwortet, dieser Eingang sei nur für ihn bestimmt gewesen, und schließt ihn.", "leitfrage": "Wie unterscheiden wir das Erzählte (das „Was“) vom Erzählen (dem „Wie“)? Und warum ist diese Unterscheidung auch bei fiktionalen Texten sinnvoll?", "merksatz": "[[erzaehlen-erzaehltes|Das Erzählte]] umfasst die Ebenen 1–4 ([[ereignis|Ereignis]], [[geschehen|Geschehen]], [[geschichte|Geschichte]], [[handlungsschema|Handlungsschema]]). [[erzaehlen-erzaehltes|Das Erzählen]] umfasst die Ebenen 5–6 ([[erzaehlung|Erzählung]], [[erzaehlen|Erzählen]]).", "fa": ["مردی روستایی می‌خواهد وارد «قانون» شود، اما دربان اجازه نمی‌دهد. مرد سال‌ها منتظر می‌ماند و در پایان می‌فهمد که این در فقط برای او بوده است.", "در کتاب مارتینز/شفل (ص ۲۲–۲۸) یاد می‌گیریم که هر روایت دو لایه دارد: «آنچه روایت می‌شود» (das Erzählte) و «شیوه‌ی روایت‌کردن» (das Erzählen).", "همین داستان را می‌شود به شیوه‌های بی‌شمار بازگفت، بی‌آنکه داستان عوض شود."]}, "text": {"quelle": "Franz Kafka: Vor dem Gesetz. In: Drucke zu Lebzeiten. Kritische Ausgabe, hg. von Wolf Kittler, Hans-Gerd Koch und Gerhard Neumann. S. Fischer 1994, S. 267–269.", "hinweis": "Rechtschreibung und Wortlaut folgen der Ausgabe („daß“, „Einlaß“, „sehn“). Die Einteilung in drei Abschnitte stammt aus dem Wiki, im Original ist es ein durchgehender Text.", "teile": [{"titel": "Abschnitt 1 · Am Tor", "t": "Vor dem Gesetz steht ein Türhüter. Zu diesem Türhüter kommt ein Mann vom Lande und bittet um Eintritt in das Gesetz. Aber der Türhüter sagt, daß er ihm jetzt den Eintritt nicht gewähren könne. Der Mann überlegt und fragt dann, ob er also später werde eintreten dürfen. „Es ist möglich“, sagt der Türhüter, „jetzt aber nicht.“ Da das Tor zum Gesetz offensteht wie immer und der Türhüter beiseite tritt, bückt sich der Mann, um durch das Tor in das Innere zu sehn. Als der Türhüter das merkt, lacht er und sagt: „Wenn es dich so lockt, versuche es doch, trotz meines Verbotes hineinzugehn. Merke aber: Ich bin mächtig. Und ich bin nur der unterste Türhüter. Von Saal zu Saal stehn aber Türhüter, einer mächtiger als der andere. Schon den Anblick des dritten kann nicht einmal ich mehr ertragen.“ Solche Schwierigkeiten hat der Mann vom Lande nicht erwartet; das Gesetz soll doch jedem und immer zugänglich sein, denkt er, aber als er jetzt den Türhüter in seinem Pelzmantel genauer ansieht, seine große Spitznase, den langen, dünnen, schwarzen tatarischen Bart, entschließt er sich, doch lieber zu warten, bis er die Erlaubnis zum Eintritt bekommt."}, {"titel": "Abschnitt 2 · Die Jahre des Wartens", "t": "Der Türhüter gibt ihm einen Schemel und läßt ihn seitwärts von der Tür sich niedersetzen. Dort sitzt er Tage und Jahre. Er macht viele Versuche, eingelassen zu werden, und ermüdet den Türhüter durch seine Bitten. Der Türhüter stellt öfters kleine Verhöre mit ihm an, fragt ihn über seine Heimat aus und nach vielem andern, es sind aber teilnahmslose Fragen, wie sie große Herren stellen, und zum Schlüsse sagt er ihm immer wieder, daß er ihn noch nicht einlassen könne. Der Mann, der sich für seine Reise mit vielem ausgerüstet hat, verwendet alles, und sei es noch so wertvoll, um den Türhüter zu bestechen. Dieser nimmt zwar alles an, aber sagt dabei: „Ich nehme es nur an, damit du nicht glaubst, etwas versäumt zu haben.“ Während der vielen Jahre beobachtet der Mann den Türhüter fast ununterbrochen. Er vergißt die andern Türhüter und dieser erste scheint ihm das einzige Hindernis für den Eintritt in das Gesetz. Er verflucht den unglücklichen Zufall, in den ersten Jahren rücksichtslos und laut, später, als er alt wird, brummt er nur noch vor sich hin. Er wird kindisch, und, da er in dem jahrelangen Studium des Türhüters auch die Flöhe in seinem Pelzkragen erkannt hat, bittet er auch die Flöhe, ihm zu helfen und den Türhüter umzustimmen."}, {"titel": "Abschnitt 3 · Das Ende", "t": "Schließlich wird sein Augenlicht schwach, und er weiß nicht, ob es um ihn wirklich dunkler wird, oder ob ihn nur seine Augen täuschen. Wohl aber erkennt er jetzt im Dunkel einen Glanz, der unverlöschlich aus der Türe des Gesetzes bricht. Nun lebt er nicht mehr lange. Vor seinem Tode sammeln sich in seinem Kopfe alle Erfahrungen der ganzen Zeit zu einer Frage, die er bisher an den Türhüter noch nicht gestellt hat. Er winkt ihm zu, da er seinen erstarrenden Körper nicht mehr aufrichten kann. Der Türhüter muß sich tief zu ihm hinunterneigen, denn der Größenunterschied hat sich sehr zu ungunsten des Mannes verändert. „Was willst du denn jetzt noch wissen?“ fragt der Türhüter, „du bist unersättlich.“ „Alle streben doch nach dem Gesetz“, sagt der Mann, „wieso kommt es, daß in den vielen Jahren niemand außer mir Einlaß verlangt hat?“ Der Türhüter erkennt, daß der Mann schon an seinem Ende ist, und, um sein vergehendes Gehör noch zu erreichen, brüllt er ihn an: „Hier konnte niemand sonst Einlaß erhalten, denn dieser Eingang war nur für dich bestimmt. Ich gehe jetzt und schließe ihn.“"}]}, "buch": {"einleitung": "Die Seiten 22–28 stehen im Kapitel „I. Merkmale fiktionalen Erzählens“, Abschnitt 2: Das Erzählen und das Erzählte. Jede Karte gibt einen Gedanken des Buches wieder, belegt ihn mit einem Zitat und wendet ihn auf Kafka an.", "karten": [{"seite": "S. 22", "titel": "Zwei Lesehaltungen: auf das „Was“ achten", "text": "Beim Lesen achten wir meistens auf den Inhalt. Wie der Text etwas erzählt, rückt in den Hintergrund.", "zitate": [{"t": "Wenn und solange wir eine solche Lesehaltung einnehmen, konzentrieren wir uns auf das, was uns erzählt wird, und blenden die Art und Weise, wie die Geschichte vermittelt wird, aus dem Bereich unserer Aufmerksamkeit aus.", "s": "S. 22"}], "kafka": "Wir fragen zuerst: Warum lässt der Türhüter den Mann nicht ein? Dass der Text im Präsens steht und aus knappen Sätzen besteht, bemerken wir erst, wenn wir auf das „Wie“ achten."}, {"seite": "S. 22–23", "titel": "Ist die Trennung bei Fiktion sinnvoll?", "text": "Bei einem Bericht können wir Ereignisse mit anderen Quellen vergleichen. Bei fiktionalen Texten kennen wir die Welt nur durch den Text. Das Buch zeigt das an Goethes „Werther“: Über den wirklichen Carl Wilhelm Jerusalem gibt es Berichte und Urkunden, über Werther nur den Roman.", "zitate": [{"t": "Aber ist denn im Falle fiktionaler Texte eine solche Unterscheidung zwischen dem Inhalt und seiner Darstellung sinnvoll?", "s": "S. 22"}], "kafka": "Was hinter dem Tor liegt, steht nirgends außerhalb des Textes. Wir wissen nur, was der Text uns mitteilt."}, {"seite": "S. 23", "titel": "Dieselbe Geschichte, viele Darstellungen", "text": "Das Buch antwortet: Man muss beides trennen, weil man dieselbe Geschichte auf viele Weisen erzählen kann. Beispiel ist Kafkas Roman „Das Schloß“. In der ersten Fassung erzählt ein „ich“, in der zweiten ein Erzähler über „K.“. Die Information über die erzählte Welt bleibt gleich.", "zitate": [{"t": "… dass die erzählte Geschichte und ihre Welt von der Art und Weise ihrer Darstellung zu unterscheiden sind.", "s": "S. 23"}, {"t": "Es wird uns mitgeteilt, dass es spät abends war, als der Protagonist ankam.", "s": "S. 23"}, {"t": "Eine Geschichte, die wir als dieselbe Geschichte wiedererkennen, kann auf unzählige verschiedene Weisen präsentiert werden.", "s": "S. 23"}], "kafka": "„Vor dem Gesetz“ könnte der Mann in der Ich-Form erzählen oder der Türhüter aus seiner Sicht. Die Geschichte bliebe erkennbar dieselbe (Beispiel in der Analyse)."}, {"seite": "S. 23–24", "titel": "Illusion und Distanz beim Lesen", "text": "Das Buch stellt Theorien vor: Boileau (der Leser muss das Erzählte vorübergehend für real halten), Aristoteles (wir haben Freude an der Nachahmung), Ingarden und Iser (wir schweben zwischen Illusion und dem Wissen, dass es Fiktion ist). Eine abschließende Antwort gibt es nicht.", "zitate": [{"t": "Eine befriedigende Antwort auf die Frage nach der psychischen Distanz des Lesers zu fiktiven Welten hat die Literaturwissenschaft bislang nicht gegeben.", "s": "S. 24"}], "kafka": "Wir wissen, dass „Vor dem Gesetz“ ein Gleichnis ist, und leiden trotzdem mit dem Mann. Das ist ein Beispiel für dieses Schweben (eigenes Beispiel, nicht aus dem Buch)."}, {"seite": "S. 24", "titel": "Fiktionale Behauptungssätze", "text": "Auch in fiktionalen Texten gibt es Tatsachen, aber sie gelten in der erzählten Welt. Ob der Leser sie für wirklich hält, spielt dafür keine Rolle.", "zitate": [{"t": "Fiktionale Behauptungssätze enthalten eine Referenz auf Tatsachen der durch sie erzählten Welt, unabhängig davon, ob der Leser diese zeitweise für Gegebenheiten seiner objektiven Wirklichkeit nimmt oder nicht.", "s": "S. 24"}], "kafka": "In der erzählten Welt gilt als Tatsache: <span class=\"kq\">„Da das Tor zum Gesetz offensteht wie immer“<\/span>. Deshalb kann der Türhüter sagen: <span class=\"kq\">„versuche es doch, trotz meines Verbotes hineinzugehn“<\/span>."}, {"seite": "S. 25", "titel": "fabula/sjužet und histoire/discours", "text": "Der russische Formalismus nennt die Reihe der Ereignisse fabula und ihre Anordnung im Werk sjužet. Todorov übernimmt das als [[histoire-discours|histoire und discours]]. Sein discours ist weiter gefasst als das sjužet.", "zitate": [{"t": "die Gesamtheit der Motive in ihrer logischen, kausal-temporalen Verknüpfung", "s": "S. 25", "q": "Tomaševskij über die fabula, zitiert bei Martínez/Scheffel"}, {"t": "die Gesamtheit derselben Motive in derjenigen Reihenfolge und Verknüpfung, in der sie im Werk vorliegen", "s": "S. 25", "q": "Tomaševskij über das sjužet, zitiert bei Martínez/Scheffel"}, {"t": "Dieselbe Geschichte hätte uns auch auf andere Weise vermittelt werden können, beispielsweise durch einen Film", "s": "S. 25", "q": "Todorov über die histoire, zitiert bei Martínez/Scheffel"}], "kafka": "Die Reihenfolge ist chronologisch, fabula und sjužet liegen also nah beieinander. Der Unterschied zeigt sich bei Perspektive und Tempo, und die gehören zu Todorovs weiterem discours-Begriff."}, {"seite": "S. 26", "titel": "Erzählte Welt, Handlung, Darstellung und Genettes Dreiteilung", "text": "Das Buch trennt die [[erzaehlte-welt|erzählte Welt]] (alles, was in der Geschichte existiert) von der engeren [[handlung|Handlung]]. Genette teilt in [[genette|Geschichte, Erzählung und Narration]]. Martínez/Scheffel übernehmen die Idee, teilen aber die Seite des „Wie“ in zwei Ebenen.", "zitate": [{"t": "Die andere Seite der Opposition, also die Art und Weise der Vermittlung der erzählten Welt, bezeichnen wir als Darstellung.", "s": "S. 26"}, {"t": "das Signifikat oder den narrativen Inhalt", "s": "S. 26", "q": "Genette über die Geschichte, zitiert bei Martínez/Scheffel"}], "kafka": "Zur erzählten Welt gehören auch die weiteren Türhüter: <span class=\"kq\">„Von Saal zu Saal stehn aber Türhüter, einer mächtiger als der andere.“<\/span> Sie greifen nie in die Handlung ein."}, {"seite": "S. 27–28", "titel": "Sechs Ebenen und die Tabelle der Begriffe", "text": "Weil die Fachbegriffe nicht einheitlich sind, schlagen die Autoren sechs Ebenen vor (siehe Analyse). Die Tabelle auf S. 28 vergleicht, wie 19 Autorinnen und Autoren ihre Begriffe auf diese Ebenen verteilen, zum Beispiel Forster, Genette, Todorov und Tomaševskij.", "zitate": [{"t": "Wie unsere theoriegeschichtlichen Hinweise bereits zeigen, ist die literaturwissenschaftliche Terminologie in diesem Zusammenhang nicht einheitlich.", "s": "S. 27"}], "kafka": "Die Ebenen 1–6 an „Vor dem Gesetz“ durchgespielt: siehe Reiter „Analyse“."}]}, "analyse": {"einleitung": "Die sechs Ebenen aus [[erzaehlen-erzaehltes|Martínez/Scheffel]] (S. 27–28), auf „Vor dem Gesetz“ angewendet. Ebene 1–4 gehören zur Handlung (das Erzählte), Ebene 5–6 zur Darstellung (das Erzählen).", "ebenen": [{"n": 1, "gruppe": "Das Erzählte: Handlung", "titel": "[[ereignis|Ereignis (Motiv)]]", "fa": "رویداد", "zitate": [{"t": "Die elementare Einheit eines narrativen Textes im Bereich der Handlung ist das Ereignis oder Motiv.", "s": "S. 27"}], "kafka": "Ein Ereignis ist zum Beispiel <span class=\"kq\">„Der Türhüter gibt ihm einen Schemel“<\/span> oder <span class=\"kq\">„bückt sich der Mann, um durch das Tor in das Innere zu sehn“<\/span>."}, {"n": 2, "gruppe": "Das Erzählte: Handlung", "titel": "[[geschehen|Geschehen]]", "fa": "رخدادها به ترتیب زمانی", "zitate": [{"t": "Auf einer ersten Integrationsstufe erscheinen Ereignisse zu einem Geschehen aneinandergereiht, indem sie chronologisch aufeinander folgen.", "s": "S. 27"}], "kafka": "Der Mann kommt, bittet um Eintritt, setzt sich, wartet Jahre, stellt seine Frage, stirbt. Hier gibt es nur „und dann“, noch kein „weil“."}, {"n": 3, "gruppe": "Das Erzählte: Handlung", "titel": "[[geschichte|Geschichte]]", "fa": "داستان با رابطه‌ی علّی", "zitate": [{"t": "… wenn die Ereignisfolge zusätzlich zum chronologischen auch einen kausalen Zusammenhang aufweist, so dass die Ereignisse nicht nur aufeinander, sondern auch auseinander folgen.", "s": "S. 27"}], "kafka": "Der Text nennt einen Grund: Der Mann sieht den Türhüter genauer an, <span class=\"kq\">„entschließt er sich, doch lieber zu warten“<\/span>. Weil er wartet, wird er alt und stirbt, ohne eingetreten zu sein. So werden die Ereignisse zu einer Geschichte."}, {"n": 4, "gruppe": "Das Erzählte: Handlung", "titel": "[[handlungsschema|Handlungsschema]]", "fa": "الگوی کلیِ کنش", "zitate": [{"t": "Durch die Integration in ein Handlungsschema erhält die Geschichte eine abgeschlossene (Anfang, Mitte, Ende) und sinnhafte (z. B. archetypische) Struktur.", "s": "S. 27"}], "kafka": "Mögliches Schema: Ein Suchender kommt an eine Schwelle, wartet und scheitert. Anfang ist die Ankunft vor dem Tor, Mitte die Jahre des Wartens, Ende der Tod und das Schließen des Eingangs. Das ist eine Deutung, die Einordnung als Gleichnis steht nicht im Buch."}, {"n": 5, "gruppe": "Das Erzählen: Darstellung", "titel": "[[erzaehlung|Erzählung]]", "fa": "ترتیب و زمان‌بندی ارائه", "zitate": [{"t": "Die erzählten Ereignisse in der Reihenfolge ihrer Darstellung im Text.", "s": "S. 27"}, {"t": "(Erzähltempo, Rückwendung, Vorausdeutung)", "s": "S. 27"}], "kafka": "Der Text beginnt ohne Einleitung: <span class=\"kq\">„Vor dem Gesetz steht ein Türhüter.“<\/span> Jahre werden in einem Satz zusammengefasst: <span class=\"kq\">„Dort sitzt er Tage und Jahre.“<\/span> Anfang und Ende dagegen sind als Gespräch ausgestaltet. Es gibt eine kleine Vorausdeutung: <span class=\"kq\">„Nun lebt er nicht mehr lange.“<\/span> Die Reihenfolge der Ereignisse ist chronologisch."}, {"n": 6, "gruppe": "Das Erzählen: Darstellung", "titel": "[[erzaehlen|Erzählen]]", "fa": "زبان، سبک و موقعیت روایی", "zitate": [{"t": "Die Präsentation der Geschichte und die Art und Weise dieser Präsentation in bestimmten Sprachen, Medien (z. B. rein sprachliche oder audio-visuelle) und Darstellungsverfahren (z. B. Erzählsituation oder Sprachstil).", "s": "S. 28"}], "kafka": "Ein Erzähler in der dritten Person, der nicht als Figur auftritt. Der Text steht im Präsens (eigene Beobachtung). Wir sehen in den Mann hinein: <span class=\"kq\">„denkt er“<\/span>, <span class=\"kq\">„er weiß nicht, ob es um ihn wirklich dunkler wird“<\/span>. Den Türhüter sehen wir von außen: <span class=\"kq\">„lacht er“<\/span>, <span class=\"kq\">„brüllt er ihn an“<\/span>. Genauere Begriffe dafür folgen im Kapitel „II. Das ‹Wie›: Darstellung“."}], "beobachtungen": [{"titel": "Erzählte Welt und Handlung", "text": "Handlungsrelevant ist das Aussehen des Türhüters, denn es bestimmt die Entscheidung des Mannes: <span class=\"kq\">„in seinem Pelzmantel genauer ansieht, seine große Spitznase, den langen, dünnen, schwarzen tatarischen Bart“<\/span>. Nur zur erzählten Welt gehören die weiteren Türhüter und Säle. Ob es sie gibt, erfahren wir ausschließlich aus der Rede des Türhüters."}, {"titel": "Dieselbe Geschichte, andere Darstellung (Übung)", "text": "Original: <span class=\"kq\">„Zu diesem Türhüter kommt ein Mann vom Lande und bittet um Eintritt in das Gesetz.“<\/span> In der Ich-Form könnte es heißen: „Ich ging zu dem Türhüter und bat um Eintritt in das Gesetz.“ (eigenes Beispiel). Die [[geschichte|Geschichte]] bleibt dieselbe, die [[darstellung|Darstellung]] ändert sich: Perspektive, Nähe zum Mann und Ton sind anders."}, {"titel": "fabula und sjužet", "text": "Weil die Reihenfolge chronologisch ist, fallen [[fabula-sjuzet|fabula und sjužet]] fast zusammen. Interessanter ist Todorovs [[histoire-discours|discours]]: Er umfasst auch Perspektive und Stil."}], "fragen": ["Wo ist die Grenze zwischen [[geschehen|Geschehen]] und [[geschichte|Geschichte]]? Ist der Grund für das Warten im Text eindeutig angegeben?", "Was ändert sich, wenn der Türhüter erzählt oder wenn die Geschichte in der Ich-Form steht?", "Welche Teile der [[erzaehlte-welt|erzählten Welt]] sind nur behauptet und werden nie bestätigt?"]}, "seminar": "erz", "status": "entwurf", "lektuere": "Martínez/Scheffel, S. 22–28", "material": [{"datei": "Kafka_Franz-Vor_dem_Gesetz_Kritische_Ausgabe.pdf", "art": "Primärtext", "notiz": "Kritische Ausgabe, S. 267–269"}, {"datei": "Martinez_Scheffel_2019-Einführung_in_die_Erzähltheorie.pdf", "art": "Lektüre", "notiz": "gedruckte S. 22–28 (PDF-Seiten 23–29)"}], "zusatz": []}, {"id": "pruefen-s1", "nr": 1, "seminar": "pruefen", "titel": "Summative Evaluation", "autor": "Doris Moser-Frötscher", "lektuere": "Moser-Frötscher 2025, S. 83–88", "thema": "Summativ und formativ, EALTA-Leitfragen, high stakes und washback", "status": "entwurf", "ueberblick": {"kurzinhalt": "Der Text unterscheidet [[summative-evaluation|summative Evaluation]] (misst im Nachhinein, was erreicht wurde, und dient der Benotung) von [[formative-evaluation|formativer Evaluation]] (begleitet das Lernen und stimmt den Unterricht darauf ab). Er betont, dass diese Gegenüberstellung eine Vereinfachung ist. Dann stellt er externe summative Prüfungen im deutschsprachigen Raum vor und ordnet gute Prüfungspraxis anhand der [[ealta-leitfragen|EALTA-Leitfragen]]: Prüfungszweck und Spezifikation, Prüfungsverfahren und Konsequenzen. Bei den Konsequenzen geht es um [[high-low-stakes|low und high stakes]] und den [[washback|washback-Effekt]].", "leitfrage": "Worin unterscheiden sich summative und formative Evaluation, und warum ist die Gegenüberstellung laut Text eine Vereinfachung? Wie lassen sich high stakes und washback auf Prüfungen zum Hochschulzugang übertragen?", "merksatz": "Summativ misst im Nachhinein und bewertet, formativ begleitet und steuert das Lernen. Entscheidend ist der Zweck, für den Informationen genutzt werden, nicht das Instrument.", "fa": ["ارزیابی پایانی (summativ) چیزی را که یادگرفته شده در پایان یک دوره می‌سنجد و برای نمره‌دادن به کار می‌رود. ارزیابی تکوینی (formativ) در جریان یادگیری انجام می‌شود تا آموزش و بازخورد را تنظیم کند.", "متن می‌گوید این تقابل یک ساده‌سازی است: یک اطلاعات یکسان می‌تواند هم پایانی و هم تکوینی باشد، بسته به اینکه برای چه هدفی استفاده شود.", "هر چه پیامد یک آزمون سنگین‌تر باشد (high stakes)، کنترل کیفیت باید دقیق‌تر باشد. همچنین آزمون‌های مهم می‌توانند بر آموزش اثر بگذارند (washback)."]}, "inhalt": [{"titel": "1. Summativ und formativ", "quelle": "Moser-Frötscher 2025, S. 83", "html": "<ul class=\"plain\"><li><strong>Summativ:<\/strong> misst im Nachhinein, was erreicht wurde. Sie findet punktuell statt, bewertet Fortschritte und dient der Benotung. Sie ist formell und geplant und steht am Ende einer Einheit (von einer Woche bis zu einem Jahr).<\/li><li><strong>Formativ:<\/strong> prüft während der Lernphase den Fortschritt, um den folgenden Unterricht abzustimmen und Feedback zu geben.<\/li><li><strong>Neuere Bezeichnungen:<\/strong> Assessment of Learning (summativ) und Assessment for Learning (formativ).<\/li><\/ul><blockquote><p>„Die summative Evaluation misst im Nachhinein, was von Einzelpersonen oder auch Gruppen erreicht wurde“<\/p><cite>Moser-Frötscher 2025, S. 83<\/cite><\/blockquote>"}, {"titel": "2. Warum die Gegenüberstellung eine Vereinfachung ist", "quelle": "Moser-Frötscher 2025, S. 83", "html": "<blockquote><p>„Die kontrastive Unterscheidung zwischen summativer und formativer Evaluation stellt jedoch eine starke Vereinfachung dieser beiden Konstrukte sowie ihrer Beziehung zueinander dar“<\/p><cite>Moser-Frötscher 2025, S. 83<\/cite><\/blockquote><p>Der Text nennt mehrere Positionen:<\/p><ul class=\"plain\"><li><strong>Harlen (2005):<\/strong> Nur der Zweck macht den Unterschied. Dieselbe Information kann summativ oder formativ sein.<\/li><li><strong>Harsch (2012):<\/strong> Dieselben Instrumente können prinzipiell für beide Paradigmen verwendet werden.<\/li><li><strong>Bachman/Damböck (2017):<\/strong> Unterschied nach den Entscheidungen. Formative betreffen Unterrichten und Lernen, summative teilen Lernende in Gruppen (z. B. Versetzung).<\/li><li><strong>Learning-Oriented Assessment (Jones/Saville 2016):<\/strong> Beide Zugänge sind eng verwoben, das erfolgreiche Lernen steht im Fokus.<\/li><\/ul><blockquote><p>„Für Harlen (2005) macht einzig der Zweck den Unterschied aus: Dieselbe Information, die gesammelt wird, kann sowohl summativ als auch formativ sein“<\/p><cite>Moser-Frötscher 2025, S. 83<\/cite><\/blockquote>"}, {"titel": "3. Zwecke und Adressaten", "quelle": "Moser-Frötscher 2025, S. 83–84", "html": "<p>Summative Informationen dienen verschiedenen Zwecken (Harlen 2005):<\/p><ul class=\"plain\"><li>schulintern: Fortschritte festhalten, die nächste Lehrperson informieren<\/li><li>Adressaten: Eltern und Schüler:innen, häufig als Schulnoten<\/li><li>extern: Zertifizierung, Auswahl von Bewerber:innen für eine Anstellung oder ein Studium<\/li><li>Standardisierung und Bildungsmonitoring durch extern vorgegebene Prüfungen<\/li><\/ul>"}, {"titel": "4. Extern vorgegebene summative Prüfungen im deutschsprachigen Raum", "quelle": "Moser-Frötscher 2025, S. 84–85", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Art<\/th><th>Beispiele im Text<\/th><\/tr><\/thead><tbody><tr><td>Leistungsvergleich<\/td><td>PISA (OECD): Kompetenzen der 15-Jährigen. 2025 erstmals optionale Zusatzerhebung zur Fremdsprachenkompetenz.<\/td><\/tr><tr><td>Zentrale Kompetenzerhebungen<\/td><td>Deutschland: Bildungstrends und VERA (IQB). Österreich: iKMPLUS (IQS). Schweiz: ÜGK.<\/td><\/tr><tr><td>Abschlussprüfungen<\/td><td>Zentralabitur in mehreren Bundesländern mit gemeinsamem Aufgabenpool. Österreich: Standardisierte, kompetenzorientierte Reife- und Diplomprüfung, zentral entwickelt, dezentral beurteilt.<\/td><\/tr><tr><td>Sprachzertifikate<\/td><td>z. B. Cambridge, Trinity, Aptis for Teens, Oxford Test of English (Englisch), DELF/DALF (Französisch), DELE (Spanisch), PLIDA/CILS (Italienisch). Für Deutsch: DSD und ÖSD.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"titel": "5. EALTA-Leitfragen als Analyseraster", "quelle": "Moser-Frötscher 2025, S. 85–87", "html": "<p>Die Richtlinien der European Association for Language Testing and Assessment (EALTA 2006) bieten Leitfragen für gute Praxis. Der Text ordnet sie drei Bereichen zu. Voraussetzung ist Language Assessment Literacy bei den Lehrpersonen.<\/p><div class=\"tablewrap\"><table><thead><tr><th>Bereich<\/th><th>Worauf geachtet wird<\/th><\/tr><\/thead><tbody><tr><td><strong>1. Prüfungszweck und Spezifikation<\/strong> (S. 85–86)<\/td><td>Zweck der Prüfung und Bezug zum Lehrplan. Testspezifikationen (Art der Kompetenzen, Gewichtung, Aufgabenformate). Abdeckung des Lehrplans. Authentizität der Aufgaben. Transparenz gegenüber den Schüler:innen.<\/td><\/tr><tr><td><strong>2. Prüfungsverfahren<\/strong> (S. 86)<\/td><td>Reliabilität. Wer entwirft die Prüfung, wie angemessen ist sie für die Zielgruppe. Vertraute Aufgabentypen, passende Schwierigkeit, sensible Themen vermeiden. Genauigkeit und Fairness der Bewertung, Bewertungsraster, Schulungen. Jahresnote aus vielen Quellen. Bestehensgrenzen kriterienorientiert. Rechtliche Vorgaben beachten.<\/td><\/tr><tr><td><strong>3. Konsequenzen<\/strong> (S. 86–87)<\/td><td>Verwendung der Ergebnisse, Folgen für Schüler:innen und Schulen. low/high stakes. Qualitätssicherung und Begleitforschung. washback. Feedback als formative Funktion.<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Etwaige Bestehensgrenzen sollten nicht normativ, sondern kriterienorientiert (d. h. in Bezug zum Lehrplan) festgelegt werden“<\/p><cite>Moser-Frötscher 2025, S. 86<\/cite><\/blockquote>"}, {"titel": "6. high stakes und washback", "quelle": "Moser-Frötscher 2025, S. 86–87", "html": "<p>Prüfungen unterscheiden sich nach den Folgen der Entscheidung: <strong>low stakes<\/strong> (geringe Auswirkungen) und <strong>high stakes<\/strong> (weitreichende Auswirkungen bei Nichtbestehen, für Lernende wie für Schulen). Bei high stakes steigen die Anforderungen an Qualitätssicherung und Validierung.<\/p><blockquote><p>„Je weitreichender die Auswirkungen einer Prüfung sind, desto wichtiger ist eine rigorose Qualitätssicherung und umfassende Begleitforschung zur Validierung“<\/p><cite>Moser-Frötscher 2025, S. 87<\/cite><\/blockquote><p><strong>washback<\/strong>: Prüfungen wirken auf Unterricht und Lernen zurück.<\/p><blockquote><p>„indem sich Lehrende und Lernende auf jene Kenntnisse, Fertigkeiten oder Fähigkeiten konzentrieren, von denen sie glauben, dass sie in der Prüfung behandelt werden“<\/p><cite>Moser-Frötscher 2025, S. 87<\/cite><\/blockquote><p>Der washback kann negativ sein (wenn die Prüfung vom Lehrplan abweicht) oder positiv. Als positives Beispiel nennt der Text eine bisher wenig beachtete Fertigkeit wie Hören, die nach einer Prüfungsreform im Unterricht stärker gewichtet wird. Auch lokale summative Prüfungen wie Klassenarbeiten können vom washback einer externen Prüfung betroffen sein.<\/p><blockquote><p>„Genauso kann washback aber auch positiv ausfallen“<\/p><cite>Moser-Frötscher 2025, S. 87<\/cite><\/blockquote>"}, {"titel": "7. Übertragung auf Hochschulzugangsprüfungen (eigene Ableitung)", "quelle": "Eigene Übertragung auf Grundlage des Textes, nicht im Text enthalten", "html": "<p>Die Aufgabenstellung der Seminar-Textarbeit verlangt, die Leitfragen auf sprachliche Prüfungen zum Hochschulzugang zu übertragen. Ein Vorschlag für das Raster:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Bereich<\/th><th>Mögliche Leitfrage für Hochschulzugangsprüfungen<\/th><\/tr><\/thead><tbody><tr><td>Zweck und Spezifikation<\/td><td>Welche Zulassungsentscheidung stützt die Prüfung, und welche sprachlichen Kompetenzen für das Studium sind in den Testspezifikationen beschrieben und gewichtet?<\/td><\/tr><tr><td>Prüfungsverfahren<\/td><td>Wie werden Aufgaben entwickelt und Leistungen bewertet (Bewertungsraster, Schulung der Bewertenden), und wie wird die Fairness gegenüber verschiedenen Gruppen von Prüflingen sichergestellt?<\/td><\/tr><tr><td>Konsequenzen<\/td><td>Welche Folgen hat das Nichtbestehen (high stakes: Zugang zum Studium), welche Begleitforschung gibt es, und wie beeinflusst die Prüfung die Vorbereitungskurse (washback)?<\/td><\/tr><\/tbody><\/table><\/div>"}], "zusatz": [{"titel": "EALTA Guidelines for Good Practice in Language Testing and Assessment", "url": "https://ealta.eu/ealta-guidelines-for-good-practice-in-language-testing-and-assessment/", "typ": "Richtlinien", "quelle": "EALTA (European Association for Language Testing and Assessment)", "geprueft": true, "notiz": "Die Richtlinien, auf die sich der Text beruft (EALTA 2006). Die Seite war beim Abruf erreichbar und bietet sie als PDF in vielen Sprachen an. Sie richten sich an Lehrerausbildung, Unterrichtsbeurteilung und Testentwicklung."}], "material": [{"datei": "Moser-Frötscher 2025.pdf", "art": "Lektüre", "notiz": "3.2 Summative Evaluation, S. 83–88"}, {"datei": "2 Textarbeit summative Evaluation.docx", "art": "Aufgabenblatt", "notiz": "Textarbeit mit vier Aufgaben (Begriffe, Argumentation, Einordnung, Analyseraster), 30 Minuten"}, {"datei": "2_Textarbeit_summative_Evaluation_ausgefuellt.docx", "art": "Eigene Bearbeitung", "notiz": "Noch nicht in das Wiki übernommen"}], "begriffe": ["summative-evaluation", "formative-evaluation", "learning-oriented-assessment", "ealta-leitfragen", "testspezifikationen", "reliabilitaet", "high-low-stakes", "washback", "language-assessment-literacy"]}, {"id": "schreiben-s1", "nr": 1, "seminar": "schreiben", "titel": "Schreibkompetenz und GER-Skalen", "autor": "Krings 2016, Grotjahn 2017", "lektuere": "Krings 2016, S. 107; Grotjahn 2017, Anhang 1–7, S. 113–116", "thema": "Teilkompetenzen des fremdsprachlichen Schreibens und ihre Beschreibung im GER", "status": "entwurf", "ueberblick": {"kurzinhalt": "Krings gliedert die fremdsprachliche [[schreibkompetenz|Schreibkompetenz]] in fünf Teilkompetenzen: Schreibmotorik, Orthographie, fremdsprachliches Schriftsystem, das Verfassen von Texten nach gültigen [[textkonventionen|Textkonventionen]] (die Kernkompetenz) und das [[schreibprozessmanagement|Schreibprozessmanagement]]. Grotjahn dokumentiert im Anhang sieben [[ger-skalen|GER-Skalen]] mit Niveaubeschreibungen von A1 bis C2.", "leitfrage": "Welche Teilkompetenzen umfasst fremdsprachliches Schreiben, und welche davon beschreiben die sieben GER-Skalen im Anhang?", "merksatz": "Schreiben ist mehr als Texte formulieren: Die Kernkompetenz ist das Verfassen von Texten nach Textkonventionen, die am häufigsten übersehene Teilkompetenz ist das Schreibprozessmanagement.", "fa": ["طبق کرینگس، توانایی نوشتن در زبان خارجی از پنج مهارت جزئی تشکیل می‌شود: حرکت دست یا تایپ، املا، آشنایی با نظام خط زبان خارجی، نوشتن متن طبق قواعد متنی (مهارت اصلی) و مدیریت فرایند نوشتن.", "مدیریت فرایند نوشتن بیشتر از همه نادیده گرفته می‌شود. هر چه متن طولانی‌تر و دشوارتر باشد، این مهارت مهم‌تر است.", "گروتیان در پیوست خود هفت مقیاس چارچوب مرجع اروپایی (GER) درباره‌ی نوشتن آورده است، از سطح A1 تا C2."]}, "inhalt": [{"titel": "1. Fünf Teilkompetenzen des fremdsprachlichen Schreibens (Krings)", "quelle": "Krings 2016, S. 107", "html": "<div class=\"tablewrap\"><table><thead><tr><th>#<\/th><th>Teilkompetenz<\/th><th>Inhalt laut Text<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Schreibmotorik<\/td><td>Handschriftliches oder elektronisches Schreibprodukt. Die elementare Handschrift wird in der Grundschule erworben. Die Beherrschung des Tastaturschreibens beeinflusst jede Textproduktion an PC, Tablet oder Smartphone.<\/td><\/tr><tr><td>2<\/td><td>Orthographie<\/td><td>Besonders wichtig in Sprachen ohne einheitliche Phonem-Graphem-Zuordnung, z. B. Englisch und Französisch.<\/td><\/tr><tr><td>3<\/td><td>Fremdsprachliches Schriftsystem<\/td><td>Der Lernaufwand hängt davon ab, ob es eine Alphabetschrift (zwei bis drei Dutzend Zeichen) oder eine logographische Schrift wie Chinesisch (mehrere tausend Zeichen) ist.<\/td><\/tr><tr><td>4<\/td><td>Texte nach Textkonventionen verfassen<\/td><td>Die Kernkompetenz. Dazu gehören Textsortenkonventionen, die von Sprache zu Sprache differieren können, und die Beherrschung der Schriftsprache im Unterschied zur Umgangssprache.<\/td><\/tr><tr><td>5<\/td><td>Schreibprozessmanagement<\/td><td>Planen und Steuern der komplexen mentalen Teilprozesse der Textproduktion.<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Dies ist zweifellos die Kernkompetenz des Schreibens.“<\/p><cite>Krings 2016, S. 107<\/cite><\/blockquote><blockquote><p>„die am häufigsten übersehene Teilkompetenz des Schreibens“<\/p><cite>Krings 2016, S. 107<\/cite><\/blockquote><blockquote><p>„Je umfangreicher und anspruchsvoller der hervorzubringende Text gemessen an den Schreiberfahrungen des Textproduzenten ist, desto größer ist die Bedeutung dieser Teilkompetenz.“<\/p><cite>Krings 2016, S. 107<\/cite><\/blockquote>"}, {"titel": "2. Die sieben GER-Skalen im Anhang (Grotjahn)", "quelle": "Grotjahn 2017, Anhang 1–7, S. 113–116", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Anhang<\/th><th>Skala<\/th><th>Seite<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Schriftliche Produktion allgemein<\/td><td>113<\/td><\/tr><tr><td>2<\/td><td>Schriftliche Interaktion allgemein<\/td><td>113<\/td><\/tr><tr><td>3<\/td><td>Spektrum sprachlicher Mittel (allgemein)<\/td><td>114<\/td><\/tr><tr><td>4<\/td><td>Wortschatzbeherrschung<\/td><td>115<\/td><\/tr><tr><td>5<\/td><td>Grammatische Korrektheit<\/td><td>115<\/td><\/tr><tr><td>6<\/td><td>Beherrschung der Orthographie<\/td><td>116<\/td><\/tr><tr><td>7<\/td><td>Kohärenz und Kohäsion<\/td><td>116<\/td><\/tr><\/tbody><\/table><\/div><p>Alle Skalen stammen aus dem Gemeinsamen europäischen Referenzrahmen (Europarat 2001) und sind in sechs Niveaus von A1 bis C2 gegliedert. Bei Wortschatz heißt es für A1: „keine Deskriptoren verfügbar“.<\/p>"}, {"titel": "3. Beispiel: Skala „Schriftliche Produktion allgemein“", "quelle": "Grotjahn 2017, Anhang 1, S. 113 (zitiert nach Europarat 2001, S. 67)", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Niveau<\/th><th>Kann …<\/th><\/tr><\/thead><tbody><tr><td><strong>C2<\/strong><\/td><td>Kann klare, flüssige, komplexe Texte in angemessenen und effektiven Stil schreiben, deren logische Struktur den Lesern das Auffinden der wesentlichen Punkte erleichtert.<\/td><\/tr><tr><td><strong>C1<\/strong><\/td><td>Kann klare, gut strukturierte Texte zu komplexen Themen verfassen und dabei die entscheidenden Punkte hervorheben…<\/td><\/tr><tr><td><strong>B2<\/strong><\/td><td>Kann klare, detaillierte Texte zu verschiedenen Themen aus seinem / ihrem Interessengebiet verfassen und dabei Informationen und Argumente aus verschiedenen Quellen zusammenführen und gegeneinander abwägen.<\/td><\/tr><tr><td><strong>B1<\/strong><\/td><td>Kann unkomplizierte, zusammenhängende Texte zu mehreren vertrauten Themen aus seinem / ihrem Interessengebiet verfassen, wobei einzelne kürzere Teile in linearer Abfolge verbunden werden.<\/td><\/tr><tr><td><strong>A2<\/strong><\/td><td>Kann eine Reihe einfacher Wendungen und Sätze schreiben und mit Konnektoren wie und, aber oder weil verbinden.<\/td><\/tr><tr><td><strong>A1<\/strong><\/td><td>Kann einfache, isolierte Wendungen und Sätze schreiben.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"meta\">Die Beschreibung für C1 ist hier gekürzt.<\/p>"}, {"titel": "4. Teilkompetenzen und Skalen im Vergleich (eigene Zuordnung)", "quelle": "Eigene Zuordnung, nicht in den Texten enthalten", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Teilkompetenz (Krings)<\/th><th>Passende GER-Skala im Anhang<\/th><\/tr><\/thead><tbody><tr><td>2. Orthographie<\/td><td>Anhang 6: Beherrschung der Orthographie<\/td><\/tr><tr><td>4. Texte nach Textkonventionen verfassen<\/td><td>Anhang 1: Schriftliche Produktion allgemein. Anhang 7: Kohärenz und Kohäsion. Außerdem Anhang 3–5 (sprachliche Mittel, Wortschatz, Grammatik) für die sprachliche Seite.<\/td><\/tr><tr><td>1. Schreibmotorik, 3. Schriftsystem, 5. Schreibprozessmanagement<\/td><td>In den sieben Skalen des Auszugs nicht vertreten<\/td><\/tr><\/tbody><\/table><\/div><p>Das wäre ein Ansatzpunkt für die Diskussion, welche Teilkompetenzen Skalen überhaupt erfassen können.<\/p>"}], "zusatz": [{"titel": "Council of Europe: CEFR Companion Volume with new descriptors", "url": "https://www.coe.int/en/web/education/-/council-of-europe-launches-the-cefr-companion-volume-with-new-descriptors", "typ": "Offizielle Seite", "quelle": "Europarat (Council of Europe)", "geprueft": false, "notiz": "Die Skalen bei Grotjahn stammen aus dem GER von 2001. Der Begleitband ergänzt neue Deskriptoren, auch zum Schreiben. Die Seite wurde nur in Suchergebnissen gesehen, nicht geöffnet."}], "material": [{"datei": "Krings 2016_ Schreibkompetenz Definition aus Handbuch Fremdsprachenunterricht_.pdf", "art": "Lektüre", "notiz": "Kap. 23 Schreiben, S. 107 (1 Seite)"}, {"datei": "Grotjahn 2017_GER Skalen Schreiben.pdf", "art": "Lektüre", "notiz": "Anhang 1–7, S. 113–116 (4 Seiten)"}], "begriffe": ["schreibkompetenz", "schreibprozessmanagement", "textkonventionen", "ger-skalen", "kohaerenz-kohaesion"]}], "glossar": [{"id": "erzaehlen-erzaehltes", "term": "das Erzählte und das Erzählen", "fa": "آنچه روایت می‌شود و روایت‌کردن", "kurz": "Die Grundunterscheidung: Was wird erzählt, und wie?", "def": "Das Erzählte ist die Geschichte mit ihrer Welt. Das Erzählen ist die Art, wie sie vermittelt wird: Sprache, Stil, Reihenfolge, Perspektive. Man trennt beides, auch wenn man bei Fiktion nur über den Text Zugang zur Welt hat.", "zitate": [{"t": "Wenn und solange wir eine solche Lesehaltung einnehmen, konzentrieren wir uns auf das, was uns erzählt wird, und blenden die Art und Weise, wie die Geschichte vermittelt wird, aus dem Bereich unserer Aufmerksamkeit aus.", "s": "S. 22"}, {"t": "Eine Geschichte, die wir als dieselbe Geschichte wiedererkennen, kann auf unzählige verschiedene Weisen präsentiert werden.", "s": "S. 23"}], "kafka": "Erzählt wird: Ein Mann wartet vor einem Tor, bis er stirbt. Das Erzählen ist ein Erzähler in der dritten Person, im Präsens, mit knappen Sätzen.", "see": ["erzaehlte-welt", "darstellung", "handlung"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "erzaehlte-welt", "term": "die erzählte Welt (Diegese)", "fa": "جهان روایت‌شده", "kurz": "Alles, was in der Geschichte existiert, nicht nur das für die Handlung Wichtige.", "def": "Die erzählte Welt umfasst Figuren, Orte und die Regeln der Geschichte. Sie ist weiter gefasst als die Handlung. Der Begriff „Diegese“ kommt aus der Filmtheorie und wurde von Genette übernommen (Fußnote S. 26).", "zitate": [{"t": "… dem engeren Begriff der Handlung, der sich nur auf die Gesamtheit der handlungsfunktionalen Elemente der dargestellten Welt bezieht.", "s": "S. 26"}], "kafka": "Zur Welt gehören auch Dinge, die nie ins Geschehen eingreifen: <span class=\"kq\">„Von Saal zu Saal stehn aber Türhüter, einer mächtiger als der andere.“<\/span> Ob es diese Türhüter gibt, wissen wir nur durch die Worte des Türhüters.", "see": ["handlung", "erzaehlen-erzaehltes"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "handlung", "term": "die Handlung", "fa": "کنش (رویدادهای مهم برای داستان)", "kurz": "Nur die handlungsfunktionalen Elemente der erzählten Welt.", "def": "Zur Handlung zählt, was für den Verlauf des Geschehens wichtig ist. Das Buch gliedert sie in vier Ebenen: Ereignis, Geschehen, Geschichte, Handlungsschema.", "zitate": [{"t": "… dem engeren Begriff der Handlung, der sich nur auf die Gesamtheit der handlungsfunktionalen Elemente der dargestellten Welt bezieht.", "s": "S. 26"}], "kafka": "Handlungsfunktional ist der Anblick des Türhüters, denn der Mann entscheidet sich seinetwegen zu warten: <span class=\"kq\">„entschließt er sich, doch lieber zu warten“<\/span>.", "see": ["erzaehlte-welt", "ereignis", "geschehen", "geschichte", "handlungsschema"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "darstellung", "term": "die Darstellung", "fa": "شیوه‌ی ارائه", "kurz": "Die Seite des „Wie“: die Art der Vermittlung der erzählten Welt.", "def": "Das Buch teilt die Darstellung in zwei Ebenen: die Erzählung (Reihenfolge und Tempo der Ereignisse) und das Erzählen (Sprache, Medium, Erzählsituation, Stil).", "zitate": [{"t": "Die andere Seite der Opposition, also die Art und Weise der Vermittlung der erzählten Welt, bezeichnen wir als Darstellung.", "s": "S. 26"}], "kafka": "Darstellung bei Kafka: Zeitraffer, Präsens, ein Erzähler, der in den Mann hineinsieht, aber den Türhüter von außen zeigt.", "see": ["erzaehlung", "erzaehlen"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "fiktionale-behauptungssaetze", "term": "fiktionale Behauptungssätze", "fa": "جمله‌های ادعایی در متن داستانی", "kurz": "Sätze im Text beziehen sich auf Tatsachen der erzählten Welt.", "def": "In einem fiktionalen Text stellen Sätze etwas als Tatsache hin. Diese Tatsachen gelten in der erzählten Welt, unabhängig davon, ob der Leser sie für wirklich hält.", "zitate": [{"t": "Fiktionale Behauptungssätze enthalten eine Referenz auf Tatsachen der durch sie erzählten Welt, unabhängig davon, ob der Leser diese zeitweise für Gegebenheiten seiner objektiven Wirklichkeit nimmt oder nicht.", "s": "S. 24"}], "kafka": "In der erzählten Welt steht das Tor offen: <span class=\"kq\">„Da das Tor zum Gesetz offensteht wie immer“<\/span>. Das ist dort eine Tatsache, obwohl wir die Geschichte als Gleichnis lesen.", "see": ["erzaehlte-welt"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "fabula-sjuzet", "term": "fabula und sjužet (Tomaševskij)", "fa": "فابولا و سیوژت", "kurz": "Russischer Formalismus: Die Ereignisse selbst (fabula) und ihre Anordnung im Werk (sjužet).", "def": "Die fabula ordnet die Motive logisch und nach Ursache und Zeit. Das sjužet betrifft nur die Reihenfolge, in der die Motive im Werk stehen.", "zitate": [{"t": "die Gesamtheit der Motive in ihrer logischen, kausal-temporalen Verknüpfung", "s": "S. 25", "q": "Tomaševskij über die fabula, zitiert bei Martínez/Scheffel"}, {"t": "die Gesamtheit derselben Motive in derjenigen Reihenfolge und Verknüpfung, in der sie im Werk vorliegen", "s": "S. 25", "q": "Tomaševskij über das sjužet, zitiert bei Martínez/Scheffel"}], "kafka": "Die Reihenfolge ist chronologisch (kommen, bitten, warten, fragen, sterben). fabula und sjužet sind daher fast gleich.", "see": ["histoire-discours", "genette"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "histoire-discours", "term": "histoire und discours (Todorov, Benveniste)", "fa": "histoire: خودِ داستان · discours: شیوه‌ی روایتِ آن", "kurz": "Todorov: das Erzählte (histoire) und die Art, wie der Erzähler es uns vermittelt (discours).", "def": "Todorov übernimmt das Paar der Formalisten. Der discours ist weiter gefasst als das sjužet: Er umfasst auch Perspektive, Stil und Modus. Benveniste hatte ursprünglich einen sprachlichen Unterschied gemeint: Erzählformen ohne und mit deutlich hervortretender Sprecherinstanz (S. 25).", "zitate": [{"t": "Dieselbe Geschichte hätte uns auch auf andere Weise vermittelt werden können, beispielsweise durch einen Film", "s": "S. 25", "q": "Todorov über die histoire, zitiert bei Martínez/Scheffel"}, {"t": "… umfasst Todorovs ‹discours› stattdessen den gesamten Bereich der literarischen Vermittlung eines Geschehens (d. h. außer der Anordnung der Ereignisse auch Perspektive, Stil, Modus usw.)", "s": "S. 25"}], "kafka": "Als histoire könnte man „Vor dem Gesetz“ auch als Film erzählen. Zum discours gehört, dass wir die Ereignisse mit dem Mann zusammen erleben und seine Gedanken kennen.", "see": ["fabula-sjuzet", "genette", "darstellung"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "genette", "term": "Genettes Dreiteilung: Geschichte, Erzählung, Narration", "fa": "سه‌گانه‌ی ژنت", "kurz": "Gérard Genette unterscheidet histoire, récit und narration.", "def": "Die Geschichte (histoire) ist der narrative Inhalt. Die Erzählung (récit) ist der Text selbst. Die Narration ist der produzierende narrative Akt, also das Erzählen, auch in seiner (realen oder fiktiven) Situation. Martínez/Scheffel nehmen diese Idee als Anregung, die Seite der Darstellung weiter zu unterteilen.", "zitate": [{"t": "das Signifikat oder den narrativen Inhalt", "s": "S. 26", "q": "Genette über die Geschichte, zitiert bei Martínez/Scheffel"}, {"t": "den Signifikanten, die Aussage [‹énoncé›], den narrativen Text oder Diskurs", "s": "S. 26", "q": "Genette über die Erzählung, zitiert bei Martínez/Scheffel"}, {"t": "produzierenden narrativen Akt", "s": "S. 26", "q": "Genette über die Narration, zitiert bei Martínez/Scheffel"}], "kafka": "Geschichte: das Geschehen um Mann und Türhüter. Erzählung: der Text „Vor dem Gesetz“. Narration: das Erzählen selbst, etwa der Erzähler, der „sagt“ und „denkt er“ berichtet.", "see": ["histoire-discours", "erzaehlung", "erzaehlen"], "sitzungen": ["erz-s1"], "hinweis": "Das Wort „Erzählung“ steht bei Genette (récit, der Text) und bei Martínez/Scheffel (Ebene 5, die Reihenfolge der Ereignisse) in ähnlichen Positionen, wird aber nicht automatisch gleich verwendet. Die Tabelle auf S. 28 zeigt, wie unterschiedlich die Autoren ihre Wörter verteilen.", "seminare": ["erz"]}, {"id": "ereignis", "term": "das Ereignis (Motiv)", "fa": "رویداد (موتیف)", "kurz": "Ebene 1: die kleinste Einheit der Handlung.", "def": "Ein Ereignis oder Motiv ist die elementare Einheit eines narrativen Textes im Bereich der Handlung.", "zitate": [{"t": "Die elementare Einheit eines narrativen Textes im Bereich der Handlung ist das Ereignis oder Motiv.", "s": "S. 27"}], "kafka": "<span class=\"kq\">„Der Türhüter gibt ihm einen Schemel“<\/span> ist ein Ereignis, ebenso das Bestechen oder das Winken kurz vor dem Tod.", "see": ["geschehen", "handlung"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "geschehen", "term": "das Geschehen", "fa": "رخدادها (ردیفِ زمانی)", "kurz": "Ebene 2: Ereignisse, die nur zeitlich aufeinander folgen.", "def": "Ein Geschehen entsteht, wenn Ereignisse chronologisch aneinandergereiht werden. Es gibt noch keinen Grund-Folge-Zusammenhang.", "zitate": [{"t": "Auf einer ersten Integrationsstufe erscheinen Ereignisse zu einem Geschehen aneinandergereiht, indem sie chronologisch aufeinander folgen.", "s": "S. 27"}], "kafka": "Der Mann kommt, bittet, wartet, fragt, stirbt: ein „und dann“.", "see": ["ereignis", "geschichte"], "sitzungen": ["erz-s1"], "hinweis": "In der Tabelle auf S. 28 heißt bei Forster das Geschehen „story“ und die Geschichte „plot“. Gleiche Wörter können in anderen Theorien etwas anderes bedeuten.", "seminare": ["erz"]}, {"id": "geschichte", "term": "die Geschichte", "fa": "داستان (با رابطه‌ی علّی)", "kurz": "Ebene 3: Ereignisse mit kausalem Zusammenhang.", "def": "Zur Geschichte wird das Geschehen, wenn die Ereignisse nicht nur aufeinander, sondern auch auseinander folgen. Es gibt also ein „weil“.", "zitate": [{"t": "… wenn die Ereignisfolge zusätzlich zum chronologischen auch einen kausalen Zusammenhang aufweist, so dass die Ereignisse nicht nur aufeinander, sondern auch auseinander folgen.", "s": "S. 27"}], "kafka": "Weil der Mann den Türhüter genauer ansieht, <span class=\"kq\">„entschließt er sich, doch lieber zu warten“<\/span>. Weil er wartet, stirbt er vor dem Tor.", "see": ["geschehen", "handlungsschema"], "sitzungen": ["erz-s1"], "hinweis": "Nicht mit „Geschichte“ im Sinne von Genette (histoire) verwechseln: Dort ist der ganze narrative Inhalt gemeint. Bei Martínez/Scheffel ist es eine bestimmte Ebene der Handlung (Tabelle S. 28).", "seminare": ["erz"]}, {"id": "handlungsschema", "term": "das Handlungsschema", "fa": "الگوی کلیِ کنش", "kurz": "Ebene 4: ein abstraktes Muster, das für Textgruppen typisch sein kann.", "def": "Das Handlungsschema ist ein aus allen erzählten Ereignissen abstrahiertes globales Schema. Es kann für ganze Textgruppen wie Gattungen charakteristisch sein und gibt der Geschichte Anfang, Mitte, Ende und eine sinnhafte Struktur.", "zitate": [{"t": "Durch die Integration in ein Handlungsschema erhält die Geschichte eine abgeschlossene (Anfang, Mitte, Ende) und sinnhafte (z. B. archetypische) Struktur.", "s": "S. 27"}], "kafka": "Mögliches Schema: Ein Suchender kommt an eine Schwelle, wartet und scheitert (eigene Deutung).", "see": ["geschichte", "handlung"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "erzaehlung", "term": "die Erzählung (Ebene 5)", "fa": "روایت (ترتیب و زمان‌بندی)", "kurz": "Die Ereignisse in der Reihenfolge, in der der Text sie darstellt.", "def": "Die Erzählung unterscheidet sich von der chronologisch rekonstruierten Handlung durch die Gestaltung und zeitliche Umgruppierung der Ereignisse im Text, etwa durch Erzähltempo, Rückwendung und Vorausdeutung.", "zitate": [{"t": "Die erzählten Ereignisse in der Reihenfolge ihrer Darstellung im Text.", "s": "S. 27"}], "kafka": "Beginn ohne Einleitung, Jahre in einem Satz (<span class=\"kq\">„Dort sitzt er Tage und Jahre.“<\/span>), eine kleine Vorausdeutung (<span class=\"kq\">„Nun lebt er nicht mehr lange.“<\/span>).", "see": ["erzaehltempo", "erzaehlen", "genette"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "erzaehlen", "term": "das Erzählen (Ebene 6)", "fa": "روایت‌کردن (زبان، سبک، موقعیت)", "kurz": "Die Präsentation der Geschichte in Sprache, Medium und Darstellungsverfahren.", "def": "Zum Erzählen gehören die Sprache, das Medium (z. B. rein sprachlich oder audio-visuell) und Darstellungsverfahren wie Erzählsituation oder Sprachstil.", "zitate": [{"t": "Die Präsentation der Geschichte und die Art und Weise dieser Präsentation in bestimmten Sprachen, Medien (z. B. rein sprachliche oder audio-visuelle) und Darstellungsverfahren (z. B. Erzählsituation oder Sprachstil).", "s": "S. 28"}], "kafka": "Ein Erzähler in der dritten Person, Präsens (eigene Beobachtung), Einblick in die Gedanken des Mannes: <span class=\"kq\">„denkt er“<\/span>.", "see": ["erzaehlung", "darstellung"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "erzaehltempo", "term": "Erzähltempo, Rückwendung, Vorausdeutung", "fa": "سرعت روایت، بازگشت به گذشته، پیش‌نمایی", "kurz": "Drei Möglichkeiten, die Zeit im Text zu gestalten (genannt bei Ebene 5).", "def": "Das Buch nennt diese Begriffe auf S. 27 als Beispiele für die zeitliche Umgruppierung der Ereignisse. Kurz gesagt: das Tempo, mit dem erzählt wird, der Sprung zurück und der Hinweis auf Späteres. Ausführlich folgen sie im Kapitel zum „Wie“.", "zitate": [{"t": "(Erzähltempo, Rückwendung, Vorausdeutung)", "s": "S. 27"}], "kafka": "Tempo: viele Jahre in einem Satz (<span class=\"kq\">„Dort sitzt er Tage und Jahre.“<\/span>). Vorausdeutung: <span class=\"kq\">„Nun lebt er nicht mehr lange.“<\/span> Eine Rückwendung gibt es kaum.", "see": ["erzaehlung"], "sitzungen": ["erz-s1"], "hinweis": null, "seminare": ["erz"]}, {"id": "summative-evaluation", "term": "summative Evaluation", "fa": "ارزیابی پایانی (تراکمی)", "kurz": "Misst im Nachhinein, was erreicht wurde, und dient der Benotung.", "def": "Formelle, geplante Bewertung am Ende einer Unterrichtseinheit (Woche, Monat, Semester oder Jahr). Neuere Bezeichnung: Assessment of Learning.", "zitate": [{"t": "Die summative Evaluation misst im Nachhinein, was von Einzelpersonen oder auch Gruppen erreicht wurde", "s": "S. 83", "q": "Moser-Frötscher 2025"}], "beispiel": "Abitur, Sprachzertifikate und Klassenarbeiten sind summative Prüfungen.", "see": ["formative-evaluation", "high-low-stakes"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s1"], "hinweis": null}, {"id": "formative-evaluation", "term": "formative Evaluation", "fa": "ارزیابی تکوینی (در جریان آموزش)", "kurz": "Prüft den Fortschritt während des Lernens, um Unterricht und Feedback anzupassen.", "def": "Neuere Bezeichnung: Assessment for Learning. Ziel ist, den nachfolgenden Unterricht abzustimmen und den Schüler:innen Feedback zu geben.", "zitate": [{"t": "Die kontrastive Unterscheidung zwischen summativer und formativer Evaluation stellt jedoch eine starke Vereinfachung dieser beiden Konstrukte sowie ihrer Beziehung zueinander dar", "s": "S. 83", "q": "Moser-Frötscher 2025"}], "beispiel": "Nach Harlen kann dieselbe Information formativ oder summativ sein, je nach Zweck.", "see": ["summative-evaluation", "learning-oriented-assessment"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s1"], "hinweis": null}, {"id": "learning-oriented-assessment", "term": "Learning-Oriented Assessment", "fa": "سنجش یادگیری‌محور", "kurz": "Modell, in dem formative und summative Zugänge eng verwoben sind.", "def": "Nach Jones/Saville (2016) steht das erfolgreiche Sprachenlernen im Fokus jeglicher Prüfungsaktivitäten.", "zitate": [{"t": "Im Modell des lerner:innenorientierten Prüfens (Learning-Oriented Assessment, Jones/ Saville 2016) sind formative und summative Zugänge eng miteinander verwoben", "s": "S. 83", "q": "Moser-Frötscher 2025"}], "beispiel": "Der Text stellt es als Antwort auf die starre Gegenüberstellung summativ/formativ vor.", "see": ["formative-evaluation", "summative-evaluation"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s1"], "hinweis": null}, {"id": "ealta-leitfragen", "term": "EALTA-Leitfragen", "fa": "پرسش‌های راهنمای EALTA", "kurz": "Leitfragen für gute Prüfungspraxis in drei Bereichen.", "def": "Die Richtlinien der European Association for Language Testing and Assessment (EALTA 2006) betreffen (1) Prüfungszweck und Spezifikation, (2) Prüfungsverfahren und (3) Konsequenzen.", "zitate": [{"t": "Diese betreffen (1) Prüfungszweck und Spezifikation; (2) Prüfungsverfahren, und (3) Konsequenzen.", "s": "S. 85", "q": "Moser-Frötscher 2025"}], "beispiel": "Die Seminar-Textarbeit nutzt die Leitfragen als Analyseraster für Hochschulzugangsprüfungen.", "see": ["testspezifikationen", "reliabilitaet", "high-low-stakes", "washback"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s1"], "hinweis": null}, {"id": "testspezifikationen", "term": "Testspezifikationen", "fa": "مشخصات آزمون", "kurz": "Zentrale Informationen über eine Prüfung.", "def": "Sie enthalten laut Text die Art der überprüften Kompetenzen, die Gewichtung der Komponenten und die Aufgabenformate (Green 2013).", "zitate": [{"t": "Testspezifikationen enthalten zentrale Informationen über die Prüfung, wie die Art der überprüften Kompetenzen, die Gewichtung der einzelnen Komponenten oder die verwendeten Aufgabenformate", "s": "S. 85", "q": "Moser-Frötscher 2025"}], "beispiel": "Gehört zum EALTA-Bereich „Prüfungszweck und Spezifikation“.", "see": ["ealta-leitfragen"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s1"], "hinweis": null}, {"id": "reliabilitaet", "term": "Reliabilität", "fa": "پایایی", "kurz": "Ergebnisse hängen konsistent von der Sprachkompetenz ab.", "def": "Instrumente sind laut Text reliabel, wenn ihre Ergebnisse konsistent von der Sprachkompetenz abhängen und nicht von anderen Faktoren, z. B. unklaren Anweisungen oder missverständlichen Fragen (Green 2013).", "zitate": [{"t": "wenn deren Ergebnisse konsistent von der Sprachkompetenz der Schüler:innen abhängen und nicht von anderen Faktoren wie unklaren Anweisungen oder missverständlichen Fragen/Antwortoptionen beeinträchtigt werden", "s": "S. 86", "q": "Moser-Frötscher 2025"}], "beispiel": "Gehört zum EALTA-Bereich „Prüfungsverfahren“.", "see": ["ealta-leitfragen"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s1"], "hinweis": null}, {"id": "high-low-stakes", "term": "low stakes und high stakes", "fa": "آزمون با پیامد کم / پیامد سنگین", "kurz": "Unterscheidung nach den Folgen der Prüfungsentscheidung.", "def": "Bei low stakes sind die Auswirkungen gering. Bei high stakes hat das Nichtbestehen weitreichende Folgen, für Lernende (z. B. Verwehrung einer Ausbildung) und für Schulen (z. B. Personalabbau, behördliche Kontrolle).", "zitate": [{"t": "Je weitreichender die Auswirkungen einer Prüfung sind, desto wichtiger ist eine rigorose Qualitätssicherung und umfassende Begleitforschung zur Validierung", "s": "S. 87", "q": "Moser-Frötscher 2025"}], "beispiel": "Hochschulzugangsprüfungen sind typische high-stakes-Prüfungen (eigene Einordnung).", "see": ["washback", "ealta-leitfragen"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s1"], "hinweis": null}, {"id": "washback", "term": "washback", "fa": "اثر بازگشتی آزمون بر آموزش", "kurz": "Rückwirkung einer Prüfung auf Unterricht und Lernen.", "def": "Vor allem bei high stakes konzentrieren sich Lehrende und Lernende auf das, was vermutlich geprüft wird. Der Effekt kann negativ oder positiv sein.", "zitate": [{"t": "indem sich Lehrende und Lernende auf jene Kenntnisse, Fertigkeiten oder Fähigkeiten konzentrieren, von denen sie glauben, dass sie in der Prüfung behandelt werden", "s": "S. 87", "q": "Moser-Frötscher 2025"}], "beispiel": "Positives Beispiel im Text: Hören wird nach einer Prüfungsreform im Unterricht stärker gewichtet.", "see": ["high-low-stakes", "summative-evaluation"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s1"], "hinweis": null}, {"id": "language-assessment-literacy", "term": "Language Assessment Literacy", "fa": "سواد سنجش زبان", "kurz": "Leistungsbeurteilungskompetenz von Lehrpersonen.", "def": "Sie umfasst laut Text Fach- und Anwendungswissen in der fremdsprachlichen Leistungsbeurteilung sowie sprachlich-fachliche Kompetenzen (Fulcher 2010).", "zitate": [{"t": "die sowohl Fach- und Anwendungswissen in der fremdsprachlichen Leistungsbeurteilung als auch sprachlich-fachliche Kompetenzen umfasst", "s": "S. 85", "q": "Moser-Frötscher 2025"}], "beispiel": "Voraussetzung dafür, Aufgaben auszuwählen und Leistungen fair zu beurteilen.", "see": ["ealta-leitfragen"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s1"], "hinweis": null}, {"id": "schreibkompetenz", "term": "fremdsprachliche Schreibkompetenz", "fa": "توانایی نوشتن در زبان خارجی", "kurz": "Besteht aus fünf Teilkompetenzen.", "def": "Krings unterscheidet Schreibmotorik, Orthographie, fremdsprachliches Schriftsystem, das Verfassen von Texten nach Textkonventionen und das Schreibprozessmanagement.", "zitate": [{"t": "Die fremdsprachliche Schreibkompetenz umfasst eine Reihe von Teilkompetenzen, die in der fachdidaktischen Diskussion nicht immer deutlich genug voneinander getrennt werden.", "s": "S. 107", "q": "Krings 2016"}], "beispiel": "Die Teilkompetenzen werden in der Diskussion oft vermischt, deshalb trennt Krings sie.", "see": ["schreibprozessmanagement", "textkonventionen", "ger-skalen"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s1"], "hinweis": null}, {"id": "schreibprozessmanagement", "term": "Schreibprozessmanagement", "fa": "مدیریت فرایند نوشتن", "kurz": "Planen und Steuern der mentalen Teilprozesse der Textproduktion.", "def": "Krings bezeichnet es als am häufigsten übersehene Teilkompetenz. Je umfangreicher und anspruchsvoller der Text, desto wichtiger wird sie.", "zitate": [{"t": "die am häufigsten übersehene Teilkompetenz des Schreibens", "s": "S. 107", "q": "Krings 2016"}], "beispiel": "Bei einem langen Text, etwa einer Hausarbeit, entscheidet es mit über den Erfolg (eigenes Beispiel).", "see": ["schreibkompetenz"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s1"], "hinweis": null}, {"id": "textkonventionen", "term": "Textkonventionen und Textsortenkonventionen", "fa": "قواعد و هنجارهای متنی", "kurz": "Regeln, nach denen Texte einer Sorte verfasst werden.", "def": "Textsortenkonventionen können nicht nur zwischen Textsorten, sondern auch für gleiche Textsorten von Sprache zu Sprache verschieden sein. Das Verfassen von Texten nach gültigen Konventionen ist laut Krings die Kernkompetenz des Schreibens.", "zitate": [{"t": "Dies ist zweifellos die Kernkompetenz des Schreibens.", "s": "S. 107", "q": "Krings 2016"}], "beispiel": "Ein Brief oder eine Hausarbeit folgt je nach Sprache anderen Konventionen (eigenes Beispiel).", "see": ["schreibkompetenz"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s1"], "hinweis": null}, {"id": "ger-skalen", "term": "GER-Skalen zum Schreiben", "fa": "مقیاس‌های GER برای نوشتن", "kurz": "Niveaubeschreibungen von A1 bis C2 für verschiedene Aspekte des Schreibens.", "def": "Im Anhang bei Grotjahn (2017) stehen sieben Skalen: Schriftliche Produktion allgemein, Schriftliche Interaktion allgemein, Spektrum sprachlicher Mittel, Wortschatzbeherrschung, Grammatische Korrektheit, Beherrschung der Orthographie, Kohärenz und Kohäsion (zitiert nach Europarat 2001).", "zitate": [{"t": "Kann einfache, isolierte Wendungen und Sätze schreiben.", "s": "Anhang 1, S. 113", "q": "Grotjahn 2017"}], "beispiel": "Niveau A1 der Produktionsskala: Kann einfache, isolierte Wendungen und Sätze schreiben.", "see": ["kohaerenz-kohaesion", "schreibkompetenz"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s1"], "hinweis": "GER = Gemeinsamer europäischer Referenzrahmen für Sprachen. Die Skalen stammen aus der Fassung von 2001."}, {"id": "kohaerenz-kohaesion", "term": "Kohärenz und Kohäsion (GER-Skala)", "fa": "انسجام و پیوستگی متن (مقیاس GER)", "kurz": "Skala zur Gliederung und Verknüpfung von Texten.", "def": "Die Skala beschreibt, wie gut Gliederung und Verknüpfung gelingen, von einfachen Konnektoren wie „und“ auf A1 bis zu einer Vielfalt an Mitteln auf C2 (Anhang 7).", "zitate": [{"t": "Kann Wortgruppen durch einfache Konnektoren wie und, aber und weil verknüpfen.", "s": "Anhang 7, S. 116", "q": "Grotjahn 2017"}], "beispiel": "A2: Konnektoren wie und, aber, weil. Auf C2 wird eine Vielfalt an Mitteln für Gliederung und Verknüpfung erwartet.", "see": ["ger-skalen"], "seminare": ["schreiben"], "sitzungen": ["schreiben-s1"], "hinweis": null}], "vokabeln": [{"de": "das Gesetz", "fa": "قانون", "gruppe": "text", "sitzung": "erz-s1", "forms": ["Gesetz"], "seminar": "erz"}, {"de": "der Türhüter", "fa": "دربان", "gruppe": "text", "sitzung": "erz-s1", "forms": ["Türhüter   var cs=sessOf(cur), h='<h4>Wiki</h4><a href="#start" class="'+(cur==="start"?"on":"")+'">Start</a>';
  D.semester.forEach(function(se){
    h+='<h4>'+esc(se.kurz)+'</h4>';
    D.seminare.filter(function(x){return x.semester===se.id}).forEach(function(sm){
      var inSem=(cs&&sess(cs)&&sess(cs).seminar===sm.id)||cur===sm.id;
      h+='<a class="sem'+(cur===sm.id?" on":"")+'" href="#'+sm.id+'">'+esc(sm.name)+'</a>';
      if(inSem){
        D.sitzungen.filter(function(s){return s.seminar===sm.id}).forEach(function(s){
          h+='<a class="sub'+(cs===s.id?" on":"")+'" href="#'+s.id+'"><span class="nr">S'+pad(s.nr)+'</span>'+esc(s.titel)+'</a>';
        });
      }
    });
  });
  h+='<h4>Nachschlagen</h4>';
  h+='<a href="#glossar" class="'+(cur==="glossar"||cur.indexOf("b-")===0?"on":"")+'">Glossar</a>';
  h+='<a href="#vokabeln" class="'+(cur==="vokabeln"?"on":"")+'">Vokabeln</a>';
  h+='<h4>Material</h4>';
  h+='<a href="#kommentare" class="'+(cur==="kommentare"?"on":"")+'">Handbuch-Kommentare</a>';
  h+='<a href="#quellen" class="'+(cur==="quellen"?"on":"")+'">Quellen</a>';
  $("#nav").innerHTML=h;
}

/* ---------- Bausteine ---------- */
function zitate(list){
  return (list||[]).map(function(z){return '<blockquote><p>'+rich(z.t)+'</p><cite>'+esc(z.q||"Martínez/Scheffel")+', '+esc(z.s)+'</cite></blockquote>'}).join("");
}
function statusBadge(s){
  return s.status==="geprueft"?'<span class="badge geprueft">geprüft</span>':'<span class="badge entwurf">Entwurf</span>';
}
function sessionHead(s,tab){
  var h='<span class="stamp">Sitzung '+s.nr+'</span>'+statusBadge(s)+'<h1>'+esc(s.titel)+'</h1>';
  var meta=[sem(s.seminar).name,s.autor,s.lektuere,s.thema].filter(Boolean).map(esc).join(" · ");
  h+='<p class="meta">'+meta+'</p>';
  h+='<div class="tabs" role="tablist">'+tabsFor(s).map(function(t){return '<a href="#'+tok(s.id,t[0])+'" class="'+(t[0]===tab?"on":"")+'">'+t[1]+'</a>'}).join("")+'</div>';
  return h;
}
function kommCard(k){
  var b=(k.bezug||[]).map(function(id){var g=entry(id);return g?'<a class="term" href="#b-'+id+'">'+esc(g.term)+'</a>':""}).join(", ");
  return '<article class="card"><div class="pg">'+esc(k.quelle)+(k.seite?', '+esc(k.seite):'')+' · '+esc(k.art)+'</div><blockquote><p>'+rich(k.text)+'</p></blockquote>'+(b?'<p class="meta">Bezug: '+b+'</p>':'')+(k.anmerkung?'<p>'+rich(k.anmerkung)+'</p>':'')+'</article>';
}
function emptyKomm(){
  return '<div class="empty"><strong>Noch keine Handbuch-Kommentare.</strong><p>Schick Auszüge aus akademischen Handbüchern mit Quelle und Seitenzahl. Sie werden hier abgelegt und mit Begriffen und Sitzungen verknüpft. Kurze Zitate oder Zusammenfassungen reichen.</p><pre>Handbuch / Autor:\nSeite:\nSitzung (Text):\nBezug (Begriff):\nAuszug oder Zusammenfassung:</pre></div>';
}
function vocabRows(list){
  return list.map(function(v){return '<tr data-sem="'+esc(v.seminar||"")+'" data-art="'+esc(v.gruppe)+'"><td><strong>'+esc(v.de)+'</strong>'+(v.hinweis?'<div class="small">'+esc(v.hinweis)+'</div>':'')+'</td><td class="fa" lang="fa" dir="rtl">'+v.fa+'</td><td class="small">'+esc(v.gruppe==="text"?"Text":"Fachbegriff")+'</td></tr>'}).join("");
}
function vocabTable(list){
  return '<div class="tablewrap"><table><thead><tr><th>Deutsch</th><th style="text-align:right">فارسی</th><th>Art</th></tr></thead><tbody>'+vocabRows(list)+'</tbody></table></div>';
}
function semOptions(){
  return '<option value="">Alle Seminare</option>'+D.seminare.map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>'}).join("");
}

/* ---------- Seiten ---------- */
function pStart(){
  var h='<span class="stamp">Uni-Wiki</span><h1>Seminar-Wiki</h1>';
  h+='<p class="lead">Persönliche Wissenssammlung zu meinen Seminaren. Pro Sitzung: Überblick, Inhalt, Analyse, Vokabeln, Zusatzmaterial und Kommentare. Begriffe und Vokabeln sind über alle Seminare hinweg verknüpft.</p>';
  D.semester.forEach(function(se){
    h+='<div class="semhead">'+esc(se.name)+'</div>';
    D.seminare.filter(function(x){return x.semester===se.id}).forEach(function(sm){
      var list=D.sitzungen.filter(function(s){return s.seminar===sm.id});
      h+='<a class="sess" href="#'+sm.id+'"><span class="meta">'+list.length+' Sitzung'+(list.length===1?"":"en")+'</span><h3>'+esc(sm.name)+'</h3><p>'+esc(sm.beschreibung||"")+'</p></a>';
    });
  });
  h+='<h2>Nachschlagen</h2><ul class="list">';
  h+='<li><a class="row" href="#glossar"><span class="t">Glossar</span><span class="s">'+D.glossar.length+' Begriffe mit Belegstellen und Beispielen</span><span class="r">→</span></a></li>';
  h+='<li><a class="row" href="#vokabeln"><span class="t">Vokabeln</span><span class="s">'+D.vokabeln.length+' Wörter Deutsch–Persisch</span><span class="r">→</span></a></li>';
  h+='<li><a class="row" href="#kommentare"><span class="t">Handbuch-Kommentare</span><span class="s">'+(D.kommentare.length?D.kommentare.length+' Einträge':'Noch leer')+'</span><span class="r">→</span></a></li></ul>';
  h+='<footer class="f">Stand: '+esc(D.meta.stand)+'. Seiten mit dem Vermerk „Entwurf“ sind noch nicht geprüft. Zitate aus der Literatur sind kurz gehalten und mit Seitenzahl belegt.</footer>';
  return h;
}
function pSeminar(id){
  var sm=sem(id), se=semester(sm.semester), list=D.sitzungen.filter(function(s){return s.seminar===id});
  var h='<span class="stamp">'+esc(se.kurz)+'</span><h1>'+esc(sm.name)+'</h1><p class="lead">'+esc(sm.beschreibung||"")+'</p><h2>Sitzungen</h2>';
  h+=list.length?list.map(function(s){return '<a class="sess" href="#'+s.id+'"><span class="meta">Sitzung '+s.nr+(s.autor?' · '+esc(s.autor):'')+(s.lektuere?' · '+esc(s.lektuere):'')+'</span>'+statusBadge(s)+'<h3>'+esc(s.titel)+'</h3><p>'+esc(s.thema||"")+'</p></a>'}).join(""):'<div class="empty">Noch keine Sitzungen.</div>';
  if(sm.lektuere&&sm.lektuere.length)h+='<h2>Lektüre und Material</h2><ul class="list">'+sm.lektuere.map(function(l){return '<li><div class="row"><span class="t">'+esc(l.titel)+'</span><span class="s">'+esc(l.autor)+(l.umfang?' · '+esc(l.umfang):'')+'</span><span class="r meta">'+esc(l.art)+'</span></div></li>'}).join("")+'</ul>';
  var gl=D.glossar.filter(function(g){return (g.seminare||[]).indexOf(id)>=0});
  h+='<h2>Begriffe dieses Seminars</h2><p>'+(gl.length?gl.map(function(g){return '<a class="term" href="#b-'+g.id+'">'+esc(g.term)+'</a>'}).join(" · "):'Noch keine Begriffe.')+'</p>';
