ite><\/blockquote>"}, {"titel": "Textarbeit: 6. high stakes und washback", "quelle": "Moser-Frötscher 2025, S. 86–87", "html": "<p>Prüfungen unterscheiden sich nach den Folgen der Entscheidung: <strong>low stakes<\/strong> (geringe Auswirkungen) und <strong>high stakes<\/strong> (weitreichende Auswirkungen bei Nichtbestehen, für Lernende wie für Schulen). Bei high stakes steigen die Anforderungen an Qualitätssicherung und Validierung.<\/p><blockquote><p>„Je weitreichender die Auswirkungen einer Prüfung sind, desto wichtiger ist eine rigorose Qualitätssicherung und umfassende Begleitforschung zur Validierung“<\/p><cite>Moser-Frötscher 2025, S. 87<\/cite><\/blockquote><p><strong>washback<\/strong>: Prüfungen wirken auf Unterricht und Lernen zurück.<\/p><blockquote><p>„indem sich Lehrende und Lernende auf jene Kenntnisse, Fertigkeiten oder Fähigkeiten konzentrieren, von denen sie glauben, dass sie in der Prüfung behandelt werden“<\/p><cite>Moser-Frötscher 2025, S. 87<\/cite><\/blockquote><p>Der washback kann negativ sein (wenn die Prüfung vom Lehrplan abweicht) oder positiv. Als positives Beispiel nennt der Text eine bisher wenig beachtete Fertigkeit wie Hören, die nach einer Prüfungsreform im Unterricht stärker gewichtet wird. Auch lokale summative Prüfungen wie Klassenarbeiten können vom washback einer externen Prüfung betroffen sein.<\/p><blockquote><p>„Genauso kann washback aber auch positiv ausfallen“<\/p><cite>Moser-Frötscher 2025, S. 87<\/cite><\/blockquote>"}, {"titel": "Textarbeit: 7. Übertragung auf Hochschulzugangsprüfungen (eigene Ableitung)", "quelle": "Eigene Übertragung auf Grundlage des Textes, nicht im Text enthalten", "html": "<p>Die Aufgabenstellung der Seminar-Textarbeit verlangt, die Leitfragen auf sprachliche Prüfungen zum Hochschulzugang zu übertragen. Ein Vorschlag für das Raster:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Bereich<\/th><th>Mögliche Leitfrage für Hochschulzugangsprüfungen<\/th><\/tr><\/thead><tbody><tr><td>Zweck und Spezifikation<\/td><td>Welche Zulassungsentscheidung stützt die Prüfung, und welche sprachlichen Kompetenzen für das Studium sind in den Testspezifikationen beschrieben und gewichtet?<\/td><\/tr><tr><td>Prüfungsverfahren<\/td><td>Wie werden Aufgaben entwickelt und Leistungen bewertet (Bewertungsraster, Schulung der Bewertenden), und wie wird die Fairness gegenüber verschiedenen Gruppen von Prüflingen sichergestellt?<\/td><\/tr><tr><td>Konsequenzen<\/td><td>Welche Folgen hat das Nichtbestehen (high stakes: Zugang zum Studium), welche Begleitforschung gibt es, und wie beeinflusst die Prüfung die Vorbereitungskurse (washback)?<\/td><\/tr><\/tbody><\/table><\/div>"}], "zusatz": [{"titel": "EALTA Guidelines for Good Practice in Language Testing and Assessment", "url": "https://ealta.eu/ealta-guidelines-for-good-practice-in-language-testing-and-assessment/", "typ": "Richtlinien", "quelle": "EALTA (European Association for Language Testing and Assessment)", "geprueft": true, "notiz": "Die Richtlinien, auf die sich der Text beruft (EALTA 2006). Die Seite war beim Abruf erreichbar und bietet sie als PDF in vielen Sprachen an. Sie richten sich an Lehrerausbildung, Unterrichtsbeurteilung und Testentwicklung."}], "material": [{"datei": "2 Prüfen Testen_Funktionen und High Stakes Tests 22.10.pdf", "art": "Folien", "notiz": "Annika Berthelé, 24 Folien"}, {"datei": "Moser-Frötscher 2025.pdf", "art": "Lektüre", "notiz": "3.2 Summative Evaluation, S. 83–88"}, {"datei": "2 Textarbeit summative Evaluation.docx", "art": "Aufgabenblatt", "notiz": "Textarbeit mit vier Aufgaben, 30 Minuten"}, {"datei": "2_Textarbeit_summative_Evaluation_ausgefuellt.docx", "art": "Eigene Bearbeitung", "notiz": "Noch nicht in das Wiki übernommen"}], "begriffe": ["summative-evaluation", "formative-evaluation", "learning-oriented-assessment", "ealta-leitfragen", "testspezifikationen", "reliabilitaet", "high-low-stakes", "washback", "language-assessment-literacy", "funktionen-assessment", "pruefen-testen", "feedback-hattie", "konstrukt", "standardisierung", "eingangstest", "assessment-of-for-as"]}, {"id": "schreiben-s1", "nr": 1, "seminar": "schreiben", "titel": "Schreibkompetenz und GER-Skalen", "autor": "Krings 2016, Grotjahn 2017", "lektuere": "Krings 2016, S. 107; Grotjahn 2017, Anhang 1–7, S. 113–116", "thema": "Teilkompetenzen des fremdsprachlichen Schreibens und ihre Beschreibung im GER", "status": "entwurf", "ueberblick": {"kurzinhalt": "Krings gliedert die fremdsprachliche [[schreibkompetenz|Schreibkompetenz]] in fünf Teilkompetenzen: Schreibmotorik, Orthographie, fremdsprachliches Schriftsystem, das Verfassen von Texten nach gültigen [[textkonventionen|Textkonventionen]] (die Kernkompetenz) und das [[schreibprozessmanagement|Schreibprozessmanagement]]. Grotjahn dokumentiert im Anhang sieben [[ger-skalen|GER-Skalen]] mit Niveaubeschreibungen von A1 bis C2.", "leitfrage": "Welche Teilkompetenzen umfasst fremdsprachliches Schreiben, und welche davon beschreiben die sieben GER-Skalen im Anhang?", "merksatz": "Schreiben ist mehr als Texte formulieren: Die Kernkompetenz ist das Verfassen von Texten nach Textkonventionen, die am häufigsten übersehene Teilkompetenz ist das Schreibprozessmanagement.", "fa": ["طبق کرینگس، توانایی نوشتن در زبان خارجی از پنج مهارت جزئی تشکیل می‌شود: حرکت دست یا تایپ، املا، آشنایی با نظام خط زبان خارجی، نوشتن متن طبق قواعد متنی (مهارت اصلی) و مدیریت فرایند نوشتن.", "مدیریت فرایند نوشتن بیشتر از همه نادیده گرفته می‌شود. هر چه متن طولانی‌تر و دشوارتر باشد، این مهارت مهم‌تر است.", "گروتیان در پیوست خود هفت مقیاس چارچوب مرجع اروپایی (GER) درباره‌ی نوشتن آورده است، از سطح A1 تا C2."]}, "inhalt": [{"titel": "1. Fünf Teilkompetenzen des fremdsprachlichen Schreibens (Krings)", "quelle": "Krings 2016, S. 107", "html": "<div class=\"tablewrap\"><table><thead><tr><th>#<\/th><th>Teilkompetenz<\/th><th>Inhalt laut Text<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Schreibmotorik<\/td><td>Handschriftliches oder elektronisches Schreibprodukt. Die elementare Handschrift wird in der Grundschule erworben. Die Beherrschung des Tastaturschreibens beeinflusst jede Textproduktion an PC, Tablet oder Smartphone.<\/td><\/tr><tr><td>2<\/td><td>Orthographie<\/td><td>Besonders wichtig in Sprachen ohne einheitliche Phonem-Graphem-Zuordnung, z. B. Englisch und Französisch.<\/td><\/tr><tr><td>3<\/td><td>Fremdsprachliches Schriftsystem<\/td><td>Der Lernaufwand hängt davon ab, ob es eine Alphabetschrift (zwei bis drei Dutzend Zeichen) oder eine logographische Schrift wie Chinesisch (mehrere tausend Zeichen) ist.<\/td><\/tr><tr><td>4<\/td><td>Texte nach Textkonventionen verfassen<\/td><td>Die Kernkompetenz. Dazu gehören Textsortenkonventionen, die von Sprache zu Sprache differieren können, und die Beherrschung der Schriftsprache im Unterschied zur Umgangssprache.<\/td><\/tr><tr><td>5<\/td><td>Schreibprozessmanagement<\/td><td>Planen und Steuern der komplexen mentalen Teilprozesse der Textproduktion.<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Dies ist zweifellos die Kernkompetenz des Schreibens.“<\/p><cite>Krings 2016, S. 107<\/cite><\/blockquote><blockquote><p>„die am häufigsten übersehene Teilkompetenz des Schreibens“<\/p><cite>Krings 2016, S. 107<\/cite><\/blockquote><blockquote><p>„Je umfangreicher und anspruchsvoller der hervorzubringende Text gemessen an den Schreiberfahrungen des Textproduzenten ist, desto größer ist die Bedeutung dieser Teilkompetenz.“<\/p><cite>Krings 2016, S. 107<\/cite><\/blockquote>"}, {"titel": "2. Die sieben GER-Skalen im Anhang (Grotjahn)", "quelle": "Grotjahn 2017, Anhang 1–7, S. 113–116", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Anhang<\/th><th>Skala<\/th><th>Seite<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Schriftliche Produktion allgemein<\/td><td>113<\/td><\/tr><tr><td>2<\/td><td>Schriftliche Interaktion allgemein<\/td><td>113<\/td><\/tr><tr><td>3<\/td><td>Spektrum sprachlicher Mittel (allgemein)<\/td><td>114<\/td><\/tr><tr><td>4<\/td><td>Wortschatzbeherrschung<\/td><td>115<\/td><\/tr><tr><td>5<\/td><td>Grammatische Korrektheit<\/td><td>115<\/td><\/tr><tr><td>6<\/td><td>Beherrschung der Orthographie<\/td><td>116<\/td><\/tr><tr><td>7<\/td><td>Kohärenz und Kohäsion<\/td><td>116<\/td><\/tr><\/tbody><\/table><\/div><p>Alle Skalen stammen aus dem Gemeinsamen europäischen Referenzrahmen (Europarat 2001) und sind in sechs Niveaus von A1 bis C2 gegliedert. Bei Wortschatz heißt es für A1: „keine Deskriptoren verfügbar“.<\/p>"}, {"titel": "3. Beispiel: Skala „Schriftliche Produktion allgemein“", "quelle": "Grotjahn 2017, Anhang 1, S. 113 (zitiert nach Europarat 2001, S. 67)", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Niveau<\/th><th>Kann …<\/th><\/tr><\/thead><tbody><tr><td><strong>C2<\/strong><\/td><td>Kann klare, flüssige, komplexe Texte in angemessenen und effektiven Stil schreiben, deren logische Struktur den Lesern das Auffinden der wesentlichen Punkte erleichtert.<\/td><\/tr><tr><td><strong>C1<\/strong><\/td><td>Kann klare, gut strukturierte Texte zu komplexen Themen verfassen und dabei die entscheidenden Punkte hervorheben…<\/td><\/tr><tr><td><strong>B2<\/strong><\/td><td>Kann klare, detaillierte Texte zu verschiedenen Themen aus seinem / ihrem Interessengebiet verfassen und dabei Informationen und Argumente aus verschiedenen Quellen zusammenführen und gegeneinander abwägen.<\/td><\/tr><tr><td><strong>B1<\/strong><\/td><td>Kann unkomplizierte, zusammenhängende Texte zu mehreren vertrauten Themen aus seinem / ihrem Interessengebiet verfassen, wobei einzelne kürzere Teile in linearer Abfolge verbunden werden.<\/td><\/tr><tr><td><strong>A2<\/strong><\/td><td>Kann eine Reihe einfacher Wendungen und Sätze schreiben und mit Konnektoren wie und, aber oder weil verbinden.<\/td><\/tr><tr><td><strong>A1<\/strong><\/td><td>Kann einfache, isolierte Wendungen und Sätze schreiben.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"meta\">Die Beschreibung für C1 ist hier gekürzt.<\/p>"}, {"titel": "4. Teilkompetenzen und Skalen im Vergleich (eigene Zuordnung)", "quelle": "Eigene Zuordnung, nicht in den Texten enthalten", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Teilkompetenz (Krings)<\/th><th>Passende GER-Skala im Anhang<\/th><\/tr><\/thead><tbody><tr><td>2. Orthographie<\/td><td>Anhang 6: Beherrschung der Orthographie<\/td><\/tr><tr><td>4. Texte nach Textkonventionen verfassen<\/td><td>Anhang 1: Schriftliche Produktion allgemein. Anhang 7: Kohärenz und Kohäsion. Außerdem Anhang 3–5 (sprachliche Mittel, Wortschatz, Grammatik) für die sprachliche Seite.<\/td><\/tr><tr><td>1. Schreibmotorik, 3. Schriftsystem, 5. Schreibprozessmanagement<\/td><td>In den sieben Skalen des Auszugs nicht vertreten<\/td><\/tr><\/tbody><\/table><\/div><p>Das wäre ein Ansatzpunkt für die Diskussion, welche Teilkompetenzen Skalen überhaupt erfassen können.<\/p>"}], "zusatz": [{"titel": "Council of Europe: CEFR Companion Volume with new descriptors", "url": "https://www.coe.int/en/web/education/-/council-of-europe-launches-the-cefr-companion-volume-with-new-descriptors", "typ": "Offizielle Seite", "quelle": "Europarat (Council of Europe)", "geprueft": false, "notiz": "Die Skalen bei Grotjahn stammen aus dem GER von 2001. Der Begleitband ergänzt neue Deskriptoren, auch zum Schreiben. Die Seite wurde nur in Suchergebnissen gesehen, nicht geöffnet."}], "material": [{"datei": "Krings 2016_ Schreibkompetenz Definition aus Handbuch Fremdsprachenunterricht_.pdf", "art": "Lektüre", "notiz": "Kap. 23 Schreiben, S. 107 (1 Seite)"}, {"datei": "Grotjahn 2017_GER Skalen Schreiben.pdf", "art": "Lektüre", "notiz": "Anhang 1–7, S. 113–116 (4 Seiten)"}], "begriffe": ["schreibkompetenz", "schreibprozessmanagement", "textkonventionen", "ger-skalen", "kohaerenz-kohaesion"]}, {"id": "schreiben-s2", "nr": 2, "seminar": "schreiben", "titel": "Schreiben als Prozess", "autor": "Schnell; Kellogg; Zimmerman/Kitsantas; Breuer", "lektuere": "Schnell 2020, S. 22–40 und 65–69 (Vorbereitungstext); Kellogg (Modell 1996), S. 161–165; Zimmerman/Kitsantas 2006, S. 53–59; Breuer 2020, S. 22–31", "thema": "Schreibprozessmodelle (Hayes/Flower, Kellogg), Arbeitsgedächtnis, Selbstregulation, Schreibschwierigkeiten und L1/FS-Vergleich", "status": "entwurf", "ueberblick": {"kurzinhalt": "Schreiben wird als kognitiver Problemlösungsprozess beschrieben. Schnell stellt das Modell von Hayes/Flower, die Rolle des [[arbeitsgedaechtnis|Arbeitsgedächtnisses]], Gefühle und [[selbstregulation-schreiben|Selbstregulation]] sowie Schreibschwierigkeiten vor. Dazu kommen die Beschreibung des [[kellogg-modell|Kellogg-Modells]], der Selbstregulationszyklus von Zimmerman/Kitsantas und Breuers Vergleich der [[schreibsubprozesse|Schreibsubprozesse]] in L1 und Fremdsprache.", "leitfrage": "Wie läuft Schreiben als Prozess ab, und was verändert sich beim Schreiben in einer Fremdsprache?", "merksatz": "Schreiben ist kein lineares Phasenmodell, sondern ein rekursives Zusammenspiel von Planen, Formulieren und Überprüfen, das durch das begrenzte Arbeitsgedächtnis und durch Selbststeuerung bestimmt wird.", "fa": ["مدل هیز و فلاور: نوشتن یک فرایند حل مسئله‌ی بازگشتی است با سه واحد: محیط تکلیف، حافظه‌ی بلندمدت و فرایندهای نوشتن (برنامه‌ریزی، ترجمه‌ی ایده به متن، بازبینی) که یک «ناظر» کنترل می‌کند. این مدل مرحله‌ای و خطی نیست.", "حافظه‌ی کاری ظرفیت محدود دارد؛ هر چه فرایندهای پایه خودکارتر شوند (مثلاً تایپ و املا)، ظرفیت بیشتری برای برنامه‌ریزی و استدلال می‌ماند. مدل کلوگ نشان می‌دهد هر زیرفرایند کدام بخش حافظه‌ی کاری را می‌خواهد.", "احساسات و خودتنظیمی در مدل‌های کلاسیک تقریباً نادیده‌اند. زیمرمن و کیتساس نوشتن را چرخه‌ای از پیش‌اندیشی، اجرا و خودبازتابی می‌دانند.", "موانع نوشتن (Schreibblockade) طبق روز و کِزلینگ بیشتر از راهبردهای ناکارآمد و قواعد سخت‌گیرانه می‌آیند، نه از «استعداد کم».", "برویر نشان می‌دهد در زبان خارجی همه‌ی زیرفرایندها سنگین‌ترند و بازبینی بیشتر سطحی می‌ماند."]}, "inhalt": [{"titel": "1. Schnell: Das Schreibprozessmodell von Hayes/Flower (2.1.1)", "quelle": "Schnell 2020, S. 23–33", "html": "<p>Schnell stellt das bekannte Modell von Hayes/Flower (1980, 1981) vor und betont, dass Schreiben kein linearer Ablauf ist:<\/p><blockquote><p>„Schreibende während der Textproduktion orchestrierte, rekursive, iterative, reflexive, hierarchisch organisierte und zielgerichtete Denkprozesse durchführen“<\/p><cite>Schnell 2020, S. 23<\/cite><\/blockquote><p>Das Modell hat drei Einheiten:<\/p><blockquote><p lang=\"en\">“the task environment, the writer’s long-term memory, and the writing processes”<\/p><cite>Schnell 2020, S. 24 (Hayes/Flower 1981: 369)<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th>Einheit<\/th><th>Inhalt<\/th><\/tr><\/thead><tbody><tr><td>Aufgabenumfeld (task environment)<\/td><td>Schreibaufgabe, Thema, Leserschaft, motivierende Hinweise und der bisher geschriebene Text<\/td><\/tr><tr><td>Langzeitgedächtnis<\/td><td>Wissen über Thema, Leserschaft und Schreibpläne, auch in externen Quellen wie Büchern<\/td><\/tr><tr><td>Schreibprozesse<\/td><td>Planung (Ideen generieren, organisieren, Ziele setzen), Übersetzung (Translating) und Überprüfung (Reviewing: Lesen, Überarbeiten), gesteuert vom Monitor<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Der geschriebene Text als Einschränkung.<\/strong> Je weiter der Text ist, desto stärker schränkt er ein, was folgen kann:<\/p><blockquote><p lang=\"en\">“each word in the growing text determines and limits the choices of what can come next”<\/p><cite>Schnell 2020, S. 25 (Hayes/Flower 1981: 371)<\/cite><\/blockquote><p><strong>Planung.<\/strong> Im Organizing entsteht ein Schreibplan aus drei Planarten: <em>plans to do<\/em> (Struktur der Ziele), <em>plans to say<\/em> (Inhalte) und <em>plans to compose<\/em> (Vorgehen). Ziele entstehen laut Hayes/Flower vor allem während des Schreibens.<\/p><p><strong>Kritik am Translating.<\/strong> Vor allem deutschsprachige Forschende kritisieren, dass der Begriff nahelegt, vorsprachliche Pläne würden einfach in Sprache übersetzt. Wrobel (1995):<\/p><blockquote><p>„weniger Übersetzen als vielmehr Adaption“<\/p><cite>Schnell 2020, S. 29 (Wrobel 1995: 125)<\/cite><\/blockquote><p><strong>Missverständnis Phasenmodell.<\/strong> Die Pfeile im Modell legen keine Reihenfolge fest. Hayes/Flower sehen Schreiben als<\/p><blockquote><p lang=\"en\">“sequence of stages but a set of optional actions”<\/p><cite>Schnell 2020, S. 31 (Hayes/Flower 1981: 375)<\/cite><\/blockquote><blockquote><p lang=\"en\">“writers are constantly planning (pre-writing) and revising (re-writing) as they compose (write), not in clean-cut stages”<\/p><cite>Schnell 2020, S. 32 (Hayes/Flower 1981: 367)<\/cite><\/blockquote><p><strong>Weitere Kritik und Weiterentwicklung.<\/strong> Die Modelle sind einseitig kognitiv und prozessual ausgerichtet. Hayes (1996) hebt das Arbeitsgedächtnis in einer eigenen Komponente hervor, berücksichtigt Motivation und Affekt stärker und hat nur noch zwei Komponenten (individual, task environment). Das Modell von 1996 fand aber deutlich weniger Beachtung (S. 33).<\/p>"}, {"titel": "2. Schnell: Das Arbeitsgedächtnis beim Schreiben (2.1.2)", "quelle": "Schnell 2020, S. 33–35", "html": "<p>In den meisten Schreibmodellen spielt das Arbeitsgedächtnis eine zentrale Rolle. Kellogg (1996) ordnet die Komponenten des Arbeitsgedächtnisses (zentrale Exekutive, visuell-räumlicher Notizblock, phonologische Schleife) schreibspezifischen Aktivitäten zu. Die Kapazität hängt mit Schreibflüssigkeit und teilweise mit der Textqualität zusammen:<\/p><blockquote><p lang=\"en\">“individuals with different working memory spans can be expected to vary in the speed an efficiency with which they execute various writing processes”<\/p><cite>Schnell 2020, S. 34 (Kormos 2012: 396)<\/cite><\/blockquote><ul class=\"plain\"><li>Flüssiges Prozessieren verringert die Belastung, sodass mehr Ressourcen für andere Operationen frei werden.<\/li><li>Noch nicht automatisierte motorische Fähigkeiten beanspruchen Arbeitsgedächtnis (Alves et al. 2007).<\/li><li>Das visuell-räumliche System kann beim Schreiben, anders als beim Sprechen, Planen und Überarbeiten entlasten (S. 34–35).<\/li><\/ul><p>Für L2-Lernende wurden in der Psycholinguistik Hypothesen entwickelt, die laut Schnell bisher kaum auf das L2-Schreiben bezogen wurden. Die <em>Trade-off-Hypothese<\/em> (Limited Capacity Hypothesis) nimmt an, dass bei anspruchsvollen Aufgaben weniger Aufmerksamkeit für die Form bleibt:<\/p><blockquote><p lang=\"en\">“with the result that less attention is available to focus on form”<\/p><cite>Schnell 2020, S. 35 (Skehan 2004: 97)<\/cite><\/blockquote><p>Nach Skehan (2004) können sich Lernende wegen der begrenzten Kapazität nur auf einen dieser Bereiche konzentrieren: <em>fluency<\/em>, <em>accuracy<\/em> oder <em>syntactic complexity<\/em>.<\/p>"}, {"titel": "3. Kellogg: Modellbeschreibung (1996)", "quelle": "Kellogg et al., Modell von 1996, S. 161–165", "html": "<blockquote><p lang=\"en\">“The model differentiated six basic processes.”<\/p><cite>Kellogg et al., Modell von 1996, S. 161<\/cite><\/blockquote><p>Kellogg baut auf Hayes/Flower (1980) auf und unterscheidet vier kognitive Prozesse (planning, translating, reading, editing; die letzten beiden sind Teile des Überprüfens, reviewing) sowie zwei motorische Prozesse (programming, executing). Die Textproduktion ist rekursiv:<\/p><blockquote><p lang=\"en\">“planning, sentence generation, and even reviewing of ideas and text are recursive operations that occur in complex patterns through text production”<\/p><cite>Kellogg et al., Modell von 1996, S. 161<\/cite><\/blockquote><p>Das Modell bezieht sich auf Baddeleys Arbeitsgedächtnis mit drei Komponenten: <strong>zentrale Exekutive<\/strong> (central executive), <strong>visuell-räumlicher Notizblock<\/strong> (visuo-spatial sketchpad) und <strong>phonologische Schleife<\/strong> (phonological loop). Tabelle 1 im Text ordnet zu:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Prozess<\/th><th>Visuell-räumlicher Notizblock<\/th><th>Zentrale Exekutive<\/th><th>Phonologische Schleife<\/th><\/tr><\/thead><tbody><tr><td>Planning (Planen)<\/td><td>X<\/td><td>X<\/td><td><\/td><\/tr><tr><td>Translating (Formulieren)<\/td><td><\/td><td>X<\/td><td>X<\/td><\/tr><tr><td>Programming (motorisch planen)<\/td><td><\/td><td>X<\/td><td><\/td><\/tr><tr><td>Executing (motorisch ausführen)<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Reading (Lesen)<\/td><td><\/td><td>X<\/td><td>X<\/td><\/tr><tr><td>Editing (Überarbeiten)<\/td><td><\/td><td>X<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><p>Wichtige Aussagen:<\/p><ul class=\"plain\"><li>Planen ist der einzige Prozess, der den Notizblock braucht, etwa für Visualisierungen, Skizzen und Textlayout.<\/li><li>Formulieren braucht die phonologische Schleife (innere Sprache).<\/li><li>Die motorische Ausführung stellt kaum Anforderungen, bei Kindern ist aber schon das Programmieren von Handschrift anstrengend.<\/li><\/ul><blockquote><p lang=\"en\">“planning was the only aspect of written composition that placed a demand on the visuo-spatial sketchpad”<\/p><cite>Kellogg et al., Modell von 1996, S. 163<\/cite><\/blockquote><blockquote><p lang=\"en\">“Translating ideas into sentences in theory demanded the phonological loop.”<\/p><cite>Kellogg et al., Modell von 1996, S. 163<\/cite><\/blockquote><blockquote><p lang=\"en\">“Until they learn to automate to some degree these lower level processes, insufficient resources of the central executive are available to the higher order demands of planning ideas, generating text, and reviewing the work produced thus far.”<\/p><cite>Kellogg et al., Modell von 1996, S. 163<\/cite><\/blockquote><p><strong>Artikulatorische Suppression:<\/strong> Die Vorhersage lautet, dass irrelevante Sprache oder ständiges lautloses Wiederholen eines Wortes (z. B. „tap, tap, tap“) das Formulieren stört.<\/p><blockquote><p lang=\"en\">“This form of dual task methodology is known as articulatory suppression, because it prevents participants from engaging in silent articulation.”<\/p><cite>Kellogg et al., Modell von 1996, S. 164<\/cite><\/blockquote><p><strong>Editing:<\/strong> Erkennen von Abweichungen zwischen Absicht und Ergebnis, im Modell nur von der zentralen Exekutive getragen.<\/p><blockquote><p lang=\"en\">“Editing refers to the detection of mistakes, that is, some mismatch between the writer’s intentions and output of another writing process.”<\/p><cite>Kellogg et al., Modell von 1996, S. 164<\/cite><\/blockquote><blockquote><p lang=\"en\">“A key and controversial assumption of Kellogg’s (1996) model is that editing makes demands solely on the central executive.”<\/p><cite>Kellogg et al., Modell von 1996, S. 165<\/cite><\/blockquote><blockquote><p lang=\"en\">“This may be one reason why it is difficult to catch mistakes in one’s own text”<\/p><cite>Kellogg et al., Modell von 1996, S. 164<\/cite><\/blockquote>"}, {"titel": "4. Schnell: Gefühle und Selbstregulation (2.1.3)", "quelle": "Schnell 2020, S. 35–40", "html": "<p>Schnell stellt fest, dass emotionale Prozesse in den gängigen Modellen kaum vorkommen:<\/p><blockquote><p>„emotionale und empfindungsbezogene Prozesse keine oder nur eine äußerst marginale Rolle“<\/p><cite>Schnell 2020, S. 35<\/cite><\/blockquote><ul class=\"plain\"><li>Die Forschung betrifft meist allgemeine Motivation (Ziele, intrinsische und extrinsische Motivation, Selbstwirksamkeit), kaum die Regulation während des Schreibens.<\/li><li>Clachar (1999): Bei einem emotional bedeutsamen Text wandten L2-Schreibende mehr Zeit für lexikalische und morphosyntaktische Prozesse auf, vermutlich um ihre Gedanken genau auszudrücken.<\/li><li>Zimmerman/Kitsantas (2006) übertragen ein Phasenmodell der Selbstregulation auf das Schreiben (siehe nächster Abschnitt). Kormos (2012) fasst zusammen:<\/li><\/ul><blockquote><p lang=\"en\">“self-regulatory strategies can have considerable influence on the amount of attention paid to various stages of the writing process”<\/p><cite>Schnell 2020, S. 37 (Kormos 2012: 399)<\/cite><\/blockquote><ul class=\"plain\"><li>Ortner (2000): Das Gefühl, mit dem Text „zu Rande gekommen“ zu sein, ist eine intuitive Bewertung, die sich in Motiven und Einstellungen verfestigt. Der Begriff <em>felt sense<\/em> (Gendlin) beschreibt dieses Gespür.<\/li><li>Dörner (1982): Angst vor Misserfolg führt zu einer „Notfallreaktion des kognitiven Systems“ und behindert das Problemlösen (S. 39). Rose (2009): Selbstzweifel führen zu unflexiblen Planungsstrategien.<\/li><li>Gefühle laufen weitgehend automatisiert und parallel zu Gedanken ab und sind deshalb mit Lautem Denken kaum rekonstruierbar (S. 38).<\/li><\/ul>"}, {"titel": "5. Zimmerman/Kitsantas: Zyklus der Selbstregulation", "quelle": "Zimmerman/Kitsantas 2006, S. 53–59", "html": "<p>Das sozial-kognitive Modell hat drei Phasen, ähnlich den Schreibphasen bei Rohman (1965) und den Prozessen bei Flower/Hayes (1980):<\/p><blockquote><p lang=\"en\">“It includes sources of motivation as well as cognitive processes in a cyclical feedback loop wherein writing outcomes are used to modify and guide subsequent efforts to write.”<\/p><cite>Zimmerman/Kitsantas 2006, S. 54<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th>Phase<\/th><th>Teilprozesse laut Abbildung 1 und Text<\/th><th>Beispiele im Text<\/th><\/tr><\/thead><tbody><tr><td><strong>Forethought<\/strong> (Vorüberlegung)<\/td><td>Task analysis: goal setting, strategic planning. Sources of self-motivation: self-efficacy, outcome expectancy, task interest/valuing, goal orientation.<\/td><td>Wochenziele bei Trollope; ausführliche Planung bei John Irving<\/td><\/tr><tr><td><strong>Performance<\/strong> (Ausführung)<\/td><td>Self-control: self-instruction, mental imagery, task strategies, attention focusing, time management, environmental structuring, self-consequences, help-seeking. Self-observation: metacognitive monitoring, self-recording.<\/td><td>Hemingway hört mitten im Satz auf; Proust lässt einen korkgedämmten Raum bauen; Hugo gibt seine Kleider ab<\/td><\/tr><tr><td><strong>Self-reflection<\/strong> (Selbstreflexion)<\/td><td>Self-judgment: self-evaluation, causal attribution. Self-reaction: self-satisfaction/affect, adaptive/defensive inferences.<\/td><td>Faulkner: nie zufrieden sein; Stafford senkt Standards gegen Schreibblockaden<\/td><\/tr><\/tbody><\/table><\/div><p>Wichtige Aussagen:<\/p><blockquote><p lang=\"en\">“Prior to performing, expert writers analyze their literary tasks and set specific writing goals”<\/p><cite>Zimmerman/Kitsantas 2006, S. 54<\/cite><\/blockquote><blockquote><p lang=\"en\">“Hemingway would purposely halt his writing for the day in mid-sentence”<\/p><cite>Zimmerman/Kitsantas 2006, S. 56<\/cite><\/blockquote><blockquote><p lang=\"en\">“Adaptive help-seeking strategies are distinguished from social dependence by several key characteristics: self-initiation, selective focus, and limited duration”<\/p><cite>Zimmerman/Kitsantas 2006, S. 57<\/cite><\/blockquote><blockquote><p lang=\"en\">“Because novice writers fail to set selective goals, they are often overwhelmed by the amount of information that must be metacognitively monitored”<\/p><cite>Zimmerman/Kitsantas 2006, S. 57<\/cite><\/blockquote><blockquote><p lang=\"en\">“Self-evaluation involves comparing self-monitored outcomes with a standard or goal.”<\/p><cite>Zimmerman/Kitsantas 2006, S. 58<\/cite><\/blockquote><blockquote><p lang=\"en\">“Poorly self-regulated writers often attribute their errors to uncontrollable factors, such as a lack of talent, which discourage these individuals from further learning efforts”<\/p><cite>Zimmerman/Kitsantas 2006, S. 58<\/cite><\/blockquote><blockquote><p lang=\"en\">“Because of its cyclical nature, this model seeks to explain writing as a continuing process of growth as a writer becomes more competent.”<\/p><cite>Zimmerman/Kitsantas 2006, S. 54<\/cite><\/blockquote>"}, {"titel": "6. Schnell: Schreibschwierigkeiten (2.1.6)", "quelle": "Schnell 2020, S. 65–69", "html": "<p>Rose (Mitte der 1980er) führt Schreibblockaden auf konkrete Verhaltensweisen zurück, nicht auf allgemeine emotionale Probleme oder geringe Schreibfähigkeit. Blockierte Schreibende wenden Regeln zu starr an:<\/p><blockquote><p lang=\"en\">“rigid rules focus the writer’s mind too narrowly”<\/p><cite>Schnell 2020, S. 65 (Rose 2009: 90)<\/cite><\/blockquote><ul class=\"plain\"><li>Blockierte Schreibende fertigen ausführliche Inhaltsangaben an, verbinden die Informationen aber nicht.<\/li><li>Zu hohe Erwartungen an sich selbst und zu frühes, wiederholtes Bearbeiten der sprachlichen Oberfläche tragen zu Blockaden bei.<\/li><\/ul><p><strong>Keseling<\/strong> (Beratungsfälle aus dem Schreiblabor Marburg) ordnet Störungen in zwei Kategorien, die sich aber überlagern:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Kategorie<\/th><th>Störungstypen<\/th><\/tr><\/thead><tbody><tr><td>Störungen beim Planen<\/td><td>Probleme bei der Konzeptbildung; Probleme beim Zusammenfassen wissenschaftlicher Literatur<\/td><\/tr><tr><td>Störungen beim Formulieren<\/td><td>unstimmige Konzepte bei spätem Starten; Probleme mit dem inneren Adressaten (zu kritisch oder nicht verfügbar)<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„unter einem zu großen Respekt vor dem Wortlaut des fremden Textes“<\/p><cite>Schnell 2020, S. 67 (Keseling 2013: 211, Zitat bei Schnell)<\/cite><\/blockquote><p>Nicht blockierte Schreibende haben auch Schwierigkeiten, halten den Prozess aber durch das Ausprobieren verschiedener Strategien im Fluss (S. 68).<\/p><p><strong>Textmuster.<\/strong> Nach Ortner fällt das narrative Schema leichter als das argumentative:<\/p><blockquote><p>„Mit dem schwierigsten Problem, dem des Gesamtzusammenhangs (Makrostruktur), ist der Schreiber meist allein auf weiter Flur“<\/p><cite>Schnell 2020, S. 68–69 (Ortner 2000: 291)<\/cite><\/blockquote>"}, {"titel": "7. Breuer (ergänzende Lektüre): Überblick über fünf Subprozesse", "quelle": "Breuer 2020, S. 22–31", "html": "<p>Der Auszug umfasst die Abschnitte 2 bis 6 des Beitrags (Abschnitt 1 liegt nicht vor):<\/p><div class=\"tablewrap\"><table><thead><tr><th>Abschnitt<\/th><th>Subprozess<\/th><th>Seiten<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>Ideen generieren<\/td><td>22–24<\/td><\/tr><tr><td>3<\/td><td>Text planen<\/td><td>24–26<\/td><\/tr><tr><td>4<\/td><td>Sprachliche Transformation<\/td><td>26–27<\/td><\/tr><tr><td>5<\/td><td>Ausführung<\/td><td>27–28<\/td><\/tr><tr><td>6<\/td><td>Revision<\/td><td>29–31<\/td><\/tr><\/tbody><\/table><\/div><p class=\"meta\">Abkürzungen im Text: L1 = Erstsprache, FS = Fremdsprache.<\/p>"}, {"titel": "8. Breuer: Ideen generieren", "quelle": "Breuer 2020, S. 22–24", "html": "<p>Ideengenerierung ist laut Flower/Hayes (1981) der Startpunkt des Schreibprozesses.<\/p><blockquote><p>„Dieser Subprozess kann in weiten Teilen sprachunabhängig ablaufen, da viele Informationen in unserem Gehirn in anderen als sprachlichen Modalitäten gespeichert werden“<\/p><cite>Breuer 2020, S. 22<\/cite><\/blockquote><p>Zugleich ist abstraktes Denken stark an Sprache gebunden. Daraus folgt ein Paradoxon:<\/p><blockquote><p>„dass wir einerseits Probleme beim Formulieren von Ideen in der FS haben, wir andererseits aber bei dem Versuch, dies in unserer L1 zu tun, feststellen, dass das nötige Fachvokabular fehlt“<\/p><cite>Breuer 2020, S. 22<\/cite><\/blockquote><p><strong>L1 als Entlastung:<\/strong> Jugendliche (Gunnarson 2019) nutzten die L1 zum Ideengenerieren, Strukturieren und bei Wortfindungsproblemen, die FS beim Lesen der Aufgabe, Formulieren und Revidieren. Bei Li (2008) hing der Erfolg von der FS-Kompetenz ab:<\/p><blockquote><p>„Gute FS-Schreibende verwendeten die L1 sehr viel erfolgreicher für das Ideengenerieren als schlechte FS-Schreibende“<\/p><cite>Breuer 2020, S. 22<\/cite><\/blockquote><p><strong>Schreiben als Denken:<\/strong> Schreiben dient auch dazu, Wissen zu transformieren oder neues zu erzeugen (Bereiter/Scardamalia 1987, Galbraith 1999).<\/p><blockquote><p>„Die körperlichen Prozesse aktivieren die mentalen, und das Schreiben wird zum Denken.“<\/p><cite>Breuer 2020, S. 22 (zu Menary 2007: 622)<\/cite><\/blockquote><blockquote><p>„so hemmt dies das Schreiben als Denken.“<\/p><cite>Breuer 2020, S. 23 (wenn Sprachsuche zu viel Arbeitsgedächtnis beansprucht)<\/cite><\/blockquote><p><strong>Studie Breuer (2016a):<\/strong> Studierende mit L1 Deutsch schrieben vier akademische Texte (zwei Deutsch, zwei Englisch), geplant mit Notizen oder mit freewriting.<\/p><blockquote><p>„Die meisten Ideen wurden im L1 freewriting festgehalten, die wenigsten in den L1-Notizen.“<\/p><cite>Breuer 2020, S. 23<\/cite><\/blockquote><blockquote><p>„Die kognitive Entlastung durch das Nicht-Verwenden der FS hatte hier langfristig keinen positiven Effekt.“<\/p><cite>Breuer 2020, S. 23<\/cite><\/blockquote><p><strong>Abrams/Byrd (2016)<\/strong> und <strong>Bloch (2007)<\/strong>: Wenn Ideen losgelöst vom Schreiben entwickelt werden (bei Bloch durch einen Genrewechsel zum Bloggen), steigen Zahl und Komplexität der Ideen.<\/p><blockquote><p>„Die Teilnehmenden, die komplexe sowie besonders viele Ideen in den inhaltszentrierten Planungsepisoden generierten, schrieben am Ende längere und bessere Texte als diejenigen, die dies nicht taten.“<\/p><cite>Breuer 2020, S. 23<\/cite><\/blockquote><blockquote><p>„Die Sprachkompetenz spielt dabei eine entscheidende Rolle.“<\/p><cite>Breuer 2020, S. 24 (Fazit des Abschnitts)<\/cite><\/blockquote>"}, {"titel": "9. Breuer: Text planen", "quelle": "Breuer 2020, S. 24–26", "html": "<p>Planen heißt: Ideen auf Aufgabenadäquatheit prüfen und eine Struktur wählen. Das kann sprachungebunden mit Stichwörtern oder visuellen Mitteln geschehen (pre-task planning).<\/p><blockquote><p>„Werden aufgrund von Sprachproblemen nur wenige Ideen generiert, hat dies für die Textplanung die Konsequenz, dass die Pläne simpel sind“<\/p><cite>Breuer 2020, S. 24 (= knowledge telling)<\/cite><\/blockquote><blockquote><p>„Allgemein wird angenommen, dass FS-Schreibende nicht zu viele Prozesse parallel ausführen, sondern sich besser auf die jeweils aktuellen Aspekte konzentrieren sollten“<\/p><cite>Breuer 2020, S. 24<\/cite><\/blockquote><p>Die L1 kann auch beim Planen entlasten: Bei Lally (2000) beeinflusste die Planungssprache Organisation und globalen Texteindruck, nicht das Vokabular. Bei Li (2008) nutzten Schreibende mit hohem FS-Niveau die L1 verstärkt für strategische höherrangige Prozesse.<\/p><p><strong>Abrams/Byrd (2016):<\/strong> Deutschlernende schrieben Zusammenfassungen ohne Planung, mit Mindmapping und mit chronologischer Stichwortliste.<\/p><blockquote><p>„Die Ergebnisse demonstrieren, dass der Text ohne vorherige Planung derjenige war, der in den Bereichen Grammatik, Wortkorrektheit und Wortwahl am besten funktionierte.“<\/p><cite>Breuer 2020, S. 25<\/cite><\/blockquote><blockquote><p>„Dagegen waren Inhalt, lexikalische Komplexität und Textfluss wesentlich besser, wenn die Teilnehmenden den Text planten.“<\/p><cite>Breuer 2020, S. 25<\/cite><\/blockquote><p><strong>Ong (2014):<\/strong> Gruppen planten 0, 10 oder 20 Minuten bei 30 Minuten Gesamtzeit, mit einfacher, mittlerer oder komplexer Aufgabenstellung.<\/p><blockquote><p>„Die Resultate belegen, dass die Aufgabenumgebung einen großen Effekt auf die metakognitiven Prozesse hatte, dass die Zeit für das Planen aber nur einen Einfluss darauf hatte, wie oft die Teilnehmenden über sprachliche Aspekte nachdachten.“<\/p><cite>Breuer 2020, S. 25<\/cite><\/blockquote><p>Ziegler (2018): Auch bei nur drei Minuten Planung dachten die Teilnehmenden vor allem über Formulierungen und Grammatik nach.<\/p><blockquote><p>„Wie man diesen Anforderungen begegnen kann, ist bisher aber noch nicht zufriedenstellend beantwortet worden.“<\/p><cite>Breuer 2020, S. 26 (Fazit des Abschnitts)<\/cite><\/blockquote>"}, {"titel": "10. Breuer: Sprachliche Transformation", "quelle": "Breuer 2020, S. 26–27", "html": "<p>Hier werden Gedanken in Text umgesetzt: Wörter generieren, syntaktische Strukturen aktivieren, das passende Register wählen.<\/p><blockquote><p>„Bei der Transformation der Gedanken in Text müssen Wörter generiert und syntaktische Strukturen aktiviert werden, was stark mit der Sprachkompetenz in der Zielsprache zusammenhängt“<\/p><cite>Breuer 2020, S. 26<\/cite><\/blockquote><p><strong>Lee (2018)<\/strong> verglich englische Abstracts koreanischer Akademiker:innen mit professionellen Übersetzungen:<\/p><blockquote><p>„LEE geht darum davon aus, dass die Übersetzung von der Idee zum Text noch über eine weitere Übersetzung abläuft – die von der L1 in die FS.“<\/p><cite>Breuer 2020, S. 26<\/cite><\/blockquote><p><strong>Breuer (2015):<\/strong> Deutsche Schreibende mit Englisch auf C1-Niveau machten die meisten Fehler bei L1-Interferenzen.<\/p><blockquote><p>„Die Analyse der Texte zeigt, dass die Fehlerquote am höchsten im Bereich der L1-Interferenzen war – vor allem im Bereich der Syntax, aber auch in phonemisch-orthographischen Aspekten.“<\/p><cite>Breuer 2020, S. 26<\/cite><\/blockquote><p><strong>Van Gelderen et al. (2011):<\/strong> Flüssigkeits- und Worttraining erhöhte die Nutzung der Zielwörter, auch auf Textebene. Eine zweite Gruppe mit Fachwissen-Unterricht profitierte ebenfalls, weil sie Ideen besser generierte.<\/p><blockquote><p>„ein weiterer Indikator dafür, dass die Schreibsubprozesse sich gegenseitig beeinflussen“<\/p><cite>Breuer 2020, S. 27<\/cite><\/blockquote><p>Der New-Literacies-Ansatz (Kress 2009) und Hunma (2016) sehen Mehrsprachigkeit positiv. Vor unkritischem Einsatz warnt Gevers:<\/p><blockquote><p>„GEVERS (2018) warnt jedoch davor, translanguaging – also das Vermischen mehrerer Sprachen – unkritisch im Unterricht einzusetzen“<\/p><cite>Breuer 2020, S. 27<\/cite><\/blockquote>"}, {"titel": "11. Breuer: Ausführung (motorische Umsetzung)", "quelle": "Breuer 2020, S. 27–28", "html": "<p>Ausführung heißt: Tippen oder Handschreiben. Dieser Prozess wurde bisher wenig als eigener Gegenstand erforscht.<\/p><blockquote><p>„Dabei hat die reine Tippfähigkeit einen großen Einfluss auf die Erfolgsaussichten der anderen Schreibprozesse“<\/p><cite>Breuer 2020, S. 28<\/cite><\/blockquote><p>Die <em>copy task<\/em> (Van Waes et al. 2019) misst per Keylogging reine Ausführungsprozesse beim Abschreiben. In einer laufenden, unveröffentlichten Studie von Breuer schrieben bisher 323 Studierende je einen deutschen und einen englischen Text ab, aufgeteilt in vier Gruppen:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Gruppe<\/th><th>Beschreibung<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>monolinguale deutsche Studierende<\/td><\/tr><tr><td>2<\/td><td>bilinguale Studierende mit Deutsch als einer der beiden L1<\/td><\/tr><tr><td>3<\/td><td>Studierende mit Migrationshintergrund (mündliche L1 nicht Deutsch, erste Schriftsprache Deutsch)<\/td><\/tr><tr><td>4<\/td><td>FS-Studierende (Deutsch weder mündlich noch schriftlich L1)<\/td><\/tr><\/tbody><\/table><\/div><p>Gruppen 1 und 2 waren in beiden Sprachen wesentlich schneller als 3 und 4. Tiryakioglu/Hilton (2018) fanden bei türkisch-französisch bilingualen Schüler:innen die höchste Geschwindigkeit in der dominanten Bildungssprache Französisch.<\/p><blockquote><p>„Die ersten Ergebnisse im Bereich der reinen Ausführungsanalyse belegen somit, dass selbst die motorische Umsetzung des geplanten Textes in der FS nicht so automatisiert abläuft, wie sie es in der L1 tut.“<\/p><cite>Breuer 2020, S. 28<\/cite><\/blockquote>"}, {"titel": "12. Breuer: Revision", "quelle": "Breuer 2020, S. 29–31", "html": "<p>Revision ist der Abgleich des Textes mit den sprachlichen, semantischen und pragmatischen Besonderheiten des Schreibziels (Alamargot/Chanquoy 2001). Sie beginnt schon bei der Ideenwahl.<\/p><blockquote><p>„Er findet nicht ausschließlich nach dem Erstellen eines Textes statt, sondern beginnt bereits bei der Generierung und der Auswahl von Ideen“<\/p><cite>Breuer 2020, S. 29<\/cite><\/blockquote><p><strong>Zeitpunkt (Chenoweth/Hayes 2001):<\/strong><\/p><blockquote><p>„Für diese war es am effektivsten, den Text erst nach der Fertigstellung zu überarbeiten.“<\/p><cite>Breuer 2020, S. 29 (für FS-Schreibende; L1-Schreibende profitierten von aktiver Revision während der Produktion)<\/cite><\/blockquote><p><strong>Ebene der Revision:<\/strong> Bereiter/Scardamalia (1987: 22) beobachten bei Anfänger:innen, unsicheren Schreibenden und FS-Schreibenden eine Überarbeitung auf einem „cosmetic level of little more than proofreading“. Xu (2018) fand bei niedriger FS-Kompetenz mehr kleine, oberflächliche Revisionen.<\/p><blockquote><p>„Der Großteil der durchgeführten Korrekturen betraf orthographische Fehler, die meisten davon waren reine Tippfehler: bis zu 53,5% im FS-Text und 60,43% im L1-Text.“<\/p><cite>Breuer 2020, S. 29–30 (Studie Breuer 2017)<\/cite><\/blockquote><p><strong>Feedback unter Studierenden (Breuer 2016b, Fallstudie):<\/strong> Eine FS-Gruppe, eine L1-Peerberaterin und eine FS-Peerberaterin gaben je einer FS-Studierenden Feedback.<\/p><blockquote><p>„Einzig der FS-Peerberaterin gelang es, den Fokus auf die eigentlichen Schwachpunkte zu setzen und dies konstruktiv-kooperativ zu tun, sodass nach dem Gespräch über den Text eine echte (selbstständige) Überarbeitung stattfand.“<\/p><cite>Breuer 2020, S. 30<\/cite><\/blockquote><p><strong>Förderung (Van Steendam et al. 2014):<\/strong> Modelling (Strategie vorführen, dann anwenden) half beiden Gruppen, das Learning-to-write-Prinzip vor allem den weniger kompetenten Schreibenden.<\/p><blockquote><p>„Die kollaborative Überarbeitung in der Fremdsprache funktionierte durch das Auseinanderziehen der Prozesse (Methode separat lernen, beobachten, anwenden) generell besser als ein paralleles Arbeiten mit Selbstmonitoring“<\/p><cite>Breuer 2020, S. 31<\/cite><\/blockquote><blockquote><p>„Alle vorgestellten Studien demonstrieren, dass es Unterschiede in L1- und FS-Revision gibt, dass hier aber schon Ansätze für Methoden zur besseren Unterstützung existieren.“<\/p><cite>Breuer 2020, S. 31<\/cite><\/blockquote>"}, {"titel": "13. Breuer: Vergleich auf einen Blick (eigene Zusammenfassung)", "quelle": "Eigene Zusammenfassung der Abschnitte 2–6, nicht im Text enthalten", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Subprozess<\/th><th>Befund in der FS (laut Breuer)<\/th><th>Was hilft<\/th><\/tr><\/thead><tbody><tr><td>Ideen generieren<\/td><td>weniger und einfachere Ideen, abhängig von der FS-Kompetenz<\/td><td>L1 als Entlastung, freewriting, Ideenentwicklung getrennt vom Schreiben<\/td><\/tr><tr><td>Planen<\/td><td>einfache Pläne bei Sprachproblemen, Planen und Formulieren konkurrieren<\/td><td>Pre-task planning, Fokus auf einen Aspekt zur Zeit<\/td><\/tr><tr><td>Sprachliche Transformation<\/td><td>zusätzlicher Übersetzungsweg L1 → FS, L1-Interferenzen auch bei C1<\/td><td>Wort- und Flüssigkeitstraining, Fachwissen, metakognitives Wissen über die Übersetzung<\/td><\/tr><tr><td>Ausführung<\/td><td>langsamer und weniger automatisiert als in der L1<\/td><td>Tippfertigkeit, Schreibübung<\/td><\/tr><tr><td>Revision<\/td><td>überwiegend lokal und oberflächlich, Textstruktur bleibt meist unberührt<\/td><td>Revision nach der Fertigstellung, Modelling, Peerberatung mit Fokus auf Schwachpunkte<\/td><\/tr><\/tbody><\/table><\/div><p>Verknüpfung mit anderen Texten: Das knappe Arbeitsgedächtnis steht auch im [[kellogg-modell|Kellogg-Modell]] im Zentrum, und die Unterscheidung zwischen einfachem und transformierendem Schreiben ([[knowledge-telling|knowledge telling]]) wird bei Schnell ausführlich erklärt (Sitzung 3).<\/p>"}, {"titel": "14. Zusammenhang der Texte (eigene Verknüpfung)", "quelle": "Eigene Verknüpfung, nicht in den Texten enthalten", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Thema<\/th><th>Schnell (Plan)<\/th><th>Ergänzung<\/th><\/tr><\/thead><tbody><tr><td>Prozessmodell<\/td><td>Hayes/Flower 1980/81, Kritik und Hayes 1996<\/td><td>Breuer: fünf Subprozesse, L1 und FS im Vergleich<\/td><\/tr><tr><td>Arbeitsgedächtnis<\/td><td>2.1.2 mit Verweis auf Kellogg 1996<\/td><td>Kellogg: Modellbeschreibung, S. 161–165<\/td><\/tr><tr><td>Selbstregulation<\/td><td>2.1.3 mit Verweis auf Zimmerman/Kitsantas 2006<\/td><td>Zimmerman/Kitsantas, S. 53–59<\/td><\/tr><\/tbody><\/table><\/div><p class=\"meta\">Ob Kellogg, Zimmerman/Kitsantas und Breuer zur Sitzung am 20.10. gehören, ist eine Annahme: Der Seminarplan nennt nur Schnell als Vorbereitungstext. Die Zuordnung folgt den Verweisen in Schnells Text.<\/p>"}], "zusatz": [], "material": [{"datei": "Schnell_2020_Schreibprozesse und Schreibentwicklung in der Fremdsprache_Vorbereitungstext.pdf", "art": "Lektüre", "notiz": "Abschnitt 2.1 L1-Schreiben, S. 22–40 und 65–69 (Vorbereitungstext laut Seminarplan)"}, {"datei": "Modellbeschreibung_Kellog 1996.pdf", "art": "Lektüre", "notiz": "Modell von 1996, S. 161–165"}, {"datei": "Modellbeschreibung_Zimmerman_Kitsantas 2006.pdf", "art": "Lektüre", "notiz": "A Writer's Discipline, S. 53–59"}, {"datei": "Breuer 2020_L2-Schreiben Ideen generieren.pdf", "art": "Lektüre", "notiz": "Abschnitt 2, S. 22–24"}, {"datei": "Breuer 2020_ L2-Schreiben Text planen.pdf", "art": "Lektüre", "notiz": "Abschnitt 3, S. 24–26"}, {"datei": "Breuer 2020_L2-Schreiben Sprachliche Transformation u. Ausführung.pdf", "art": "Lektüre", "notiz": "Abschnitte 4 und 5, S. 26–28"}, {"datei": "Breuer 2020_L2-Schreiben Revision.pdf", "art": "Lektüre", "notiz": "Abschnitt 6, S. 29–31"}], "begriffe": ["hayes-flower", "kellogg-modell", "arbeitsgedaechtnis", "selbstregulation-schreiben", "schreibblockade", "schreibsubprozesse", "l1-entlastung", "freewriting", "pre-task-planning", "copy-task", "revision", "translanguaging", "schreiben-als-denken", "knowledge-telling"]}, {"id": "schreiben-s3", "nr": 3, "seminar": "schreiben", "titel": "Schreibentwicklung und Schreibstrategien", "autor": "Schnell", "lektuere": "Schnell 2020, S. 40–51 und 70–75 (Vorbereitungstext)", "thema": "Schreibstrategien (knowledge telling, transforming, crafting) und Schreibentwicklung von Novizen zu Expert:innen", "status": "entwurf", "ueberblick": {"kurzinhalt": "Schnell beschreibt, wie sich Schreibstrategien und Schreibkompetenz entwickeln. Novizen arbeiten eher mit [[knowledge-telling|knowledge telling]], geübte Schreibende mit [[knowledge-transforming|knowledge transforming]], Expert:innen zusätzlich mit [[knowledge-crafting|knowledge crafting]]. Dazu kommen Strategietypen wie Brain-stormer und Outliner und Stufenmodelle der [[schreibentwicklung-bereiter|Schreibentwicklung]].", "leitfrage": "Wie unterscheiden sich Novizen und Expert:innen beim Schreiben, und wie entwickelt sich Schreibkompetenz?", "merksatz": "Wer Schreiben lernt, automatisiert Teilprozesse, damit Aufmerksamkeit für höhere Aufgaben frei wird, und lernt, den eigenen Prozess zu steuern.", "fa": ["نوآموزان بیشتر «دانش‌گویی» (knowledge telling) می‌کنند: هر چه به ذهن می‌آید خطی می‌نویسند. خبرگان «دانش‌دگرگونی» (knowledge transforming) می‌کنند: دانش را با توجه به هدف متن بازسازی می‌کنند.", "مرحله‌ی سوم، «دانش‌پرداخت» (knowledge crafting) است: نویسنده خواننده را همیشه در نظر دارد. به گفته‌ی اشنل این سطح تقریباً بیست سال تمرین نوشتن می‌خواهد.", "راهبرد نوشتن چیزی وابسته به تکلیف و فرد است؛ مثلاً «طوفان‌فکری‌کننده‌ها» سریع می‌نویسند و بعد بارها بازنویسی می‌کنند و «طرح‌ریزان» اول طولانی طرح می‌ریزند.", "رشد نوشتن ترتیب طبیعی ثابتی ندارد (برایتر)؛ خودکارشدن مهارت‌های پایه ظرفیت را برای مهارت‌های بالاتر آزاد می‌کند."]}, "inhalt": [{"titel": "1. Schnell: Schreibstrategien (Abschnitt 2.1.4)", "quelle": "Schnell 2020, S. 40–51", "html": "<p>Die Strategieforschung sah sich zunächst als Weg, Lernenden wenige Strategien beizubringen, die dann in vielen Gebieten helfen. Die Kognitionspsychologie zeigte aber, dass kognitive Operationen stärker an aufgabenbezogenes und inhaltliches Wissen gebunden sind.<\/p><h4>Bereiter/Scardamalia (1987): knowledge telling und knowledge transforming<\/h4><blockquote><p>„Die Grundfiguren des Modells sind die Knowledge-telling-Strategie und die Knowledge-transforming-Strategie.“<\/p><cite>Schnell 2020, S. 41<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th><\/th><th>[[knowledge-telling|knowledge telling]]<\/th><th>[[knowledge-transforming|knowledge transforming]]<\/th><\/tr><\/thead><tbody><tr><td>Wer<\/td><td>vor allem Schreibnovizen<\/td><td>vor allem Schreibexpert:innen<\/td><\/tr><tr><td>Vorgehen<\/td><td>Schlüsselbegriffe zu Thema und Genre aus dem Gedächtnis abrufen und linear aneinanderreihen, ohne größere Planung<\/td><td>Textziele und Textmuster steuern das Schreiben; Inhalts- und Diskurswissen werden aufeinander bezogen<\/td><\/tr><tr><td>Funktion<\/td><td>ähnelt dem assoziativen oder expressiven Schreiben<\/td><td>aktiviert die epistemisch-heuristische (erkenntnisfördernde) Funktion<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Durch ein simples lineares Aneinanderreihen werden diese Informationen ohne größere erkennbare Organisationsprozesse miteinander verbunden.“<\/p><cite>Schnell 2020, S. 42<\/cite><\/blockquote><blockquote><p>„Bei dieser problemorientierten Herangehensweise wird die epistemisch-heuristische (erkenntnisfördernde) Funktion des Schreibens aktiviert“<\/p><cite>Schnell 2020, S. 43<\/cite><\/blockquote><p>Beide Strategien sind integriert gedacht: Das gesamte knowledge telling ist als Unterprozess in das knowledge transforming eingebunden. Wichtig ist die Einschränkung:<\/p><blockquote><p lang=\"en\">“it is possible to write well or poorly following either model”<\/p><cite>Schnell 2020, S. 43 (Bereiter/Scardamalia 1987: 5)<\/cite><\/blockquote><blockquote><p>„Dieses bietet eine Erklärung dafür, dass die kognitiv-emotionale Belastung auch bei versierten Schreibenden nicht zwingend abnimmt, sondern u. U. sogar zunehmen kann“<\/p><cite>Schnell 2020, S. 43<\/cite><\/blockquote><h4>Kellogg (2008): knowledge crafting<\/h4><p>Als dritte Stufe ergänzt Kellogg das [[knowledge-crafting|knowledge crafting]]. Schreibende können dabei zusätzlich über Wissen, Argumentation und Adressaten reflektieren. Das gelingt laut Kellogg meist erst nach etwa zwanzig Jahren Schreibpraxis.<\/p><blockquote><p lang=\"en\">“Regardless of the particular composition strategy employed, what characterizes the knowledge-crafting of expert writers is the capacity to keep in mind how a reader would interpret the text as well as representing the author’s ideas and what the text says, in its present form, communicates to the author and to the reader”<\/p><cite>Schnell 2020, S. 44 (zitiert Kellogg 2008, S. 10)<\/cite><\/blockquote><h4>Weitere Befunde und Typologien<\/h4><ul class=\"plain\"><li><strong>Hayes/Flower (1981):<\/strong> Erfolgreiche Schreibende halten die Repräsentation der Aufgabe und die Leserschaft im Blick. Manche vereinfachen das Problem radikal (z. B. „write another theme for English class“), was ein Risiko ist.<\/li><li><strong>Reid (1984):<\/strong> zwei Typen, radical brain-stormer (wenig Vorplanung, mehrfach überarbeiten) und radical outliner (sehr detaillierte Planung, spätes Schreiben).<\/li><li><strong>Ortner (2000):<\/strong> zehn idealtypische Schreibstrategien aus Selbstbeschreibungen von Schriftstellern, z. B. „Einen Text zu einer Idee schreiben“, „Planendes Schreiben“, „Schrittweises, produktionslogisches Vorgehen“ (Sammeln, Disponieren, Konzipieren, Gliedern, Formulieren, Korrigieren).<\/li><li><strong>Deutschsprachige Studien:<\/strong> Molitor-Lübbert (1985), Becker-Mrotzek (1992, 2004), Perrin (2001), Reimann (1989). Strategien sind vor allem aufgabenabhängig, aber auch personenabhängig.<\/li><\/ul><blockquote><p>„people only solve the problems they define for themselves“<\/p><cite>Schnell 2020, S. 45 (zitiert Hayes/Flower 1981: 372)<\/cite><\/blockquote><blockquote><p>„Ich begreife eine Strategie als ein Verfahren, das Feld der Aufmerksamkeit zu erweitern“<\/p><cite>Schnell 2020, S. 47 (Ortner 2000: 352)<\/cite><\/blockquote><blockquote><p>„Insgesamt weisen die meisten Ergebnisse der Untersuchungen zu Schreibstrategien darauf hin, dass sich situationsbedingte, aufgaben- und personenspezifische Parameter erheblich voneinander unterscheiden können, ohne dass dadurch Rückschlüsse auf bessere oder schlechtere Produkte gezogen werden können“<\/p><cite>Schnell 2020, S. 50<\/cite><\/blockquote>"}, {"titel": "2. Schnell: Schreibentwicklung (Abschnitt 2.1.7)", "quelle": "Schnell 2020, S. 70–75", "html": "<p>Bereiters Modell (1980) mit fünf Stufen ist theoretisch begründet, nicht empirisch (Übersetzungen nach Zuchewicz 2001):<\/p><div class=\"tablewrap\"><table><thead><tr><th>Stufe (englisch)<\/th><th>Deutsch<\/th><th>Kern<\/th><\/tr><\/thead><tbody><tr><td>Associative writing<\/td><td>Assoziatives Schreiben<\/td><td>Ideen aufschreiben, wie sie einfallen; reines knowledge telling<\/td><\/tr><tr><td>Performative writing<\/td><td>Regelgemäßes Schreiben<\/td><td>zusätzlich auf Orthografie, Syntax, Stil, Textsortenwissen achten<\/td><\/tr><tr><td>Communicative writing<\/td><td>Kommunikatives Schreiben<\/td><td>Wirkung auf Adressaten wird mitgedacht<\/td><\/tr><tr><td>Unified writing<\/td><td>Authentisch-gestaltendes (reflektiertes) Schreiben<\/td><td>eigener Stil und kritischer Standpunkt; Perspektivwechsel Schreibende/Lesende (writing-reading feedback loop)<\/td><\/tr><tr><td>Epistemic writing<\/td><td>Epistemisches Schreiben<\/td><td>Gedanken umstrukturieren, neue Zusammenhänge erarbeiten, Erkenntnis erweitern<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Es handelt sich um reines knowledge telling“<\/p><cite>Schnell 2020, S. 70 (zu associative writing)<\/cite><\/blockquote><blockquote><p lang=\"en\">“there is no natural order of writing development”<\/p><cite>Schnell 2020, S. 71 (Bereiter 1980: 89)<\/cite><\/blockquote><p>Die Stufen sind also keine feste Abfolge. Wichtig ist die Automatisierung der Grundprozesse, damit Aufmerksamkeit für weitere Teilfähigkeiten frei wird. Kritik: Das Modell erklärt nicht, wie der Übergang zum knowledge transforming gelingt (Hyland 2011, Becker-Mrotzek 2004).<\/p><blockquote><p lang=\"en\">“do not explain, however, how novices make the cognitive transition to a knowledge-transforming model”<\/p><cite>Schnell 2020, S. 72 (Hyland 2011: 19)<\/cite><\/blockquote><p><strong>Studierende:<\/strong> Pohl (2007) fand komplexere Problemrepräsentationen bei wachsender Schreibfähigkeit. Steinhoff (2007) beschreibt drei Stufen der Schreibkompetenz im Studium:<\/p><blockquote><p>„Zu Anfang des Studiums kommt es zu einer Imitation wissenschaftlicher Stilmittel.“<\/p><cite>Schnell 2020, S. 73<\/cite><\/blockquote><blockquote><p>„Am Ende der Schreibkompetenzentwicklung steht dann ein kontextadäquater Sprachgebrauch, der keine Anzeichen mehr von Imitation aufweist.“<\/p><cite>Schnell 2020, S. 73<\/cite><\/blockquote><blockquote><p>„Hinzu kommt, dass die Anforderungen, die Schreibende mit zunehmender Schreibexpertise an sich selbst stellen, steigen und dass es dadurch im Hinblick auf die Schreibentwicklung keinen Endpunkt gibt.“<\/p><cite>Schnell 2020, S. 75<\/cite><\/blockquote>"}, {"titel": "3. Verknüpfung mit Sitzung 2 (eigene Zusammenfassung)", "quelle": "Eigene Verknüpfung, nicht in den Texten enthalten", "html": "<ul class=\"plain\"><li>Das knappe Arbeitsgedächtnis (Sitzung 2) erklärt, warum Novizen beim Formulieren keine Kapazität für Planung und Leserperspektive haben und eher beim knowledge telling bleiben.<\/li><li>Die Selbstregulation nach Zimmerman/Kitsantas (Sitzung 2) entspricht dem, was Schnell als Strategiewahl und Steuerung des eigenen Prozesses beschreibt.<\/li><li>Rose und Keseling (Sitzung 2, Schreibschwierigkeiten) führen Blockaden auf starre oder ineffektive Strategien zurück. Das passt zur Strategieforschung in dieser Sitzung.<\/li><\/ul>"}], "zusatz": [], "material": [{"datei": "Schnell_2020_Schreibprozesse und Schreibentwicklung in der Fremdsprache_Vorbereitungstext 3. Sitzung.pdf", "art": "Lektüre", "notiz": "Abschnitte 2.1.4 (S. 40–51) und 2.1.7 (S. 70–75). Eine zweite Fassung ohne „3. Sitzung“ im Namen enthält S. 22–40 und 65–69 und gehört zu Sitzung 2."}], "begriffe": ["knowledge-telling", "knowledge-transforming", "knowledge-crafting", "schreibstrategie", "schreibentwicklung-bereiter", "epistemisches-schreiben"]}], "glossar": [{"id": "erzaehlen-erzaehltes", "term": "das Erzählte und das Erzählen", "kurz": "Die Grundunterscheidung: Was wird erzählt, und wie?", "def": "Das Erzählte ist die Geschichte mit ihrer Welt. Das Erzählen ist die Art, wie sie vermittelt wird: Sprache, Stil, Reihenfolge, Perspektive. Man trennt beides, auch wenn man bei Fiktion nur über den Text Zugang zur Welt hat.", "zitate": [{"t": "Wenn und solange wir eine solche Lesehaltung einnehmen, konzentrieren wir uns auf das, was uns erzählt wird, und blenden die Art und Weise, wie die Geschichte vermittelt wird, aus dem Bereich unserer Aufmerksamkeit aus.", "s": "S. 22", "q": "Martínez/Scheffel"}, {"t": "Eine Geschichte, die wir als dieselbe Geschichte wiedererkennen, kann auf unzählige verschiedene Weisen präsentiert werden.", "s": "S. 23", "q": "Martínez/Scheffel"}], "kafka": "Erzählt wird: Ein Mann wartet vor einem Tor, bis er stirbt. Das Erzählen ist ein Erzähler in der dritten Person, im Präsens, mit knappen Sätzen.", "see": ["erzaehlte-welt", "darstellung", "handlung"], "sitzungen": ["erz-s3"], "hinweis": null, "seminare": ["erz"], "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 22", "S. 23"]}]}, {"id": "erzaehlte-welt", "term": "die erzählte Welt (Diegese)", "kurz": "Alles, was in der Geschichte existiert, nicht nur das für die Handlung Wichtige.", "def": "Die erzählte Welt umfasst Figuren, Orte und die Regeln der Geschichte. Sie ist weiter gefasst als die Handlung. Der Begriff „Diegese“ kommt aus der Filmtheorie und wurde von Genette übernommen (Fußnote S. 26).", "zitate": [{"t": "… dem engeren Begriff der Handlung, der sich nur auf die Gesamtheit der handlungsfunktionalen Elemente der dargestellten Welt bezieht.", "s": "S. 26", "q": "Martínez/Scheffel"}], "kafka": "Zur Welt gehören auch Dinge, die nie ins Geschehen eingreifen: <span class=\"kq\">„Von Saal zu Saal stehn aber Türhüter, einer mächtiger als der andere.“<\/span> Ob es diese Türhüter gibt, wissen wir nur durch die Worte des Türhüters.", "see": ["handlung", "erzaehlen-erzaehltes"], "sitzungen": ["erz-s3"], "hinweis": null, "seminare": ["erz"], "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 26"]}]}, {"id": "handlung", "term": "die Handlung", "kurz": "Nur die handlungsfunktionalen Elemente der erzählten Welt.", "def": "Zur Handlung zählt, was für den Verlauf des Geschehens wichtig ist. Das Buch gliedert sie in vier Ebenen: Ereignis, Geschehen, Geschichte, Handlungsschema.", "zitate": [{"t": "… dem engeren Begriff der Handlung, der sich nur auf die Gesamtheit der handlungsfunktionalen Elemente der dargestellten Welt bezieht.", "s": "S. 26", "q": "Martínez/Scheffel"}], "kafka": "Handlungsfunktional ist der Anblick des Türhüters, denn der Mann entscheidet sich seinetwegen zu warten: <span class=\"kq\">„entschließt er sich, doch lieber zu warten“<\/span>.", "see": ["erzaehlte-welt", "ereignis", "geschehen", "geschichte", "handlungsschema"], "sitzungen": ["erz-s3"], "hinweis": null, "seminare": ["erz"], "lexikon": [{"t": "Summe des Geschehens in einem Drama, Film oder Erzählwerk; die Folge der Hauptbegebenheiten.", "q": "Reallexikon der deutschen Literaturwissenschaft, s. v. Handlung", "s": "PDF-S. 804"}], "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 26"]}]}, {"id": "darstellung", "term": "die Darstellung", "kurz": "Die Seite des „Wie“: die Art der Vermittlung der erzählten Welt.", "def": "Das Buch teilt die Darstellung in zwei Ebenen: die Erzählung (Reihenfolge und Tempo der Ereignisse) und das Erzählen (Sprache, Medium, Erzählsituation, Stil).", "zitate": [{"t": "Die andere Seite der Opposition, also die Art und Weise der Vermittlung der erzählten Welt, bezeichnen wir als Darstellung.", "s": "S. 26", "q": "Martínez/Scheffel"}], "kafka": "Darstellung bei Kafka: Zeitraffer, Präsens, ein Erzähler, der in den Mann hineinsieht, aber den Türhüter von außen zeigt.", "see": ["erzaehlung", "erzaehlen"], "sitzungen": ["erz-s3"], "hinweis": null, "seminare": ["erz"], "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 26"]}]}, {"id": "fiktionale-behauptungssaetze", "term": "fiktionale Behauptungssätze", "kurz": "Sätze im Text beziehen sich auf Tatsachen der erzählten Welt.", "def": "In einem fiktionalen Text stellen Sätze etwas als Tatsache hin. Diese Tatsachen gelten in der erzählten Welt, unabhängig davon, ob der Leser sie für wirklich hält.", "zitate": [{"t": "Fiktionale Behauptungssätze enthalten eine Referenz auf Tatsachen der durch sie erzählten Welt, unabhängig davon, ob der Leser diese zeitweise für Gegebenheiten seiner objektiven Wirklichkeit nimmt oder nicht.", "s": "S. 24", "q": "Martínez/Scheffel"}], "kafka": "In der erzählten Welt steht das Tor offen: <span class=\"kq\">„Da das Tor zum Gesetz offensteht wie immer“<\/span>. Das ist dort eine Tatsache, obwohl wir die Geschichte als Gleichnis lesen.", "see": ["erzaehlte-welt"], "sitzungen": ["erz-s3"], "hinweis": null, "seminare": ["erz"], "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 24"]}]}, {"id": "fabula-sjuzet", "term": "fabula und sjužet (Tomaševskij)", "kurz": "Russischer Formalismus: Die Ereignisse selbst (fabula) und ihre Anordnung im Werk (sjužet).", "def": "Die fabula ordnet die Motive logisch und nach Ursache und Zeit. Das sjužet betrifft nur die Reihenfolge, in der die Motive im Werk stehen.", "zitate": [{"t": "die Gesamtheit der Motive in ihrer logischen, kausal-temporalen Verknüpfung", "s": "S. 25", "q": "Tomaševskij über die fabula, zitiert bei Martínez/Scheffel"}, {"t": "die Gesamtheit derselben Motive in derjenigen Reihenfolge und Verknüpfung, in der sie im Werk vorliegen", "s": "S. 25", "q": "Tomaševskij über das sjužet, zitiert bei Martínez/Scheffel"}], "kafka": "Die Reihenfolge ist chronologisch (kommen, bitten, warten, fragen, sterben). fabula und sjužet sind daher fast gleich.", "see": ["histoire-discours", "genette"], "sitzungen": ["erz-s3"], "hinweis": null, "seminare": ["erz"], "lexikon": [{"t": "Modellhaftes Handlungssubstrat oder Kompositionsschema eines Textes; sein Hauptgegenstand (Thema, Motiv, Stoff bzw. Hauptfigur).", "q": "Reallexikon der deutschen Literaturwissenschaft, s. v. Sujet", "s": "PDF-S. 2143"}], "herkunft": [{"q": "Tomaševskij über die fabula, zitiert bei Martínez/Scheffel", "s": ["S. 25"]}, {"q": "Tomaševskij über das sjužet, zitiert bei Martínez/Scheffel", "s": ["S. 25"]}]}, {"id": "histoire-discours", "term": "histoire und discours (Todorov, Benveniste)", "kurz": "Todorov: das Erzählte (histoire) und die Art, wie der Erzähler es uns vermittelt (discours).", "def": "Todorov übernimmt das Paar der Formalisten. Der discours ist weiter gefasst als das sjužet: Er umfasst auch Perspektive, Stil und Modus. Benveniste hatte ursprünglich einen sprachlichen Unterschied gemeint: Erzählformen ohne und mit deutlich hervortretender Sprecherinstanz (S. 25).", "zitate": [{"t": "Dieselbe Geschichte hätte uns auch auf andere Weise vermittelt werden können, beispielsweise durch einen Film", "s": "S. 25", "q": "Todorov über die histoire, zitiert bei Martínez/Scheffel"}, {"t": "… umfasst Todorovs ‹discours› stattdessen den gesamten Bereich der literarischen Vermittlung eines Geschehens (d. h. außer der Anordnung der Ereignisse auch Perspektive, Stil, Modus usw.)", "s": "S. 25", "q": "Martínez/Scheffel"}], "kafka": "Als histoire könnte man „Vor dem Gesetz“ auch als Film erzählen. Zum discours gehört, dass wir die Ereignisse mit dem Mann zusammen erleben und seine Gedanken kennen.", "see": ["fabula-sjuzet", "genette", "darstellung"], "sitzungen": ["erz-s3"], "hinweis": null, "seminare": ["erz"], "herkunft": [{"q": "Todorov über die histoire, zitiert bei Martínez/Scheffel", "s": ["S. 25"]}, {"q": "Martínez/Scheffel", "s": ["S. 25"]}]}, {"id": "genette", "term": "Genettes Dreiteilung: Geschichte, Erzählung, Narration", "kurz": "Gérard Genette unterscheidet histoire, récit und narration.", "def": "Die Geschichte (histoire) ist der narrative Inhalt. Die Erzählung (récit) ist der Text selbst. Die Narration ist der produzierende narrative Akt, also das Erzählen, auch in seiner (realen oder fiktiven) Situation. Martínez/Scheffel nehmen diese Idee als Anregung, die Seite der Darstellung weiter zu unterteilen.", "zitate": [{"t": "das Signifikat oder den narrativen Inhalt", "s": "S. 26", "q": "Genette über die Geschichte, zitiert bei Martínez/Scheffel"}, {"t": "den Signifikanten, die Aussage [‹énoncé›], den narrativen Text oder Diskurs", "s": "S. 26", "q": "Genette über die Erzählung, zitiert bei Martínez/Scheffel"}, {"t": "produzierenden narrativen Akt", "s": "S. 26", "q": "Genette über die Narration, zitiert bei Martínez/Scheffel"}], "kafka": "Geschichte: das Geschehen um Mann und Türhüter. Erzählung: der Text „Vor dem Gesetz“. Narration: das Erzählen selbst, etwa der Erzähler, der „sagt“ und „denkt er“ berichtet.", "see": ["histoire-discours", "erzaehlung", "erzaehlen"], "sitzungen": ["erz-s3"], "hinweis": "Das Wort „Erzählung“ steht bei Genette (récit, der Text) und bei Martínez/Scheffel (Ebene 5, die Reihenfolge der Ereignisse) in ähnlichen Positionen, wird aber nicht automatisch gleich verwendet. Die Tabelle auf S. 28 zeigt, wie unterschiedlich die Autoren ihre Wörter verteilen.", "seminare": ["erz"], "herkunft": [{"q": "Genette über die Geschichte, zitiert bei Martínez/Scheffel", "s": ["S. 26"]}, {"q": "Genette über die Erzählung, zitiert bei Martínez/Scheffel", "s": ["S. 26"]}, {"q": "Genette über die Narration, zitiert bei Martínez/Scheffel", "s": ["S. 26"]}]}, {"id": "ereignis", "term": "das Ereignis (Motiv)", "kurz": "Ebene 1: die kleinste Einheit der Handlung.", "def": "Ein Ereignis oder Motiv ist die elementare Einheit eines narrativen Textes im Bereich der Handlung.", "zitate": [{"t": "Die elementare Einheit eines narrativen Textes im Bereich der Handlung ist das Ereignis oder Motiv.", "s": "S. 27", "q": "Martínez/Scheffel"}], "kafka": "<span class=\"kq\">„Der Türhüter gibt ihm einen Schemel“<\/span> ist ein Ereignis, ebenso das Bestechen oder das Winken kurz vor dem Tod.", "see": ["geschehen", "handlung"], "sitzungen": ["erz-s3"], "hinweis": null, "seminare": ["erz"], "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 27"]}]}, {"id": "geschehen", "term": "das Geschehen", "kurz": "Ebene 2: Ereignisse, die nur zeitlich aufeinander folgen.", "def": "Ein Geschehen entsteht, wenn Ereignisse chronologisch aneinandergereiht werden. Es gibt noch keinen Grund-Folge-Zusammenhang.", "zitate": [{"t": "Auf einer ersten Integrationsstufe erscheinen Ereignisse zu einem Geschehen aneinandergereiht, indem sie chronologisch aufeinander folgen.", "s": "S. 27", "q": "Martínez/Scheffel"}], "kafka": "Der Mann kommt, bittet, wartet, fragt, stirbt: ein „und dann“.", "see": ["ereignis", "geschichte"], "sitzungen": ["erz-s3"], "hinweis": "In der Tabelle auf S. 28 heißt bei Forster das Geschehen „story“ und die Geschichte „plot“. Gleiche Wörter können in anderen Theorien etwas anderes bedeuten.", "seminare": ["erz"], "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 27"]}]}, {"id": "geschichte", "term": "die Geschichte", "kurz": "Ebene 3: Ereignisse mit kausalem Zusammenhang.", "def": "Zur Geschichte wird das Geschehen, wenn die Ereignisse nicht nur aufeinander, sondern auch auseinander folgen. Es gibt also ein „weil“.", "zitate": [{"t": "… wenn die Ereignisfolge zusätzlich zum chronologischen auch einen kausalen Zusammenhang aufweist, so dass die Ereignisse nicht nur aufeinander, sondern auch auseinander folgen.", "s": "S. 27", "q": "Martínez/Scheffel"}], "kafka": "Weil der Mann den Türhüter genauer ansieht, <span class=\"kq\">„entschließt er sich, doch lieber zu warten“<\/span>. Weil er wartet, stirbt er vor dem Tor.", "see": ["geschehen", "handlungsschema"], "sitzungen": ["erz-s3"], "hinweis": "Nicht mit „Geschichte“ im Sinne von Genette (histoire) verwechseln: Dort ist der ganze narrative Inhalt gemeint. Bei Martínez/Scheffel ist es eine bestimmte Ebene der Handlung (Tabelle S. 28).", "seminare": ["erz"], "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 27"]}]}, {"id": "handlungsschema", "term": "das Handlungsschema", "kurz": "Ebene 4: ein abstraktes Muster, das für Textgruppen typisch sein kann.", "def": "Das Handlungsschema ist ein aus allen erzählten Ereignissen abstrahiertes globales Schema. Es kann für ganze Textgruppen wie Gattungen charakteristisch sein und gibt der Geschichte Anfang, Mitte, Ende und eine sinnhafte Struktur.", "zitate": [{"t": "Durch die Integration in ein Handlungsschema erhält die Geschichte eine abgeschlossene (Anfang, Mitte, Ende) und sinnhafte (z. B. archetypische) Struktur.", "s": "S. 27", "q": "Martínez/Scheffel"}], "kafka": "Mögliches Schema: Ein Suchender kommt an eine Schwelle, wartet und scheitert (eigene Deutung).", "see": ["geschichte", "handlung"], "sitzungen": ["erz-s3"], "hinweis": null, "seminare": ["erz"], "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 27"]}]}, {"id": "erzaehlung", "term": "die Erzählung (Ebene 5)", "kurz": "Die Ereignisse in der Reihenfolge, in der der Text sie darstellt.", "def": "Die Erzählung unterscheidet sich von der chronologisch rekonstruierten Handlung durch die Gestaltung und zeitliche Umgruppierung der Ereignisse im Text, etwa durch Erzähltempo, Rückwendung und Vorausdeutung.", "zitate": [{"t": "Die erzählten Ereignisse in der Reihenfolge ihrer Darstellung im Text.", "s": "S. 27", "q": "Martínez/Scheffel"}], "kafka": "Beginn ohne Einleitung, Jahre in einem Satz (<span class=\"kq\">„Dort sitzt er Tage und Jahre.“<\/span>), eine kleine Vorausdeutung (<span class=\"kq\">„Nun lebt er nicht mehr lange.“<\/span>).", "see": ["erzaehltempo", "erzaehlen", "genette"], "sitzungen": ["erz-s3"], "hinweis": null, "seminare": ["erz"], "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 27"]}]}, {"id": "erzaehlen", "term": "das Erzählen (Ebene 6)", "kurz": "Die Präsentation der Geschichte in Sprache, Medium und Darstellungsverfahren.", "def": "Zum Erzählen gehören die Sprache, das Medium (z. B. rein sprachlich oder audio-visuell) und Darstellungsverfahren wie Erzählsituation oder Sprachstil.", "zitate": [{"t": "Die Präsentation der Geschichte und die Art und Weise dieser Präsentation in bestimmten Sprachen, Medien (z. B. rein sprachliche oder audio-visuelle) und Darstellungsverfahren (z. B. Erzählsituation oder Sprachstil).", "s": "S. 28", "q": "Martínez/Scheffel"}], "kafka": "Ein Erzähler in der dritten Person, Präsens (eigene Beobachtung), Einblick in die Gedanken des Mannes: <span class=\"kq\">„denkt er“<\/span>.", "see": ["erzaehlung", "darstellung"], "sitzungen": ["erz-s3"], "hinweis": null, "seminare": ["erz"], "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 28"]}]}, {"id": "erzaehltempo", "term": "Erzähltempo, Rückwendung, Vorausdeutung", "kurz": "Drei Möglichkeiten, die Zeit im Text zu gestalten (genannt bei Ebene 5).", "def": "Das Buch nennt diese Begriffe auf S. 27 als Beispiele für die zeitliche Umgruppierung der Ereignisse. Kurz gesagt: das Tempo, mit dem erzählt wird, der Sprung zurück und der Hinweis auf Späteres. Ausführlich folgen sie im Kapitel zum „Wie“.", "zitate": [{"t": "(Erzähltempo, Rückwendung, Vorausdeutung)", "s": "S. 27", "q": "Martínez/Scheffel"}], "kafka": "Tempo: viele Jahre in einem Satz (<span class=\"kq\">„Dort sitzt er Tage und Jahre.“<\/span>). Vorausdeutung: <span class=\"kq\">„Nun lebt er nicht mehr lange.“<\/span> Eine Rückwendung gibt es kaum.", "see": ["erzaehlung"], "sitzungen": ["erz-s3"], "hinweis": null, "seminare": ["erz"], "herkunft": [{"q": "Martínez/Scheffel", "s": ["S. 27"]}]}, {"id": "summative-evaluation", "term": "summative Evaluation", "kurz": "Misst im Nachhinein, was erreicht wurde, und dient der Benotung.", "def": "Formelle, geplante Bewertung am Ende einer Unterrichtseinheit (Woche, Monat, Semester oder Jahr). Neuere Bezeichnung: Assessment of Learning.", "zitate": [{"t": "Die summative Evaluation misst im Nachhinein, was von Einzelpersonen oder auch Gruppen erreicht wurde", "s": "S. 83", "q": "Moser-Frötscher 2025"}], "beispiel": "Abitur, Sprachzertifikate und Klassenarbeiten sind summative Prüfungen.", "see": ["formative-evaluation", "high-low-stakes"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null, "herkunft": [{"q": "Moser-Frötscher 2025", "s": ["S. 83"]}]}, {"id": "formative-evaluation", "term": "formative Evaluation", "kurz": "Prüft den Fortschritt während des Lernens, um Unterricht und Feedback anzupassen.", "def": "Neuere Bezeichnung: Assessment for Learning. Ziel ist, den nachfolgenden Unterricht abzustimmen und den Schüler:innen Feedback zu geben.", "zitate": [{"t": "Die kontrastive Unterscheidung zwischen summativer und formativer Evaluation stellt jedoch eine starke Vereinfachung dieser beiden Konstrukte sowie ihrer Beziehung zueinander dar", "s": "S. 83", "q": "Moser-Frötscher 2025"}], "beispiel": "Nach Harlen kann dieselbe Information formativ oder summativ sein, je nach Zweck.", "see": ["summative-evaluation", "learning-oriented-assessment"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null, "herkunft": [{"q": "Moser-Frötscher 2025", "s": ["S. 83"]}]}, {"id": "learning-oriented-assessment", "term": "Learning-Oriented Assessment", "kurz": "Modell, in dem formative und summative Zugänge eng verwoben sind.", "def": "Nach Jones/Saville (2016) steht das erfolgreiche Sprachenlernen im Fokus jeglicher Prüfungsaktivitäten.", "zitate": [{"t": "Im Modell des lerner:innenorientierten Prüfens (Learning-Oriented Assessment, Jones/ Saville 2016) sind formative und summative Zugänge eng miteinander verwoben", "s": "S. 83", "q": "Moser-Frötscher 2025"}], "beispiel": "Der Text stellt es als Antwort auf die starre Gegenüberstellung summativ/formativ vor.", "see": ["formative-evaluation", "summative-evaluation"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null, "herkunft": [{"q": "Moser-Frötscher 2025", "s": ["S. 83"]}]}, {"id": "ealta-leitfragen", "term": "EALTA-Leitfragen", "kurz": "Leitfragen für gute Prüfungspraxis in drei Bereichen.", "def": "Die Richtlinien der European Association for Language Testing and Assessment (EALTA 2006) betreffen (1) Prüfungszweck und Spezifikation, (2) Prüfungsverfahren und (3) Konsequenzen.", "zitate": [{"t": "Diese betreffen (1) Prüfungszweck und Spezifikation; (2) Prüfungsverfahren, und (3) Konsequenzen.", "s": "S. 85", "q": "Moser-Frötscher 2025"}], "beispiel": "Die Seminar-Textarbeit nutzt die Leitfragen als Analyseraster für Hochschulzugangsprüfungen.", "see": ["testspezifikationen", "reliabilitaet", "high-low-stakes", "washback"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null, "herkunft": [{"q": "Moser-Frötscher 2025", "s": ["S. 85"]}]}, {"id": "testspezifikationen", "term": "Testspezifikationen", "kurz": "Zentrale Informationen über eine Prüfung.", "def": "Sie enthalten laut Text die Art der überprüften Kompetenzen, die Gewichtung der Komponenten und die Aufgabenformate (Green 2013).", "zitate": [{"t": "Testspezifikationen enthalten zentrale Informationen über die Prüfung, wie die Art der überprüften Kompetenzen, die Gewichtung der einzelnen Komponenten oder die verwendeten Aufgabenformate", "s": "S. 85", "q": "Moser-Frötscher 2025"}], "beispiel": "Gehört zum EALTA-Bereich „Prüfungszweck und Spezifikation“.", "see": ["ealta-leitfragen"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null, "herkunft": [{"q": "Moser-Frötscher 2025", "s": ["S. 85"]}]}, {"id": "reliabilitaet", "term": "Reliabilität", "kurz": "Ergebnisse hängen konsistent von der Sprachkompetenz ab.", "def": "Instrumente sind laut Text reliabel, wenn ihre Ergebnisse konsistent von der Sprachkompetenz abhängen und nicht von anderen Faktoren, z. B. unklaren Anweisungen oder missverständlichen Fragen (Green 2013).", "zitate": [{"t": "wenn deren Ergebnisse konsistent von der Sprachkompetenz der Schüler:innen abhängen und nicht von anderen Faktoren wie unklaren Anweisungen oder missverständlichen Fragen/Antwortoptionen beeinträchtigt werden", "s": "S. 86", "q": "Moser-Frötscher 2025"}], "beispiel": "Gehört zum EALTA-Bereich „Prüfungsverfahren“.", "see": ["ealta-leitfragen"], "seminare": ["pruefen", "ki"], "sitzungen": ["pruefen-s2", "ki-s2"], "hinweis": null, "herkunft": [{"q": "Moser-Frötscher 2025", "s": ["S. 86"]}]}, {"id": "high-low-stakes", "term": "low stakes und high stakes", "kurz": "Unterscheidung nach den Folgen der Prüfungsentscheidung.", "def": "Bei low stakes sind die Auswirkungen gering. Bei high stakes hat das Nichtbestehen weitreichende Folgen, für Lernende (z. B. Verwehrung einer Ausbildung) und für Schulen (z. B. Personalabbau, behördliche Kontrolle).", "zitate": [{"t": "Je weitreichender die Auswirkungen einer Prüfung sind, desto wichtiger ist eine rigorose Qualitätssicherung und umfassende Begleitforschung zur Validierung", "s": "S. 87", "q": "Moser-Frötscher 2025"}], "beispiel": "Hochschulzugangsprüfungen sind typische high-stakes-Prüfungen (eigene Einordnung).", "see": ["washback", "ealta-leitfragen"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null, "herkunft": [{"q": "Moser-Frötscher 2025", "s": ["S. 87"]}]}, {"id": "washback", "term": "washback", "kurz": "Rückwirkung einer Prüfung auf Unterricht und Lernen.", "def": "Vor allem bei high stakes konzentrieren sich Lehrende und Lernende auf das, was vermutlich geprüft wird. Der Effekt kann negativ oder positiv sein.", "zitate": [{"t": "indem sich Lehrende und Lernende auf jene Kenntnisse, Fertigkeiten oder Fähigkeiten konzentrieren, von denen sie glauben, dass sie in der Prüfung behandelt werden", "s": "S. 87", "q": "Moser-Frötscher 2025"}], "beispiel": "Positives Beispiel im Text: Hören wird nach einer Prüfungsreform im Unterricht stärker gewichtet.", "see": ["high-low-stakes", "summative-evaluation"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null, "herkunft": [{"q": "Moser-Frötscher 2025", "s": ["S. 87"]}]}, {"id": "language-assessment-literacy", "term": "Language Assessment Literacy", "kurz": "Leistungsbeurteilungskompetenz von Lehrpersonen.", "def": "Sie umfasst laut Text Fach- und Anwendungswissen in der fremdsprachlichen Leistungsbeurteilung sowie sprachlich-fachliche Kompetenzen (Fulcher 2010).", "zitate": [{"t": "die sowohl Fach- und Anwendungswissen in der fremdsprachlichen Leistungsbeurteilung als auch sprachlich-fachliche Kompetenzen umfasst", "s": "S. 85", "q": "Moser-Frötscher 2025"}], "beispiel": "Voraussetzung dafür, Aufgaben auszuwählen und Leistungen fair zu beurteilen.", "see": ["ealta-leitfragen"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null, "herkunft": [{"q": "Moser-Frötscher 2025", "s": ["S. 85"]}]}, {"id": "funktionen-assessment", "term": "Funktionen von Assessment", "kurz": "Wozu Lehrende Leistungen erfassen: Diagnose, Förderung, Notenvergabe, Selektion u. a.", "def": "Die Folie sammelt Funktionen aus der Lehrendenperspektive (Grotjahn/Kleppin 2017, S. 12), z. B. Diagnose, Einstufung, Rückmeldung, Förderung, Motivierung, Notenvergabe, Rangordnung, Selektion und Disziplinierung.", "zitate": [{"t": "Wählen Sie drei Funktionen aus, die Sie persönlich prioritär finden", "s": "Folie 8", "q": "Folien Berthelé"}], "beispiel": "Dieselbe Klassenarbeit kann diagnostizieren, benoten und selektieren, je nachdem, wofür das Ergebnis genutzt wird (eigenes Beispiel).", "see": ["pruefen-testen", "high-low-stakes"], "seminare": ["pruefen"], "sitzungen": ["pruefen-s2"], "hinweis": null, "herkunft": [{"q": "Folien Berthelé", "s": ["Folie 8"]}]}, {"id": "pruefen-testen", "term": "Prüfen und Testen", "kurz": "Prüfen (assessment) ist der weite, Testen (testing) der engere Begriff.", "def": "Prüfen umfasst alle Aktivitäten, bei denen Informationen über Lernende gesammelt werden (auch Quiz, Selbst- und Peerevaluation). Testen meint Verfahren der Leistungsmessung, möglichst objektiv und zuverlässig. In der Praxis werden bei
