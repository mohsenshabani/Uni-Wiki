<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Vazirmatn:wght@400;600&display=swap">
<style>
/* Layout: Aktenordner-Wiki. Kopfzeile mit Suche, linke Navigation, Lesespalte.
   Blau = Behördenblau (Navigation, Links); Rot = Stempel (Sitzungsmarken, Belege). */
:root{
  --bg:#E9EDF1; --surface:#F7F9FB; --ink:#172233; --muted:#566376; --line:#CBD3DC;
  --accent:#1F4E79; --accent-soft:#DCE6F0; --stamp:#A12B2B; --quote:#EEF2F6; --hl:#F6E3A1;
  --f-serif:"Literata",Georgia,"Times New Roman",serif;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-fa:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1620; --surface:#17212D; --ink:#E6EBF1; --muted:#9AA7B8; --line:#2B3949;
    --accent:#86B8E4; --accent-soft:#22364A; --stamp:#E8827A; --quote:#1C2836; --hl:#5A4B12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1620; --surface:#17212D; --ink:#E6EBF1; --muted:#9AA7B8; --line:#2B3949;
  --accent:#86B8E4; --accent-soft:#22364A; --stamp:#E8827A; --quote:#1C2836; --hl:#5A4B12; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
a{color:var(--accent);text-underline-offset:.18em}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--f-serif);line-height:1.25;text-wrap:balance;margin:0}
.fa{font-family:var(--f-fa);direction:rtl;unicode-bidi:isolate}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:.9rem;padding-block:.6rem}
.brand{display:flex;align-items:baseline;gap:.6rem;text-decoration:none;color:var(--ink);font:600 1.05rem var(--f-serif);white-space:nowrap}
.az{font:500 .68rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);border:1.5px solid var(--stamp);padding:.05rem .35rem;border-radius:2px}
.top input[type=search]{flex:1;min-width:0;max-width:26rem;margin-left:auto;font:inherit;padding:.45rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#menu{display:none;font:500 .9rem var(--f-sans);padding:.4rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}

/* Rahmen */
.shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:2.5rem;padding-block:1.75rem 4rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav#nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.2rem);align-self:start;max-height:calc(100vh - 6rem);overflow:auto;font-size:.93rem}
nav h4{font:500 .7rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:1.3rem 0 .4rem}
nav h4:first-child{margin-top:0}
nav a{display:block;padding:.32rem .6rem;margin-left:-.6rem;border-radius:4px;color:var(--ink);text-decoration:none}
nav a:hover{background:var(--accent-soft)}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav a .nr{font:500 .75rem var(--f-mono);color:var(--stamp);margin-right:.45rem}
main{min-width:0;font:17px/1.7 var(--f-serif)}
main:focus{outline:none}
main > *{max-width:46rem}
main h1{font-size:2rem;font-weight:600}
main h2{font-size:1.3rem;font-weight:600;margin:2.2rem 0 .6rem}
main h3{font-size:1.05rem;font-weight:600;margin:0 0 .35rem}
main p{margin:.6rem 0}
.lead{font-size:1.1rem;color:var(--muted)}
.meta{font:500 .8rem var(--f-sans);color:var(--muted);letter-spacing:.02em}
.stamp{display:inline-block;font:500 .72rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--stamp);border:1.5px solid var(--stamp);padding:.12rem .5rem;border-radius:2px;transform:rotate(-1.5deg);margin-bottom:.7rem}

/* Status und Navigation */
.badge{display:inline-block;font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:.1rem .45rem;border-radius:2px;margin:0 0 .7rem .5rem;vertical-align:top}
.badge.entwurf{color:var(--muted);border:1.5px dashed var(--muted)}
.badge.geprueft{color:var(--surface);background:var(--accent);border:1.5px solid var(--accent)}
nav a.sem{font-weight:600;margin-top:.3rem}
nav a.sub{padding-left:1.1rem;font-size:.9rem}
.semhead{font:500 .8rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2rem 0 .2rem}
.linkitem{display:block;padding:.8rem 0;border-top:1px solid var(--line)}
.linkitem:last-child{border-bottom:1px solid var(--line)}
.linkitem .u{font:.8rem var(--f-mono);color:var(--muted);word-break:break-all}
.chip{display:inline-block;font:500 .72rem var(--f-mono);letter-spacing:.06em;border:1px solid var(--line);border-radius:3px;padding:0 .4rem;color:var(--muted);margin-left:.4rem}

/* Reiter */
.tabs{display:flex;gap:.1rem;overflow-x:auto;border-bottom:1px solid var(--line);margin:1.2rem 0 1.5rem}
.tabs a{white-space:nowrap;padding:.55rem .85rem;font:500 .9rem var(--f-sans);color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a:hover{color:var(--ink)}

/* Bausteine */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem 1.2rem;margin:1rem 0}
.card.fa-box{border-left:3px solid var(--accent)}
.card.fa-box p{font:400 1rem/1.9 var(--f-fa);direction:rtl;text-align:right;margin:.2rem 0}
.pg{font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--stamp);margin-bottom:.3rem}
blockquote{margin:.8rem 0;padding:.6rem 1rem;background:var(--quote);border-left:3px solid var(--line);font-size:.97rem}
blockquote p{margin:.2rem 0}
blockquote cite{display:block;font:500 .75rem var(--f-mono);letter-spacing:.06em;color:var(--muted);font-style:normal;margin-top:.35rem}
.kq{font-style:italic}
.bei{border-top:1px dashed var(--line);margin-top:.7rem;padding-top:.5rem;font-size:.96rem}
.bei b{font:600 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-right:.4rem}
.src{font:.9rem/1.5 var(--f-sans);border-left:3px solid var(--line);padding:.2rem .9rem;margin:.8rem 0;color:var(--muted)}
.src p{margin:.3rem 0}.src ul{margin:.2rem 0 .4rem 1.1rem;padding:0}
blockquote.lex{border-left-color:var(--accent)}
.hint{font:.88rem/1.5 var(--f-sans);color:var(--muted);background:var(--accent-soft);padding:.55rem .8rem;border-radius:5px;margin:.8rem 0}
a.term{text-decoration:none;border-bottom:1px solid var(--accent)}
a.term:hover{background:var(--accent-soft)}
.list{list-style:none;padding:0;margin:.5rem 0}
.list li{border-top:1px solid var(--line)}
.list li:last-child{border-bottom:1px solid var(--line)}
.list .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem 1rem;padding:.75rem .2rem;text-decoration:none;color:var(--ink)}
.list a.row:hover{background:var(--accent-soft)}
.list .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.list .s{min-width:0;overflow-wrap:anywhere}
.list .s{grid-column:1;font:.9rem/1.45 var(--f-sans);color:var(--muted)}
.list .r{grid-row:1/3;grid-column:2;align-self:center;font-size:.95rem}
.sess{display:block;text-decoration:none;color:var(--ink);padding:1rem 1.2rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin:.8rem 0}
.sess:hover{border-color:var(--accent)}
.plan{list-style:none;padding:0;margin:.6rem 0 1.2rem}
.plan li{display:grid;grid-template-columns:6rem minmax(0,1fr);gap:.15rem 1rem;padding:.7rem .3rem;border-top:1px solid var(--line)}
.plan li:last-child{border-bottom:1px solid var(--line)}
.plan .d{font:500 .82rem/1.5 var(--f-mono);color:var(--muted)}
.plan .th{font-weight:600;overflow-wrap:anywhere}
.plan .tx{font:.9rem/1.5 var(--f-sans);color:var(--muted);overflow-wrap:anywhere;margin:.15rem 0 0}
.plan .fr{font:.88rem/1.5 var(--f-sans);color:var(--stamp);margin:.15rem 0 0}
.plan li.next{background:var(--accent-soft);border-radius:6px;border-top-color:transparent}
.plan li.off .th{color:var(--muted);text-decoration:line-through}
.plan .go{font:.88rem var(--f-sans);margin:.2rem 0 0}
.pinfo{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.2rem .9rem;font:.92rem/1.5 var(--f-sans);margin:.4rem 0 1rem}
.pinfo dt{color:var(--muted)} .pinfo dd{margin:0;overflow-wrap:anywhere}
.lei{margin:.6rem 0;padding:.7rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.lei h3{font-size:1.02rem;margin:0 0 .3rem}.lei p{margin:.2rem 0;font:.93rem/1.55 var(--f-sans)}
@media (max-width:560px){.plan li{grid-template-columns:1fr}}

.sess h3{font-size:1.2rem;margin:.1rem 0 .3rem}
.sess p{margin:.2rem 0;font:.95rem/1.5 var(--f-sans);color:var(--muted)}
.filter{width:100%;max-width:26rem;font:inherit;font-family:var(--f-sans);padding:.5rem .75rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);margin:.4rem 0 .8rem}
.row-tools{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;max-width:none!important}
.row-tools select{font:inherit;font-family:var(--f-sans);padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.tablewrap{overflow-x:auto;max-width:none!important}
table{border-collapse:collapse;width:100%;font:.95rem/1.45 var(--f-sans)}
th{font:500 .7rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:.5rem .7rem;border-bottom:1.5px solid var(--ink)}
td{padding:.55rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
td.fa{font-size:1.02rem;text-align:right;min-width:9rem}
td .small{color:var(--muted);font-size:.82rem}
tr[hidden]{display:none}

/* Ebenen */
.group{font:500 .72rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:1.8rem 0 .2rem;display:flex;gap:.6rem;align-items:center}
.group::after{content:"";flex:1;border-top:1px solid var(--line)}
.lvl{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:0 .9rem;padding:1rem 0;border-top:1px solid var(--line)}
.lvl .n{font:500 1.5rem var(--f-mono);color:var(--stamp);line-height:1.2}
.lvl .fa{font-size:.95rem;color:var(--muted);margin-left:.4rem}
ul.plain{padding-left:1.1rem;margin:.5rem 0}
ul.plain li{margin:.35rem 0}

/* Text mit Vokabelhilfe */
.textcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.2rem 1.4rem;margin:1rem 0}
.textcard .sec{font:500 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);margin:1.2rem 0 .1rem}
.textcard .sec:first-child{margin-top:0}
.textcard p.k{font-size:1.1rem;line-height:1.85;margin:.2rem 0 .6rem}
.v{background:var(--accent-soft);border-bottom:1.5px dotted var(--accent);cursor:pointer;border-radius:2px;padding:0 .08em}
.nohelp .v{background:none;border-bottom:none;cursor:text}
.gloss{position:sticky;bottom:env(safe-area-inset-bottom,0px);margin-top:1rem;padding:.6rem .9rem;background:var(--surface);border:1px solid var(--accent);border-radius:6px;font:.95rem/1.5 var(--f-sans);display:flex;gap:.8rem;align-items:baseline;flex-wrap:wrap;max-width:none!important}
.gloss .fa{font-size:1.05rem}
.toggle{display:inline-flex;gap:.5rem;align-items:center;font:.9rem var(--f-sans);color:var(--muted);cursor:pointer}

mark.hl{background:var(--hl);color:inherit;border-radius:2px}
.snip{font:.92rem/1.5 var(--f-sans);color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:6px;padding:1.2rem 1.4rem;margin:1rem 0;font-family:var(--f-sans)}
.empty pre{font:.85rem/1.6 var(--f-mono);background:var(--quote);padding:.7rem .9rem;border-radius:5px;overflow-x:auto;margin:.7rem 0 0;white-space:pre-wrap}
.back{font:.88rem var(--f-sans);display:inline-block;margin-bottom:.8rem}
footer.f{font:.8rem/1.5 var(--f-sans);color:var(--muted);margin-top:3rem;border-top:1px solid var(--line);padding-top:1rem;max-width:46rem}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:1rem;padding-block:1rem 3rem}
  #menu{display:inline-block}
  nav#nav{display:none;position:static;max-height:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.9rem 1rem}
  body.nav-open nav#nav{display:block}
  .az{display:none}
  main h1{font-size:1.65rem}
  .lvl{grid-template-columns:1.8rem minmax(0,1fr);gap:0 .6rem}
}
@media (prefers-reduced-motion:no-preference){ .sess,nav a,.list a.row{transition:background .15s,border-color .15s} }
</style>

</div></header>
<div class="shell">

  <main id="view" tabindex="-1"></main>
</div>

-03", "thema": "Gruppenarbeit, Training", "nr": 4}, {"datum": "10.11.2026", "iso": "2026-11-10", "thema": "Theoretische Grundlagen 3: Feedback und Schreiben in der L2", "nr": 5, "frist": "Gruppenzuordnung bis 17.11. abgeschlossen"}, {"datum": "17.11.2026", "iso": "2026-11-17", "thema": "Überblick über das Forschungsthema: Lektüre von Meta-Studien", "nr": 6}, {"datum": "24.11.2026", "iso": "2026-11-24", "thema": "Recherche empirischer Studien zur Rolle von genKI beim Schreiben in der L2 (Gruppenarbeit)", "nr": 7}, {"datum": "01.12.2026", "iso": "2026-12-01", "thema": "Kurzpräsentation gefundener empirischer Studien", "nr": 8, "frist": "Auswahl der empirischen Studie bis 8.12."}, {"datum": "08.12.2026", "iso": "2026-12-08", "thema": "Analyse empirischer Studien mit dem Analyseraster (Einführung, Gruppenarbeit)", "nr": 9}, {"datum": "15.12.2026", "iso": "2026-12-15", "thema": "Analyse empirischer Studien mit dem Analyseraster (Gruppenarbeit)", "nr": 10, "frist": "Ausgefüllte Analyseraster bis 21.12."}, {"datum": "22.12.2026", "iso": "2026-12-22", "thema": "Kurzpräsentation der Analyseergebnisse (Diskussion, mündliche Kommentierung, keine PowerPoint)", "nr": 11}, {"datum": "12.01.2027", "iso": "2027-01-12", "thema": "Entwicklung einer didaktisierten Lerneinheit (Einführung, Gruppenarbeit)", "nr": 12}, {"datum": "19.01.2027", "iso": "2027-01-19", "thema": "Entwicklung einer didaktisierten Lerneinheit (Gruppenarbeit)", "nr": 13, "frist": "Entwurf der Lerneinheit bis 25.1."}, {"datum": "26.01.2027", "iso": "2027-01-26", "thema": "Präsentation der Lerneinheiten plus Peer-Feedback", "nr": 14}, {"datum": "02.02.2027", "iso": "2027-02-02", "thema": "Präsentation der Lerneinheiten plus Peer-Feedback", "nr": 15}], "leistungen": [{"titel": "Studienleistung", "text": ["Betreute Gruppenarbeit mit Präsentationen: Recherche und Analyse einer empirischen Studie sowie Didaktisierung einer Lerneinheit mit KI-Feedback. Gruppen mit 3 bis 5 Personen, festzulegen bis 17.11.2026."]}, {"titel": "Prüfungsleistung", "text": ["Hausarbeit (ca. 15–20 Seiten, kritische Analyse von mindestens zwei empirischen Studien) oder ca. 45-minütige mündliche Prüfung mit Thesenpapier. Vorab Kurzpräsentation der Thematik im Seminar."]}], "quelle": "Von den Folien abgelesen (Bildschirmfotos). Wortlaut bitte in Moodle gegenprüfen."}}, {"id": "cl", "name": "Computerlinguistik", "beschreibung": "Einführung in die Computerlinguistik (Sina Zarrieß, Bastian Bunzeck, AG Computerlinguistik). Sitzungen 1 und 2 nach den Folien, dazu Hausaufgaben und Bücher.", "lektuere": [{"titel": "Folien Sitzung 1: Einführung", "autor": "Zarrieß, Bunzeck", "umfang": "vl01.pdf", "art": "Folien"}, {"titel": "Folien Sitzung 2: Input und Output der Sprachverarbeitung", "autor": "Zarrieß, Bunzeck", "umfang": "vl02.pdf", "art": "Folien"}, {"titel": "Linguistic Fundamentals for Natural Language Processing: 100 Essentials from Morphology and Syntax", "autor": "Emily M. Bender", "umfang": "174 Seiten", "art": "Buch"}, {"titel": "Linguistic Fundamentals for Natural Language Processing II: 100 Essentials from Semantics and Pragmatics", "autor": "Emily M. Bender, Alex Lascarides", "umfang": "270 Seiten", "art": "Buch"}, {"titel": "Speech and Language Processing, 2nd Edition", "autor": "Daniel Jurafsky, James H. Martin", "umfang": "1038 Seiten", "art": "Buch"}, {"titel": "Hausaufgabe 1: Rechtschreibkorrektur (Algorithmen)", "autor": "eigene Hausaufgabe", "umfang": "2 Seiten", "art": "Eigene Arbeit"}], "semester": "2026-ws", "ordner": "Computerlinguistik"}, {"id": "litmehr", "name": "Literatur und Mehrsprachigkeit", "beschreibung": "Literarische Mehrsprachigkeit (Veranstaltung 230149, Mi 16–18 Uhr, B2-215). Ausgangspunkt ist Till Dembecks These, dass es keine einsprachigen Texte gibt; danach theoretische, historische Perspektiven und exemplarische Lektüren (Erzähltexte des 19. und frühen 20. Jahrhunderts).", "lektuere": [{"titel": "Buddenbrooks (1901)", "autor": "Thomas Mann", "umfang": "S. 192–210 (Sitzung 2)", "art": "Primärtext"}, {"titel": "Es gibt keine einsprachigen Texte! Ein Vorschlag für die Literaturwissenschaft", "autor": "Till Dembeck (2020), ZiG 11 (1)", "umfang": "S. 163–176 (Sitzung 3)", "art": "Lektüre"}, {"titel": "Literatur und Mehrsprachigkeit. Ein Handbuch", "autor": "Till Dembeck, Rolf Parr (Hrsg.) (2017)", "umfang": "383 Seiten", "art": "Handbuch"}], "semester": "2026-ws", "ordner": "Lit. Mehrsprachigkeit", "plan": {"info": [["Veranstaltungsnummer", "230149"], ["Zeit und Ort", "Mittwochs 16–18 Uhr, B2-215"], ["Sprechstunde", "Montags 14–15 Uhr (ohne Anmeldung)"], ["Dozent", "Benedikt Wolf (aus dem Link im Seminarplan erschlossen)"], ["Phasen", "Systematisches und Voraussetzungen (bis 11.11.); Historische Perspektive (18.11.–16.12.); Exemplarische Lektüren (ab 13.1.)"], ["Hinweise", "Einsatz von KI für die Hausarbeit nicht gestattet (mit Passus in der Eigenständigkeitserklärung). Aufzeichnungsverbot. Semesterapparat in der Bibliothek."]], "termine": [{"datum": "14.10.2026", "iso": "2026-10-14", "thema": "Einführung", "nr": 1}, {"datum": "21.10.2026", "iso": "2026-10-21", "thema": "Ein Beispiel", "nr": 2, "texte": ["Thomas Mann, Buddenbrooks (1901), S. 192–210"], "sitzung": "litmehr-s2"}, {"datum": "28.10.2026", "iso": "2026-10-28", "thema": "Es gibt keine einsprachigen Texte", "nr": 3, "texte": ["Till Dembeck, Es gibt keine einsprachigen Texte (digital)"], "frist": "Mitbringen: ein kurzer einsprachiger literarischer Text", "sitzung": "litmehr-s3"}, {"datum": "04.11.2026", "iso": "2026-11-04", "thema": "Begriffswerkzeug", "nr": 4, "texte": ["Giulia Radaelli, Literarische Mehrsprachigkeit, S. 47 und 53–75 (digital)"]}, {"datum": "11.11.2026", "iso": "2026-11-11", "thema": "Voraussetzungen", "nr": 5, "texte": ["Gen 2,4–25; Gen 3; Gen 10–11; Apg 2,1–42"]}, {"datum": "18.11.2026", "iso": "2026-11-18", "thema": "Die postmonolinguale Situation", "nr": 6, "texte": ["Yasemin Yildiz, Beyond the Mother Tongue, S. 1–29 (digital)"]}, {"datum": "25.11.2026", "iso": "2026-11-25", "thema": "Keine Sitzung wegen Bi.Teach", "entfaellt": true}, {"datum": "02.12.2026", "iso": "2026-12-02", "thema": "Historische Konstellation 1: Sprachreinheit und literarische Praxis im 17. Jahrhundert", "nr": 7, "texte": ["Opitz, Buch von der Deutschen Poeterey (1624), S. 33–45", "Moscherosch, Gesichte Philanders von Sittewalt, S. 88–105 und 145–151", "Haberland, Opitz’ Ode Ich empfinde fast ein grawen …"]}, {"datum": "09.12.2026", "iso": "2026-12-09", "thema": "Historische Konstellation 2: Varietäten im Realismus", "nr": 8, "texte": ["Weninger, Zur Dialektik des Dialekts (digital)", "Freytag, Soll und Haben, Bd. 1, S. 13–26 (digital)"]}, {"datum": "16.12.2026", "iso": "2026-12-16", "thema": "Historische Konstellation 3: Ludische Mehrsprachigkeit in der Moderne", "nr": 9, "texte": ["Stefan George, Ursprünge", "Walter Serner, Der Schluck um die Achse", "Paul Celan, Eine Gauner- und Ganovenweise … (1963)"]}, {"datum": "13.01.2027", "iso": "2027-01-13", "thema": "Exemplarische Lektüren", "nr": 10}, {"datum": "20.01.2027", "iso": "2027-01-20", "thema": "Exemplarische Lektüren", "nr": 11}, {"datum": "27.01.2027", "iso": "2027-01-27", "thema": "Exemplarische Lektüren / Auswertung", "nr": 12}, {"datum": "03.02.2027", "iso": "2027-02-03", "thema": "Fällt aus wegen der Prüfungswoche in der Germanistik", "entfaellt": true}], "leistungen": [{"titel": "Studienleistung (je nach Modul)", "text": ["Sitzungsprotokoll, Kurzreferat oder (im Modul 23-DAF-M-DAFGER-Glit_a) eigenständige Moderation einer Sitzung."]}, {"titel": "Prüfungsleistung (je nach Modul)", "text": ["Hausarbeit (ca. 15 bis 20 Seiten; bei manchen Modulen Voraussetzung: Kurzpräsentation des Themas im Seminar), Exposé vorher in der Sprechstunde besprechen.", "Oder 30-minütiges Referat mit schriftlicher Ausarbeitung (7–8 Seiten), oder Sitzungsmoderation mit ca. 5-seitigem Ergebnisprotokoll."]}, {"titel": "Mögliche Texte für exemplarische Lektüren", "text": ["Droste-Hülshoff, Die Judenbuche (1842); Storm, Es waren zwei Königskinder (1884); Meyrink, Der Golem (1913/14); Homunkulus, Zwischen den Geschlechtern (1919); Thomas Mann, Wälsungenblut (1921); Klabund, Spuk (1922); Stratz, Der mysteriöse Cavalier (1924); Sagitta (Mackay), Der Puppenjunge (1926); Fallada, Gauner-Geschichten (1928); Thomas Mann, Der Erwählte (1951)."]}, {"titel": "Weitere Referatsthemen", "text": ["Bachtin, Das Wort im Roman; Schottelius, Ausführliche Arbeit Von der Teutschen HaubtSprache; Herder, Volkslieder; Arnim/Brentano, Des Knaben Wunderhorn; Nitsche, Neue österreichische Lyrik – und kein Wort Deutsch; Auerbach, Mimesis; Literaturjiddisch."]}], "quelle": "Seminarplan (PDF) zu Veranstaltung 230149."}}], "sitzungen": [{"id": "cl-s1", "nr": 1, "seminar": "cl", "titel": "Einführung in die Computerlinguistik", "autor": "Sina Zarrieß, Bastian Bunzeck (AG Computerlinguistik)", "lektuere": "Folien Sitzung 1 (51 Folien)", "thema": "Organisation, Grundbegriffe (Algorithmus, Programmiersprache), sprachliche Ebenen und was Computerlinguistik ist", "status": "entwurf", "ueberblick": {"kurzinhalt": "Die erste Sitzung klärt die Organisation und stellt die Frage, was [[computerlinguistik|Computerlinguistik]] ist. Dazu werden zuerst die Grundbegriffe [[algorithmus|Algorithmus]] und [[programmiersprache|Programmiersprache]] geklärt, dann [[natuerliche-sprache|natürliche Sprache]] und die [[sprachliche-ebenen|sprachlichen Ebenen]] (Phonetik/Phonologie, Morphologie, Syntax, Semantik, Pragmatik). Die Computerlinguistik modelliert Sprachverstehen und Sprachproduktion mit Algorithmen, klassisch regelbasiert, heute vor allem mit [[sprachmodell|Sprachmodellen]].", "leitfrage": "Was ist Computerlinguistik, und worin unterscheiden sich natürliche Sprache und Programmiersprachen auf den sprachlichen Ebenen?", "merksatz": "Computerlinguistik = Sprache formal beschreiben und mit Algorithmen verarbeiten, zwischen Linguistik und Informatik, aber mit eigenen Theorien und Methoden.", "fa": ["زبان‌شناسی رایانشی (Computerlinguistik) یعنی توصیف دقیق و صوری زبان طبیعی و مدل‌سازی درک و تولید زبان با الگوریتم‌ها. این رشته بین زبان‌شناسی و علوم کامپیوتر است، ولی نظریه‌ها و روش‌های خودش را دارد.", "الگوریتم یک دستورالعمل بی‌ابهام برای حل یک مسئله است که یک ورودی مشخص را به یک خروجی مشخص تبدیل می‌کند. زبان برنامه‌نویسی یک زبان صوری برای نوشتن الگوریتم‌هاست (مثلاً Python).", "سطح‌های زبانی: آواشناسی/واج‌شناسی (صداها)، ساختواژه (واژه‌ها)، نحو (جمله)، معنی‌شناسی (معنی) و کاربردشناسی (ارتباط)."]}, "inhalt": [{"titel": "1. Organisation der Veranstaltung", "quelle": "Folien Sitzung 1 (vl01), Folien 3–12", "html": "<div class=\"tablewrap\"><table><thead><tr><th><\/th><th>Seminar (vorlesungsartig)<\/th><th>Übung/Tutorium<\/th><\/tr><\/thead><tbody><tr><td>Wer<\/td><td>Sina Zarrieß<\/td><td>Hannah Bultmann<\/td><\/tr><tr><td>Wann<\/td><td>Do, 10–12, S1-209<\/td><td>Di, 8–10, Hörsaal 11<\/td><\/tr><tr><td>Inhalt<\/td><td>Folien auf Moodle, Mitarbeit erwünscht, 2 Anwesenheitsübungen (je 15 Minuten)<\/td><td>wöchentliche Hausaufgaben mit Frist, Besprechung in der Übung, oft Laptop/Tablet nötig<\/td><\/tr><tr><td>Bewertung<\/td><td>Anwesenheitsübungen: bestanden/nicht bestanden<\/td><td>Hausaufgaben: bestanden/nicht bestanden<\/td><\/tr><\/tbody><\/table><\/div><p>Materialien, Hausaufgaben und Fragen laufen über Moodle.<\/p><blockquote><p>„Folien sind kein vollständiges/ausformuliertes Skript!“<\/p><cite>Folien Sitzung 1 (vl01), Folie 7<\/cite><\/blockquote><blockquote><p>„Mini-Probeklausur mit Fragen, wie sie in der Klausur vorkommen werden“<\/p><cite>Folien Sitzung 1 (vl01), Folie 8<\/cite><\/blockquote><blockquote><p>„mehr als 50% der Punkte wurden erreicht“<\/p><cite>Folien Sitzung 1 (vl01), Folie 8 (Kriterium für „bestanden“ bei den Anwesenheitsübungen)<\/cite><\/blockquote><blockquote><p>„sinnvolle Auseinandersetzung mit der Aufgabe ist erkennbar“<\/p><cite>Folien Sitzung 1 (vl01), Folie 9 (Kriterium für „bestanden“ bei den Hausaufgaben)<\/cite><\/blockquote><h4>Studienleistung und Prüfung<\/h4><ul class=\"plain\"><li>23-CL-BaCL1: 3 LP Seminar + 3 LP Übung. 23-MeWi-Einf-II: 3 LP Seminar.<\/li><li>Alle Hausaufgaben müssen bis zum Ende der Vorlesungszeit (05.02.2027) eingereicht und bestanden sein, beide Anwesenheitsübungen bestanden.<\/li><li>Klausur, 1. Termin: 11.02.2027, 10–12 Uhr, X-E0-001.<\/li><li>Klausur, 2. Termin: laut Folie 22.03.2026, 10–12 Uhr, X-E0-001. <strong>Die Jahreszahl 2026 liegt vor dem Semester und ist vermutlich ein Tippfehler (2027?). Bitte in Moodle prüfen.<\/strong><\/li><\/ul>"}, {"titel": "2. Was machen Computerlinguist:innen?", "quelle": "Folien Sitzung 1 (vl01), Folien 13–19", "html": "<p><strong>Anwendungen im Alltag<\/strong> (Folie 15): Chatbots und andere Dialogsysteme, Sprachmodelle (Large Language Models), Suchmaschinen, Recommendersysteme, automatische Übersetzung, Spamfilter, Rechtschreibkorrekturprogramme, Sprachlernprogramme, Robot Journalists, Informationsextraktionssysteme.<\/p><p><strong>Andere Bezeichnungen<\/strong> (Folie 16): Maschinelle Sprachverarbeitung, Sprachtechnologie, sprachliche Informationsverarbeitung, Digital Humanities, Natural Language Processing, Computational Linguistics.<\/p><p><strong>Verhältnis zu anderen Wissenschaften<\/strong> (Folien 17–18): Die Folien fragen zuerst, ob Computerlinguistik = Linguistik + Informatik + Psychologie ist, und antworten dann:<\/p><blockquote><p>„Computerlinguisten entwickeln eigene Theorien, Modelle und Methoden, die nicht Teil der Kern-Informatik oder Kern-Linguistik sind.“<\/p><cite>Folien Sitzung 1 (vl01), Folie 18<\/cite><\/blockquote>"}, {"titel": "3. Grundbegriffe: Computer, Algorithmus, Programmiersprache", "quelle": "Folien Sitzung 1 (vl01), Folien 20–24", "html": "<p><strong>Computer<\/strong> (Folie 20): Die Folie benennt Bauteile und ihre Aufgaben, z. B. Prozessor (CPU) verarbeitet Bits, Arbeitsspeicher (RAM) und Festplatte speichern Bits, der Monitor zeigt Pixel an.<\/p><blockquote><p>„Ein Algorithmus ist eine eindeutige Handlungsvorschrift zur Lösung eines Problems oder einer Klasse von Problemen. Bei der Problemlösung wird eine bestimmte Eingabe in eine bestimmte Ausgabe überführt.“<\/p><cite>Folien Sitzung 1 (vl01), Folie 21<\/cite><\/blockquote><p>Algorithmen lassen sich in natürlicher Sprache, Pseudocode oder Programmiersprachen formulieren. Maschinell ausführbare Algorithmen sind außerdem <em>finit<\/em> (endlicher Programmcode und Speicherbedarf) und <em>terminieren<\/em> nach endlich vielen Schritten.<\/p><blockquote><p>„Eine Programmiersprache ist eine formale Sprache zur Formulierung von Algorithmen, die auf einem Computer ausgeführt werden können.“<\/p><cite>Folien Sitzung 1 (vl01), Folie 22<\/cite><\/blockquote><p>Ein Compiler oder Interpreter übersetzt den Programmcode in Befehle, die der Prozessor ausführt. <strong>Python<\/strong> ist das Beispiel der Folien:<\/p><blockquote><p>„Wird in der Computerlinguistik und im maschinellen Lernen viel verwendet“<\/p><cite>Folien Sitzung 1 (vl01), Folie 23<\/cite><\/blockquote>"}, {"titel": "4. Natürliche Sprache und sprachliches Wissen", "quelle": "Folien Sitzung 1 (vl01), Folien 26–38", "html": "<p>Ausgangspunkt ist ein Alltagsgespräch (Hassan, Espresso). Die Folien fragen: Was wissen und können Sprecher einer natürlichen Sprache?<\/p><blockquote><p>„Die Sprache, die von Menschen gelernt, gesprochen, geschrieben oder gebärdet wird“<\/p><cite>Folien Sitzung 1 (vl01), Folie 27 (Definition natürliche Sprache)<\/cite><\/blockquote><p>Beispiele für Wissen auf verschiedenen Stufen:<\/p><ul class=\"plain\"><li><strong>Einheiten<\/strong>: Buchstaben/Laute, Silben, Wortteile, Wort, Phrase, Satz, Text.<\/li><li><strong>Strukturen und Regeln<\/strong>: „Kannst du mir Kaffee machen?“ ist möglich, „Machst du Kaffee können?“ oder „Kannst du Offee machen?“ nicht.<\/li><li><strong>Bedeutung und Intention<\/strong>: Warum stellt der Sprecher diese Frage, was versteht der Hörer, wie reagiert er?<\/li><\/ul><blockquote><p>„Bisherige Erkenntnis: Sprache ist systematisch!“<\/p><cite>Folien Sitzung 1 (vl01), Folie 34<\/cite><\/blockquote><p>Die Erforschung dieser Regelmäßigkeiten ist Gegenstand der Sprachwissenschaft.<\/p><h4>Sprachliche Ebenen (Folie 35)<\/h4><div class=\"tablewrap\"><table><thead><tr><th>Ebene<\/th><th>Gegenstand<\/th><\/tr><\/thead><tbody><tr><td>Phonetik und Phonologie<\/td><td>Ebene der sprachlichen Laute<\/td><\/tr><tr><td>Morphologie<\/td><td>Ebene der Wörter<\/td><\/tr><tr><td>Syntax<\/td><td>Ebene des Satzes<\/td><\/tr><tr><td>Semantik<\/td><td>Ebene der Bedeutung<\/td><\/tr><tr><td>Pragmatik<\/td><td>Ebene der Kommunikation<\/td><\/tr><\/tbody><\/table><\/div><p>Die Folien fordern auf, zu jeder Ebene ein Phänomen zu finden und zu vergleichen, auf welchen Ebenen sich natürliche Sprache und Programmiersprachen unterscheiden (Folien 36–37).<\/p><blockquote><p>„Sprache ist die Fähigkeit lautliche Äußerungen (oder Gebärden) zu produzieren, wahrzunehmen und diese mit Bedeutung zu assoziieren.“<\/p><cite>Folien Sitzung 1 (vl01), Folie 38 (Zusammenfassung)<\/cite><\/blockquote>"}, {"titel": "5. Was ist Computerlinguistik?", "quelle": "Folien Sitzung 1 (vl01), Folien 39–47", "html": "<p>Die Folien verbinden die beiden Begriffe: Ein Modell oder Algorithmus bildet Sprache auf Bedeutung/Intention ab (Sprachverstehen) oder Bedeutung/Intention auf Sprache (Sprachgenerierung). Leitfragen der Computerlinguistik (Folie 42):<\/p><blockquote><p>„Wie kann man natürliche Sprache und sprachliches Wissen formal präzise beschreiben?“<\/p><cite>Folien Sitzung 1 (vl01), Folie 42<\/cite><\/blockquote><blockquote><p>„Wie kann man Sprachverstehen und -produktion mit Algorithmen modellieren?“<\/p><cite>Folien Sitzung 1 (vl01), Folie 42<\/cite><\/blockquote><p><strong>Offizielle Definition (Association for Computational Linguistics, Folie 43):<\/strong><\/p><blockquote><p lang=\"en\">“Simply put, computational linguistics is the scientific study of language from a computational perspective.”<\/p><cite>ACL, zitiert auf Folien Sitzung 1 (vl01), Folie 43<\/cite><\/blockquote><p>Die Definition nennt zwei Arten von Modellen (wissensbasiert/handgemacht und datengetrieben/statistisch) und zwei Motivationen (wissenschaftliche Erklärung eines Phänomens oder technische Komponente eines Sprachsystems).<\/p><h4>Zwei Beispiele für Systeme<\/h4><blockquote><p>„Regelbasierte oder sog. „symbolische“ Systeme zerlegen den Sprachverarbeitungsprozess in verschiedene Komponenten mit entsprechenden Repräsentationen für sprachliche Struktur und Bedeutung“<\/p><cite>Folien Sitzung 1 (vl01), Folie 45 („klassisches“ Dialogsystem, nach J&M, S. 503)<\/cite><\/blockquote><blockquote><p>„Neuere Ansätze und Technologien basieren auf sehr einfachen aber riesigen Sprachmodellen, die auf großen Datenmengen Lernen, Wortsequenzen vorherzusagen“<\/p><cite>Folien Sitzung 1 (vl01), Folie 46 (Beispiel ChatGPT)<\/cite><\/blockquote>"}, {"titel": "6. Lernziele und Lektüre", "quelle": "Folien Sitzung 1 (vl01), Folien 47–50", "html": "<p>Die Veranstaltung vermittelt: linguistisches Grundwissen („Linguistic Essentials“), wie Sprache mit formalen oder statistischen Methoden beschrieben wird, welche Grenzen diese Methoden haben, welche Typen von Methoden und Algorithmen es gibt, und eine Hinführung zum Programmieren (sehr basic).<\/p><blockquote><p>„Welche Herausforderungen ergeben sich bei der formalen Beschreibung von Sprache, wo stoßen unsere Methoden an ihre Grenzen?“<\/p><cite>Folien Sitzung 1 (vl01), Folie 47<\/cite><\/blockquote><p><strong>Lektüreempfehlungen:<\/strong> Jurafsky/Martin, Speech and Language Processing, 2. Auflage 2009 (Abkürzung J&M, die Folie nennt sie eine sehr gute Einführung), sowie die 3. Edition (Fokus auf maschinelles Lernen und Deep Learning), die in späteren Semestern eine große Rolle spielen wird.<\/p><blockquote><p>„Diese Edition wird in späteren Semestern eine große Rolle spielen“<\/p><cite>Folien Sitzung 1 (vl01), Folie 50<\/cite><\/blockquote>"}], "zusatz": [{"titel": "Speech and Language Processing, 3. Edition (Jurafsky/Martin)", "url": "https://web.stanford.edu/~jurafsky/slp3/", "typ": "Lehrbuch (online)", "quelle": "Stanford, Folie 50", "geprueft": false, "notiz": "Link steht auf der Folie. Nicht von mir geöffnet."}, {"titel": "ACL: What is Computational Linguistics?", "url": "http://www.aclweb.org/archive/misc/what.html", "typ": "Definition", "quelle": "Association for Computational Linguistics, Folie 43", "geprueft": false, "notiz": "Quelle der zitierten Definition. Link steht auf der Folie. Nicht von mir geöffnet."}, {"titel": "AG Computerlinguistik Bielefeld", "url": "https://clause-bielefeld.github.io", "typ": "Webseite der Gruppe", "quelle": "Folie 2", "geprueft": false, "notiz": "Link steht auf der Folie. Nicht von mir geöffnet."}], "material": [{"datei": "vl01.pdf", "art": "Folien", "notiz": "Sitzung 1: Einführung, 51 Folien"}, {"datei": "Hausaufgabe_Algorithmen.pdf", "art": "Eigene Arbeit", "notiz": "Hausaufgabe 1: Rechtschreibkorrektur und Simultandolmetschen. Noch nicht in das Wiki übernommen. Die zugehörige Aufgabe stammt vermutlich aus der Übung."}], "begriffe": ["computerlinguistik", "algorithmus", "programmiersprache", "natuerliche-sprache", "sprachliche-ebenen", "sprachmodell"]}, {"id": "cl-s2", "nr": 2, "seminar": "cl", "titel": "Input und Output der Sprachverarbeitung", "autor": "Sina Zarrieß (AG Computerlinguistik)", "lektuere": "Folien Sitzung 2 (61 Folien); Jurafsky/Martin SLP3, Kap. 16 und 2 (Hinweis auf Folien)", "thema": "Gesprochene und geschriebene Sprache, Phoneme und Grapheme, Spracherkennung, Zeichensätze, Token und Typen", "status": "entwurf", "ueberblick": {"kurzinhalt": "Die Sitzung fragt, welche Eingaben und Ausgaben Sprachverarbeitung hat. Bei gesprochener Sprache geht es um Schall, [[phonem|Phoneme]] und [[phon-allophon|Phone]], bei geschriebener um [[graphem|Grapheme]] und Schriftsysteme. [[spracherkennung-asr|Spracherkennung]] bildet Laute auf Graphemfolgen ab, die [[sprachsynthese-tts|Sprachsynthese]] umgekehrt. Im Computer wird Text über [[zeichensatz|Zeichensätze]] kodiert. Schließlich unterscheidet man in einem [[korpus|Korpus]] [[token-typ|Token und Typen]].", "leitfrage": "Woraus bestehen sprachliche Inputs und Outputs, und wie machen Computer Sprache und Wörter greifbar?", "merksatz": "Spracherkennung ist nicht Transkription: Sie bildet Laute auf Graphemfolgen ab, nicht auf Lautschrift.", "fa": ["ورودی زبان گفتاری موج صوتی است و ورودی زبان نوشتاری دنباله‌ای از نمادهای گسسته (حروف). واج کوچک‌ترین واحد معنی‌متمایزکننده‌ی گفتار است و نویسه (Graphem) کوچک‌ترین واحد نوشتار.", "بازشناسی گفتار (ASR) صدا را به دنباله‌ی حروف تبدیل می‌کند، نه به نشانه‌گذاری آوایی (IPA). سنتز گفتار (TTS) برعکس عمل می‌کند.", "Token هر نمونه‌ی یک واژه در متن است و Type شکل انتزاعی واژه. در جمله‌ی «Wenn eine Fliege hinter Fliegen fliegt, fliegt eine Fliege Fliegen nach.» ۱۱ توکن و ۷ تایپ وجود دارد."]}, "inhalt": [{"titel": "1. Organisatorisches und Rückblick", "quelle": "Folien Sitzung 2 (vl02), Folien 2–6", "html": "<ul class=\"plain\"><li>Keine Vorlesung am 29.10.2026.<\/li><li>Die Übung am 27.10.2026 findet statt, die Übung am 03.11.2026 nicht.<\/li><li>Nächste Anwesenheitsübung: 26.11.2026.<\/li><\/ul><p>Hinweis der Folie: keine E-Mails schicken, wenn Hausaufgaben nicht hochgeladen wurden (die Abgabe in Moodle bleibt geöffnet) oder wenn man wegen Krankheit nicht teilnehmen kann.<\/p><p>Rückblick: die fünf sprachlichen Ebenen und der Algorithmus als Funktion:<\/p><blockquote><p>„Algorithmen kann man formal auch als Funktionen verstehen, die Inputs aus einer Menge X auf Outputs aus einer Menge Y abbilden“<\/p><cite>Folien Sitzung 2 (vl02), Folie 6<\/cite><\/blockquote>"}, {"titel": "2. Gesprochene Sprache: Schall, Vokale, Konsonanten", "quelle": "Folien Sitzung 2 (vl02), Folien 9–19", "html": "<p>Beim Sprechen erzeugen wir mit Artikulationsorganen (Stimmbänder, Zunge, Lippen) und Atmung Schallwellen. Physikalisch sind das Änderungen im Luftdruck, die ein Mikrofon aufnehmen kann. Eine Wellenform zeigt die Amplitude über die Zeit.<\/p><blockquote><p>„Vokale sind stimmhafte Laute, bei deren Artikulation die Stimmbänder relativ eng zusammen stehen und dadurch vibrieren“<\/p><cite>Folien Sitzung 2 (vl02), Folie 15<\/cite><\/blockquote><blockquote><p>„Konsonanten sind stimmhaft oder stimmlos“<\/p><cite>Folien Sitzung 2 (vl02), Folie 16<\/cite><\/blockquote><p>Vokale sind relativ lang und laut, stimmlose Konsonanten sind in der Wellenform schwer zu erkennen.<\/p><blockquote><p>„Die Phonetik beschäftigt sich mit sprachlichen Lauten“<\/p><cite>Folien Sitzung 2 (vl02), Folie 17<\/cite><\/blockquote><p>Demo auf der Folie (Spracherkennung im Browser) und die Frage: Warum kann man eine englische Spracherkennung nicht für deutsche Äußerungen verwenden? Antwort der nächsten Folien: Sprachen haben unterschiedliche Lautsysteme.<\/p><blockquote><p>„Einzelsprachen unterscheiden sich sehr bezüglich der Laute, die Sprecher (systematisch) produzieren und verstehen können“<\/p><cite>Folien Sitzung 2 (vl02), Folie 19<\/cite><\/blockquote>"}, {"titel": "3. Phoneme, Phone, Transkription", "quelle": "Folien Sitzung 2 (vl02), Folien 20–27", "html": "<p>Ein <strong>Phonem<\/strong> ist die Art von Laut, die in einer Sprache Wörter unterscheiden kann (Minimalpaar: /a/ vs. /u/ in <em>hat<\/em> und <em>Hut<\/em>). Ein <strong>Phon<\/strong> ist eine konkrete Realisierung.<\/p><blockquote><p>„Dasselbe Phonem kann mit verschiedenen Phonen realisiert werden, diese sind dann aber nicht bedeutungsunterscheidend“<\/p><cite>Folien Sitzung 2 (vl02), Folie 26<\/cite><\/blockquote><blockquote><p>„Die Realisierung eines Phonems wird auch durch vorangehende Phoneme bedingt“<\/p><cite>Folien Sitzung 2 (vl02), Folie 25<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th>Begriff<\/th><th>Bedeutung (Folien 20, 26)<\/th><\/tr><\/thead><tbody><tr><td>Phonem<\/td><td>kleinste bedeutungsunterscheidende Einheit der gesprochenen Sprache<\/td><\/tr><tr><td>Phon<\/td><td>minimale Analyseeinheit, Laut, Realisierung eines Phonems<\/td><\/tr><tr><td>Allophon<\/td><td>Variante desselben Phonems, nicht bedeutungsunterscheidend (Beispiel: gerolltes oder nicht gerolltes „r“)<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Das IPA ist eine standardisierte Schreibweise für Phoneme in verschiedenen Sprachen“<\/p><cite>Folien Sitzung 2 (vl02), Folie 21<\/cite><\/blockquote><p>ARPAbet ist ein vereinfachtes Transkriptionsalphabet, das J&M für das Englische nutzen. Zusätzlich tragen Betonung, Intonation und Prosodie Information:<\/p><blockquote><p>„Wörter und Sätze können mit verschiedenen Intonationsmustern gesprochen werden“<\/p><cite>Folien Sitzung 2 (vl02), Folie 27<\/cite><\/blockquote>"}, {"titel": "4. Geschriebene Sprache: Grapheme und Schriftsysteme", "quelle": "Folien Sitzung 2 (vl02), Folien 28–33", "html": "<blockquote><p>„Schriftsprache ist generell eine sekundäre Form der Sprachverwendung und ist an bestimmte Medien geknüpft“<\/p><cite>Folien Sitzung 2 (vl02), Folie 29<\/cite><\/blockquote><blockquote><p>„kann als erste Form der sprachwissenschaftlichen Analyse gesehen werden“<\/p><cite>Folien Sitzung 2 (vl02), Folie 29 (zur Erfindung der Schriftsysteme)<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th><\/th><th>Phonem<\/th><th>Graphem<\/th><\/tr><\/thead><tbody><tr><td>Definition<\/td><td>kleinste bedeutungsunterscheidende Einheit der gesprochenen Sprache<\/td><td>kleinste bedeutungsunterscheidende Einheit der geschriebenen Sprache<\/td><\/tr><tr><td>Status<\/td><td>Teil des Sprachsystems<\/td><td>sekundär, beruht auf Konvention<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Logographische Schrift:<\/strong> Grapheme stehen für bedeutungstragende Einheiten. <strong>Phonographische Schrift:<\/strong> Grapheme stehen für bedeutungsunterscheidende Einheiten (Laute).<\/p><blockquote><p>„Je nach Schrift und orthographischen Konventionen gibt es unterschiedliche Graphem-Phonem-Korrespondenzen in Sprachen, aber diese sind nie 1:1“<\/p><cite>Folien Sitzung 2 (vl02), Folie 60 (Zusammenfassung)<\/cite><\/blockquote>"}, {"titel": "5. Sprachliche Daten: Korpora", "quelle": "Folien Sitzung 2 (vl02), Folien 34–37", "html": "<blockquote><p>„Das Korpus: eine Sammlung von sprachlichen Daten“<\/p><cite>Folien Sitzung 2 (vl02), Folie 35<\/cite><\/blockquote><ul class=\"plain\"><li><strong>Textkorpora<\/strong>: geschriebene Texte (Zeitung, Artikel, Blogs, Tweets, Webseiten). Beispiel auf der Folie: DWDS.<\/li><li><strong>Korpora gesprochener Sprache<\/strong>: Dialoge, Interviews, vorgelesene Texte. Beispiel auf der Folie: vorgelesene Wikipedia (Spoken Wikipedia Corpus).<\/li><\/ul><blockquote><p>„Korpora gesprochener Sprache sind generell schwieriger zu erstellen und zu bekommen“<\/p><cite>Folien Sitzung 2 (vl02), Folie 35<\/cite><\/blockquote>"}, {"titel": "6. Spracherkennung (ASR) und Sprachsynthese (TTS)", "quelle": "Folien Sitzung 2 (vl02), Folien 38–47", "html": "<p>Systeme für gesprochene Sprache müssen Audio auf Symbolfolgen abbilden.<\/p><blockquote><p>„Spracherkennung bildet komplexe Lautsignale auf Sequenzen von Graphemen ab“<\/p><cite>Folien Sitzung 2 (vl02), Folie 42<\/cite><\/blockquote><blockquote><p>„Achtung: Spracherkennung ist nicht dasselbe wie Transkription! Die Ausgabe von existierenden ASR-Systemen ist keine genaue phonetische Transkription (z.B. mit IPA)!“<\/p><cite>Folien Sitzung 2 (vl02), Folie 42<\/cite><\/blockquote><p>Die Folie fragt: Warum nimmt man Grapheme und nicht Phoneme, um gesprochene Sprache zu erkennen? Aktuelle Systeme verwenden maschinelles Lernen (z. B. tiefe neuronale Netze).<\/p><p><strong>Herausforderungen:<\/strong><\/p><blockquote><p>„Keine oder sehr kurze Pausen zwischen Wörtern. Stimmlose Laute sind schwer zu erkennen!“<\/p><cite>Folien Sitzung 2 (vl02), Folie 44 (Segmentierung)<\/cite><\/blockquote><blockquote><p>„Reduktionen: Weglassen von Phonemen“<\/p><cite>Folien Sitzung 2 (vl02), Folie 45 (Variation in der Artikulation)<\/cite><\/blockquote><p>Assimilation: Anpassung von Phonen an den Kontext, z. B. [semf] statt [senf].<\/p><blockquote><p>„Sprachsynthese bildet Grapheme auf komplexe Lautsignale ab“<\/p><cite>Folien Sitzung 2 (vl02), Folie 47 (TTS, Text-to-Speech)<\/cite><\/blockquote>"}, {"titel": "7. Zeichensätze: ASCII und Unicode", "quelle": "Folien Sitzung 2 (vl02), Folien 48–53", "html": "<p>Bei geschriebener Sprache liegt der Input als Folge diskreter Symbole vor. Der Computer braucht einen Zeichensatz und eine Zeichenkodierung.<\/p><div class=\"tablewrap\"><table><thead><tr><th><\/th><th>ASCII<\/th><th>Unicode (UTF-8)<\/th><\/tr><\/thead><tbody><tr><td>Umfang<\/td><td>128 Zeichen (7 Bit + 1 Reservebit)<\/td><td>kann alle existierenden Zeichen kodieren<\/td><\/tr><tr><td>Bedeutung<\/td><td>erster Standard auf Computern, reicht für das Englische<\/td><td>heutiger Standard für Betriebssysteme und Programme<\/td><\/tr><tr><td>Beispiele<\/td><td>Leerzeichen: 32 (sp), Zeilenumbruch „\\n“: 10 (nl)<\/td><td>ältere Daten nutzen manchmal noch andere Zeichensätze<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Umfasst 128 Zeichen (7 Bit + 1 Reservebit)“<\/p><cite>Folien Sitzung 2 (vl02), Folie 51<\/cite><\/blockquote><blockquote><p>„Kann alle existierenden Zeichen kodieren“<\/p><cite>Folien Sitzung 2 (vl02), Folie 52<\/cite><\/blockquote><p>Einfache Textdateien („raw text“) enthalten nur Zeichen, keine Schriftart, und werden meist in Unicode kodiert.<\/p>"}, {"titel": "8. Wie erkennen Computer Wörter? Token und Typ", "quelle": "Folien Sitzung 2 (vl02), Folien 54–59", "html": "<p>Der Beispielsatz: <em>Wenn eine Fliege hinter Fliegen fliegt, fliegt eine Fliege Fliegen nach.<\/em> Zählt man „Fliege“ einmal oder zweimal?<\/p><div class=\"tablewrap\"><table><thead><tr><th><\/th><th>Type<\/th><th>Token<\/th><\/tr><\/thead><tbody><tr><td>Definition<\/td><td>Wortform, Element des Vokabulars einer Sprache<\/td><td>Instanz einer Wortform in einem Text<\/td><\/tr><tr><td>Beispiel im Satz<\/td><td>der Type „Fliege“<\/td><td>zwei Token des Types „Fliege“<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Wortform, Element des Vokabulars“<\/p><cite>Folien Sitzung 2 (vl02), Folie 57 (Type)<\/cite><\/blockquote><blockquote><p>„Instanz einer Wortform in einem Text“<\/p><cite>Folien Sitzung 2 (vl02), Folie 57 (Token)<\/cite><\/blockquote><p><strong>Eigene Zählung<\/strong> (ohne Satzzeichen, Groß- und Kleinschreibung unterschieden): Der Satz hat <strong>11 Token<\/strong> (running words) und <strong>7 Types<\/strong> (distinct words): Wenn, eine, Fliege, hinter, Fliegen, fliegt, nach.<\/p><blockquote><p>„Token sind Vorkommen von Wörtern einer Sprache in einem Text“<\/p><cite>Folien Sitzung 2 (vl02), Folie 60 (Zusammenfassung)<\/cite><\/blockquote><blockquote><p>„Typen sind abstrakte Wortformen einer Sprache“<\/p><cite>Folien Sitzung 2 (vl02), Folie 60<\/cite><\/blockquote>"}], "zusatz": [{"titel": "SLP3, Kapitel 16: Automatic Speech Recognition and Text-to-Speech", "url": "https://web.stanford.edu/~jurafsky/slp3/16.pdf", "typ": "Lehrbuchkapitel", "quelle": "Folie 10", "geprueft": false, "notiz": "Als Literatur zu gesprochener Sprache auf der Folie genannt. Nicht von mir geöffnet; Kapiteltitel nicht geprüft."}, {"titel": "SLP3, Kapitel 2: Wörter und Tokenisierung", "url": "https://web.stanford.edu/~jurafsky/slp3/2.pdf", "typ": "Lehrbuchkapitel", "quelle": "Folie 55", "geprueft": false, "notiz": "Als Literatur zu Wörtern auf der Folie genannt. Nicht von mir geöffnet; Kapiteltitel nicht geprüft."}, {"titel": "vosk-browser (Spracherkennungs-Demo)", "url": "https://ccoreilly.github.io/vosk-browser/", "typ": "Demo", "quelle": "Folie 11", "geprueft": false, "notiz": "Demo aus der Sitzung, nicht von mir geöffnet."}, {"titel": "Phoneme und Grapheme des Deutschen (Wiktionary)", "url": "https://de.wiktionary.org/wiki/Verzeichnis:Deutsch/Phoneme_und_Grapheme", "typ": "Nachschlagewerk", "quelle": "Folien 23 und 33", "geprueft": false, "notiz": "Auf den Folien genannt, nicht von mir geöffnet."}], "material": [{"datei": "vl02.pdf", "art": "Folien", "notiz": "Sitzung 2: Input und Output der Sprachverarbeitung, 61 Folien"}], "begriffe": ["algorithmus", "sprachliche-ebenen", "phonem", "phon-allophon", "graphem", "spracherkennung-asr", "sprachsynthese-tts", "korpus", "zeichensatz", "token-typ"]}, {"id": "erz-s2", "nr": 2, "seminar": "erz", "titel": "Faktuales und fiktionales Erzählen", "autor": "Martínez/Scheffel; Heinrich von Kleist", "lektuere": "Martínez/Scheffel, S. 11–21 (Kap. I.1); Kleist: Unwahrscheinliche Wahrhaftigkeiten, S. 376–379", "thema": "Erzählen im Alltag und in der Dichtung, Fiktionalität, Fiktionssignale und die doppelte Kommunikationssituation", "status": "entwurf", "ueberblick": {"kurzinhalt": "Das erste Kapitel von Martínez/Scheffel fragt, was ‹Erzählen› heißt und wodurch sich [[faktuales-erzaehlen|faktuales]] vom fiktionalen Erzählen unterscheidet. Es verfolgt den Streit um Dichtung und Lüge von Platon und Aristoteles bis Sidney, trennt die Begriffe [[fiktional-fiktiv-fingiert|fingiert, fiktional und fiktiv]], nennt [[fiktionssignale|Fiktionssignale]] und beschreibt die [[doppelte-kommunikation|doppelte Kommunikationssituation]] fiktionaler Texte. Kleists Anekdote lässt einen Offizier drei unwahrscheinliche Geschichten als wahr erzählen und spielt so mit dem Verhältnis von Wahrheit und Wahrscheinlichkeit.", "leitfrage": "Woran erkennt man, dass ein Text fiktional ist, und warum lügt der Dichter nach dieser Theorie nicht?", "merksatz": "Fiktional ist der pragmatische Status einer Rede, fiktiv der ontologische Status des Ausgesagten, fingiert heißt vortäuschen. Wer fiktional erzählt, erfindet, aber täuscht nicht.", "fa": ["روایت «واقع‌نما» (faktual) خبر از رویدادهای واقعی می‌دهد، مانند گزارش روزنامه. روایت «تخیلی» (fiktional) در چارچوب ادبیات و داستان قرار دارد. دروغ در این نظریه حالت خاصی از روایت واقع‌نماست، چون ادعای درستی دارد و درست نیست.", "سه واژه را باید از هم جدا کرد: fingiert یعنی «وانمود و فریب»، fiktional وضعیت کاربردی (pragmatisch) یک گفتار است، و fiktiv وضعیت هستی‌شناختی آنچه گفته می‌شود (غیرواقعی بودن). نویسنده‌ی داستان چیزی «می‌سازد» اما کسی را فریب نمی‌دهد.", "نشانه‌های تخیلی بودن: عبارت آغازین مثل «روزی روزگاری»، زیرنویس «رمان» روی جلد و ویژگی‌های درون‌متنی، مثلاً فعل‌های حالات درونی درباره‌ی شخص سوم.", "متن تخیلی دو موقعیت ارتباطی دارد: ارتباط واقعی میان نویسنده و خواننده و ارتباط خیالی میان راوی و مخاطب. به همین دلیل راوی جمله‌ها را «ادعا» می‌کند و نویسنده فقط آن‌ها را تولید می‌کند.", "کلایست در «راست‌نماهای ناباورانه» افسری را نشان می‌دهد که سه داستان باورنکردنی را راست می‌داند. نکته‌ی داستان این است که احتمال و حقیقت همیشه یکی نیستند."]}, "inhalt": [{"titel": "1. Was heißt ‹Erzählen›? Vorverständnis aus dem Wörterbuch", "quelle": "Martínez/Scheffel, S. 11–12", "html": "<p>Das Kapitel beginnt mit einem Wörterbucheintrag zu ‹Erzählen›. Aus den vielen Verwendungsweisen ergibt sich ein Vorverständnis:<\/p><blockquote><p>„Als ‹Erzählen› bezeichnet man eine Art von mündlicher oder schriftlicher Rede, in der jemand jemandem etwas Besonderes mitteilt“<\/p><cite>Martínez/Scheffel, S. 11<\/cite><\/blockquote><p>Der Eintrag zeigt außerdem zwei Unterschiede, die für eine Theorie des literarischen Erzählens wichtig sind:<\/p><ul class=\"plain\"><li><blockquote><p>„Erzählt werden kann von realen oder erfundenen Vorgängen.“<\/p><cite>Martínez/Scheffel, S. 12<\/cite><\/blockquote><\/li><li><blockquote><p>„Erzählt werden kann im Rahmen von alltäglicher Rede oder aber im Rahmen von dichterischer Rede.“<\/p><cite>Martínez/Scheffel, S. 12<\/cite><\/blockquote><\/li><\/ul><p>Daraus entstehen zwei Merkmalspaare, ‹real vs. fiktiv› und ‹dichterisch vs. nichtdichterisch›, und damit vier denkbare Kombinationen:<\/p><div class=\"tablewrap\"><table><thead><tr><th><\/th><th>nichtdichterische Rede<\/th><th>dichterische Rede<\/th><\/tr><\/thead><tbody><tr><td><strong>reale Vorgänge<\/strong><\/td><td>faktuale Erzählung: Reisebericht, Zeitungsbericht über einen Unfall, Biographie<\/td><td>schwieriger Fall: Roman mit historischem Hintergrund (Die Blechtrommel)<\/td><\/tr><tr><td><strong>erfundene Vorgänge<\/strong><\/td><td>Lüge oder Täuschung, als Sonderfall der faktualen Erzählung<\/td><td>Märchen, Fabel, erzählende Dichtung<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Diese Form der authentischen Erzählung von historischen Ereignissen und Personen sei hier als faktuale Erzählung bezeichnet“<\/p><cite>Martínez/Scheffel, S. 12 (mit Verweis auf Genette)<\/cite><\/blockquote><blockquote><p>„die Lüge oder Täuschung, die hier als ein Sonderfall der faktualen Erzählung verstanden sei“<\/p><cite>Martínez/Scheffel, S. 12<\/cite><\/blockquote><p>Der Roman <em>Die Blechtrommel<\/em> (Günter Grass) dient als Problemfall: Eine erfundene Figur erzählt ihr Leben an historischen Orten und verbindet es mit realen Ereignissen. Das Alltagswissen reicht dafür nicht aus, man braucht eine fachsprachliche Theorie (S. 12–13).<\/p>"}, {"titel": "2. Dichtung und Lüge: von Aristoteles bis Sidney", "quelle": "Martínez/Scheffel, S. 13–16", "html": "<p>Das Buch rekapituliert, wie das abendländische Verständnis von Dichtung begründet wurde.<\/p><div class=\"tablewrap\"><table><thead><tr><th>Position<\/th><th>Kern<\/th><th>Seite<\/th><\/tr><\/thead><tbody><tr><td>Aristoteles (Poetik, 4. Jh. v. Chr.)<\/td><td>Dichter und Geschichtsschreiber unterscheiden sich nicht durch Vers oder Prosa, sondern durch das, wovon sie sprechen<\/td><td>13<\/td><\/tr><tr><td>Platon (Politeia)<\/td><td>Dichtung sei Täuschung und überflüssig, wenn nicht schädlich; er wollte sie aus dem Idealstaat ausschließen<\/td><td>14<\/td><\/tr><tr><td>Aristoteles (Gegenthese)<\/td><td>Dichtung sei nützlich und notwendig, weil sie das Allgemeine mitteilt, nach Wahrscheinlichkeit und Notwendigkeit gebaut<\/td><td>14<\/td><\/tr><tr><td>Lukian (um 180 n. Chr.)<\/td><td>Gesteht in der Vorrede, dass seine „wahren Geschichten“ erfunden sind<\/td><td>14–15<\/td><\/tr><tr><td>Sir Philip Sidney (Defence of Poesy, 1595)<\/td><td>Der Dichter behauptet nichts und lügt deshalb nicht<\/td><td>15–16<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„daß der eine das wirklich Geschehene mitteilt, der andere, was geschehen könnte“<\/p><cite>Martínez/Scheffel, S. 13 (Aristoteles, Poetik 1451b)<\/cite><\/blockquote><blockquote><p>„denn ich sage doch wenigstens Eine Wahrheit, indem ich sage daß ich lüge“<\/p><cite>Martínez/Scheffel, S. 14 (Lukian)<\/cite><\/blockquote><blockquote><p>„Unter allen möglichen Verfassern von Texten, so Sidneys vielzitierte These, lügen die Dichter am allerwenigsten, weil sie – im Gegensatz zu den Geschichtsschreibern – in ihren Werken erklärtermaßen nichts behaupten“<\/p><cite>Martínez/Scheffel, S. 15<\/cite><\/blockquote><blockquote><p lang=\"en\">“the Poet, he nothing affirms, and therefore never lieth”<\/p><cite>Martínez/Scheffel, S. 15 (Sidney, Defence, S. 52 f.)<\/cite><\/blockquote><p>Die Frage nach dem Wert der Dichtung wird hier ausgeklammert. Interessant ist nur das Verhältnis von ‹Dichten› und ‹Lügen› (S. 14).<\/p>"}, {"titel": "3. fingiert, fiktional, fiktiv", "quelle": "Martínez/Scheffel, S. 16", "html": "<p>Aus Sidneys These folgt, dass Dichtung keinen Anspruch auf unmittelbare Referenzialisierbarkeit erhebt. Das Buch trennt drei verwandte Begriffe:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Begriff<\/th><th>Gegenbegriff<\/th><th>Bedeutung<\/th><\/tr><\/thead><tbody><tr><td>fingiert<\/td><td><\/td><td>‹[vor]täuschen›<\/td><\/tr><tr><td>fiktional<\/td><td>faktual, authentisch<\/td><td>pragmatischer Status einer Rede<\/td><\/tr><tr><td>fiktiv<\/td><td>real<\/td><td>ontologischer Status des in der Rede Ausgesagten<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Fiktional steht im Gegensatz zu ‹faktual› bzw. ‹authentisch› und bezeichnet den pragmatischen Status einer Rede. Fiktiv steht im Gegensatz zu ‹real› und bezeichnet den ontologischen Status des in dieser Rede Ausgesagten.“<\/p><cite>Martínez/Scheffel, S. 16<\/cite><\/blockquote><p>Barbara Herrnstein Smith geht weiter: Dichtung sei Nachahmung von Rede, nicht von Welt.<\/p><blockquote><p lang=\"en\">“in a novel or tale, it is the act of reporting events, the act of describing persons and referring to places, that is fictive”<\/p><cite>Martínez/Scheffel, S. 16 (Smith, Margins, S. 29)<\/cite><\/blockquote><p>Das Buch hält das für nur halb richtig (S. 17): Wir müssen die Rede als authentische, wenn auch fiktive Rede eines fiktiven Sprechers verstehen, die auf bestimmte Dinge referiert.<\/p><blockquote><p>„Stellen Sie sich bitte vor, dass einmal ein Müller war“<\/p><cite>Martínez/Scheffel, S. 17 (zur Eingangsformel ‹Es war einmal›)<\/cite><\/blockquote><blockquote><p>„verwechselt die Geschäftsgrundlage und liest einen Roman nach den pragmatischen Regeln einer realen Autobiographie“<\/p><cite>Martínez/Scheffel, S. 17 (über Leser, die Oskars Geburtshaus in Danzig suchen)<\/cite><\/blockquote>"}, {"titel": "4. Woran erkennt man Fiktionalität? Fiktionssignale", "quelle": "Martínez/Scheffel, S. 17–19", "html": "<p>Fiktionalität ist nach heutigem Verständnis relational:<\/p><blockquote><p>„Fiktional ist ein Text demnach nicht an und für sich, sondern in einem bestimmten historischen und sozialen Kontext“<\/p><cite>Martínez/Scheffel, S. 17<\/cite><\/blockquote><blockquote><p>„Damit eine Rede als fiktional aufgefasst wird, bedarf sie der Kontextmarkierung.“<\/p><cite>Martínez/Scheffel, S. 18<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th>Art des Signals<\/th><th>Beispiele<\/th><\/tr><\/thead><tbody><tr><td>paratextuell, kontextuell<\/td><td>‹Roman›, ‹Drama›, ‹Novelle› im Untertitel; Verlagsreihe<\/td><\/tr><tr><td>Eingangsformeln und Schlüsse<\/td><td>‹Es war einmal›; ‹Und wenn sie nicht gestorben sind …›; ‹Ende›<\/td><\/tr><tr><td>textintern<\/td><td>Verben innerer Vorgänge bei dritten Personen (‹sie fühlte, dass er kommen würde›); erweitertes Tempussystem (‹morgen war Weihnachten, und sie hatte immer noch kein Geschenk›)<\/td><\/tr><tr><td>Selbstreflexion<\/td><td>Metafiktion: Der Text macht seinen Status und die Grundlagen seiner Produktion sichtbar<\/td><\/tr><\/tbody><\/table><\/div><p>Fiktionssignale heben die normalen Regeln auf, nach denen Sprechakte und Welt zusammenhängen. Deshalb kann man von einem Sprachspiel nach besonderen Regeln sprechen und nicht von einem bloßen Regelverstoß wie bei der Lüge (S. 18, mit Searle).<\/p>"}, {"titel": "5. Die doppelte Kommunikationssituation", "quelle": "Martínez/Scheffel, S. 19–22", "html": "<p>Fiktionale Texte sind komplexer als faktuale, weil sie zwei Kommunikationssituationen angehören:<\/p><blockquote><p>„Die fiktionale Erzählung richtet sich sowohl im imaginären als auch im realen Kontext an einen Leser und stellt daher eine «kommunizierte Kommunikation» dar“<\/p><cite>Martínez/Scheffel, S. 19 (mit Janik)<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th><\/th><th>reale Kommunikation<\/th><th>imaginäre Kommunikation<\/th><\/tr><\/thead><tbody><tr><td>Sender<\/td><td>realer Autor<\/td><td>fiktiver Erzähler<\/td><\/tr><tr><td>Empfänger<\/td><td>realer Leser<\/td><td>fiktiver Hörer oder Leser<\/td><\/tr><tr><td>Sätze sind<\/td><td>real, aber inauthentisch (nicht als Behauptung des Autors gemeint)<\/td><td>imaginär, aber authentisch (vom Erzähler behauptet)<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Die fiktionale Erzählung ist zugleich Teil einer realen wie einer imaginären Kommunikation und besteht deshalb je nach Sichtweise aus real-inauthentischen oder aus imaginär-authentischen Sätzen.“<\/p><cite>Martínez/Scheffel, S. 20<\/cite><\/blockquote><p>Zwei Konsequenzen:<\/p><ul class=\"plain\"><li><strong>Zeitliche Folge fiktionsintern:<\/strong> Das Erzählte liegt dem Erzählen zeitlich voraus, auch bei Geschichten, die von außen betrachtet in der Zukunft spielen. Merksatz des Buchs: „Auch erzählte Utopien sind im Präteritum verfasst.“ (S. 21)<\/li><li><strong>Freiraum:<\/strong> Der Wegfall der Einbindung in einen realen raum-zeitlichen Zusammenhang überlässt die Ausgestaltung (Sprache, Perspektive, Figuren, erzählte Welt) im Wesentlichen der Imagination des Autors.<\/li><\/ul><blockquote><p>„durch den Wegfall jeder unmittelbaren Einbindung in einen realen raum-zeitlichen Zusammenhang ein Freiraum, dessen Ausgestaltung im Wesentlichen der Imagination des Autors überlassen bleibt“<\/p><cite>Martínez/Scheffel, S. 21<\/cite><\/blockquote><blockquote><p>„Schon deshalb erfordert ein Beschreibungsmodell des fiktionalen Erzählens neben einer Theorie des Erzählens immer auch eine Theorie der Fiktionalität.“<\/p><cite>Martínez/Scheffel, S. 22 (Übergang zum nächsten Abschnitt)<\/cite><\/blockquote>"}, {"titel": "6. Kleist: Unwahrscheinliche Wahrhaftigkeiten", "quelle": "Kleist, Unwahrscheinliche Wahrhaftigkeiten, S. 376–379", "html": "<p>Eine kurze Anekdote aus Kleists Sammlung „Fabeln, Anekdoten, Geschichten“. Ein alter Offizier will drei Geschichten erzählen, die er selbst für wahr hält, aber nicht erzählen möchte, weil man sie ihm nicht glauben würde. Die Einleitung begründet das:<\/p><blockquote><p>„Denn die Leute fordern, als erste Bedingung, von der Wahrheit, daß sie wahrscheinlich sei; und doch ist die Wahrscheinlichkeit, wie die Erfahrung lehrt, nicht immer auf Seiten der Wahrheit.“<\/p><cite>Kleist, Unwahrscheinliche Wahrhaftigkeiten, S. 376<\/cite><\/blockquote><blockquote><p>„denn man kannte den Offizier als einen heitern und schätzenswürdigen Mann, der sich der Lüge niemals schuldig machte.“<\/p><cite>Kleist, Unwahrscheinliche Wahrhaftigkeiten, S. 376<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th>Nr.<\/th><th>Geschichte (Inhalt)<\/th><th>Reaktion der Gesellschaft<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Rheinkampagne 1792: Ein Soldat marschiert trotz Schuss durch die Brust weiter. Die Kugel ist am Brustknochen abgeprallt, unter der Haut um den Leib geglitten und am Rücken wieder ausgetreten (S. 376–377).<\/td><td>Man hat Mühe, ein Gelächter zu unterdrücken.<\/td><\/tr><tr><td>2<\/td><td>Steinbruch bei Königstein (Sachsen), 1803: Ein herabstürzender Felsblock versetzt durch den Luftdruck einen schwer beladenen Elbkahn auf das Trockene am anderen Ufer (S. 377–378).<\/td><td>„Seltsam!“ ruft die Gesellschaft; der Block sei nicht ins Wasser gefallen.<\/td><\/tr><tr><td>3<\/td><td>Belagerung von Antwerpen: Ein Fahnenjunker wird durch die Explosion eines Branders samt Fahne und Gepäck über die Schelde auf das andere Ufer versetzt (S. 379).<\/td><td>Der Landedelmann ruft: „Himmel, Tod und Teufel!“<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Die Kugel? Um den ganzen Leib herum? Im Kreise?“<\/p><cite>Kleist, Unwahrscheinliche Wahrhaftigkeiten, S. 377<\/cite><\/blockquote><blockquote><p>„sagte der Offizier, indem er eine Prise Tabak nahm, und schwieg.“<\/p><cite>Kleist, Unwahrscheinliche Wahrhaftigkeiten, S. 377<\/cite><\/blockquote><blockquote><p>„Es ist wahrscheinlich, daß die ganze Elbe (die Oberfläche derselben) einen Augenblick ausgetreten“<\/p><cite>Kleist, Unwahrscheinliche Wahrhaftigkeiten, S. 378<\/cite><\/blockquote><blockquote><p>„Dixi! sprach der Offizier, nahm Stock und Hut und ging weg.“<\/p><cite>Kleist, Unwahrscheinliche Wahrhaftigkeiten, S. 379<\/cite><\/blockquote><p>Am Schluss fragt man nach der Quelle. Ein Mitglied der Gesellschaft verweist auf Schillers Geschichte vom Abfall der vereinigten Niederlande:<\/p><blockquote><p>„ein Dichter von diesem Faktum keinen Gebrauch machen könne“<\/p><cite>Kleist, Unwahrscheinliche Wahrhaftigkeiten, S. 379<\/cite><\/blockquote><p class=\"meta\">Der Wortlaut des Schlusssatzes ist im Scan teilweise schlecht lesbar, deshalb zitiere ich nur den gut lesbaren Teil.<\/p>"}, {"titel": "7. Kleist und Martínez/Scheffel (eigene Verknüpfung)", "quelle": "Eigene Verknüpfung, nicht in den Texten enthalten", "html": "<p>Das sind Lesevorschläge, keine Aussagen der Texte:<\/p><ul class=\"plain\"><li><strong>Wahrheit und Wahrscheinlichkeit:<\/strong> Kleists Offizier trennt, was der Fall ist (Wahrheit), von dem, was glaubhaft klingt (Wahrscheinlichkeit). Bei Martínez/Scheffel erscheint die Wahrscheinlichkeit bei Aristoteles als Bauprinzip der Dichtung (S. 14).<\/li><li><strong>Geschichtsschreiber und Dichter:<\/strong> Der Schlusssatz kehrt Aristoteles' Unterscheidung um. Der Geschichtsschreiber muss das Unwahrscheinliche aufnehmen, wenn die Quellen es belegen, der Dichter kann es nicht verwenden (S. 379, vgl. Martínez/Scheffel, S. 13).<\/li><li><strong>Rahmenerzählung und Kommunikationsebenen:<\/strong> Kleists Offizier erzählt in einer Gesellschaft (imaginäre Situation). Wir lesen die Anekdote als fiktional, obwohl der Offizier ausdrücklich Wahrheit beansprucht. Das ist ein Beispiel für „kommunizierte Kommunikation“.<\/li><li><strong>Fiktionssignal?<\/strong> Die Anekdote erhebt den Anspruch auf Wahrheit und stützt ihn durch genaue Orts- und Zeitangaben (1792, 1803, Königstein, Antwerpen). Welche Signale sprechen trotzdem für die Lektüre als Fiktion?<\/li><\/ul><h3 style=\"margin-top:1.2rem\">Fragen zur Diskussion<\/h3><ul class=\"plain\"><li>Wo liegt in Kleists Text der Übergang zwischen faktualer und fiktionaler Rede?<\/li><li>Wie würde sich der Text lesen, wenn er als Zeitungsbericht gerahmt wäre?<\/li><li>Bietet das Vier-Felder-Schema (real/erfunden, nichtdichterisch/dichterisch) Platz für Kleists Anekdote?<\/li><\/ul>"}, {"titel": "8. Deine Mitschrift vom 19.10.2026", "quelle": "Notizen/Kafka Kleist.pdf (handschriftlich, von Hand abgelesen)", "html": "<p>Deine Notizen aus der Sitzung, Überschrift „Kafka, Kleist und die Kunst des Erzählens“. Sinngemäß abgetippt, mit den passenden Stellen im Buch:<\/p><ol><li><strong>Aristoteles, Poetik (4. Jh. v. Chr.):<\/strong> „das, was geschehen könnte“, im Gegensatz zum Geschichtsschreiber. Dagegen Platon: Dichtung als Täuschung. Stichwörter: „Mimesis“, „Wahrscheinlichkeit“, „Notwendigkeit“. (Buch S. 13–14)<\/li><li><strong>Lukian (um 180 n. Chr.):<\/strong> Radikalisierung von Aristoteles’ Definition. (Buch S. 14–15)<\/li><li><strong>Sidney (1595):<\/strong> Der Begriff der Lüge greift nicht. Dichtung ist da, wo nicht ist und niemals sein wird. (Buch S. 15–16)<\/li><li><strong>Smith:<\/strong> Dichtung ist Nachahmung von Rede und nicht Nachahmung von Welt, ohne empirische Objektbezüge und ohne Verankerung in einer realen Gesprächssituation. Gemeint ist Barbara Herrnstein Smith. (Buch S. 16)<\/li><\/ol><p class=\"meta\">Am Rand steht: „Reclam, Griechisch/Deutsche Texte“. Das Kleist-Handbuch führt auf S. 159 diese Aristoteles-Ausgabe: Poetik. Griechisch/Deutsch. Übersetzt und hg. von Manfred Fuhrmann. Stuttgart 1989. Das ist vermutlich die Reclam-Ausgabe aus der Sitzung.<\/p>"}], "zusatz": [], "material": [{"datei": "Martinez, Scheffel (2019)-Einführung in die Erzähltheorie.pdf", "art": "Lektüre", "notiz": "gedruckte S. 11–22 (PDF-Seiten 12–23)"}, {"datei": "Kleist, Heinrich-Unwahrscheinliche Wahrhaftigkeiten.pdf", "art": "Primärtext", "notiz": "Sämtliche Erzählungen, hg. v. Müller-Salget, Frankfurt a. M. 2005, S. 376–379 (Scan)"}, {"datei": "Kafka Kleist.pdf", "art": "Notizen", "notiz": "deine handschriftliche Mitschrift vom 19.10.2026 (Ordner Notizen)"}, {"datei": "unwahrscheinliche Wahrhaftigkeiten Kleist.pdf", "art": "Handbuch", "notiz": "Kleist-Handbuch, Kap. II.2.12, S. 156–159"}], "begriffe": ["faktuales-erzaehlen", "fiktional-fiktiv-fingiert", "dichtung-luege", "fiktionssignale", "doppelte-kommunikation"]}, {"id": "erz-s3", "nr": 3, "titel": "Vor dem Gesetz", "autor": "Franz Kafka", "thema": "Das Erzählen und das Erzählte", "begriffe": ["erzaehlen-erzaehltes", "erzaehlte-welt", "handlung", "darstellung", "fiktionale-behauptungssaetze", "fabula-sjuzet", "histoire-discours", "genette", "ereignis", "geschehen", "geschichte", "handlungsschema", "erzaehlung", "erzaehlen", "erzaehltempo"], "ueberblick": {"kurzinhalt": "Ein Mann vom Lande will in das Gesetz. Der Türhüter sagt, jetzt könne er ihn nicht einlassen. Der Mann wartet Tage und Jahre vor dem offenen Tor, besticht den Türhüter und stellt ihm kurz vor seinem Tod eine letzte Frage: Warum hat in all den Jahren niemand außer ihm Einlass verlangt? Der Türhüter antwortet, dieser Eingang sei nur für ihn bestimmt gewesen, und schließt ihn.", "leitfrage": "Wie unterscheiden wir das Erzählte (das „Was“) vom Erzählen (dem „Wie“)? Und warum ist diese Unterscheidung auch bei fiktionalen Texten sinnvoll?", "merksatz": "[[erzaehlen-erzaehltes|Das Erzählte]] umfasst die Ebenen 1–4 ([[ereignis|Ereignis]], [[geschehen|Geschehen]], [[geschichte|Geschichte]], [[handlungsschema|Handlungsschema]]). [[erzaehlen-erzaehltes|Das Erzählen]] umfasst die Ebenen 5–6 ([[erzaehlung|Erzählung]], [[erzaehlen|Erzählen]]).", "fa": ["مردی روستایی می‌خواهد وارد «قانون» شود، اما دربان اجازه نمی‌دهد. مرد سال‌ها منتظر می‌ماند و در پایان می‌فهمد که این در فقط برای او بوده است.", "در کتاب مارتینز/شفل (ص ۲۲–۲۸) یاد می‌گیریم که هر روایت دو لایه دارد: «آنچه روایت می‌شود» (das Erzählte) و «شیوه‌ی روایت‌کردن» (das Erzählen).", "همین داستان را می‌شود به شیوه‌های بی‌شمار بازگفت، بی‌آنکه داستان عوض شود."]}, "text": {"quelle": "Franz Kafka: Vor dem Gesetz. In: Drucke zu Lebzeiten. Kritische Ausgabe, hg. von Wolf Kittler, Hans-Gerd Koch und Gerhard Neumann. S. Fischer 1994, S. 267–269.", "hinweis": "Rechtschreibung und Wortlaut folgen der Ausgabe („daß“, „Einlaß“, „sehn“). Die Einteilung in drei Abschnitte stammt aus dem Wiki, im Original ist es ein durchgehender Text.", "teile": [{"titel": "Abschnitt 1 · Am Tor", "t": "Vor dem Gesetz steht ein Türhüter. Zu diesem Türhüter kommt ein Mann vom Lande und bittet um Eintritt in das Gesetz. Aber der Türhüter sagt, daß er ihm jetzt den Eintritt nicht gewähren könne. Der Mann überlegt und fragt dann, ob er also später werde eintreten dürfen. „Es ist möglich“, sagt der Türhüter, „jetzt aber nicht.“ Da das Tor zum Gesetz offensteht wie immer und der Türhüter beiseite tritt, bückt sich der Mann, um durch das Tor in das Innere zu sehn. Als der Türhüter das merkt, lacht er und sagt: „Wenn es dich so lockt, versuche es doch, trotz meines Verbotes hineinzugehn. Merke aber: Ich bin mächtig. Und ich bin nur der unterste Türhüter. Von Saal zu Saal stehn aber Türhüter, einer mächtiger als der andere. Schon den Anblick des dritten kann nicht einmal ich mehr ertragen.“ Solche Schwierigkeiten hat der Mann vom Lande nicht erwartet; das Gesetz soll doch jedem und immer zugänglich sein, denkt er, aber als er jetzt den Türhüter in seinem Pelzmantel genauer ansieht, seine große Spitznase, den langen, dünnen, schwarzen tatarischen Bart, entschließt er sich, doch lieber zu warten, bis er die Erlaubnis zum Eintritt bekommt."}, {"titel": "Abschnitt 2 · Die Jahre des Wartens", "t": "Der Türhüter gibt ihm einen Schemel und läßt ihn seitwärts von der Tür sich niedersetzen. Dort sitzt er Tage und Jahre. Er macht viele Versuche, eingelassen zu werden, und ermüdet den Türhüter durch seine Bitten. Der Türhüter stellt öfters kleine Verhöre mit ihm an, fragt ihn über seine Heimat aus und nach vielem andern, es sind aber teilnahmslose Fragen, wie sie große Herren stellen, und zum Schlüsse sagt er ihm immer wieder, daß er ihn noch nicht einlassen könne. Der Mann, der sich für seine Reise mit vielem ausgerüstet hat, verwendet alles, und sei es noch so wertvoll, um den Türhüter zu bestechen. Dieser nimmt zwar alles an, aber sagt dabei: „Ich nehme es nur an, damit du nicht glaubst, etwas versäumt zu haben.“ Während der vielen Jahre beobachtet der Mann den Türhüter fast ununterbrochen. Er vergißt die andern Türhüter und dieser erste scheint ihm das einzige Hindernis für den Eintritt in das Gesetz. Er verflucht den unglücklichen Zufall, in den ersten Jahren rücksichtslos und laut, später, als er alt wird, brummt er nur noch vor sich hin. Er wird kindisch, und, da er in dem jahrelangen Studium des Türhüters auch die Flöhe in seinem Pelzkragen erkannt hat, bittet er auch die Flöhe, ihm zu helfen und den Türhüter umzustimmen."}, {"titel": "Abschnitt 3 · Das Ende", "t": "Schließlich wird sein Augenlicht schwach, und er weiß nicht, ob es um ihn wirklich dunkler wird, oder ob ihn nur seine Augen täuschen. Wohl aber erkennt er jetzt im Dunkel einen Glanz, der unverlöschlich aus der Türe des Gesetzes bricht. Nun lebt er nicht mehr lange. Vor seinem Tode sammeln sich in seinem Kopfe alle Erfahrungen der ganzen Zeit zu einer Frage, die er bisher an den Türhüter noch nicht gestellt hat. Er winkt ihm zu, da er seinen erstarrenden Körper nicht mehr aufrichten kann. Der Türhüter muß sich tief zu ihm hinunterneigen, denn der Größenunterschied hat sich sehr zu ungunsten des Mannes verändert. „Was willst du denn jetzt noch wissen?“ fragt der Türhüter, „du bist unersättlich.“ „Alle streben doch nach dem Gesetz“, sagt der Mann, „wieso kommt es, daß in den vielen Jahren niemand außer mir Einlaß verlangt hat?“ Der Türhüter erkennt, daß der Mann schon an seinem Ende ist, und, um sein vergehendes Gehör noch zu erreichen, brüllt er ihn an: „Hier konnte niemand sonst Einlaß erhalten, denn dieser Eingang war nur für dich bestimmt. Ich gehe jetzt und schließe ihn.“"}]}, "buch": {"einleitung": "Die Seiten 22–28 stehen im Kapitel „I. Merkmale fiktionalen Erzählens“, Abschnitt 2: Das Erzählen und das Erzählte. Jede Karte gibt einen Gedanken des Buches wieder, belegt ihn mit einem Zitat und wendet ihn auf Kafka an.", "karten": [{"seite": "S. 22", "titel": "Zwei Lesehaltungen: auf das „Was“ achten", "text": "Beim Lesen achten wir meistens auf den Inhalt. Wie der Text etwas erzählt, rückt in den Hintergrund.", "zitate": [{"t": "Wenn und solange wir eine solche Lesehaltung einnehmen, konzentrieren wir uns auf das, was uns erzählt wird, und blenden die Art und Weise, wie die Geschichte vermittelt wird, aus dem Bereich unserer Aufmerksamkeit aus.", "s": "S. 22"}], "kafka": "Wir fragen zuerst: Warum lässt der Türhüter den Mann nicht ein? Dass der Text im Präsens steht und aus knappen Sätzen besteht, bemerken wir erst, wenn wir auf das „Wie“ achten."}, {"seite": "S. 22–23", "titel": "Ist die Trennung bei Fiktion sinnvoll?", "text": "Bei einem Bericht können wir Ereignisse mit anderen Quellen vergleichen. Bei fiktionalen Texten kennen wir die Welt nur durch den Text. Das Buch zeigt das an Goethes „Werther“: Über den wirklichen Carl Wilhelm Jerusalem gibt es Berichte und Urkunden, über Werther nur den Roman.", "zitate": [{"t": "Aber ist denn im Falle fiktionaler Texte eine solche Unterscheidung zwischen dem Inhalt und seiner Darstellung sinnvoll?", "s": "S. 22"}], "kafka": "Was hinter dem Tor liegt, steht nirgends außerhalb des Textes. Wir wissen nur, was der Text uns mitteilt."}, {"seite": "S. 23", "titel": "Dieselbe Geschichte, viele Darstellungen", "text": "Das Buch antwortet: Man muss beides trennen, weil man dieselbe Geschichte auf viele Weisen erzählen kann. Beispiel ist Kafkas Roman „Das Schloß“. In der ersten Fassung erzählt ein „ich“, in der zweiten ein Erzähler über „K.“. Die Information über die erzählte Welt bleibt gleich.", "zitate": [{"t": "… dass die erzählte Geschichte und ihre Welt von der Art und Weise ihrer Darstellung zu unterscheiden sind.", "s": "S. 23"}, {"t": "Es wird uns mitgeteilt, dass es spät abends war, als der Protagonist ankam.", "s": "S. 23"}, {"t": "Eine Geschichte, die wir als dieselbe Geschichte wiedererkennen, kann auf unzählige verschiedene Weisen präsentiert werden.", "s": "S. 23"}], "kafka": "„Vor dem Gesetz“ könnte der Mann in der Ich-Form erzählen oder der Türhüter aus seiner Sicht. Die Geschichte bliebe erkennbar dieselbe (Beispiel in der Analyse)."}, {"seite": "S. 23–24", "titel": "Illusion und Distanz beim Lesen", "text": "Das Buch stellt Theorien vor: Boileau (der Leser muss das Erzählte vorübergehend für real halten), Aristoteles (wir haben Freude an der Nachahmung), Ingarden und Iser (wir schweben zwischen Illusion und dem Wissen, dass es Fiktion ist). Eine abschließende Antwort gibt es nicht.", "zitate": [{"t": "Eine befriedigende Antwort auf die Frage nach der psychischen Distanz des Lesers zu fiktiven Welten hat die Literaturwissenschaft bislang nicht gegeben.", "s": "S. 24"}], "kafka": "Wir wissen, dass „Vor dem Gesetz“ ein Gleichnis ist, und leiden trotzdem mit dem Mann. Das ist ein Beispiel für dieses Schweben (eigenes Beispiel, nicht aus dem Buch)."}, {"seite": "S. 24", "titel": "Fiktionale Behauptungssätze", "text": "Auch in fiktionalen Texten gibt es Tatsachen, aber sie gelten in der erzählten Welt. Ob der Leser sie für wirklich hält, spielt dafür keine Rolle.", "zitate": [{"t": "Fiktionale Behauptungssätze enthalten eine Referenz auf Tatsachen der durch sie erzählten Welt, unabhängig davon, ob der Leser diese zeitweise für Gegebenheiten seiner objektiven Wirklichkeit nimmt oder nicht.", "s": "S. 24"}], "kafka": "In der erzählten Welt gilt als Tatsache: <span class=\"kq\">„Da das Tor zum Gesetz offensteht wie immer“<\/span>. Deshalb kann der Türhüter sagen: <span class=\"kq\">„versuche es doch, trotz meines Verbotes hineinzugehn“<\/span>."}, {"seite": "S. 25", "titel": "fabula/sjužet und histoire/discours", "text": "Der russische Formalismus nennt die Reihe der Ereignisse fabula und ihre Anordnung im Werk sjužet. Todorov übernimmt das als [[histoire-discours|histoire und discours]]. Sein discours ist weiter gefasst als das sjužet.", "zitate": [{"t": "die Gesamtheit der Motive in ihrer logischen, kausal-temporalen Verknüpfung", "s": "S. 25", "q": "Tomaševskij über die fabula, zitiert bei Martínez/Scheffel"}, {"t": "die Gesamtheit derselben Motive in derjenigen Reihenfolge und Verknüpfung, in der sie im Werk vorliegen", "s": "S. 25", "q": "Tomaševskij über das sjužet, zitiert bei Martínez/Scheffel"}, {"t": "Dieselbe Geschichte hätte uns auch auf andere Weise vermittelt werden können, beispielsweise durch einen Film", "s": "S. 25", "q": "Todorov über die histoire, zitiert bei Martínez/Scheffel"}], "kafka": "Die Reihenfolge ist chronologisch, fabula und sjužet liegen also nah beieinander. Der Unterschied zeigt sich bei Perspektive und Tempo, und die gehören zu Todorovs weiterem discours-Begriff."}, {"seite": "S. 26", "titel": "Erzählte Welt, Handlung, Darstellung und Genettes Dreiteilung", "text": "Das Buch trennt die [[erzaehlte-welt|erzählte Welt]] (alles, was in der Geschichte existiert) von der engeren [[handlung|Handlung]]. Genette teilt in [[genette|Geschichte, Erzählung und Narration]]. Martínez/Scheffel übernehmen die Idee, teilen aber die Seite des „Wie“ in zwei Ebenen.", "zitate": [{"t": "Die andere Seite der Opposition, also die Art und Weise der Vermittlung der erzählten Welt, bezeichnen wir als Darstellung.", "s": "S. 26"}, {"t": "das Signifikat oder den narrativen Inhalt", "s": "S. 26", "q": "Genette über die Geschichte, zitiert bei Martínez/Scheffel"}], "kafka": "Zur erzählten Welt gehören auch die weiteren Türhüter: <span class=\"kq\">„Von Saal zu Saal stehn aber Türhüter, einer mächtiger als der andere.“<\/span> Sie greifen nie in die Handlung ein."}, {"seite": "S. 27–28", "titel": "Sechs Ebenen und die Tabelle der Begriffe", "text": "Weil die Fachbegriffe nicht einheitlich sind, schlagen die Autoren sechs Ebenen vor (siehe Analyse). Die Tabelle auf S. 28 vergleicht, wie 19 Autorinnen und Autoren ihre Begriffe auf diese Ebenen verteilen, zum Beispiel Forster, Genette, Todorov und Tomaševskij.", "zitate": [{"t": "Wie unsere theoriegeschichtlichen Hinweise bereits zeigen, ist die literaturwissenschaftliche Terminologie in diesem Zusammenhang nicht einheitlich.", "s": "S. 27"}], "kafka": "Die Ebenen 1–6 an „Vor dem Gesetz“ durchgespielt: siehe Reiter „Analyse“."}]}, "analyse": {"einleitung": "Die sechs Ebenen aus [[erzaehlen-erzaehltes|Martínez/Scheffel]] (S. 27–28), auf „Vor dem Gesetz“ angewendet. Ebene 1–4 gehören zur Handlung (das Erzählte), Ebene 5–6 zur Darstellung (das Erzählen).", "ebenen": [{"n": 1, "gruppe": "Das Erzählte: Handlung", "titel": "[[ereignis|Ereignis (Motiv)]]", "fa": "رویداد", "zitate": [{"t": "Die elementare Einheit eines narrativen Textes im Bereich der Handlung ist das Ereignis oder Motiv.", "s": "S. 27"}], "kafka": "Ein Er
