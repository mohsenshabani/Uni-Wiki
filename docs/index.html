eignis ist zum Beispiel <span class=\"kq\">„Der Türhüter gibt ihm einen Schemel“<\/span> oder <span class=\"kq\">„bückt sich der Mann, um durch das Tor in das Innere zu sehn“<\/span>."}, {"n": 2, "gruppe": "Das Erzählte: Handlung", "titel": "[[geschehen|Geschehen]]", "fa": "رخدادها به ترتیب زمانی", "zitate": [{"t": "Auf einer ersten Integrationsstufe erscheinen Ereignisse zu einem Geschehen aneinandergereiht, indem sie chronologisch aufeinander folgen.", "s": "S. 27"}], "kafka": "Der Mann kommt, bittet um Eintritt, setzt sich, wartet Jahre, stellt seine Frage, stirbt. Hier gibt es nur „und dann“, noch kein „weil“."}, {"n": 3, "gruppe": "Das Erzählte: Handlung", "titel": "[[geschichte|Geschichte]]", "fa": "داستان با رابطه‌ی علّی", "zitate": [{"t": "… wenn die Ereignisfolge zusätzlich zum chronologischen auch einen kausalen Zusammenhang aufweist, so dass die Ereignisse nicht nur aufeinander, sondern auch auseinander folgen.", "s": "S. 27"}], "kafka": "Der Text nennt einen Grund: Der Mann sieht den Türhüter genauer an, <span class=\"kq\">„entschließt er sich, doch lieber zu warten“<\/span>. Weil er wartet, wird er alt und stirbt, ohne eingetreten zu sein. So werden die Ereignisse zu einer Geschichte."}, {"n": 4, "gruppe": "Das Erzählte: Handlung", "titel": "[[handlungsschema|Handlungsschema]]", "fa": "الگوی کلیِ کنش", "zitate": [{"t": "Durch die Integration in ein Handlungsschema erhält die Geschichte eine abgeschlossene (Anfang, Mitte, Ende) und sinnhafte (z. B. archetypische) Struktur.", "s": "S. 27"}], "kafka": "Mögliches Schema: Ein Suchender kommt an eine Schwelle, wartet und scheitert. Anfang ist die Ankunft vor dem Tor, Mitte die Jahre des Wartens, Ende der Tod und das Schließen des Eingangs. Das ist eine Deutung, die Einordnung als Gleichnis steht nicht im Buch."}, {"n": 5, "gruppe": "Das Erzählen: Darstellung", "titel": "[[erzaehlung|Erzählung]]", "fa": "ترتیب و زمان‌بندی ارائه", "zitate": [{"t": "Die erzählten Ereignisse in der Reihenfolge ihrer Darstellung im Text.", "s": "S. 27"}, {"t": "(Erzähltempo, Rückwendung, Vorausdeutung)", "s": "S. 27"}], "kafka": "Der Text beginnt ohne Einleitung: <span class=\"kq\">„Vor dem Gesetz steht ein Türhüter.“<\/span> Jahre werden in einem Satz zusammengefasst: <span class=\"kq\">„Dort sitzt er Tage und Jahre.“<\/span> Anfang und Ende dagegen sind als Gespräch ausgestaltet. Es gibt eine kleine Vorausdeutung: <span class=\"kq\">„Nun lebt er nicht mehr lange.“<\/span> Die Reihenfolge der Ereignisse ist chronologisch."}, {"n": 6, "gruppe": "Das Erzählen: Darstellung", "titel": "[[erzaehlen|Erzählen]]", "fa": "زبان، سبک و موقعیت روایی", "zitate": [{"t": "Die Präsentation der Geschichte und die Art und Weise dieser Präsentation in bestimmten Sprachen, Medien (z. B. rein sprachliche oder audio-visuelle) und Darstellungsverfahren (z. B. Erzählsituation oder Sprachstil).", "s": "S. 28"}], "kafka": "Ein Erzähler in der dritten Person, der nicht als Figur auftritt. Der Text steht im Präsens (eigene Beobachtung). Wir sehen in den Mann hinein: <span class=\"kq\">„denkt er“<\/span>, <span class=\"kq\">„er weiß nicht, ob es um ihn wirklich dunkler wird“<\/span>. Den Türhüter sehen wir von außen: <span class=\"kq\">„lacht er“<\/span>, <span class=\"kq\">„brüllt er ihn an“<\/span>. Genauere Begriffe dafür folgen im Kapitel „II. Das ‹Wie›: Darstellung“."}], "beobachtungen": [{"titel": "Erzählte Welt und Handlung", "text": "Handlungsrelevant ist das Aussehen des Türhüters, denn es bestimmt die Entscheidung des Mannes: <span class=\"kq\">„in seinem Pelzmantel genauer ansieht, seine große Spitznase, den langen, dünnen, schwarzen tatarischen Bart“<\/span>. Nur zur erzählten Welt gehören die weiteren Türhüter und Säle. Ob es sie gibt, erfahren wir ausschließlich aus der Rede des Türhüters."}, {"titel": "Dieselbe Geschichte, andere Darstellung (Übung)", "text": "Original: <span class=\"kq\">„Zu diesem Türhüter kommt ein Mann vom Lande und bittet um Eintritt in das Gesetz.“<\/span> In der Ich-Form könnte es heißen: „Ich ging zu dem Türhüter und bat um Eintritt in das Gesetz.“ (eigenes Beispiel). Die [[geschichte|Geschichte]] bleibt dieselbe, die [[darstellung|Darstellung]] ändert sich: Perspektive, Nähe zum Mann und Ton sind anders."}, {"titel": "fabula und sjužet", "text": "Weil die Reihenfolge chronologisch ist, fallen [[fabula-sjuzet|fabula und sjužet]] fast zusammen. Interessanter ist Todorovs [[histoire-discours|discours]]: Er umfasst auch Perspektive und Stil."}], "fragen": ["Wo ist die Grenze zwischen [[geschehen|Geschehen]] und [[geschichte|Geschichte]]? Ist der Grund für das Warten im Text eindeutig angegeben?", "Was ändert sich, wenn der Türhüter erzählt oder wenn die Geschichte in der Ich-Form steht?", "Welche Teile der [[erzaehlte-welt|erzählten Welt]] sind nur behauptet und werden nie bestätigt?"]}, "seminar": "erz", "status": "entwurf", "lektuere": "Martínez/Scheffel, S. 22–28", "material": [{"datei": "Kafka_Franz-Vor_dem_Gesetz_Kritische_Ausgabe.pdf", "art": "Primärtext", "notiz": "Kritische Ausgabe, S. 267–269"}, {"datei": "Martinez_Scheffel_2019-Einführung_in_die_Erzähltheorie.pdf", "art": "Lektüre", "notiz": "gedruckte S. 22–28 (PDF-Seiten 23–29)"}, {"datei": "Kommentar Kafka vor dem Gesetz HB S458.pdf", "art": "Handbuch", "notiz": "Kafka-Handbuch, S. 458–459 (Kleine Formen: Parabeln)"}], "zusatz": []}, {"id": "ki-s1", "nr": 1, "seminar": "ki", "titel": "Einstieg, Seminarplanung und Übung zu KI-Feedback", "autor": "Prof. Dr. Claudia Riemer", "lektuere": "Folien Einstieg (4 Folien)", "thema": "Seminarplan, Studien- und Prüfungsleistung, eigene Lernertext-Übung mit KI-Feedback", "status": "entwurf", "ueberblick": {"kurzinhalt": "Die erste Sitzung stellt den Seminarplan (drei Blöcke) und die Anforderungen für Studien- und Prüfungsleistung vor. In einer Übung schreibt man selbst einen kurzen Text in einer L2, reflektiert die eigenen Korrekturstrategien und lässt den Text von einem KI-Tool kommentieren, um zu erleben, welche Prompts und welches [[ki-feedback|KI-Feedback]] nützlich sind.", "leitfrage": "Welche Strategien nutze ich beim Korrigieren eigener Texte, und welches KI-Feedback finde ich nützlich?", "merksatz": "Erst selbst schreiben, dann KI-Feedback einholen und kritisch vergleichen: Die eigene Erfahrung ist der Ausgangspunkt für die Forschungsfrage des Seminars.", "fa": ["سمینار سه بلوک دارد: (۱) مقدمه‌ی موضوعی و مبانی، (۲) پژوهش تجربی درباره‌ی بازخورد هوش مصنوعی در L2 (جست‌وجو، انتخاب و تحلیل مطالعات)، (۳) تدوین یک واحد آموزشی.", "Studienleistung: کار گروهی (۳ تا ۵ نفر) با ارائه‌ی دستاوردها؛ تحلیل یک مطالعه‌ی تجربی و طراحی یک واحد درسی با استفاده از بازخورد هوش مصنوعی. Prüfungsleistung: مقاله‌ی ۱۵ تا ۲۰ صفحه‌ای یا امتحان شفاهی حدود ۴۵ دقیقه (طبق اسلاید). گروه‌ها تا ۱۷.۱۱.۲۰۲۶ تعیین شوند.", "تمرین: یک متن حدود ۱۵۰ کلمه‌ای در یک زبان دوم بنویس (بدون ابزار ترجمه)، سپس از یک ابزار هوش مصنوعی با پرامپت‌های مختلف بازخورد بگیر و مقایسه کن."]}, "inhalt": [{"titel": "1. Seminarplan", "quelle": "Folien Einstieg (Riemer), Folie 2 (Bildschirmfoto aus Moodle, von mir abgelesen)", "html": "<p>Das Seminar „Feedback und generative KI, empirische Studien und Konsequenzen für den DaF- und DaZ-Unterricht“ (Prof. Dr. Claudia Riemer, WiSe 2026/27) ist in Blöcke gegliedert. Auf der Folie sind drei Blöcke sichtbar:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Block<\/th><th>Titel laut Folie<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Thematische Einführung – Grundlagen – Überblick<\/td><\/tr><tr><td>2<\/td><td>Empirische Forschung in der L2-KI-Feedbackforschung: Recherche, Auswahl und Analyse von Studien<\/td><\/tr><tr><td>3<\/td><td>Entwicklung einer didaktisierten Lerneinheit<\/td><\/tr><\/tbody><\/table><\/div><p class=\"meta\">Möglicherweise gibt es weitere Blöcke; die Folie schneidet die Liste ab.<\/p>"}, {"titel": "2. Zeitplan", "quelle": "Folien Einstieg (Riemer), Folie 3", "html": "<p>Die Folie nennt Termine und Themen des Semesters. Rot markiert sind dort Fristen, hier mit „Frist“ gekennzeichnet.<\/p><div class=\"tablewrap\"><table><thead><tr><th>Datum<\/th><th>Thema / Frist<\/th><\/tr><\/thead><tbody><tr><td>13.10.<\/td><td>Seminarplanung, Einstiegsübung<\/td><\/tr><tr><td>20.10.<\/td><td>Theoretische Grundlagen 1: KI und Fremdsprachenlernen. Gemeinsame Lektüre und Besprechung von Moorhouse/Wong 2025, Teil I (Kap. 1–4)<\/td><\/tr><tr><td>27.10.<\/td><td>Theoretische Grundlagen 2: KI und Fremdsprachenlernen. Teil II (Kap. 5–8)<\/td><\/tr><tr><td>3.11.<\/td><td>Gruppenarbeit, Training<\/td><\/tr><tr><td>10.11.<\/td><td>Theoretische Grundlagen 3: Feedback und Schreiben in der L2. <em>Frist:<\/em> Gruppenzuordnung bis 17.11. abgeschlossen<\/td><\/tr><tr><td>17.11.<\/td><td>Überblick über das Forschungsthema: Lektüre von Meta-Studien<\/td><\/tr><tr><td>24.11.<\/td><td>Recherche von empirischen Studien zur Rolle von genKI beim Schreiben in der L2 (Gruppenarbeit)<\/td><\/tr><tr><td>1.12.<\/td><td>Kurzpräsentation von gefundenen empirischen Studien. <em>Frist:<\/em> Auswahl der empirischen Studie bis 8.12.<\/td><\/tr><tr><td>8.12.<\/td><td>Analyse empirischer Studien mit dem Analyseraster (Einführung Analyseraster, Gruppenarbeit)<\/td><\/tr><tr><td>15.12.<\/td><td>Analyse empirischer Studien mit dem Analyseraster (Gruppenarbeit). <em>Frist:<\/em> ausgefüllte Analyseraster bis 21.12.<\/td><\/tr><tr><td>22.12.<\/td><td>Kurzpräsentation der Analyseergebnisse: Diskussion im Seminar, mündliche Kommentierung der Gruppen, keine PowerPoint-Präsentation<\/td><\/tr><tr><td>Weihnachtspause<\/td><td><\/td><\/tr><tr><td>12.1.<\/td><td>Entwicklung einer didaktisierten Lerneinheit (Einführung in die Aufgabe, Gruppenarbeit)<\/td><\/tr><tr><td>19.1.<\/td><td>Entwicklung einer didaktisierten Lerneinheit (Gruppenarbeit). <em>Frist:<\/em> Entwurf der Lerneinheit bis 25.1.<\/td><\/tr><tr><td>26.1.<\/td><td>Präsentation der entwickelten Lerneinheiten plus Peer-Feedback<\/td><\/tr><tr><td>2.2.<\/td><td>Präsentation der entwickelten Lerneinheiten plus Peer-Feedback<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Gemeinsame Lektüre und Besprechung von Moorhouse/Wong 2025, Teil I (Kap. 1–4)“<\/p><cite>Folien Einstieg (Riemer), Folie 3 (Bild, von mir abgelesen)<\/cite><\/blockquote>"}, {"titel": "3. Studienleistung, Prüfungsleistung, Arbeitsgruppen", "quelle": "Folien Einstieg (Riemer), Folie 2 (Bildschirmfoto aus Moodle, von mir abgelesen)", "html": "<p>Die Folie zeigt eine Moodle-Beschreibung. Sinngemäß:<\/p><ul class=\"plain\"><li><strong>Studienleistung:<\/strong> Erarbeitung in betreuter Gruppenarbeit mit Präsentationen im Seminar. Recherche und Analyse einer empirischen Studie aus dem Themenbereich sowie Didaktisierung einer Lerneinheit mit Einsatz von KI-Feedback (als Gruppenarbeit).<\/li><li><strong>Prüfungsleistung:<\/strong> Voraussetzung ist die Beteiligung an der Gruppenarbeit inklusive Präsentationen im Seminar. Dann entweder eine schriftliche Hausarbeit (ca. 15–20 Seiten, kritische Analyse von mindestens zwei empirischen Studien) oder eine ca. 45-minütige mündliche Prüfung mit 5–10-seitigem Thesenpapier als Modulprüfung. In beiden Fällen wird vorab eine Kurzpräsentation der gewählten Thematik im Seminar verlangt.<\/li><li><strong>Zusatzbestimmung:<\/strong> Wird im Modul „Sprachlehr- und -lernforschung“ die schriftliche Hausarbeit gewählt, muss das Modul „Entwicklungen in der Sprach- und Kulturvermittlung“ mündlich abgeschlossen werden und umgekehrt.<\/li><li><strong>Arbeitsgruppen:<\/strong> 3 bis 5 Personen, in begründeten Ausnahmefällen und nur nach Rücksprache Partner- oder Einzelarbeit. <strong>Die Gruppen sind bis spätestens 17.11.2026 festzulegen<\/strong> (Eintrag in Moodle).<\/li><\/ul><p class=\"meta\">Wortlaut bitte in Moodle gegenprüfen, ich habe nur das Bildschirmfoto gelesen.<\/p>"}, {"titel": "4. Übung zu KI-Feedback", "quelle": "Folien Einstieg (Riemer), Folie 4", "html": "<p>Die Übung hat vier Schritte:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Schritt<\/th><th>Aufgabe<\/th><\/tr><\/thead><tbody><tr><td>1. Schreiben<\/td><td>Digitaler Text in einer L2 deiner Wahl, ca. 150 Wörter, 15 Minuten, ohne Übersetzungstool. Impuls A oder B.<\/td><\/tr><tr><td>2. Reflektieren<\/td><td>Welche Strategien zur Textkorrektur habe ich beim Schreiben genutzt?<\/td><\/tr><tr><td>3. KI-Feedback<\/td><td>Text in ein KI-Tool laden (ChatGPT, Claude, BiKi o. ä.) und mit verschiedenen Prompts Feedback einholen.<\/td><\/tr><tr><td>4. Auswerten<\/td><td>Welches Feedback ist nützlich? Welcher Prompt war am besten? Womit bin ich unzufrieden?<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Benutzen Sie bitte kein Übersetzungstool.“<\/p><cite>Folien Einstieg (Riemer), Folie 4<\/cite><\/blockquote><p><strong>Impuls A:<\/strong><\/p><blockquote><p>„Was ich über die Chancen und Risiken von KI-Feedback für die Verbesserung der L2-Schreibkompetenz weiß“<\/p><cite>Folien Einstieg (Riemer), Folie 4<\/cite><\/blockquote><p><strong>Impuls B:<\/strong><\/p><blockquote><p>„Welches Feedback zu schriftlichen Lernertexten ist effektiver: KI-Feedback oder Lehrerfeedback?“<\/p><cite>Folien Einstieg (Riemer), Folie 4<\/cite><\/blockquote><blockquote><p>„Experimentieren Sie mit unterschiedlichen Prompts und lassen sich Feedback auf Ihren Text geben.“<\/p><cite>Folien Einstieg (Riemer), Folie 4<\/cite><\/blockquote><blockquote><p>„Welches Feedback finden Sie nützlich? Welcher Prompt hat am besten funktioniert? Womit sind Sie unzufrieden?“<\/p><cite>Folien Einstieg (Riemer), Folie 4<\/cite><\/blockquote>"}, {"titel": "5. Platz für deine eigenen Beobachtungen", "quelle": "Eigene Notizen, noch leer", "html": "<p>Hier könnten deine Notizen zur Übung stehen: dein Text, die Prompts, die du ausprobiert hast, und welches KI-Feedback nützlich war. Lege sie als Datei in den Ordner „Notizen“ dieses Seminars, dann nehme ich sie beim nächsten Update auf.<\/p>"}], "zusatz": [], "material": [{"datei": "Sitzung_Einstieg.pdf", "art": "Folien", "notiz": "Seminarplanung und Übung, 4 Folien"}], "begriffe": ["ki-feedback"]}, {"id": "ki-s2", "nr": 2, "seminar": "ki", "titel": "KI und Fremdsprachenlernen: Moorhouse/Wong 2025, Teil I", "autor": "Benjamin Luke Moorhouse, Kevin M. Wong (Buch); Claudia Riemer (Folien)", "lektuere": "Moorhouse/Wong 2025, Kap. 1–4 (S. 1–40)", "thema": "genKI, berufliche genKI-Kompetenz, Wissensressource, Unterrichtsplanung, Testen/Prüfen und Feedback", "status": "entwurf", "ueberblick": {"kurzinhalt": "Moorhouse/Wong sehen in generativer KI Potenzial und Risiko zugleich und fordern von Lehrkräften eine berufsbezogene genKI-Kompetenz ([[p-genai-c|P-GenAI-C]]) mit fünf Aspekten. Kapitel 1 erklärt, was [[genki|genKI]] und [[llm|LLMs]] sind, Kapitel 2 zeigt genKI als Wissensressource, Kapitel 3 für Unterrichtsplanung und Materialien und Kapitel 4 für Testen/Prüfen und Feedback. Beim Feedback ist der Einsatz umstritten. Bedingungen sind Urheberrecht, Datenschutz, Transparenz und [[human-in-the-loop|human-in-the-loop]].", "leitfrage": "Unter welchen Bedingungen kann genKI Lehrkräfte unterstützen, evidenzbasierte Prinzipien des Fremdsprachenunterrichts umzusetzen, und wo liegen die Grenzen, besonders bei Bewertung und Feedback?", "merksatz": "genKI ist Werkzeug und nicht Ersatz: Lernziele und Prinzipien zuerst, KI-Ergebnisse immer fachlich prüfen, bei Lernertexten Einwilligung und Transparenz.", "fa": ["نویسندگان می‌گویند هوش مصنوعی مولد هم فرصت است و هم خطر. معلم باید «شایستگی حرفه‌ای در هوش مصنوعی مولد» (P-GenAI-C) با پنج جنبه داشته باشد: دانش فنی، سازگاری آموزشی، کار حرفه‌ای بیرون از کلاس، آگاهی از خطر و اخلاق، آماده‌سازی زبان‌آموزان.", "LLMها محتوا را با شناسایی الگوها تولید می‌کنند و خروجی «از نظر آماری محتمل» است، نه لزوماً درست؛ پس باید پاسخ‌ها بررسی شوند (توهم، سوگیری).", "در بازخورد و نمره‌دهی، استفاده از هوش مصنوعی بحث‌برانگیزترین کاربرد است. شرایط: رضایت زبان‌آموز و حق مالکیت متن، حفظ داده‌ها، شفافیت و دخالت ارزیاب انسانی (human in the loop)."]}, "inhalt": [{"titel": "1. Einleitung: Potenzial, Risiko, P-GenAI-C", "quelle": "Moorhouse/Wong 2025, S. 1–3; Folien Moorhouse/Wong Teil I (Riemer)", "html": "<p>Die zentrale These der Einleitung:<\/p><blockquote><p>„Zentrale These: Moorhouse und Wong sagen, genKI berge Potenzial und Risiko zugleich.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 3<\/cite><\/blockquote><p>Die Autoren übertragen den Gedanken der Berufsbezogenheit auf KI: Ein Arzt und eine Lehrkraft brauchen beide digitale Kompetenz, aber unterschiedliche.<\/p><blockquote><p lang=\"en\">“A doctor may need to understand and apply the use of AI in medical diagnostic processes. In contrast, a language teacher may need to guide students in how to use GenAI tools to engage in language practice activities.”<\/p><cite>Moorhouse/Wong 2025, S. 2<\/cite><\/blockquote><blockquote><p lang=\"en\">“to conceptualise the knowledge and skills needed by language teachers in the GenAI world”<\/p><cite>Moorhouse/Wong 2025, S. 2<\/cite><\/blockquote><h4>Fünf Aspekte der beruflichen genKI-Kompetenz (P-GenAI-C)<\/h4><div class=\"tablewrap\"><table><thead><tr><th>#<\/th><th>Aspekt<\/th><th>Bedeutung (Folie)<\/th><th>Beispiel (Folie)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Technologische Kompetenz<\/td><td>Tools, Funktionen, Verwendungen, Affordanzen kennen<\/td><td>Lehrkraft entscheidet, ob ein Chatbot, ein Bildgenerator oder ein Spezialtool passt<\/td><\/tr><tr><td>2<\/td><td>Pädagogische Kompatibilität<\/td><td>genKI zur Unterstützung des Sprachenlernens einsetzen, ausgerichtet an Lernzielen<\/td><td>Chatbot-Rollenspiel für mündliches Üben<\/td><\/tr><tr><td>3<\/td><td>Professionelle Arbeit außerhalb des Unterrichts<\/td><td>Bewertung, Feedback, Kommunikation, Verwaltung<\/td><td>Vorkorrektur von Lernertexten, Elternbrief<\/td><\/tr><tr><td>4<\/td><td>Risiko, Wohlbefinden, Ethik<\/td><td>Risiken, Wohlbefinden und ethische Fragen im Blick<\/td><td>Einwilligung, bevor Lernertexte hochgeladen werden<\/td><\/tr><tr><td>5<\/td><td>Vorbereitung der Lernenden<\/td><td>Lernende auf eine genKI-Welt vorbereiten<\/td><td>Lernenden zeigen, wie sie KI-Feedback prüfen und nutzen<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Die Lehrkraft kennt unterschiedliche genKI-Tools sowie deren Funktionen, Verwendungsweisen und Affordanzen.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 4<\/cite><\/blockquote><blockquote><p>„Affordanzen (Angebotscharakter): Handlungsmöglichkeiten, die für bestimmte Nutzende in einem bestimmten Kontext wahrnehmbar und realisierbar sind, einschließlich dessen, was das Tool nahelegt oder erschwert.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 4<\/cite><\/blockquote>"}, {"titel": "2. Kapitel 1: Generative KI (S. 3–15)", "quelle": "Moorhouse/Wong 2025, S. 3–15; Folien Moorhouse/Wong Teil I (Riemer), Folien 6–7", "html": "<p><strong>Abgrenzung zu regelbasierten Systemen:<\/strong> Frühere Chatbots und Schreibassistenten folgten vorprogrammierten Regeln und konnten nicht von ihrer Rolle abweichen.<\/p><blockquote><p lang=\"en\">“While researchers saw the potential of these kinds of rule-based AIs in language teaching, due to their narrow functionality, they have experienced very limited uptake in language classrooms.”<\/p><cite>Moorhouse/Wong 2025, S. 5<\/cite><\/blockquote><p><strong>LLMs und „statistisch wahrscheinlich“:<\/strong><\/p><blockquote><p lang=\"en\">“Instead of relying on predefined rules, LLMs generate content by identifying patterns and relationships within the data to produce statistically probable outcomes”<\/p><cite>Moorhouse/Wong 2025, S. 5<\/cite><\/blockquote><blockquote><p>„LLMs generieren Inhalte, indem sie Muster und Zusammenhänge innerhalb der Daten identifizieren, um statistisch wahrscheinliche Ergebnisse zu erzeugen (S. 5).“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 7<\/cite><\/blockquote><p>Konsequenz für die Verlässlichkeit: Wahrscheinlich heißt nicht wahr. Lehrkräfte sollten das wissen, weil sie Inhalte prüfen müssen (siehe Kapitel 2).<\/p><p><strong>Drei Hauptarten von genKI-Tools:<\/strong><\/p><blockquote><p lang=\"en\">“One way to classify GenAI tools for language teaching is according to the following three categories: 1. conversational AI chatbots; 2. visual, audio, and video generators; and 3. tools with embedded GenAI functions and specialist AI tools.”<\/p><cite>Moorhouse/Wong 2025, S. 6<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th>Kategorie<\/th><th>Beispiele im Buch (S. 6–14)<\/th><\/tr><\/thead><tbody><tr><td>Conversational AI chatbots<\/td><td>ChatGPT (OpenAI), Gemini (Google), Claude (Anthropic), Llama (Meta)<\/td><\/tr><tr><td>Visuelle, Audio- und Videogeneratoren<\/td><td>Dall-E, Stable Diffusion, MidJourney; Jukebox, Speechflow AI, Heygen; Sora AI<\/td><\/tr><tr><td>Tools mit eingebauten genKI-Funktionen und Spezialtools<\/td><td>Kahoot! (Quizfragen generieren), Mentimeter, MagicSchool.ai<\/td><\/tr><\/tbody><\/table><\/div><p>Die Frage der Folien, ob die Einteilung trennscharf ist, beantwortet das Buch selbst: Viele Tools kombinieren mehrere Funktionen.<\/p><blockquote><p lang=\"en\">“Many tools have multiple functionalities and combine different AI technologies to make them easy to use while performing highly advanced tasks.”<\/p><cite>Moorhouse/Wong 2025, S. 6<\/cite><\/blockquote><p><strong>Fähigkeiten von Chatbots<\/strong> (Folie 7): in natürlicher Sprache interagieren, multimodale Eingaben analysieren, Texte nach Vorgaben erzeugen, Gesprächspartner mit Rollen sein, Texte bewerten, zusammenfassen und analysieren, dolmetschen und übersetzen.<\/p><blockquote><p>„Besonderheit: Die Tools arbeiten extrem schnell.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 7<\/cite><\/blockquote>"}, {"titel": "3. Kapitel 2: genKI als Wissensressource (S. 15–23)", "quelle": "Moorhouse/Wong 2025, S. 15–23; Folien Moorhouse/Wong Teil I (Riemer), Folien 8–9", "html": "<p>Sprachunterricht findet in sehr verschiedenen Kontexten statt, deshalb gibt es kein Patentrezept:<\/p><blockquote><p lang=\"en\">“Similarly, there is no ‘one-size-fits-all’ method or approach that language teachers can adopt to guarantee success in any or all contexts”<\/p><cite>Moorhouse/Wong 2025, S. 17<\/cite><\/blockquote><p>Es gibt aber evidenzbasierte Prinzipien (Richards 2010), z. B. klare Lernziele, verständlicher Input, bedeutungsvolle Kommunikation, authentische Materialien, regelmäßige Übung, zeitnahes Feedback. Die These: genKI kann helfen, diese Prinzipien in verschiedenen Kontexten umzusetzen.<\/p><p><strong>Drei Ausdifferenzierungen<\/strong> (Folie 9):<\/p><ul class=\"plain\"><li><strong>Themen- und Inhaltswissen<\/strong> der Lehrkraft entwickeln (z. B. Feste für Jugendliche). Antworten müssen wegen möglicher Halluzinationen geprüft werden (S. 18).<\/li><li><strong>Verständnis von Methoden und Ansätzen<\/strong> fördern: Informationen zu Methoden, Beispielaktivitäten, kontextbezogene Unterrichtspläne (S. 19).<\/li><li><strong>Bewusstsein für Sprachen, Kulturen und Gesellschaften<\/strong>: Recherchen zu den Sprachen der Lernenden, kontrastive Darstellungen (S. 19–20).<\/li><\/ul><blockquote><p>„Achtung: Die Antworten müssen wegen möglicher Halluzinationen und Ungenauigkeiten überprüft werden.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 9<\/cite><\/blockquote><blockquote><p lang=\"en\">“the majority of the training data for LLMs is in English (93%) compared to 7% for other languages”<\/p><cite>Moorhouse/Wong 2025, S. 20 (nach Brown et al. 2020)<\/cite><\/blockquote><p>Folge für mehrsprachige Klassen (Frage 3 der Folie, meine Antwort): Für weniger verbreitete Sprachen ist die Qualität der Antworten schlechter, Stereotype sind wahrscheinlicher. Das Buch sagt: Die Qualität hängt von der Datenmenge zur Sprache und vom Prompt ab.<\/p>"}, {"titel": "4. Kapitel 3: Unterrichtsplanung und Materialien (S. 24–33)", "quelle": "Moorhouse/Wong 2025, S. 24–33; Folien Moorhouse/Wong Teil I (Riemer), Folien 10–12", "html": "<p>genKI als <em>Kolleg:in auf Abruf<\/em> (Folie 10): als Planungspartner oder kritische:r Freund:in beim Brainstorming und Verfeinern von Stundenideen.<\/p><blockquote><p lang=\"en\">“Lesson planning is a great place to start using GenAI as it does not require students to engage with the tools directly”<\/p><cite>Moorhouse/Wong 2025, S. 33<\/cite><\/blockquote><p><strong>Einsatzmöglichkeiten<\/strong> (Folie 11):<\/p><ul class=\"plain\"><li>multimodale Materialien (Texte, Bilder, Audios, Videos, Skripte), zugeschnitten auf Lernende<\/li><li>Material auf bestimmtem Niveau oder mit bestimmten Wörtern und Strukturen<\/li><li>Training einzelner Fertigkeiten (Hörtexte aus Texten, Verständnisfragen)<\/li><li>affektiv und kognitiv ansprechende Materialien (Witze, Lieder, Spiele, Bilder)<\/li><li>formfokussierte Materialien (Arbeitsblätter, Übungen)<\/li><li>mehrsprachige Materialien und Anpassung vorhandener Materialien an evidenzbasierte Prinzipien<\/li><\/ul><p><strong>Bedingungen<\/strong> (Folie 9):<\/p><blockquote><p>„Lernziele und pädagogische Prinzipien müssen den Ausgangspunkt bilden.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 12<\/cite><\/blockquote><blockquote><p>„Die Planung darf nicht von der bloßen Verfügbarkeit eines Tools bestimmt werden“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 12<\/cite><\/blockquote><blockquote><p>„Es soll keine ausschließliche Abhängigkeit von KI-generierten Materialien entstehen.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 12<\/cite><\/blockquote><blockquote><p>„muss der Einsatz von GenKI offengelegt werden“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 12 (bei Übersetzungen in Sprachen, die die Lehrkraft nicht beherrscht)<\/cite><\/blockquote><p>Eine mögliche Rangfolge (meine Begründung zu Frage 4 der Folien): 1. Lernziele zuerst, 2. fachliche und didaktische Prüfung aller Vorschläge, 3. genaues, iteratives Prompten, 4. Transparenz bei Übersetzungen, 5. keine Abhängigkeit.<\/p>"}, {"titel": "5. Kapitel 4: Testen/Prüfen und Feedback (S. 33–40)", "quelle": "Moorhouse/Wong 2025, S. 33–40; Folien Moorhouse/Wong Teil I (Riemer), Folien 13–15", "html": "<p>Die Qualität einer Prüfung beurteilt man nach drei Merkmalen:<\/p><blockquote><p lang=\"en\">“The quality of an assessment is often judged by three characteristics: transparency, validity, and reliability”<\/p><cite>Moorhouse/Wong 2025, S. 35<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th>Kriterium<\/th><th>Bedeutung (Folie 11)<\/th><th>Wo es mit genKI gefährdet sein kann (eigenes Beispiel)<\/th><\/tr><\/thead><tbody><tr><td>Transparenz<\/td><td>Zweck der Leistungsüberprüfung ist bekannt<\/td><td>Lernende wissen nicht, dass KI mitbewertet<\/td><\/tr><tr><td>Validität<\/td><td>geprüft wird das, was geprüft werden soll, und nichts anderes<\/td><td>KI-Aufgabe prüft eher Rechtschreibung als Leseverstehen<\/td><\/tr><tr><td>Reliabilität<\/td><td>konsistente Ergebnisse, Rater-Reliabilität<\/td><td>derselbe Text bekommt bei zweitem Durchlauf eine andere Note<\/td><\/tr><\/tbody><\/table><\/div><p>Querverbindung: Das sind dieselben Gütekriterien wie im Seminar „Prüfen und Testen“ (siehe [[reliabilitaet|Reliabilität]], [[washback|washback]], Sitzung 2).<\/p><blockquote><p>„Validität (geprüft wird das, was geprüft werden soll, und nichts anderes)“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 14<\/cite><\/blockquote><blockquote><p lang=\"en\">“This is commonly referred to as the washback effect.”<\/p><cite>Moorhouse/Wong 2025, S. 35<\/cite><\/blockquote><p><strong>Einsatzmöglichkeiten<\/strong> (Folie 14): Online-Bewertungstools (z. B. Aussprache, Flüssigkeit), genKI-gestützte Gestaltung von Prüfungsaufgaben, formative und summative Bewertung (Vorkorrektur, eigene Tools mit Bewertungsschema), Anleitung der Lernenden zur Nutzung formativen KI-Feedbacks.<\/p><p><strong>Bedingungen<\/strong> (Folie 12 und Buch):<\/p><blockquote><p lang=\"en\">“students have copyright over the work they produce”<\/p><cite>Moorhouse/Wong 2025, S. 39<\/cite><\/blockquote><blockquote><p lang=\"en\">“there is still a need for the ‘human in the loop’ to ensure that the feedback is appropriate to the task, the context, and the learner”<\/p><cite>Moorhouse/Wong 2025, S. 39<\/cite><\/blockquote><blockquote><p>„KI-Feedback muss mit Fachwissen überprüft werden“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 15<\/cite><\/blockquote><p><strong>Befund zu Feedback-Qualität<\/strong> (Steiss et al. 2024, nach dem Buch):<\/p><blockquote><p lang=\"en\">“Importantly, there was no difference in the quality of ChatGPT feedback between L2 and L1 writing.”<\/p><cite>Moorhouse/Wong 2025, S. 39<\/cite><\/blockquote><blockquote><p lang=\"en\">“It excelled in criteria-based feedback.”<\/p><cite>Moorhouse/Wong 2025, S. 39<\/cite><\/blockquote><p>Menschen schnitten in vier Kategorien besser ab (Klarheit, Genauigkeit, Priorisierung wesentlicher Merkmale, Ton), ChatGPT-Feedback wurde aber ebenfalls hoch bewertet.<\/p><p><strong>Fazit des Kapitels:<\/strong><\/p><blockquote><p lang=\"en\">“the use of GenAI within assessment practices is the most controversial use of GenAI in language teaching and learning”<\/p><cite>Moorhouse/Wong 2025, S. 39<\/cite><\/blockquote><blockquote><p>„Einsatz von genKI zu Bewertungszwecken ist sehr umstritten!“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 15<\/cite><\/blockquote><blockquote><p>„Gleichgewicht zwischen technischer Effizienz und ethischen Überlegungen herstellen“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 15<\/cite><\/blockquote>"}, {"titel": "6. Zentrale These und Diskussionsfragen", "quelle": "Folien Moorhouse/Wong Teil I (Riemer), Folie 16", "html": "<blockquote><p>„GenKI kann Lehrkräfte dabei unterstützen, evidenzbasierte Prinzipien des Fremdsprachenunterrichts in unterschiedlichen Kontexten umzusetzen.“<\/p><cite>Folien Moorhouse/Wong Teil I (Riemer), Folie 16<\/cite><\/blockquote><p>Die Folie fragt: Welche Argumente aus Kapitel 1–4 stützen die These, welche Einschränkungen sind zu machen, unter welchen Bedingungen stimmst du zu, und wie lautet eine präzisere Version?<\/p><p><strong>Mein Entwurf einer differenzierten Version (eigene Formulierung, zur Diskussion):<\/strong> genKI kann Lehrkräfte bei der Umsetzung evidenzbasierter Prinzipien unterstützen, wenn Lernziele die Planung leiten, die Lehrkraft alle Ausgaben fachlich prüft und bei Bewertung und Feedback Einwilligung, Transparenz und menschliche Letztverantwortung gesichert sind.<\/p><p>Dazu passende Einschränkungen aus dem Material: Halluzinationen und Verzerrungen, englischlastige Trainingsdaten, Datenschutz und Urheberrecht, Abhängigkeit, und die Frage, wie sich Lernende fühlen, wenn Dozierende KI zur Beurteilung nutzen.<\/p>"}], "zusatz": [{"titel": "Moorhouse/Wong (2025): Generative Artificial Intelligence and Language Teaching", "url": "https://doi.org/10.1017/9781009618823", "typ": "Buch (Cambridge Elements)", "quelle": "DOI aus der Fußzeile der PDF-Seiten", "geprueft": false, "notiz": "DOI steht in der Fußzeile der Lektüre-PDF. Nicht von mir geöffnet."}], "material": [{"datei": "Sitzung_Lektüre und Diskussion Moorhouse  Wong 2025_Teil 1.pdf", "art": "Folien", "notiz": "Fragen und Zusammenfassungen zu Kap. 1–4, 16 Folien"}, {"datei": "generative-artificial-intelligence-and-language-teaching.pdf", "art": "Lektüre", "notiz": "Buch, 94 PDF-Seiten, 8 Sektionen. Dieses Wiki nutzt bisher nur Kap. 1–4 (S. 1–40)."}], "begriffe": ["genki", "llm", "p-genai-c", "affordanz", "halluzination", "human-in-the-loop", "prompt", "validitaet", "ki-feedback"]}, {"id": "litmehr-s2", "nr": 2, "seminar": "litmehr", "titel": "Ein Beispiel: Platt und Hochdeutsch in Buddenbrooks", "autor": "Thomas Mann", "lektuere": "Thomas Mann, Buddenbrooks (1901), S. 192–210", "thema": "Die Bürgerschaftssitzung im Oktober 1848 und die Sprachwechsel zwischen Hochdeutsch und Plattdeutsch", "status": "entwurf", "ueberblick": {"kurzinhalt": "Die Szene spielt an einem Oktobertag 1848. Die Köchin Trina kündigt in plattdeutscher Rede einen Umsturz an, das Volk zieht durch die Stadt, und die Bürgerschaft sitzt in ihrem Saal fest. Konsul Buddenbrook geht mit dem Makler Gosch hinaus und spricht mit dem Lagerarbeiter Corl Smolt Platt. Das Gespräch löst die Spannung in Gelächter auf. Für das Seminar ist die Szene ein Beispiel dafür, wie ein hochdeutscher Roman Sprachvielfalt darstellt: durch [[plattdeutsch-figurenrede|Plattdeutsch als Figurenrede]], durch [[sprachwechsel-sprachmischung|Sprachwechsel]] je nach Gesprächspartner und durch Goschs Zitate in anderen Sprachen.", "leitfrage": "Wie und wozu stellt der Roman die Sprachen der Figuren dar, und was zeigt die Szene über Stand, Macht und Nähe?", "merksatz": "In der Szene wechselt der Konsul bewusst ins Platt, sobald er sich an die Menge wendet, und fällt vor Ärger zurück ins Hochdeutsche. Die Wahl der Sprache ist also Teil der Handlung.", "fa": ["صحنه در اکتبر ۱۸۴۸ می‌گذرد: آشپز خانه (Trina) به زبان پلاتدویچ (گویش شمال آلمان) تهدید می‌کند که «نظم تازه‌ای می‌آید»؛ مردم در شهر شلوغ می‌کنند و اعضای Bürgerschaft در سالن گیر می‌افتند.", "کنسول Buddenbrook همراه دلال Gosch بیرون می‌رود و با کارگر انبار Corl Smolt به پلاتدویچ حرف می‌زند. گفت‌وگو شوخی‌وار تمام می‌شود و جمعیت پراکنده می‌شود.", "نکته‌ی سمینار: رمان به آلمانی معیار نوشته شده، اما با گویش (پلات)، املای ویژه‌ی گویش، و جمله‌های ایتالیایی Gosch تنوع زبانی را نشان می‌دهد. انتخاب زبان بسته به مخاطب عوض می‌شود (کنسول با مردم پلات، با دیگران آلمانی معیار).", "جمله‌ی مهم متن: کنسول «از شدت خشم فراموش کرد پلات حرف بزند». یعنی پلات برای او ابزاری آگاهانه است، نه زبان طبیعی لحظه."]}, "inhalt": [{"titel": "1. Was geschieht in S. 192–210?", "quelle": "Thomas Mann, Buddenbrooks, S. 192–210 (Kap. 2–3, Beginn von Kap. 4)", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Stelle<\/th><th>Handlung<\/th><\/tr><\/thead><tbody><tr><td>S. 192–193<\/td><td>Beim Mittagessen erfährt der Konsul, dass die Köchin Trina entlassen wurde, nachdem sie mit „neuer Ordnung“ gedroht hatte. In der Stadt gärt es wegen der Verfassungsfrage (ständisches Prinzip gegen allgemeines Wahlrecht).<\/td><\/tr><tr><td>S. 193–196<\/td><td>An einem Oktobertag 1848 zieht ein Volkshaufen durch die Straßen. Die Konsulin ist in Angst, der Konsul geht trotzdem in die Sitzung der Bürgerschaft.<\/td><\/tr><tr><td>S. 196–199<\/td><td>Auf dem Weg trifft er den Makler Gosch, der die Szene mit dem Pathos eines Schauspielers begleitet (S. 197–198 beschreiben ihn ausführlich).<\/td><\/tr><tr><td>S. 199–205<\/td><td>Im Sitzungssaal herrscht Aufregung. Die Sitzung wird nicht eröffnet, man beschließt abzuwarten, bis das Volk abzieht.<\/td><\/tr><tr><td>S. 207–210<\/td><td>Konsul und Gosch gehen vor das Haus. Der Konsul spricht die Menge auf Platt an, Corl Smolt antwortet, man lacht, die Menge zerstreut sich.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"meta\">Die Seitenangaben beruhen auf dem Seminarscan. Der Scan ist schlecht lesbar, die zitierten Stellen habe ich von Hand an den Seiten abgelesen.<\/p>"}, {"titel": "2. Trinas Rede: das Plattdeutsche als Stimme von unten (S. 192)", "quelle": "Thomas Mann, Buddenbrooks, S. 192", "html": "<p>Die Szene beginnt mit einem Bericht über die Köchin. Sie hat bis dahin „Treue und Biedersinn“ gezeigt und ist dann plötzlich zu „unverhüllter Empörung“ übergegangen:<\/p><blockquote><p>„Trina, die Köchin Trina, ein Mädchen, das bislang nur Treue und Biedersinn an den Tag gelegt hatte, war plötzlich zu unverhüllter Empörung übergegangen.“<\/p><cite>Thomas Mann, Buddenbrooks, S. 192<\/cite><\/blockquote><p>Dann folgt ihre Rede im Wortlaut, ohne Übersetzung:<\/p><blockquote><p>„Warten Sie man bloß, Fru Konsulin, dat duert nu nich mehr lang, denn kommt ne annere Ordnung in de Saak; denn sitt ick doar up'm Sofa in' sieden Kleed, un Sei bedeinen mich denn...“<\/p><cite>Thomas Mann, Buddenbrooks, S. 192<\/cite><\/blockquote><p>Zwei Beobachtungen:<\/p><ul class=\"plain\"><li>Der Erzähler berichtet auf Hochdeutsch, die Figur spricht Platt, nur die Anrede „Sei“ (Sie) und „Fru Konsulin“ ist angepasst. Der Gegensatz Erzählstimme und Figurenrede ist hier auch ein sozialer Gegensatz.<\/li><li>Die Köchin greift die Gesellschaftsordnung in der Sprache an, in der sie lebt. Ihr Satz ist eine Vorwegnahme der späteren Szene mit Corl Smolt (Revolution, Ordnung).<\/li><\/ul>"}, {"titel": "3. Gosch: Hochdeutsch mit Pathos und fremden Sprachen (S. 197–198)", "quelle": "Thomas Mann, Buddenbrooks, S. 197–198", "html": "<p>Siegismund Gosch ist ein Makler mit künstlerischen Neigungen. Der Erzähler beschreibt ihn so:<\/p><blockquote><p>„Dieser Makler Siegismund Gosch, ein Junggeselle von etwa vierzig Jahren, war trotz seines Gebarens der ehrlichste und gutmütigste Mensch von der Welt; nur war er ein Schöngeist, ein origineller Kopf.“<\/p><cite>Thomas Mann, Buddenbrooks, S. 197<\/cite><\/blockquote><blockquote><p>„eine böse, hämische, interessante und furchtgebietende Charakterfigur zwischen Mephistopheles und Napoleon“<\/p><cite>Thomas Mann, Buddenbrooks, S. 197<\/cite><\/blockquote><blockquote><p>„in seinem engen, dunklen Comptoir aber stand ein großer Bücherschrank, der mit Dichtwerken in allen Sprachen gefüllt war, und es ging das Gerücht, daß er seit seinem zwanzigsten Jahre an einer Übersetzung von Lope de Vega's sämtlichen Dramen arbeite“<\/p><cite>Thomas Mann, Buddenbrooks, S. 197<\/cite><\/blockquote><p>Gosch spricht auch in der Alltagsrede mit Pathos. Der Erzähler zeigt es an seinen Redewendungen und an einem italienischen Satz, den niemand versteht:<\/p><blockquote><p>„als wollte er sagen: Schurke, ha! Im Grab verfluch' ich deine Ahnen!“<\/p><cite>Thomas Mann, Buddenbrooks, S. 198<\/cite><\/blockquote><blockquote><p>„pflegte er zu antworten: Oh, mein werter Freund! Uomo non educato dal dolore riman sempre bambino! Begreiflicher Weise verstand das Niemand. War es von Lope de Vega?“<\/p><cite>Thomas Mann, Buddenbrooks, S. 198<\/cite><\/blockquote><p>Damit steht Gosch für eine weitere Art von Sprachvielfalt in der Szene: Er bringt Fremdsprachiges und literarische Register in die Stadtgesellschaft, die ihn nicht versteht, aber als Original duldet.<\/p>"}, {"titel": "4. Das Gespräch mit Corl Smolt (S. 207–210)", "quelle": "Thomas Mann, Buddenbrooks, S. 207–210", "html": "<p>Der Konsul tritt auf die Stufen, sieht die Menge und spricht sie sofort auf Platt an:<\/p><blockquote><p>„Lüd, wat is dat nu bloß für dumm Tüg, wat Ji da anstellt!“<\/p><cite>Thomas Mann, Buddenbrooks, S. 208<\/cite><\/blockquote><p>Die Menge reagiert mit Respekt und mit Platt, auch über Gosch:<\/p><blockquote><p>„Dat's Kunsel Buddenbrook! Kunsel Buddenbrook will 'ne Red' hollen! Holl din Mul, Krischan, hei kann höllschen fuchtig warn!... Dat's Makler Gosch... kiek! Dat's son Aap!... Is hei 'n beeten öwerspönig?“<\/p><cite>Thomas Mann, Buddenbrooks, S. 208<\/cite><\/blockquote><p>Der Konsul wendet sich dann an den Lagerarbeiter Corl Smolt, und es folgt das Gespräch, das die Szene entscheidet:<\/p><blockquote><p>„Je, Herr Kunsel... brachte Corl Smolt kauend hervor. Dat's nu so 'n Saak... öäwer... Dat is nu so wied... Wi maaken nu Revolutschon.“<\/p><cite>Thomas Mann, Buddenbrooks, S. 208<\/cite><\/blockquote><blockquote><p>„Hür mal, Smolt, un ihr annern Lüd! Wer nu 'n verstännigen Kierl is, der geht naa Hus un scheert sich nich mihr um Revolution und stört hier nich de Ordnung...“<\/p><cite>Thomas Mann, Buddenbrooks, S. 209<\/cite><\/blockquote><blockquote><p>„Die heilige Ordnung! unterbrach Herr Gosch ihn zischend“<\/p><cite>Thomas Mann, Buddenbrooks, S. 209<\/cite><\/blockquote><blockquote><p>„De Ordnung, seg ick! beschloß Konsul Buddenbrook.“<\/p><cite>Thomas Mann, Buddenbrooks, S. 209<\/cite><\/blockquote><p>Der Moment, in dem der Konsul das Platt kurz verliert, ist im Text ausdrücklich benannt:<\/p><blockquote><p>„Großer Gott, du Tropf! rief der Konsul und vergaß, platt zu sprechen vor Indignation... Du redest ja lauter Unsinn...“<\/p><cite>Thomas Mann, Buddenbrooks, S. 209<\/cite><\/blockquote><p>Dann der Wendepunkt, der die Menge zum Lachen bringt:<\/p><blockquote><p>„Je, Herr Kunsel, ick seg man bloß: wie wull nu 'ne Republike, seg ick man bloß...“<\/p><cite>Thomas Mann, Buddenbrooks, S. 209<\/cite><\/blockquote><blockquote><p>„Öwer du Döskopp... Ji heww ja schon een!“<\/p><cite>Thomas Mann, Buddenbrooks, S. 209<\/cite><\/blockquote><blockquote><p>„Je, Herr Kunsel, denn wull wi noch een.“<\/p><cite>Thomas Mann, Buddenbrooks, S. 209<\/cite><\/blockquote><blockquote><p>„Einige der Umstehenden, die es besser wußten, begannen schwerfällig und herzlich zu lachen, und obgleich die Wenigsten die Antwort Corl Smolts verstanden hatten, pflanzte diese Heiterkeit sich fort“<\/p><cite>Thomas Mann, Buddenbrooks, S. 209<\/cite><\/blockquote><blockquote><p>„Na Lüd, sagte schließlich Konsul Buddenbrook, ick glöw, dat is nu dat Beste, wenn ihr Alle naa Hus gaht!“<\/p><cite>Thomas Mann, Buddenbrooks, S. 210<\/cite><\/blockquote><blockquote><p>„Der Einzige, den diese Wendung der Dinge enttäuschte und schmerzte, war Siegismund Gosch.“<\/p><cite>Thomas Mann, Buddenbrooks, S. 210<\/cite><\/blockquote>"}, {"titel": "5. Beobachtungen zur Sprachdarstellung (eigene Analyse)", "quelle": "Eigene Analyse, nicht im Text ausgesprochen", "html": "<p>Das sind Beobachtungen für die Diskussion, keine Aussagen des Romans. Teil 2 der Sitzung 3 (Dembeck) liefert dazu die Begriffe.<\/p><div class=\"tablewrap\"><table><thead><tr><th>Beobachtung<\/th><th>Beleg<\/th><th>mögliche Deutung<\/th><\/tr><\/thead><tbody><tr><td><strong>Sprachwahl nach Adressat:<\/strong> Der Konsul spricht seine Frau und die Herren Hochdeutsch, die Menge auf Platt.<\/td><td>S. 208 „Lüd, wat is dat nu bloß für dumm Tüg…“; S. 209 „vergaß, platt zu sprechen“<\/td><td>Platt dient der Nähe und dem Einfluss auf die Menge; der Wechsel ist eine soziale Entscheidung.<\/td><\/tr><tr><td><strong>Mischung in einer Äußerung:<\/strong> In Platt-Sätzen stehen hochdeutsche Formen.<\/td><td>S. 209 „un ihr annern Lüd“; S. 210 „wenn ihr Alle naa Hus gaht“<\/td><td>Das Platt des Konsuls ist durchsetzt mit hochdeutschen Formen. Das ist Sprachmischung statt eines klaren Wechsels.<\/td><\/tr><tr><td><strong>Eigene Schreibung des Dialekts:<\/strong> „Kunsel“, „Revolutschon“, „öäwer“, „mihr“<\/td><td>S. 208–209<\/td><td>Der Text bildet Aussprache ab. Die Schreibung selbst ist eine Entscheidung des Autors.<\/td><\/tr><tr><td><strong>Platt als Pointe:<\/strong> „denn wull wi noch een“<\/td><td>S. 209<\/td><td>Die Sprachform trägt den Witz, der die Spannung löst. Die „Umstehenden, die es besser wußten“, lachen zuerst.<\/td><\/tr><tr><td><strong>Weitere Sprachen bei Gosch:<\/strong> Italienisch, Lope de Vega, Schillers Don Carlos<\/td><td>S. 197–198<\/td><td>Die Bildungsrede steht gegen die Volksrede und wird von beiden nicht verstanden.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"titel": "6. Fragen für die Sitzung", "quelle": "", "html": "<ul class=\"plain\"><li>Welche Funktion hat die Platt-Rede bei Trina, Corl Smolt und dem Konsul, und wo unterscheiden sich die drei?<\/li><li>Was bedeutet es, dass der Erzähler den Wechsel ausdrücklich benennt („vergaß, platt zu sprechen“)?<\/li><li>Welche Rolle spielt Goschs Italienisch? Wer ist hier der Adressat der Rede?<\/li><li>Wie weit hilft der Begriff ‹Sprachwechsel› (Dembeck, S. 170), und wo muss man von Sprachmischung sprechen?<\/li><\/ul>"}], "zusatz": [], "material": [{"datei": "Mann, Thomas-Buddenbrooks S. 192-210 (Scan)", "art": "Primärtext", "notiz": "Seminarscan, schwer lesbar; Zitate von Hand an der Seite geprüft"}], "begriffe": ["plattdeutsch-figurenrede", "sprachwechsel-sprachmischung", "code-switching", "heterolinguismus"]}, {"id": "litmehr-s3", "nr": 3, "seminar": "litmehr", "titel": "Es gibt keine einsprachigen Texte", "autor": "Till Dembeck", "lektuere": "Till Dembeck: Es gibt keine einsprachigen Texte! (2020), S. 163–176", "thema": "Mehrsprachigkeitsphilologie als Methode, Analyseebenen literarischer Sprachvielfalt und kulturpolitische Interpretation", "status": "entwurf", "ueberblick": {"kurzinhalt": "Dembeck schlägt vor, die Literaturwissenschaft als [[mehrsprachigkeitsphilologie|Mehrsprachigkeitsphilologie]] auszurichten. Seine These „Es gibt keine einsprachigen Texte“ ist keine Existenzaussage, sondern eine methodische Voraussetzung: Jeder Text kann auf die Vielfalt seiner sprachlichen Ausdrucksmittel hin gelesen werden. Dafür entwirft er einen Werkzeugkasten mit Analyseebenen (Idiome, Varietäten, metrische und rhetorische Muster; Grammatik, Lexik, Phraseologie, Rechtschreibung) und Formen der Kontrastierung ([[sprachwechsel-sprachmischung|Sprachwechsel und Sprachmischung]], Sprecherverteilung, Übersetzung). Das Ziel bleibt die [[kulturpolitische-interpretation|kulturpolitische Interpretation]].", "leitfrage": "Was heißt es, dass es keine einsprachigen Texte gibt, und wie sieht eine Analyse aus, die das ernst nimmt?", "merksatz": "Die These ist ein Blickwinkel, keine Behauptung über Tatsachen: Jeder Text kann auf die Vielfalt seiner sprachlichen Mittel hin gelesen werden.", "fa": ["دمبک می‌گوید: «متن تک‌زبانه وجود ندارد!» این جمله ادعای وجودی نیست؛ یک پیش‌فرض روش‌شناختی است: هر متنی را می‌توان از نظر تنوع ابزارهای زبانی‌اش خواند.", "او پیشنهاد می‌کند ادبیات‌شناسی را به «Mehrsprachigkeitsphilologie» (فیلولوژی چندزبانگی) تبدیل کنیم. نمونه‌ها فقط متن‌هایی نیستند که دو زبان آشکار دارند؛ گویش، لهجه، وزن شعر و قیدهای نوشتاری هم بخشی از تنوع زبانی‌اند.", "تعریف Grutman از heterolinguisme: حضور زبان‌های بیگانه «به هر شکل» و نیز گونه‌های اجتماعی، منطقه‌ای یا تاریخی زبان اصلی در یک متن.", "ابزارها: سطح‌های تحلیل (زبان‌ها، گونه‌ها، قیدهای فرم) و سطح‌های ساختار زبان (دستور، واژگان، عبارت‌های ثابت، املا) و شکل‌های تقابل (Sprachwechsel در برابر Sprachmischung، توزیع زبان‌ها بین گوینده‌ها، ترجمه).", "هدف نهایی، تفسیر فرهنگی-سیاسی است: متن ادبی خودش بازیگر فرهنگی است و راه‌های دیگر معنادادن به جهان را آزمایش می‌کند."]}, "inhalt": [{"titel": "1. Ausgangspunkt: Sprachvielfalt als Frage der Methode", "quelle": "Dembeck 2020, S. 163–164", "html": "<blockquote><p>„Die Erforschung literarischer Sprachvielfalt besteht meist darin, dass man das Vorkommen unterschiedlicher Sprachen in Texten interpretiert“<\/p><cite>Dembeck 2020, S. 163<\/cite><\/blockquote><p>Dembeck knüpft daran die kulturpolitische Dimension: Sprachvielfalt zeigt kulturelle Vielfalt an, kann aber auch ausschließen. Er will weg von der Vorstellung, mehrsprachige Literatur sei ein abgegrenztes Korpus.<\/p><blockquote><p>„die Analyse und Interpretation literarischer Sprachvielfalt muss umgekehrt als Frage der Methode aufgefasst werden“<\/p><cite>Dembeck 2020, S. 163<\/cite><\/blockquote><blockquote><p>„Mehrsprachigkeitsphilologie neu auszurichten“<\/p><cite>Dembeck 2020, S. 164 (Fortsetzung des Satzes von S. 163: Literaturwissenschaft ‹als› Mehrsprachigkeitsphilologie)<\/cite><\/blockquote><p>Wichtig ist der Unterschied zwischen offener und verdeckter Sprachvielfalt. Verdeckt sind Fälle, in denen andere Sprachen simuliert werden:<\/p><blockquote><p>„In den Wildwestromanen Karl Mays sprechen die deutschen Protagonisten manchmal untereinander im sächsischen Dialekt, während sie ihre amerikanischen Gefährten in Standarddeutsch ansprechen, wodurch klar wird, dass Standarddeutsch in diesem Zusammenhang Englisch darstellt.“<\/p><cite>Dembeck 2020, S. 164<\/cite><\/blockquote><blockquote><p>„Phänomene, wie sie auch die Mehrsprachigkeitslinguistik beschreibt, etwa Interferenz oder Codeswitching, durch poetische Tricks nachgeahmt“<\/p><cite>Dembeck 2020, S. 164<\/cite><\/blockquote><p>Dazu gehören laut Dembeck auch metrische Unterschiede (Blankvers gegen Prosa bei Shakespeare; Grillparzer: Griechen im Blankvers, Kolcher nicht).<\/p>"}, {"titel": "2. Heterolinguismus (Grutman)", "quelle": "Dembeck 2020, S. 164", "html": "<p>Als weite Bestimmung zieht Dembeck Rainier Grutmans Begriff <em>hétérolinguisme<\/em> heran. Die deutsche Fassung der Fußnote lautet:<\/p><blockquote><p>„das Vorhandensein fremder Idiome, in welcher Form auch immer, sowie von (sozial, regional oder chronologisch definierten) Varietäten der Hauptsprache in einem Text“<\/p><cite>Dembeck 2020, S. 164 (Fn. 2, Übers. T. D. nach Grutman 1997: 37)<\/cite><\/blockquote><p>Grutmans Definition schließt Dialekte, Soziolekte und historische Sprachstufen ein. Sie reicht aber nicht für Grillparzers Goldenes Vlies, wo die Sprachen der Griechen und Kolcher nur über das Metrum erscheinen. Dembeck folgert: Auch metrische und rhetorische Muster sind Teil literarischer Sprachvielfalt (S. 165).<\/p>"}, {"titel": "3. Die These „Es gibt keine einsprachigen Texte!“", "quelle": "Dembeck 2020, S. 165–167", "html": "<p>Die Ausgangslage:<\/p><blockquote><p>„weder für Personen noch für den alltäglichen Sprachgebrauch und auch nicht für (literarische) Texte die Norm ist, einsprachig zu sein“<\/p><cite>Dembeck 2020, S. 165<\/cite><\/blockquote><blockquote><p>„Einsprachigkeit ein historisch spezifisches, ja, kontrafaktisches Konstrukt oder Regulativ darstellt“<\/p><cite>Dembeck 2020, S. 165<\/cite><\/blockquote><p>Dembeck geht einen Schritt weiter und formuliert die Behauptung bewusst zugespitzt:<\/p><blockquote><p>„Es gibt keine einsprachigen Texte!“<\/p><cite>Dembeck 2020, S. 165<\/cite><\/blockquote><p>Er rechnet mit Widerspruch und prüft mögliche Einwände:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Einwand<\/th><th>Antwort bei Dembeck<\/th><th>S.<\/th><\/tr><\/thead><tbody><tr><td>Fremdes im Text ist vermeidbar; ein Muttersprachler könnte ‹rein› schreiben.<\/td><td>Auch ein ‹reiner› Text kombiniert Elemente aus verschiedenen historischen Kontexten. Muttersprachlichkeit selbst ist kritisch zu befragen.<\/td><td>165–166<\/td><\/tr><tr><td>Bildungssprachen seien natürlich gewachsen.<\/td><td>Sie sind Effekt kulturpolitischer Interventionen, die Bildungssprachen aus vermeintlich naturwüchsigen Erstsprachen entwickeln.<\/td><td>166<\/td><\/tr><tr><td>Abweichungen seien Fehler.<\/td><td>Sprechern werden immer Lizenzen an Unreinheit gewährt; ‹Fehler› können legitime rhetorische Mittel sein. Sonst wäre Sprachwandel nicht erklärbar.<\/td><td>166<\/td><\/tr><tr><td>Die Linguistik sagt das nicht.<\/td><td>Sie sucht Regelmäßigkeiten und darf daher klar einsprachige Texte annehmen. Die Literaturwissenschaft hat einen anderen Blick auf den Einzelfall.<\/td><td>166–167<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„die schiere Diversifizierung der Ausdrucksmittel, die vor Sprachgrenzen keinen Halt macht“<\/p><cite>Dembeck 2020, S. 166 (David Gramling: „semiodiversity“; Gegenbegriff „glossodiversity“: das Nebeneinander wohlbestimmter Einzelsprachen)<\/cite><\/blockquote><blockquote><p>„Anders wäre Sprachwandel gar nicht erklärbar.“<\/p><cite>Dembeck 2020, S. 166<\/cite><\/blockquote><p>Der Unterschied zwischen Linguistik und Literaturwissenschaft liegt in der Methode:<\/p><blockquote><p>„die Regelmäßigkeiten im Umgang mit Sprachvielfalt so genau wie möglich zu beschreiben“<\/p><cite>Dembeck 2020, S. 166 (Aufgabe der Linguistik)<\/cite><\/blockquote><blockquote><p>„Wenn man sich aber für den Einzelfall interessiert, dann sind singuläre Unregelmäßigkeiten, einschließlich sprachlicher Unreinheiten, besonders signifikant.“<\/p><cite>Dembeck 2020, S. 167<\/cite><\/blockquote><blockquote><p>„als ein Mittel dazu nämlich, in einer bestimmten Situation eine bestimmte Wirkung zu erzielen“<\/p><cite>Dembeck 2020, S. 167 (über die Verwendung zweier ‹Sprachen› im Vergleich zu rhetorischen Figuren und Tropen)<\/cite><\/blockquote><p>Schließlich schränkt Dembeck die These selbst ein:<\/p><blockquote><p>„Denn eigentlich will sie gar keine Existenzaussage treffen, sondern eine Einstellung umreißen, eine methodische Voraussetzung namhaft machen“<\/p><cite>Dembeck 2020, S. 167<\/cite><\/blockquote><blockquote><p>„Jeder Text kann im Hinblick auf die Vielfalt der verwendeten sprachlichen Ausdrucksmittel gelesen werden.“<\/p><cite>Dembeck 2020, S. 167<\/cite><\/blockquote>"}, {"titel": "4. Der Werkzeugkasten: Analyseebenen (Abschnitt 2)", "quelle": "Dembeck 2020, S. 168–173", "html": "<blockquote><p>„die Untersuchung der literarischen Sprachvielfalt muss als Mehrsprachigkeitsphilologie ein Instrumentarium entwickeln, das darauf ausgerichtet ist, manifeste wie latente Formen sprachlicher Vielfalt“<\/p><cite>Dembeck 2020, S. 168<\/cite><\/blockquote><p>Dembeck sammelt dafür Beispiele und systematisiert sie am Ende:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Bereich<\/th><th>Beispiele im Text<\/th><th>S.<\/th><\/tr><\/thead><tbody><tr><td>Figurenrede (Sprecherverteilung)<\/td><td>Karl May (Sächsisch für Deutsche, Hochdeutsch für Englisch); Tolstoi: Französisch wird oft auf Russisch wiedergegeben, wenn Szenen intimer sind; Thomas Mann, Zauberberg: Französisch von Hans Castorp und Clawdia Chauchat unterscheidet sich<\/td><td>168–169<\/td><\/tr><tr><td>Dialekt, Soziolekt, Akzent, Schreibung<\/td><td>Fehlende feste Rechtschreibung für Dialekte; Lessing, Minna von Barnhelm (Riccaults Akzent als Karikatur); Balzac (deutscher Akzent); Zaimoglu, Kanak Sprak (Nachdichtung)<\/td><td>169<\/td><\/tr><tr><td>Entwicklung einer Sprache im Text<\/td><td>Goethe, Faust (Helena lernt zu reimen); Xiaolu Guo, A Concise Chinese-English Dictionary for Lovers<\/td><td>169<\/td><\/tr><tr><td>Erzählstimme, Sprachmischung<\/td><td>Joyce, Ulysses (Oxen of the Sun) und Finnegans Wake; Perec, La disparition (Lipogramm); Jandl und Pastior; Luther, Tischgespräche (lateinische Syntax im Deutschen); Özdamar (wörtliche Übersetzung türkischer Wendungen)<\/td><td>169–171<\/td><\/tr><tr><td>Vers und Gattung<\/td><td>Hexameter im Deutschen als ‹gräzisierende› Form; Eliot, The Waste Land; Drama (Kostüm, Musik); Film (Schrift im Bild, Untertitel)<\/td><td>171–172<\/td><\/tr><tr><td>Übersetzung<\/td><td>Herausgeberfiktion (Don Quixote), stillschweigende, wörtliche und homophone Übersetzung (Eigennamen: Hamburg → Amburgo)<\/td><td>172<\/td><\/tr><\/tbody><\/table><\/div><h3 style=\"margin-top:1.2rem\">Sprachwechsel und Sprachmischung (S. 170)<\/h3><blockquote><p>„Sprachwechsel einerseits und Sprachmischung andererseits unterscheiden, wobei Ersterer die segmentäre Differenzierung der beteiligten Idiome erlaubt, während Letztere die verschiedenen Sprachen in einem solchen Maße integriert, dass diese Differenzierung nicht möglich ist“<\/p><cite>Dembeck 2020, S. 170<\/cite><\/blockquote><h3 style=\"margin-top:1.2rem\">Zusammenfassung der Ebenen (S. 173)<\/h3><div class=\"tablewrap\"><table><thead><tr><th>Frage<\/th><th>Ebenen<\/th><\/tr><\/thead><tbody><tr><td>Welche Idiome stehen gegeneinander?<\/td><td>1. Idiome, die sich gegenseitig nicht ohne Weiteres verstehen; 2. Soziolekte, Dialekte, Register, historische Idiome; 3. metrische, rhetorische, ästhetische contraintes<\/td><\/tr><tr><td>Auf welcher Ebene der Sprachstruktur zeigen sich Interferenzen?<\/td><td>Grammatik (Phonologie, Morphologie, Syntax); Lexik; Phraseologie; Rechtschreibung<\/td><\/tr><tr><td>Wie werden Idiome kontrastiert?<\/td><td>Sprachwechsel vs. Sprachmischung; Verteilung auf Sprecher (auch Zitate); Formen der Übersetzung (wörtlich, homophon)<\/td><\/tr><tr><td>Welche Verfahren sind gattungs- oder medienspezifisch?<\/td><td>z. B. Vers, Drama, Film, Hörspiel<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„die Ebene der Soziolekte, Dialekte, Register, historischen Idiome usw.“<\/p><cite>Dembeck 2020, S. 173<\/cite><\/blockquote><blockquote><p>„die Ebene der metrischen, rhetorischen, ästhetischen contraintes, denen sich ein Text womöglich unterwirft“<\/p><cite>Dembeck 2020, S. 173<\/cite><\/blockquote><blockquote><p>„Nur die Analyse des Zusammenspiels dieser Faktoren kann uns den vollen Grad an Sprachvielfalt bewusst machen, der einem literarischen Text innewohnt.“<\/p><cite>Dembeck 2020, S. 173<\/cite><\/blockquote>"}, {"titel": "5. Kulturpolitische Interpretation (Abschnitt 3)", "quelle": "Dembeck 2020, S. 173–174", "html": "<blockquote><p>„Natürlich aber darf die schematische Analyse sprachlicher Vielfalt nicht das Ziel einer Mehrsprachigkeitsphilologie sein.“<\/p><cite>Dembeck 2020, S. 173<\/cite><\/blockquote><p>Das Ziel ist die Einschätzung der kulturellen, sozialen und politischen Folgen der Sprachvielfalt. Dembeck schlägt dafür zwei Schritte vor:<\/p><ul class=\"plain\"><li><strong>Flexibel bleiben:<\/strong> Beobachtungen auf verschiedenen Ebenen zueinander und zu literarischen und historischen Kontexten in Beziehung setzen, im Sinne der Akteur-Netzwerk-Theorie (Latour).<\/li><li><strong>Den Text als Akteur ernst nehmen:<\/strong> Literarische Texte können eine Art Handlungsmacht (agency) entwickeln.<\/li><\/ul><blockquote><p>„Literarische Texte erforschen Alternativen der Weltbeschreibung qua Sprache; sie machen die Dinge also auf andere Art und Weise bedeutsam.“<\/p><cite>Dembeck 2020, S. 174<\/cite><\/blockquote><blockquote><p>„nichts anderes als der Name für all jene Mechanismen, durch die die Gesellschaft den Dingen Bedeutung zuschreibt“<\/p><cite>Dembeck 2020, S. 174 (Dembeck über ‹Kultur›)<\/cite><\/blockquote><blockquote><p>„sind sie selbst kulturpolitische Akteure“<\/p><cite>Dembeck 2020, S. 174<\/cite><\/blockquote>"}, {"titel": "6. Anwendung auf Buddenbrooks (eigene Verknüpfung)", "quelle": "Eigene Verknüpfung mit Sitzung 2, nicht von Dembeck", "html": "<p>Die Szene aus Sitzung 2 lässt sich mit Dembecks Werkzeugen beschreiben. Das ist ein Vorschlag, den ich selbst gemacht habe. Er ist nicht aus dem Text abgeleitet.<\/p><div class=\"tablewrap\"><table><thead><tr><th>Dembeck-Werkzeug<\/th><th>Anwendung auf Buddenbrooks S. 192–210<\/th><\/tr><\/thead><tbody><tr><td>Binnensprachliche Mehrsprachigkeit (S. 168)<\/td><td>Platt und Hochdeutsch sind Varietäten desselben Sprachraums. Nach Grutman gehören Dialekte zum Heterolinguismus.<\/td><\/tr><tr><td>Verteilung auf Sprecher (S. 173)<\/td><td>Trina, Corl Smolt und die Menge sprechen Platt, der Erzähler und die Herren Hochdeutsch. Der Konsul wechselt je nach Adressat.<\/td><\/tr><tr><td>Sprachwechsel und Sprachmischung (S. 170)<\/td><td>Der Konsul wechselt klar (‹vergaß, platt zu sprechen›), mischt aber auch („un ihr annern Lüd“).<\/td><\/tr><tr><td>Rechtschreibung (S. 169)<\/td><td>„Kunsel“, „Revolutschon“: die Schreibung ist bedeutsam.<\/td><\/tr><tr><td>Weitere Idiome<\/td><td>Gosch: Italienisch, Spanisch (Lope de Vega) und Schillers Pathos.<\/td><\/tr><tr><td>Kulturpolitik (S. 173–174)<\/td><td>Wer darf in der Szene in welcher Sprache sprechen? Das Platt der Menge erscheint als Sprache der Revolution und als Quelle des Lachens, das sie auflöst.<\/td><\/tr><\/tbody><\/table><\/div><h3 style=\"margin-top:1.2rem\">Aufgabe aus dem Seminarplan<\/h3><p>Der Seminarplan verlangt, einen kurzen einsprachigen literarischen Text mitzubringen. Mögliche Prüffragen an den Text, abgeleitet aus Dembecks Ebenen: Gibt es Dialekt oder Soziolekt? Wie sind Namen und Fremdwörter geschrieben? Gibt es Zitate, Formeln oder Fachsprachen? Welche Versform oder Rhetorik steht dahinter?<\/p>"}], "zusatz": [], "material": [{"datei": "Dembeck, Till-Es gibt keine einsprachigen Texte.pdf", "art": "Lektüre", "notiz": "ZiG 11 (2020), H. 1, S. 163–176"}], "begriffe": ["mehrsprachigkeitsphilologie", "heterolinguismus", "binnenmehrsprachigkeit", "sprachwechsel-sprachmischung", "code-switching", "semiodiversity-glossodiversity", "kulturpolitische-interpretation"]}, {"id": "pruefen-s2", "nr": 2, "seminar": "pruefen", "titel": "Funktionen von Assessment, Testtypen und High-Stakes-Tests", "autor": "Annika Berthelé (Folien), Doris Moser-Frötscher (Text)", "lektuere": "Folien 22.10.2026; Moser-Frötscher 2025, S. 83–88", "thema": "Funktionen, Prüfen und Testen, Feedback, low/high stakes, Standardisierung, summative Evaluation", "status": "entwurf", "ueberblick": {"kurzinhalt": "Die Sitzung klärt die Grundbegriffe: Welche [[funktionen-assessment|Funktionen]] hat Assessment, wie unterscheiden sich [[pruefen-testen|Prüfen und Testen]], was leistet [[feedback-hattie|Feedback]] und welche [[konstrukt|Konstrukte]] werden gemessen. Dann geht es um [[high-low-stakes|low und high stakes]], die [[standardisierung|Standardisierung]] von high-stakes-Tests, [[eingangstest|Eingangstests]] für den Hochschulzugang und die drei Arten [[assessment-of-for-as|Assessment of, for und as Learning]]. In der Textarbeit zu Moser-Frötscher werden [[summative-evaluation|summative]] und [[formative-evaluation|formative Evaluation]], die [[ealta-leitfragen|EALTA-Leitfragen]] und der [[washback|washback]] besprochen.", "leitfrage": "Worin unterscheiden sich Prüfen und Testen, low und high stakes, und wie lassen sich die EALTA-Leitfragen auf Prüfungen zum Hochschulzugang übertragen?", "merksatz": "Je weitreichender die Folgen einer Prüfung, desto strenger muss sie standardisiert und qualitätsgesichert sein.", "fa": ["ارزیابی پایانی (summativ) چیزی را که یادگرفته شده در پایان یک دوره می‌سنجد و برای نمره‌دادن به کار می‌رود. ارزیابی تکوینی (formativ) در جریان یادگیری انجام می‌شود تا آموزش و بازخورد را تنظیم کند.", "متن می‌گوید این تقابل یک ساده‌سازی است: یک اطلاعات یکسان می‌تواند هم پایانی و هم تکوینی باشد، بسته به اینکه برای چه هدفی استفاده شود.", "هر چه پیامد یک آزمون سنگین‌تر باشد (high stakes)، کنترل کیفیت باید دقیق‌تر باشد. همچنین آزمون‌های مهم می‌توانند بر آموزش اثر بگذارند (washback).", "«Prüfen» (assessment) مفهومی گسترده است و هر فعالیتی را که اطلاعاتی درباره‌ی زبان‌آموز جمع می‌کند در بر می‌گیرد؛ «Testen» مفهومی محدودتر است و روش اندازه‌گیری عملکرد است.", "بازخورد خوب سه گام دارد: feed up (هدف و جایگاه من)، feed back (پیشرفت من)، feed forward (گام بعدی).", "سه نوع سنجش: Assessment of Learning (پایانی)، for Learning (در جریان یادگیری، با بازخورد) و as Learning (خود/همتاسنجی)."]}, "inhalt": [{"titel": "1. Organisatorisches und Plan der Sitzung", "quelle": "Folien Berthelé, 22.10.2026, Folie 4 und 6", "html": "<p>Je nach Leistungsart gilt im Seminar:<\/p><ul class=\"plain\"><li><strong>Studienleistung:<\/strong> Referat ist Pflicht.<\/li><li><strong>Prüfungsleistung:<\/strong> Hausarbeit oder mündliche Prüfung (abhängig von der Studienleistungsform, laut Folie „SLF“).<\/li><\/ul><blockquote><p>„Wenn Studienleistung: Referat Pflicht“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 4<\/cite><\/blockquote><p>Geplante Inhalte der Sitzung: Funktionen, Definitionen (Prüfen, Testen), low-stakes und high-stakes, Standardisierung und Arten von Assessment.<\/p>"}, {"titel": "2. Funktionen von Assessment (Einstieg)", "quelle": "Folien Berthelé, 22.10.2026, Folie 7 und 8; Quelle der Grafik: Grotjahn/Kleppin 2017, S. 12", "html": "<p>Die Folie sammelt Funktionen aus der Perspektive der Lehrenden:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Gruppe (eigene Ordnung)<\/th><th>Stichwörter auf der Folie<\/th><\/tr><\/thead><tbody><tr><td>Diagnose und Entwicklung<\/td><td>Diagnose, Entwicklung diagnostischer Kompetenzen (Lernende), Fortschritte erkennen, Einstufung<\/td><\/tr><tr><td>Lernunterstützung<\/td><td>Rückmeldung, Förderung, Motivierung<\/td><\/tr><tr><td>Steuerung und Auslese<\/td><td>Notenvergabe, Rangordnung erstellen, Selektionsfunktion, Vergleich, Disziplinierung<\/td><\/tr><tr><td>Bezug zum Lehrplan<\/td><td>Lernziele und curriculare Vorgaben<\/td><\/tr><\/tbody><\/table><\/div><p class=\"meta\">Die Gruppierung in der linken Spalte ist meine Ordnung, nicht die der Folie.<\/p><p><strong>Energizer („Gesprächsmühle“):<\/strong> Wähle drei Funktionen, die du persönlich am wichtigsten findest, und überlege, was deine Prüfungseinstellung für die Lehrpraxis bedeutet. Tausche dich in wechselnden Gruppen jeweils zwei Minuten darüber aus.<\/p><blockquote><p>„Wählen Sie drei Funktionen aus, die Sie persönlich prioritär finden“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 8<\/cite><\/blockquote>"}, {"titel": "3. Begriffe: Prüfen, Testen, Evaluation", "quelle": "Folien 9, 12, 13, 15; Vogt 2025a, S. 10–11; Grotjahn/Kleppin 2017, S. 15; Zimmermann 2025, S. 110", "html": "<p>Die Begriffe sind hierarchisch geordnet, werden aber oft synonym verwendet und überschneiden sich. Die Abbildung (Vogt 2025a, S. 11) ordnet <strong>Evaluation<\/strong> über <strong>Leistungsbeurteilung / Prüfen / Assessment<\/strong> und diese über <strong>Leistungsmessung / Prüfen / Testen<\/strong>.<\/p><blockquote><p>„Häufige synonyme Verwendung in Fachliteratur“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 12<\/cite><\/blockquote><div class=\"tablewrap\"><table><thead><tr><th><\/th><th>Prüfen (assessment)<\/th><th>Testen (testing)<\/th><\/tr><\/thead><tbody><tr><td>Umfang<\/td><td>weiter Begriff<\/td><td>enger Begriff<\/td><\/tr><tr><td>Was gehört dazu<\/td><td>alle Aktivitäten, bei denen Informationen über Lernende gesammelt werden<\/td><td>Verfahren der Leistungsmessung<\/td><\/tr><tr><td>Ziel<\/td><td>Sprachkompetenz oder Lernfortschritt evaluieren<\/td><td>Auskunft über den aktuellen Stand der Kompetenzentwicklung<\/td><\/tr><tr><td>Form<\/td><td>formell, informell und alternativ (Quiz, Selbst- und Peerevaluation)<\/td><td>möglichst objektiv und zuverlässig<\/td><\/tr><tr><td>Rückschluss<\/td><td colspan=\"2\">Rückschluss auf Kompetenz über elizitierte Leistungen: Beantwortung von Items, schriftliche oder mündliche Textproduktion<\/td><\/tr><\/tbody><\/table><\/div><p>Im Sprachgebrauch ist „TestDaF“ oder „DTZ“ ein „Test“ als Marke, hat aber auch Merkmale einer Prüfung. „Prüfen“ wird eher mit wichtigem Assessment verbunden (z. B. Zertifikate), „Tests“ eher mit engen Formaten (Vokabeltest) oder geschlossenen Formaten (Multiple Choice).<\/p><blockquote><p>„Bei Sprachtests im Sinne der pädagogisch-psychologischen Diagnostik handelt es sich um theoretisch und empirisch fundierte Verfahren zur kontrollierten Auslösung von diagnostisch relevantem Verhalten durch standardisierte Reize“<\/p><cite>Grotjahn 2010, S. 211, zitiert auf Folien Berthelé, 22.10.2026, Folie 15<\/cite><\/blockquote><blockquote><p>„Das Testen ist eine Methode der Leistungsmessung, die die latente Fähigkeit (Kompetenz) eines Individuums in einer ausgewählten Domäne mittels einer Lerner:innenleistung (Performanz) anhand von Indikatoren (Bearbeitung von Testaufgaben und Items) misst“<\/p><cite>Vogt 2025a, S. 10, zitiert auf Folien Berthelé, 22.10.2026, Folie 15<\/cite><\/blockquote>"}, {"titel": "4. Feedback: feed up, feed back, feed forward", "quelle": "Folien 10 und 11; Hattie/Timperley 2007; Vogt 2025a, S. 10; Vogt 2025c, S. 96 und 99", "html": "<p>Feedback hat an Bedeutung gewonnen, weil es Lehren, Lernen und Assessment verbindet. Es soll die Distanz zwischen Lernziel und aktueller Leistung überbrücken. Es ist ein entscheidender Faktor für erfolgreiches Lernen, kann aber negativ wirken, wenn es nicht zu erhöhter Leistung motiviert.<\/p><div class=\"tablewrap\"><table><thead><tr><th>Schritt<\/th><th>Leitfrage<\/th><\/tr><\/thead><tbody><tr><td><strong>Feed up<\/strong><\/td><td>Welche Ziele habe ich? Wo stehe ich?<\/td><\/tr><tr><td><strong>Feed back<\/strong><\/td><td>Wie komme ich voran? (Reflexion, Rückblick)<\/td><\/tr><tr><td><strong>Feed forward<\/strong><\/td><td>Wohin als nächstes? Was sind die nächsten Schritte?<\/td><\/tr><\/tbody><\/table><\/div><p>Gutes Feedback muss laut Vogt (2025c, S. 99) unter anderem:<\/p><blockquote><p>„klar und verständlich für den:die Adressat:in sein“<\/p><cite>Vogt 2025c, S. 99, zitiert auf Folien Berthelé, 22.10.2026, Folie 11<\/cite><\/blockquote><blockquote><p>„kategorienbezogen und aufgabenbezogen sein, nicht auf die Person abzielend“<\/p><cite>Vogt 2025c, S. 99, zitiert auf Folien Berthelé, 22.10.2026, Folie 11<\/cite><\/blockquote><blockquote><p>„spezifisch und konkret am Beispiel arbeitend sein, ggf. auf wenige Aspekte fokussieren“<\/p><cite>Vogt 2025c, S. 99, zitiert auf Folien Berthelé, 22.10.2026, Folie 11<\/cite><\/blockquote>"}, {"titel": "5. Konstrukte der Leistungsmessung", "quelle": "Folien Berthelé, 22.10.2026, Folie 14; Vogt 2025a, S. 12", "html": "<p>Die Leitfrage lautet: Was soll gemessen werden? Ein <strong>Konstrukt<\/strong> ist eine theoretische Vorstellung von sprachlich-kommunikativer Handlungsfähigkeit. Die Folie zeichnet zwei Linien nach:<\/p><div class=\"tablewrap\"><table><thead><tr><th>Entwicklung<\/th><th>Ausweitung<\/th><\/tr><\/thead><tbody><tr><td>behavioristisch (Lado 1961) → multikomponentiell (Bachman/Palmer 2010) → handlungsorientiert (GeR 2001 und 2010)<\/td><td>allgemeine Kompetenzen (GeR); Mediation; Lernendenautonomie; plurikulturelle Kompetenz; Mehrsprachigkeit; kein native-speaker-Standard; Prüfungsgerechtigkeit<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„theoretische Vorstellungen von sprachlich-kommunikativer Handlungsfähigkeit“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 14<\/cite><\/blockquote>"}, {"titel": "6. low stakes und high stakes", "quelle": "Folien Berthelé, 22.10.2026, Folie 16; Zimmermann 2025, S. 110", "html": "<p>Unterschieden wird nach der Tragweite der Konsequenzen für die Teilnehmenden, abhängig von Art und Verwendungszweck des Tests.<\/p><div class=\"tablewrap\"><table><thead><tr><th><\/th><th>low stakes<\/th><th>high stakes<\/th><\/tr><\/thead><tbody><tr><td>Folgen<\/td><td>keine langfristigen Folgen für Lernende<\/td><td>weitreichende Folgen für Lernende<\/td><\/tr><tr><td>Zweck<\/td><td>Diagnose, Förderung, Einordnung<\/td><td>anerkannte Zertifizierung<\/td><\/tr><tr><td>Beispiele<\/td><td>schulischer Diagnosetest (Stärken und Schwächen, Förderbedarf), Einstufungstest im Sprachkurs<\/td><td>Hochschulzugang, Einbürgerung, Nachweis berufsbezogener Sprachkenntnisse; oft als Sprachstandstest (proficiency test) angelegt<\/td><\/tr><\/tbody><\/table><\/div><p>Bei high-stakes-Tests sind Qualitätssicherung und die Einhaltung der Gütekriterien bei Erstellung, Durchführung und Auswertung besonders wichtig. Dazu dient die <strong>Standardisierung<\/strong>.<\/p><blockquote><p>„Unterschieden wird nach der Tragweite der Konsequenzen für die Teilnehmenden, abhängig von Art und Verwendungszweck des Tests.“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 16<\/cite><\/blockquote>"}, {"titel": "7. Standardisierung bei high-stakes-Tests", "quelle": "Folien 17–19; Zimmermann 2025, S. 112–113", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Bereich<\/th><th>Kern<\/th><\/tr><\/thead><tbody><tr><td><strong>Entwicklung<\/strong><\/td><td>Testspezifikationen legen Konstrukt und Aufgabenformate fest und dienen als Blaupause für weitere Testversionen. Ziel: Vergleichbarkeit, gleichbleibende Schwierigkeit. Schritte: Aufgabenentwicklung, Pilotierung, psychometrische Analysen und qualitative Begleitforschung, Festlegung des Formats, Produktion weiterer Versionen.<\/td><\/tr><tr><td><strong>Durchführung<\/strong><\/td><td>Leistungen entstehen unter vergleichbaren Bedingungen. Durchführungsbestimmungen bei dezentralen Tests (z. B. Goethe, TestDaF, DELF/DALF, DELE, Cambridge). Ziel: Fairness.<\/td><\/tr><tr><td><strong>Auswertung<\/strong><\/td><td>Geschlossene Formate: objektive Auswertung unproblematisch. Produktive Leistungen: einheitliche Beurteilungsskalen, unabhängige Doppelbeurteilung, Multifacetten-Rasch-Analyse.<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Ziel: Fairness, niemand wird benachteiligt oder bevorzugt, egal wo Prüfung abgelegt wird“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 18<\/cite><\/blockquote><blockquote><p>„Multifacetten-Rasch-Analyse: statistischer Ausgleich von Strenge/Milde der Beurteilenden“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 19<\/cite><\/blockquote>"}, {"titel": "8. Eingangstests für den sprachlichen Hochschulzugang", "quelle": "Folien Berthelé, 22.10.2026, Folie 20; Holzknecht 2025, S. 117", "html": "<p><strong>Aufnahmetest, Zulassungstest, Zugangstest:<\/strong> Sie klären, ob Teilnehmende in eine Sprachausbildung aufgenommen werden. Sie sind high stakes.<\/p><div class=\"tablewrap\"><table><thead><tr><th>Eignungstest<\/th><th>Aufnahmetest<\/th><\/tr><\/thead><tbody><tr><td>misst die allgemeine Befähigung zum Fremdsprachenlernen<\/td><td>meist sprachspezifisch, idealerweise auf Inhalte der jeweiligen Ausbildung abgestimmt<\/td><\/tr><\/tbody><\/table><\/div><p>Im Seminarkontext sind extern entwickelte <em>proficiency tests<\/em> das Aufnahmekriterium: in englischsprachigen Ländern TOEFL und IELTS, in Deutschland der TestDaF (und weitere) als anerkannter Aufnahmetest.<\/p><blockquote><p>„Eignungstest → misst allgemeine Befähigung zum Fremdsprachenlernen“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 20<\/cite><\/blockquote>"}, {"titel": "9. Arten von Assessment: of, for und as Learning", "quelle": "Folien Berthelé, 22.10.2026, Folie 21 (nach Vogt 2025a, S. 12–14)", "html": "<div class=\"tablewrap\"><table><thead><tr><th><\/th><th>Assessment of Learning<\/th><th>Assessment for Learning<\/th><th>Assessment as Learning<\/th><\/tr><\/thead><tbody><tr><td>Art<\/td><td>summativ (am Ende)<\/td><td>formativ (prozessbezogen)<\/td><td>formativ (prozessbezogen)<\/td><\/tr><tr><td>Ziel<\/td><td>Lernziele erreicht?<\/td><td>Lernprozess unterstützen<\/td><td>Verantwortung für eigenes Lernen<\/td><\/tr><tr><td>Zeitpunkt<\/td><td>Ende (Kurs, Lektion, Abschnitt)<\/td><td>prozessbegleitend<\/td><td>integraler Teil des Lernens<\/td><\/tr><tr><td>Charakter<\/td><td>geplant, eher formell<\/td><td>eher informell, eingebettet<\/td><td>in Lernen eingebettet<\/td><\/tr><tr><td>Wer beurteilt?<\/td><td>Lehrperson / Institution<\/td><td>Lehrperson, mit Feedback<\/td><td>Lernende (selbst / gegenseitig)<\/td><\/tr><tr><td>Beispiele<\/td><td>Klassenarbeit, Abitur, Vergleichsarbeiten<\/td><td>Rückfragen, geplante Evaluationsaktivitäten, Portfolio<\/td><td>Self-Assessment, Peer-Assessment, dynamic assessment<\/td><\/tr><tr><td>Nutzen<\/td><td>Ergebnis, Bildungsmonitoring<\/td><td>Feedback für Lernen und Lehren<\/td><td>Selbststeuerung der Lernenden<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„In Praxis nicht immer zu trennen!“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 21<\/cite><\/blockquote>"}, {"titel": "10. Vorbereitung der nächsten Sitzung", "quelle": "Folien Berthelé, 22.10.2026, Folie 23", "html": "<blockquote><p>„Mindestens 2 Texte aus Kapitel 2 in Vogt/Rossa (2025) – freie Wahl!“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 23<\/cite><\/blockquote><p>Der Sammelband ist auf Moodle verlinkt.<\/p>"}, {"titel": "Textarbeit: Ziele", "quelle": "Folien Berthelé, 22.10.2026, Folie 22", "html": "<p>Zu bearbeiten ist Moser-Frötscher (2025), Summative Evaluation, S. 83–88. Die Folie nennt als Lernziele:<\/p><blockquote><p>„Ich kann die Begriffe summative und formative Evaluation, high stakes und washback erklären und voneinander abgrenzen und sie kritisch einordnen.“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 22<\/cite><\/blockquote><blockquote><p>„Ich kann Leitfragen guter Prüfungspraxis (EALTA) auf Prüfungen zum Hochschulzugang übertragen und als Analyseraster nutzen.“<\/p><cite>Folien Berthelé, 22.10.2026, Folie 22<\/cite><\/blockquote>"}, {"titel": "Textarbeit: 1. Summativ und formativ", "quelle": "Moser-Frötscher 2025, S. 83", "html": "<ul class=\"plain\"><li><strong>Summativ:<\/strong> misst im Nachhinein, was erreicht wurde. Sie findet punktuell statt, bewertet Fortschritte und dient der Benotung. Sie ist formell und geplant und steht am Ende einer Einheit (von einer Woche bis zu einem Jahr).<\/li><li><strong>Formativ:<\/strong> prüft während der Lernphase den Fortschritt, um den folgenden Unterricht abzustimmen und Feedback zu geben.<\/li><li><strong>Neuere Bezeichnungen:<\/strong> Assessment of Learning (summativ) und Assessment for Learning (formativ).<\/li><\/ul><blockquote><p>„Die summative Evaluation misst im Nachhinein, was von Einzelpersonen oder auch Gruppen erreicht wurde“<\/p><cite>Moser-Frötscher 2025, S. 83<\/cite><\/blockquote>"}, {"titel": "Textarbeit: 2. Warum die Gegenüberstellung eine Vereinfachung ist", "quelle": "Moser-Frötscher 2025, S. 83", "html": "<blockquote><p>„Die kontrastive Unterscheidung zwischen summativer und formativer Evaluation stellt jedoch eine starke Vereinfachung dieser beiden Konstrukte sowie ihrer Beziehung zueinander dar“<\/p><cite>Moser-Frötscher 2025, S. 83<\/cite><\/blockquote><p>Der Text nennt mehrere Positionen:<\/p><ul class=\"plain\"><li><strong>Harlen (2005):<\/strong> Nur der Zweck macht den Unterschied. Dieselbe Information kann summativ oder formativ sein.<\/li><li><strong>Harsch (2012):<\/strong> Dieselben Instrumente können prinzipiell für beide Paradigmen verwendet werden.<\/li><li><strong>Bachman/Damböck (2017):<\/strong> Unterschied nach den Entscheidungen. Formative betreffen Unterrichten und Lernen, summative teilen Lernende in Gruppen (z. B. Versetzung).<\/li><li><strong>Learning-Oriented Assessment (Jones/Saville 2016):<\/strong> Beide Zugänge sind eng verwoben, das erfolgreiche Lernen steht im Fokus.<\/li><\/ul><blockquote><p>„Für Harlen (2005) macht einzig der Zweck den Unterschied aus: Dieselbe Information, die gesammelt wird, kann sowohl summativ als auch formativ sein“<\/p><cite>Moser-Frötscher 2025, S. 83<\/cite><\/blockquote>"}, {"titel": "Textarbeit: 3. Zwecke und Adressaten", "quelle": "Moser-Frötscher 2025, S. 83–84", "html": "<p>Summative Informationen dienen verschiedenen Zwecken (Harlen 2005):<\/p><ul class=\"plain\"><li>schulintern: Fortschritte festhalten, die nächste Lehrperson informieren<\/li><li>Adressaten: Eltern und Schüler:innen, häufig als Schulnoten<\/li><li>extern: Zertifizierung, Auswahl von Bewerber:innen für eine Anstellung oder ein Studium<\/li><li>Standardisierung und Bildungsmonitoring durch extern vorgegebene Prüfungen<\/li><\/ul>"}, {"titel": "Textarbeit: 4. Extern vorgegebene summative Prüfungen im deutschsprachigen Raum", "quelle": "Moser-Frötscher 2025, S. 84–85", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Art<\/th><th>Beispiele im Text<\/th><\/tr><\/thead><tbody><tr><td>Leistungsvergleich<\/td><td>PISA (OECD): Kompetenzen der 15-Jährigen. 2025 erstmals optionale Zusatzerhebung zur Fremdsprachenkompetenz.<\/td><\/tr><tr><td>Zentrale Kompetenzerhebungen<\/td><td>Deutschland: Bildungstrends und VERA (IQB). Österreich: iKMPLUS (IQS). Schweiz: ÜGK.<\/td><\/tr><tr><td>Abschlussprüfungen<\/td><td>Zentralabitur in mehreren Bundesländern mit gemeinsamem Aufgabenpool. Österreich: Standardisierte, kompetenzorientierte Reife- und Diplomprüfung, zentral entwickelt, dezentral beurteilt.<\/td><\/tr><tr><td>Sprachzertifikate<\/td><td>z. B. Cambridge, Trinity, Aptis for Teens, Oxford Test of English (Englisch), DELF/DALF (Französisch), DELE (Spanisch), PLIDA/CILS (Italienisch). Für Deutsch: DSD und ÖSD.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"titel": "Textarbeit: 5. EALTA-Leitfragen als Analyseraster", "quelle": "Moser-Frötscher 2025, S. 85–87", "html": "<p>Die Richtlinien der European Association for Language Testing and Assessment (EALTA 2006) bieten Leitfragen für gute Praxis. Der Text ordnet sie drei Bereichen zu. Voraussetzung ist Language Assessment Literacy bei den Lehrpersonen.<\/p><div class=\"tablewrap\"><table><thead><tr><th>Bereich<\/th><th>Worauf geachtet wird<\/th><\/tr><\/thead><tbody><tr><td><strong>1. Prüfungszweck und Spezifikation<\/strong> (S. 85–86)<\/td><td>Zweck der Prüfung und Bezug zum Lehrplan. Testspezifikationen (Art der Kompetenzen, Gewichtung, Aufgabenformate). Abdeckung des Lehrplans. Authentizität der Aufgaben. Transparenz gegenüber den Schüler:innen.<\/td><\/tr><tr><td><strong>2. Prüfungsverfahren<\/strong> (S. 86)<\/td><td>Reliabilität. Wer entwirft die Prüfung, wie angemessen ist sie für die Zielgruppe. Vertraute Aufgabentypen, passende Schwierigkeit, sensible Themen vermeiden. Genauigkeit und Fairness der Bewertung, Bewertungsraster, Schulungen. Jahresnote aus vielen Quellen. Bestehensgrenzen kriterienorientiert. Rechtliche Vorgaben beachten.<\/td><\/tr><tr><td><strong>3. Konsequenzen<\/strong> (S. 86–87)<\/td><td>Verwendung der Ergebnisse, Folgen für Schüler:innen und Schulen. low/high stakes. Qualitätssicherung und Begleitforschung. washback. Feedback als formative Funktion.<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>„Etwaige Bestehensgrenzen sollten nicht normativ, sondern kriterienorientiert (d. h. in Bezug zum Lehrplan) festgelegt werden“<\/p><cite>Moser-Frötscher 2025, S. 86<\/c
